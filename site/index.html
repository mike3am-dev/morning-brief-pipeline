/* diventa false se Supabase non conosce ancora la colonna del voto */
let VOTE_SYNC = true;

function markRow(k, m){
  const row = {
    user_id:AUTH.user_id, story:k,
    starred_at:m.starred_at || null, read_at:m.read_at || null,
    note:m.note || "", links:m.links || []
  };
  if(VOTE_SYNC) row.vote = m.vote || 0;
  return row;
}
function diaryRow(e){
  return {
    user_id:AUTH.user_id, id:e.id, ts:new Date(e.ts).toISOString(),
    text:e.text || "", tags:e.tags || [], link:e.link || null,
    ref:e.ref || null, deleted_at:e.deleted_at || null
  };
}

async function sync(){
  if(!CLOUD || !AUTH || syncing) return;
  if(!navigator.onLine){ pip("offline", "Offline — gli appunti restano sul dispositivo"); return; }
  syncing = true;
  pip("busy", "Sincronizzazione…");
  try{
    /* 1. spinge quello che è cambiato qui */
    /* Si segna l'ora di ogni riga *prima* di spedirla. Fra la partenza e la
       risposta passano dei secondi in cui si continua a scrivere, e marcare
       pulito quello che nel frattempo e' cambiato ancora vuol dire perderlo:
       resterebbe solo qui, senza piu' niente che lo spinga su. */
    const dirtyMarks = Object.keys(S.marks).filter(function(k){ return S.marks[k].dirty; });
    const sentAt = {};
    dirtyMarks.forEach(function(k){ sentAt[k] = S.marks[k].updated_at; });
    if(dirtyMarks.length){
      const invia = function(){
        return sb("/rest/v1/brief_marks?on_conflict=user_id,story", {
          method:"POST",
          headers:{"Prefer":"resolution=merge-duplicates,return=representation"},
          body:JSON.stringify(dirtyMarks.map(function(k){ return markRow(k, S.marks[k]); }))
        });
      };
      let res = await invia();
      /* Se la colonna del voto non c'è ancora (migrazione non lanciata), la
         riga verrebbe respinta tutta, portandosi dietro appunti e salvati.
         Meglio rinunciare al voto e salvare il resto: tornerà al prossimo giro. */
      if(!res.ok && res.status === 400){
        const detail = (await res.clone().text()).toLowerCase();
        if(detail.indexOf("vote") >= 0 && VOTE_SYNC){
          VOTE_SYNC = false;
          console.warn("Colonna 'vote' assente su brief_marks: i pollici restano locali.");
          res = await invia();
        }
      }
      if(!res.ok) throw new Error("brief_marks " + res.status + " " + (await res.text()).slice(0,140));
      (await res.json()).forEach(function(row){
        const m = S.marks[row.story];
        if(!m || m.updated_at !== sentAt[row.story]) return;   /* ritoccata nel frattempo */
        m.updated_at = row.updated_at; m.dirty = false;
      });
    }
    const dirtyDiary = S.diary.filter(function(e){ return e.dirty; });
    const diarySentAt = {};
    dirtyDiary.forEach(function(e){ diarySentAt[e.id] = e.updated_at; });
    if(dirtyDiary.length){
      const res = await sb("/rest/v1/brief_diary?on_conflict=user_id,id", {
        method:"POST",
        headers:{"Prefer":"resolution=merge-duplicates,return=representation"},
        body:JSON.stringify(dirtyDiary.map(diaryRow))
      });
      if(!res.ok) throw new Error("brief_diary " + res.status + " " + (await res.text()).slice(0,140));
      (await res.json()).forEach(function(row){
        const e = S.diary.filter(function(x){ return x.id === row.id; })[0];
        if(!e || e.updated_at !== diarySentAt[row.id]) return;
        e.updated_at = row.updated_at; e.dirty = false;
      });
    }

    /* 2. tira quello che è cambiato altrove */
    const since = S.lastPull || "1970-01-01T00:00:00Z";
    const [rm, rd] = await Promise.all([
      sb("/rest/v1/brief_marks?select=*&updated_at=gt." + encodeURIComponent(since)),
      sb("/rest/v1/brief_diary?select=*&updated_at=gt." + encodeURIComponent(since))
    ]);
    if(!rm.ok || !rd.ok) throw new Error("lettura " + rm.status + "/" + rd.status);

    let changed = false;
    (await rm.json()).forEach(function(row){
      const local = S.marks[row.story];
      if(local && local.dirty) return;                       /* il locale non ancora spinto vince */
      if(local && local.updated_at && local.updated_at >= row.updated_at) return;
      S.marks[row.story] = {
        starred_at:row.starred_at, read_at:row.read_at, note:row.note || "",
        links:row.links || [], vote:row.vote || 0, updated_at:row.updated_at, dirty:false
      };
      changed = true;
    });
    (await rd.json()).forEach(function(row){
      const i = S.diary.findIndex(function(x){ return x.id === row.id; });
      const entry = {
        id:row.id, ts:new Date(row.ts).getTime(), text:row.text, tags:row.tags || [],
        link:row.link, ref:row.ref, updated_at:row.updated_at,
        deleted_at:row.deleted_at, dirty:false
      };
      if(i < 0){ S.diary.push(entry); changed = true; }
      else if(!S.diary[i].dirty && (!S.diary[i].updated_at || S.diary[i].updated_at < row.updated_at)){
        S.diary[i] = entry; changed = true;
      }
    });
    if(changed){
      S.diary.sort(function(a,b){ return b.ts - a.ts; });
      repaint();
    }

    S.lastPull = new Date(Date.now() - 5000).toISOString();
    saveNow();
    refreshCounts();
    pip("ok", "Sincronizzato");
  }catch(err){
    /* il motivo va almeno in console: il pallino rosso dice che qualcosa non
       va, non dice cosa, e senza questa riga non restava traccia da nessuna parte */
    console.warn("Sincronizzazione non riuscita:", err && err.message ? err.message : err);
    pip("error", "Sincronizzazione non riuscita — riprovo tra poco");
  }finally{
    syncing = false;
  }
}

/* la cache locale delle edizioni non ha spazio garantito: l'archivio
   cresce di circa 150-200 KB al giorno (foto incorporate comprese) e prima
   o poi supera la quota di localStorage. Invece di lasciar fallire lo
   scrive in silenzio (e restare bloccati per sempre sull'ultimo salvataggio
   riuscito, magari di settimane prima), si scarta la coda piu' vecchia
   finche' non ci sta */
function saveBriefsCache(list){
  let slice = list;
  while(slice.length){
    try{ localStorage.setItem(K_BRIEFS, JSON.stringify(slice)); return; }
    catch(e){ slice = slice.slice(0, Math.max(1, Math.floor(slice.length / 2))); }
  }
  try{ localStorage.removeItem(K_BRIEFS); }catch(e){}
}

async function loadBriefs(){
  if(!CLOUD){ indexAll(); return; }
  try{
    const cached = JSON.parse(localStorage.getItem(K_BRIEFS) || "null");
    if(cached && cached.length){ BRIEFS = cached; indexAll(); repaint(); }
  }catch(e){}
  try{
    const res = await sb("/rest/v1/brief_editions?select=payload&order=date.desc&limit=400");
    if(!res.ok) throw new Error("brief_editions " + res.status);
    const rows = await res.json();
    if(rows.length){
      BRIEFS = rows.map(function(r){ return r.payload; });
      saveBriefsCache(BRIEFS);
      indexAll();
      if(!currentDate || !BRIEFS.some(function(b){ return b.date === currentDate; })){
        currentDate = BRIEFS[0].date;
      }
      repaint();
    }
  }catch(err){
    if(!BRIEFS.length) toast("Nessuna edizione scaricata — controlla la connessione");
  }
}

function indexAll(){
  ALL = [];
  EXTRAS = [];
  BRIEFS.forEach(function(b){
    (b.news || []).forEach(function(n){ ALL.push({brief:b, news:n, k:key(b.date, n.id)}); });
    /* radar, banco e recap non sono notizie ma si salvano lo stesso: un video
       da guardare dopo deve ricomparire fra i salvati come tutto il resto */
    [["radar", "Radar"], ["banco", "Sul banco"], ["recap", "Se te lo fossi perso"]]
      .forEach(function(sez){
        (b[sez[0]] || []).forEach(function(it){
          if(!it.id) return;
          EXTRAS.push({brief:b, item:it, kind:sez[0], label:sez[1],
                       k:key(b.date, sez[0] + ":" + it.id)});
        });
      });
  });
  indexThreads();
  indexClaims();
  indexFacts();
}

/* ================= fili e previsioni =================
   Nessuna tabella in piu' da sincronizzare: fili e previsioni stanno dentro
   le edizioni, e qui vengono ricostruiti a ogni caricamento. Per questo la
   copia Artifact, che non puo' fare rete, si comporta esattamente uguale. */

let THREADS = {};   /* slug -> {label, note, episodes} */
let CLAIMS = [];    /* previsioni con il loro stato di oggi */

function byDate(desc){
  return BRIEFS.slice().sort(function(a, b){
    return (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) * (desc ? -1 : 1);
  });
}

function indexThreads(){
  THREADS = {};
  byDate(true).forEach(function(b){
    const labels = b.threads || {};
    /* notizie e voci AI: un filo puo' passare dall'una all'altra sezione
       (Muse di Meta e' nata nella scheda AI ed e' arrivata fra le notizie) */
    (b.news || []).map(function(n){ return [n, "news"]; })
      .concat((b.ai || []).map(function(a){ return [a, "ai"]; }))
      .forEach(function(pair){
      const n = pair[0], section = pair[1];
      if(!n.thread) return;
      let t = THREADS[n.thread];
      if(!t) t = THREADS[n.thread] = {slug:n.thread, label:n.thread, note:"", episodes:[]};
      /* l'etichetta piu' recente vince: se la rinomini, l'archivio si adegua */
      const lab = labels[n.thread];
      if(lab && !t.named){
        t.label = (typeof lab === "string") ? lab : (lab.label || n.thread);
        t.note = (typeof lab === "string") ? "" : (lab.note || "");
        t.named = true;
      }
      t.episodes.push({date:b.date, brief:b, news:n, section:section});
    });
  });
  Object.keys(THREADS).forEach(function(s){
    THREADS[s].episodes.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  });
}

const VERDICTS = ["confermato", "parziale", "smentito", "scaduto", "aperto"];

const SOURCE_ALIASES = {
  "gurman":"Mark Gurman (Bloomberg)", "mark gurman":"Mark Gurman (Bloomberg)",
  "bloomberg":"Mark Gurman (Bloomberg)", "kuo":"Ming-Chi Kuo",
  "ming-chi kuo":"Ming-Chi Kuo", "ross young":"Ross Young",
  "counterpoint":"Counterpoint Research", "idc":"IDC",
  "digitimes":"Digitimes", "etnews":"ETNews"
};

/* "9to5Mac (stime di analisti)" e "9to5Mac" sono la stessa fonte;
   "Mark Gurman (Bloomberg)" no: la maiuscola distingue l'editore
   dalla precisazione. */
function canonSource(s){
  let out = String(s || "ignota").replace(/\s+/g, " ").trim();
  const m = out.match(/^(.*?)\s*\(([^)]*)\)$/);
  if(m && m[2] && m[2][0] === m[2][0].toLowerCase() && m[2][0] !== m[2][0].toUpperCase()){
    out = m[1].trim();
  }
  return SOURCE_ALIASES[out.toLowerCase()] || out;
}

function indexClaims(){
  const opened = {}, closed = {};
  byDate(false).forEach(function(b){
    (b.news || []).forEach(function(n){
      if(n.claim && n.claim.id && !opened[n.claim.id]){
        opened[n.claim.id] = {
          id:n.claim.id, text:n.claim.text || "", horizon:n.claim.horizon || "",
          source:canonSource(n.claim.source || (n.sources || [])[0]),
          date:b.date, brief:b, news:n
        };
      }
      (n.resolves || []).forEach(function(r){
        if(r && r.claim) closed[r.claim] = {
          verdict:r.verdict, note:r.note || "", date:b.date, brief:b, news:n
        };
      });
    });
  });
  const today = localDay(new Date());
  CLAIMS = Object.keys(opened).map(function(id){
    const c = opened[id], res = closed[id];
    if(res && VERDICTS.indexOf(res.verdict) >= 0 && res.verdict !== "aperto"){
      c.state = res.verdict; c.res = res;
    } else if(c.horizon && c.horizon.slice(0, 10) < today){
      c.state = "scaduto";
    } else {
      c.state = "aperto";
    }
    c.left = c.horizon ? Math.round((new Date(c.horizon.slice(0,10) + "T12:00:00") - new Date()) / 86400000) : null;
    return c;
  });
  CLAIMS.sort(function(a, b){ return (a.horizon || "9999") < (b.horizon || "9999") ? -1 : 1; });
}

function claimById(id){
  for(let i = 0; i < CLAIMS.length; i++){ if(CLAIMS[i].id === id) return CLAIMS[i]; }
  return null;
}

/* ================= i numeri che si muovono ================= */
let FACTS = {};   /* chiave -> letture in ordine di data */

const UNIT_FMT = {
  "USD":["$",""], "EUR":[""," €"], "%":["","%"], "mAh":[""," mAh"],
  "mm":[""," mm"], "g":[""," g"], "pollici":["","”"],
  "milioni":[""," mln"], "miliardi":[""," mld"], "":["",""]
};
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;

function isDateVal(v){ return typeof v === "string" && ISO_DATE.test(v); }

function fmtVal(value, unit){
  if(isDateVal(value)) return fmtShort(value);
  const u = UNIT_FMT[unit || ""] || ["", " " + (unit || "")];
  if(typeof value !== "number") return (u[0] + value + u[1]).trim();
  /* Separatori italiani scritti a mano: toLocaleString("it-IT") non raggruppa
     i numeri di quattro cifre (1299 resta 1299) e non coinciderebbe con quello
     che stampa facts.py sul terminale. */
  const neg = value < 0;
  const parts = String(Math.round(Math.abs(value) * 100) / 100).split(".");
  const body = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".")
             + (parts[1] ? "," + parts[1] : "");
  return ((neg ? "-" : "") + u[0] + body + u[1]).trim();
}

function indexFacts(){
  FACTS = {};
  byDate(false).forEach(function(b){
    (b.news || []).forEach(function(n){
      (n.facts || []).forEach(function(f){
        if(!f || !f.key) return;
        (FACTS[f.key] || (FACTS[f.key] = [])).push({
          key:f.key, label:f.label || f.key, unit:f.unit || "",
          value:f.value, kind:f.kind || "stima", source:f.source || "",
          date:b.date, brief:b, news:n
        });
      });
    });
  });
  Object.keys(FACTS).forEach(function(k){
    FACTS[k].sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  });
}

/* Di quanto si è mossa una serie: testo e verso. */
function factDelta(a, b){
  if(isDateVal(a.value) && isDateVal(b.value)){
    const days = Math.round((new Date(b.value + "T12:00:00") - new Date(a.value + "T12:00:00")) / 86400000);
    if(!days) return {text:"ferma", dir:0};
    return {text:(days > 0 ? "slittata di " : "anticipata di ") + Math.abs(days) + " giorni",
            dir:days > 0 ? 1 : -1};
  }
  const x = Number(a.value), y = Number(b.value);
  if(!isFinite(x) || !isFinite(y)) return {text:"", dir:0};
  if(x === y) return {text:"stabile", dir:0};
  const diff = y - x;
  const pct = x ? Math.round(100 * diff / Math.abs(x)) : null;
  return {text:(diff > 0 ? "+" : "") + fmtVal(diff, a.unit) + (pct !== null ? " (" + (pct > 0 ? "+" : "") + pct + "%)" : ""),
          dir:diff > 0 ? 1 : -1};
}

/* Il blocco dei numeri: una riga per metrica, con la storia se ce l'ha. */
function numbersNode(facts, title){
  const keys = [];
  (facts || []).forEach(function(f){ if(f && f.key && keys.indexOf(f.key) < 0) keys.push(f.key); });
  if(!keys.length) return null;

  const box = el("div", {class:"numbers"}, [el("span", {class:"lbl", text:title || "I numeri"})]);
  keys.forEach(function(k){
    const series = FACTS[k] || [];
    if(!series.length) return;
    const last = series[series.length - 1];
    const row = el("div", {class:"num-row"}, [
      el("div", {class:"num-head"}, [
        el("span", {class:"lab", text:last.label}),
        el("span", {class:"val", text:fmtVal(last.value, last.unit)}),
        el("span", {class:"kind k-" + last.kind, text:last.kind})
      ])
    ]);
    if(series.length > 1){
      const hist = el("div", {class:"hist"});
      series.slice(0, -1).forEach(function(r){
        hist.appendChild(el("span", {class:"past", text:fmtVal(r.value, r.unit)}));
        hist.appendChild(el("span", {class:"when", text:fmtShort(r.date)}));
      });
      const d = factDelta(series[0], last);
      hist.appendChild(el("span", {
        class:"move " + (d.dir > 0 ? "up" : d.dir < 0 ? "down" : "flat"),
        text:(d.dir > 0 ? "↑ " : d.dir < 0 ? "↓ " : "= ") + d.text
      }));
      hist.appendChild(el("span", {text:"su " + series.length + " letture"}));
      row.appendChild(hist);
    } else if(last.source){
      row.appendChild(el("div", {class:"hist"}, [el("span", {text:last.source})]));
    }
    box.appendChild(row);
  });
  return box.childNodes.length > 1 ? box : null;
}

const ORDINALS = ["", "1ª", "2ª", "3ª", "4ª", "5ª", "6ª", "7ª", "8ª", "9ª", "10ª"];
function ordinal(i){ return ORDINALS[i] || (i + "ª"); }

/* La notizia dentro l'edizione, non altrove: lo stesso identificativo esiste
   anche nella vista dei salvati, che monta gli stessi blocchi. */
function storyEl(id){
  const scope = document.getElementById("view-oggi");
  const all = scope ? scope.getElementsByClassName("story") : [];
  for(let i = 0; i < all.length; i++){ if(all[i].id === "s-" + id) return all[i]; }
  return null;
}

/* Porta la vista sulla notizia e la apre — *solo* apre. Un .click() secco sul
   titolo e' un interruttore: chiamato su una notizia gia' aperta la chiudeva,
   ed e' quello che succedeva arrivandoci dal sommario o dalla ricerca. */
function openStory(id, block){
  const t = storyEl(id);
  if(!t) return null;
  t.scrollIntoView({behavior:(block === "start" ? "smooth" : "auto"),
                    block:block || "center"});
  const head = t.querySelector(".story-head");
  const body = t.querySelector(".story-body");
  if(head && body && body.hidden) head.click();
  return t;
}

/* Apre una puntata di un filo dove sta davvero: nell'edizione se e' una
   notizia, nella scheda AI di quel giorno se e' una voce AI. */
function openEpisode(ep){
  if(!ep) return;
  if(ep.section === "ai"){
    currentDate = ep.date;
    show("ai");
    setTimeout(function(){
      const t = document.getElementById("a-" + ep.news.id);
      if(!t) return;
      t.scrollIntoView({block:"center"});
      const row = t.querySelector(".row");
      const body = t.querySelector(".body");
      if(row && body && body.hidden) row.click();
    }, 40);
    return;
  }
  jumpTo(ep.date, ep.news.id);
}

/* L'ultima puntata uscita in un giorno *prima* di questo, se la voce sta in
   un filo: {ep, thread} o null. Le puntate dello stesso giorno si leggono
   gia' insieme, "segue da oggi" non direbbe niente. */
function prevEpisode(date, item){
  const thread = item && item.thread ? THREADS[item.thread] : null;
  if(!thread) return null;
  const before = thread.episodes.filter(function(e){ return e.date < date; });
  return before.length ? {ep:before[before.length - 1], thread:thread} : null;
}

/* La riga "segue": dice da quando, e cosa si era detto. Tocca e vai. */
function segueNode(date, item){
  const p = prevEpisode(date, item);
  if(!p) return null;
  /* la sezione si dice solo quando cambia: una voce AI che segue una notizia */
  const where = p.ep.section === "news" ? " · dalle notizie" : "";
  return el("button", {type:"button", class:"segue", title:"Il filo: " + p.thread.label,
    onclick:function(ev){ ev.stopPropagation(); openEpisode(p.ep); }}, [
    el("b", {text:"Segue · " + fmtAgo(p.ep.date, date) + where}),
    el("span", {text:p.ep.news.title})
  ]);
}

/* Porta la vista sulla notizia, cambiando edizione se serve. */
function jumpTo(date, id){
  currentDate = date;
  renderEdition();
  show("oggi");
  setTimeout(function(){ openStory(id); }, 40);
}

/* ================= campo di pallini =================
   Il campo si ridisegna a ogni cambio di edizione, di scheda e di tema. Ogni
   passaggio registrava il suo ascoltatore di ridimensionamento senza togliere
   il precedente: dopo una mattinata di navigazione erano decine, tutti attaccati
   a una tela ormai staccata dalla pagina. Ne resta uno solo, e a cambiarlo e'
   l'ultimo campo acceso — che e' anche l'unico visibile. */
let dotLive = null;

function dotfield(canvas){
  if(!canvas) return;
  if(dotLive){ dotLive.stop(); dotLive = null; }
  const ctx = canvas.getContext("2d");
  const still = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const css = getComputedStyle(document.documentElement);
  const palette = ["--red","--yellow","--blue","--orange"].map(function(v){ return css.getPropertyValue(v).trim(); });
  let dots = [], raf = null, t0 = 0;

  function layout(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if(!w || !h) return;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const step = 19, r = 5.4;
    dots = [];
    for(let y = step/2; y < h; y += step){
      for(let x = step/2; x < w; x += step){
        if(Math.random() < 0.30 + 0.55 * (1 - x / w)){
          dots.push({x:x, y:y, r:r, c:palette[(Math.random()*palette.length)|0], d:(x/w)*520 + Math.random()*260});
        }
      }
    }
  }
  function draw(now){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    let done = true;
    for(let i = 0; i < dots.length; i++){
      const p = dots[i];
      let k = still ? 1 : (now - t0 - p.d) / 460;
      if(k < 0){ k = 0; done = false; } else if(k < 1){ done = false; } else k = 1;
      if(k <= 0) continue;
      const e = 1 - Math.pow(1 - k, 3);
      ctx.globalAlpha = e;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * e, 0, 6.2832);
      ctx.fillStyle = p.c;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if(!done) raf = requestAnimationFrame(draw);
  }
  layout(); t0 = performance.now();
  raf = requestAnimationFrame(draw);

  /* stop() legge "raf" dalla chiusura invece di una copia: draw() lo riassegna
     a ogni fotogramma, e una copia presa qui sarebbe gia' vecchia al primo. */
  const live = {timer:null, onResize:null, stop:function(){
    window.removeEventListener("resize", live.onResize);
    clearTimeout(live.timer);
    cancelAnimationFrame(raf);
  }};
  live.onResize = function(){
    clearTimeout(live.timer);
    live.timer = setTimeout(function(){
      layout(); t0 = performance.now() - 2000;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(draw);
    }, 180);
  };
  window.addEventListener("resize", live.onResize);
  dotLive = live;
}

/* ================= i quattro pulsanti =================
   Salva, Appunti, e i due pollici. Stessa forma, stessa misura, in fondo a
   destra di ogni voce — notizie, radar, banco, recap. I due pollici dicono
   una cosa diversa dagli altri due: non "mi serve", ma "meritava di stare
   qui". Ripremere lo stesso pollice toglie il voto.

   Le icone sono disegnate qui e non prese da un font: devono avere tutte lo
   stesso peso ottico dentro un cerchio di 36 punti. */
function ico(d){
  return '<svg class="ico" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">' +
         '<path fill="currentColor" d="' + d + '"/></svg>';
}
const I_STAR  = ico("M8 1.6l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.4l-3.8 2 .7-4.3-3.1-3 4.3-.6z");
const I_PEN   = ico("M2.2 11.5l6.9-6.9 2.3 2.3-6.9 6.9-3 .7zM10.2 3.5l1.3-1.3a1 1 0 0 1 1.4 0l.9.9a1 1 0 0 1 0 1.4l-1.3 1.3z");
const I_THUMB = ico("M6.1 14.2H4.3a.8.8 0 0 1-.8-.8V7.6c0-.4.4-.8.8-.8h1.8v7.4zM13.9 8.1l-1.3 5.3c-.1.5-.5.8-1 .8H7V6.6l2.3-2.6c.3-.4.8-.5 1.2-.3.5.2.8.7.7 1.2l-.5 2.2h2.4c.6 0 1 .5.8 1z");

function toolBtn(cls, title, glyph){
  return el("button", {class:"tool " + cls, type:"button", title:title,
                       "aria-label":title, html:glyph});
}

/* Il pannello degli appunti: testo, link allegati, invio al diario. Era dentro
   la notizia, ora sta qui perche' lo usano anche radar, banco e recap — un
   video da guardare dopo si salva e si annota come una notizia. */
function notesPanel(k, ref, onPaint){
  const panel = el("div", {class:"workspace", hidden:"hidden"});
  const ta = el("textarea", {class:"note",
    placeholder:"Cosa ti serve ricordare — un'idea, un angolo da approfondire, un follow-up."});
  ta.value = (mk(k) && mk(k).note) || "";
  const flag = el("span", {class:"saved-flag", text:""});

  ta.addEventListener("input", function(){
    mark(k).note = ta.value;
    touched(k); onPaint();
    flag.textContent = "salvato";
    clearTimeout(ta._t); ta._t = setTimeout(function(){ flag.textContent = ""; }, 1400);
  });

  const linkList = el("ul", {class:"saved-links"});
  function paintLinks(){
    linkList.innerHTML = "";
    ((mk(k) && mk(k).links) || []).forEach(function(l, i){
      /* l'indirizzo si ricontrolla qui e non solo in scrittura: questi appunti
         arrivano anche da un file importato e dalla sincronizzazione, e un
         "javascript:" salvato altrove diventerebbe un bottone da premere */
      const lu = safeUrl(l && l.url);
      linkList.appendChild(el("li", {}, [
        lu ? el("a", {href:lu, target:"_blank", rel:"noopener noreferrer", text:(l.label || lu)})
           : el("span", {class:"broken", text:(l && l.label) || "indirizzo non valido"}),
        el("button", {class:"kill", type:"button", title:"Rimuovi", text:"✕", onclick:function(){
          mark(k).links.splice(i, 1); touched(k); paintLinks(); onPaint();
        }})
      ]));
    });
  }
  paintLinks();

  const urlIn = el("input", {type:"url", placeholder:"https:// video, articolo, thread…"});
  const labIn = el("input", {type:"text", placeholder:"etichetta (facoltativa)"});
  const addBtn = el("button", {class:"btn ghost", type:"button", text:"Aggiungi", onclick:function(){
    const u = safeUrl(urlIn.value);
    if(!u){ toast("Serve un indirizzo che inizi con http:// o https://"); return; }
    const m = mark(k);
    if(!m.links) m.links = [];
    m.links.push({url:u, label:labIn.value.trim() || u.replace(/^https?:\/\//,"").split("/")[0]});
    urlIn.value = ""; labIn.value = "";
    touched(k); paintLinks(); onPaint();
  }});

  const diaryBtn = el("button", {class:"btn ghost", type:"button", text:"Manda al diario", onclick:function(){
    const txt = (ta.value || "").trim();
    if(!txt){ toast("Scrivi prima un appunto"); return; }
    addDiary({text:txt, tags:["Da una notizia"], ref:ref});
    toast("Aggiunto al diario");
  }});

  panel.appendChild(ta);
  panel.appendChild(el("div", {class:"linkrow"}, [urlIn, labIn, addBtn]));
  panel.appendChild(linkList);
  panel.appendChild(el("div", {class:"linkrow"}, [diaryBtn, flag]));
  panel.focusNote = function(){ ta.focus(); };
  return panel;
}

function itemTools(k, opts){
  opts = opts || {};
  const bar = el("div", {class:"tools"});
  const star = toolBtn("t-star", "Salva", I_STAR);
  const note = toolBtn("t-note", "Appunti", I_PEN);
  const up   = toolBtn("t-up vote", "Ci stava", I_THUMB);
  const down = toolBtn("t-down vote", "Non ci stava", I_THUMB);
  const panel = notesPanel(k, opts.ref, paintNote);

  function paintStar(){
    const on = !!(mk(k) && mk(k).starred_at);
    star.classList.toggle("on", on);
    star.setAttribute("aria-pressed", on ? "true" : "false");
    star.title = on ? "Salvata — togli" : "Salva";
  }
  function paintNote(){
    const m = mk(k);
    const n = (m && m.links ? m.links.length : 0);
    const on = !!(m && ((m.note || "").trim() || n));
    note.classList.toggle("on", on);
    note.setAttribute("data-count", n > 0 ? String(n) : "");
  }
  function paintVote(){
    const v = (mk(k) && mk(k).vote) || 0;
    up.classList.toggle("on", v > 0);
    down.classList.toggle("on", v < 0);
    up.setAttribute("aria-pressed", v > 0 ? "true" : "false");
    down.setAttribute("aria-pressed", v < 0 ? "true" : "false");
  }

  star.addEventListener("click", function(ev){
    ev.stopPropagation();
    const m = mark(k);
    m.starred_at = m.starred_at ? null : new Date().toISOString();
    paintStar(); touched(k); refreshCounts();
    toast(m.starred_at ? "Salvata" : "Tolta dai salvati");
  });
  note.addEventListener("click", function(ev){
    ev.stopPropagation();
    panel.hidden = !panel.hidden;
    if(!panel.hidden){
      if(opts.onNote) opts.onNote();
      panel.focusNote();
    }
  });
  function vota(v){
    const m = mark(k);
    m.vote = (m.vote === v) ? 0 : v;
    paintVote(); touched(k);
    toast(m.vote > 0 ? "Segnato: ci stava"
        : m.vote < 0 ? "Segnato: non ci stava" : "Voto tolto");
  }
  up.addEventListener("click", function(ev){ ev.stopPropagation(); vota(1); });
  down.addEventListener("click", function(ev){ ev.stopPropagation(); vota(-1); });

  paintStar(); paintNote(); paintVote();
  bar.appendChild(star); bar.appendChild(note); bar.appendChild(up); bar.appendChild(down);
  return {bar:bar, panel:panel};
}

/* La catena delle fonti (pipeline/verify.py), detta in una riga. Si mostra
   solo quando dice qualcosa: se nessuna testata dichiara da dove viene, spesso
   e' perche' la fonte e' la testata stessa — ha provato la beta, era in sala —
   e scriverlo sembrerebbe un sospetto che non c'e'. */
function verificaText(v){
  if(!v) return "";
  const official = ["Apple", "documenti SEC", "atti giudiziari", "Commissione europea"];
  const indip = (v.origini || []).filter(function(o){ return official.indexOf(o) < 0; });
  const tail = v.testate > 1 ? " · " + v.testate + " testate" : "";
  if(v.ufficiale) return "Verifica · c'è la parola di Apple" + tail;
  if(indip.length >= 2) return "Verifica · " + indip.length + " fonti indipendenti: " + indip.join(", ");
  if(indip.length === 1) return "Verifica · una sola fonte d'origine, " + indip[0]
    + (v.riprese >= 2 ? ", ripresa da " + v.riprese + " testate" : "");
  return "";
}

/* ================= notizia ================= */
/* ================= approfondimento =================
   Il pezzo lungo che la corsa del mattino scrive per le prime cinque notizie.
   La parte di testo e' dati (punto, sotto, tappe, fonti, dopo, approfondire).
   Le visualizzazioni invece sono codice, e stanno *qui*: l'edizione dice solo
   quale usare e con quali numeri ("visivi": [{"tipo": "resa", ...}]). Cosi'
   dal database non arriva mai codice da eseguire, e ogni visualizzazione
   costruita una volta resta nel kit per tutte le mattine dopo. */

const STILL = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function cssv(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function tone(c){ return cssv("--" + (c || "blue")) || c; }
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, kids){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in (attrs || {})){ if(attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]); }
  (kids || []).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}
function svText(x, y, txt, attrs){ const t = sv("text", Object.assign({x:x, y:y}, attrs || {})); t.textContent = txt; return t; }

/* "2025-04" -> "apr 2025", "2026-09-30" -> "30 set 2026" */
function fmtDeepDate(d){
  d = String(d || "");
  if(/^\d{4}-\d{2}$/.test(d)) return MESI[+d.slice(5,7) - 1].slice(0,3) + " " + d.slice(0,4);
  return fmtShort(d);
}
function spokenDate(d){
  d = String(d || "");
  if(/^\d{4}-\d{2}$/.test(d)) return MESI[+d.slice(5,7) - 1] + " " + d.slice(0,4);
  const x = new Date(d.slice(0,10) + "T12:00:00");
  return isNaN(x) ? d : x.getDate() + " " + MESI[x.getMonth()];
}
function daysUntil(d, ref){
  const a = new Date(String(d).slice(0,10) + "T12:00:00"), b = new Date(String(ref).slice(0,10) + "T12:00:00");
  return (isNaN(a) || isNaN(b)) ? null : Math.round((a - b) / 86400000);
}

/* Parte quando la visualizzazione entra nello schermo, una volta sola: le
   animazioni viste a pannello chiuso sarebbero sprecate. */
function whenSeen(node, fn){
  if(!("IntersectionObserver" in window)){ setTimeout(fn, 60); return; }
  const io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ io.disconnect(); fn(); } });
  }, {threshold:.35});
  io.observe(node);
}

/* Un canvas nitido sugli schermi densi, che segue la larghezza del contenitore */
function crispCanvas(canvas, ratio){
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = canvas.clientWidth || canvas.parentNode.clientWidth || 320;
  const h = Math.round(w * ratio);
  canvas.style.height = h + "px";
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return {ctx:ctx, w:w, h:h};
}

function visFrame(v, kind){
  const box = el("figure", {class:"vis vis-" + kind});
  if(v.titolo) box.appendChild(el("figcaption", {class:"vis-title", text:v.titolo}));
  return box;
}
function visCaption(box, v){
  if(v.didascalia) box.appendChild(el("p", {class:"vis-cap", text:v.didascalia}));
  if(v.fonte) box.appendChild(el("p", {class:"vis-src", text:"Fonte: " + v.fonte}));
}
function toggleRow(options, onPick){
  const row = el("div", {class:"vis-toggle", role:"tablist"});
  options.forEach(function(o, i){
    const b = el("button", {type:"button", role:"tab", "aria-selected":i === 0 ? "true" : "false", text:o[1]});
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(row.children, function(x){ x.setAttribute("aria-selected", x === b ? "true" : "false"); });
      onPick(o[0]);
    });
    row.appendChild(b);
  });
  return row;
}

/* ---------- stime: i numeri che si muovono, disegnati ----------
   Le stime come anelli, il dato vero come pallino pieno: si vede a colpo
   d'occhio chi ci aveva preso. Legge dai numeri dell'archivio (chiave) o
   dai punti scritti nell'edizione. */
function visStime(v){
  const box = visFrame(v, "stime");
  let pts = v.punti;
  let unit = v.unita || "";
  if(!pts && v.chiave && FACTS[v.chiave]){
    pts = FACTS[v.chiave].map(function(r){ return {data:r.date, valore:r.value, fonte:r.source, tipo:r.kind}; });
    unit = unit || (FACTS[v.chiave][0] || {}).unit || "";
  }
  pts = (pts || []).filter(function(p){ return typeof p.valore === "number"; });
  if(pts.length < 2){ return null; }
  const W = 640, H = 300, L = 70, R = 28, T = 34, B = 46;
  const ts = pts.map(function(p){ return new Date(p.data + "T12:00:00").getTime(); });
  let t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts);
  if(t0 === t1){ t0 -= 864e5; t1 += 864e5; }
  const span = t1 - t0; t0 -= span * .05; t1 += span * .05;
  const vs = pts.map(function(p){ return p.valore; });
  let v0 = Math.min.apply(null, vs), v1 = Math.max.apply(null, vs);
  const m = (v1 - v0) || Math.abs(v1) * .1 || 1; v0 -= m * .35; v1 += m * .35;
  const X = function(t){ return L + (t - t0) / (t1 - t0) * (W - L - R); };
  const Y = function(x){ return T + (1 - (x - v0) / (v1 - v0)) * (H - T - B); };
  const svg = sv("svg", {viewBox:"0 0 " + W + " " + H, class:"vis-svg", role:"img", "aria-label":v.titolo || "serie di stime"});
  /* tacche su cifre tonde: 2.000, 2.050, 2.100 — non 2.077 */
  const raw = (v1 - v0) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(function(k){ return k * mag; }).filter(function(k){ return k >= raw; })[0] || raw;
  for(let val = Math.ceil(v0 / step) * step; val <= v1; val += step){
    const y = Y(val);
    svg.appendChild(sv("line", {x1:L, x2:W - R, y1:y, y2:y, class:"grid"}));
    svg.appendChild(svText(L - 10, y + 4, fmtVal(Math.round(val * 100) / 100, unit), {class:"ax", "text-anchor":"end"}));
  }
  let d = "";
  pts.forEach(function(p, i){ d += (i ? " L" : "M") + X(ts[i]).toFixed(1) + " " + Y(p.valore).toFixed(1); });
  const path = sv("path", {d:d, class:"line"});
  svg.appendChild(path);
  const tip = svText(L, 18, "Tocca un punto per vedere chi l'ha detto", {class:"tip"});
  svg.appendChild(tip);
  const dots = [];
  pts.forEach(function(p, i){
    const real = p.tipo === "dato";
    const g = sv("g", {class:"pt" + (real ? " real" : ""), tabindex:"0", style:"opacity:0"});
    g.appendChild(sv("circle", {cx:X(ts[i]), cy:Y(p.valore), r:real ? 11 : 8}));
    g.appendChild(svText(X(ts[i]), Y(p.valore) - 17, fmtVal(p.valore, unit), {class:"val", "text-anchor":"middle"}));
    g.appendChild(svText(X(ts[i]), H - B + 22, fmtShort(p.data).replace(/ \d{4}$/, ""), {class:"ax", "text-anchor":"middle"}));
    const show = function(){
      dots.forEach(function(x){ x.classList.remove("sel"); });
      g.classList.add("sel");
      tip.textContent = (real ? "DATO · " : "STIMA · ") + fmtShort(p.data) + " · " + (p.fonte || "");
    };
    g.addEventListener("click", show);
    g.addEventListener("keydown", function(e){ if(e.key === "Enter") show(); });
    dots.push(g); svg.appendChild(g);
  });
  box.appendChild(svg);
  box.appendChild(el("div", {class:"vis-legend"}, [
    el("span", {}, [el("i", {class:"lg ring"}), el("span", {text:"stima"})]),
    el("span", {}, [el("i", {class:"lg full"}), el("span", {text:"dato ufficiale"})])
  ]));
  visCaption(box, v);
  whenSeen(box, function(){
    const len = path.getTotalLength ? path.getTotalLength() : 1000;
    path.style.strokeDasharray = len; path.style.strokeDashoffset = STILL ? 0 : len;
    requestAnimationFrame(function(){ path.style.transition = "stroke-dashoffset 1.6s ease"; path.style.strokeDashoffset = 0; });
    dots.forEach(function(g, i){ setTimeout(function(){ g.style.transition = "opacity .4s"; g.style.opacity = 1; }, STILL ? 0 : 250 + i * 320); });
  });
  return box;
}

/* ---------- barre: le grandezze a confronto ----------
   Forchette vere (min-max), non numeri tondi: la parte piena e' il minimo,
   quella tratteggiata arriva al massimo. */
function visBarre(v){
  const box = visFrame(v, "barre");
  const voci = v.voci || [];
  const top = Math.max.apply(null, voci.map(function(x){ return x.max || x.min || 0; })) || 1;
  const list = el("div", {class:"bars"});
  const fills = [];
  voci.forEach(function(x){
    const lo = x.min || 0, hi = x.max || lo;
    const bar = el("div", {class:"bar-track"});
    const full = el("i", {class:"bar-full"}); full.style.background = tone(x.colore);
    const ext = el("i", {class:"bar-ext"}); ext.style.borderColor = tone(x.colore);
    bar.appendChild(full); bar.appendChild(ext);
    fills.push([full, ext, lo / top * 100, (hi - lo) / top * 100]);
    list.appendChild(el("div", {class:"bar-row"}, [
      el("div", {class:"bar-head"}, [
        el("span", {class:"bar-label", text:x.etichetta}),
        el("b", {text:(hi > lo ? fmtNum(lo) + "–" + fmtNum(hi) : fmtNum(lo)) + (v.unita ? " " + v.unita : "")})
      ]),
      bar,
      x.nota ? el("span", {class:"bar-note", text:x.nota}) : null
    ]));
  });
  box.appendChild(list);
  visCaption(box, v);
  whenSeen(box, function(){
    fills.forEach(function(f, i){
      setTimeout(function(){
        f[0].style.width = f[2] + "%";
        f[1].style.left = f[2] + "%"; f[1].style.width = f[3] + "%";
      }, STILL ? 0 : 120 + i * 260);
    });
  });
  return box;
}
function fmtNum(x){
  const neg = x < 0, parts = String(Math.round(Math.abs(x) * 100) / 100).split(".");
  return (neg ? "-" : "") + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (parts[1] ? "," + parts[1] : "");
}

/* ---------- resa: la linea di montaggio ----------
   I telefoni escono dal nastro, passano il controllo o finiscono nel cesto.
   Il cursore cambia la resa, e il conto in basso dice quanti ne vanno montati
   per arrivare all'obiettivo. Aritmetica, niente di inventato. */
function visResa(v){
  const box = visFrame(v, "resa");
  const canvas = el("canvas", {class:"vis-canvas", "aria-hidden":"true"});
  box.appendChild(canvas);
  let resa = Math.max(.05, Math.min(.99, v.resa || .6));
  const slider = el("input", {type:"range", min:"30", max:"99", value:String(Math.round(resa * 100)), "aria-label":"resa di assemblaggio"});
  const pct = el("b", {class:"big", text:Math.round(resa * 100) + "%"});
  const counts = el("span", {class:"counts"});
  const need = el("p", {class:"need"});
  box.appendChild(el("div", {class:"vis-controls"}, [
    el("label", {class:"lbl"}, [el("span", {text:"Resa"}), pct]), slider
  ]));
  box.appendChild(counts);
  box.appendChild(need);
  const goal = v.obiettivo || 0;
  let made = 0, good = 0, bad = 0;
  function readout(){
    pct.textContent = Math.round(resa * 100) + "%";
    counts.textContent = "Montati " + made + " · passano " + good + " · scartati " + bad;
    if(goal){
      const n = goal / resa;
      need.innerHTML = "";
      need.appendChild(el("span", {text:"Per " + (v.etichetta_obiettivo || fmtNum(goal) + " buoni") + " ne vanno montati "}));
      need.appendChild(el("b", {text:(n >= 1e6 ? fmtNum(Math.round(n / 1e5) / 10) + " milioni" : fmtNum(Math.round(n)))}));
      need.appendChild(el("span", {text:" — su 100 che escono dalla linea, " + Math.round(resa * 100) + " passano il controllo."}));
    }
  }
  slider.addEventListener("input", function(){ resa = +slider.value / 100; made = good = bad = 0; readout(); });
  readout();
  visCaption(box, v);

  whenSeen(box, function(){
    let geo = crispCanvas(canvas, .36);
    window.addEventListener("resize", function(){ geo = crispCanvas(canvas, .36); });
    const items = [];
    let last = 0;
    const blue = tone("blue"), red = tone("red"), ink = cssv("--ink"), rule = cssv("--rule-strong"), paper = cssv("--paper-2");
    function phone(ctx, x, y, col, mark){
      ctx.fillStyle = col;
      const w = 18, h = 24, r = 4;
      ctx.beginPath();
      ctx.moveTo(x - w/2 + r, y - h/2); ctx.arcTo(x + w/2, y - h/2, x + w/2, y + h/2, r);
      ctx.arcTo(x + w/2, y + h/2, x - w/2, y + h/2, r); ctx.arcTo(x - w/2, y + h/2, x - w/2, y - h/2, r);
      ctx.arcTo(x - w/2, y - h/2, x + w/2, y - h/2, r); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y - h/2 + 3); ctx.lineTo(x, y + h/2 - 3); ctx.stroke();
      if(mark){ ctx.fillStyle = "#fff"; ctx.font = "700 11px system-ui"; ctx.textAlign = "center"; ctx.fillText(mark, x, y + 4); }
    }
    function frame(now){
      const ctx = geo.ctx, w = geo.w, h = geo.h;
      const beltY = h * .42, gate = w * .56;
      ctx.clearRect(0, 0, w, h);
      /* nastro */
      ctx.fillStyle = paper; ctx.fillRect(0, beltY + 14, w, 8);
      ctx.fillStyle = rule;
      for(let x = ((now / 18) % 22); x < w; x += 22){ ctx.beginPath(); ctx.arc(x, beltY + 18, 2.2, 0, 7); ctx.fill(); }
      /* controllo qualita' */
      ctx.fillStyle = ink; ctx.fillRect(gate - 2, beltY - 30, 4, 44);
      ctx.fillRect(gate - 16, beltY - 34, 32, 6);
      ctx.font = "700 9px system-ui"; ctx.textAlign = "center"; ctx.fillText("CONTROLLO", gate, beltY - 40);
      /* cesto degli scarti */
      ctx.strokeStyle = red; ctx.lineWidth = 2;
      ctx.strokeRect(gate + 30, h - 34, 64, 26);
      ctx.fillStyle = red; ctx.font = "700 9px system-ui"; ctx.fillText("SCARTI", gate + 62, h - 40);
      if(now - last > (STILL ? 1e9 : 520)){ items.push({x:-14, y:beltY, st:0}); last = now; made++; readout(); }
      for(let i = items.length - 1; i >= 0; i--){
        const it = items[i];
        if(it.st === 0){ it.x += 1.6; if(it.x >= gate){ it.st = Math.random() < resa ? 1 : 2; if(it.st === 1) good++; else bad++; readout(); } }
        else if(it.st === 1){ it.x += 1.6; }
        else { it.x += .9; it.y += 2.2; if(it.y > h - 22){ it.y = h - 22; it.x = Math.min(it.x, gate + 86); it.st = 3; it.t = now; } }
        const col = it.st === 0 ? ink : (it.st === 1 ? blue : red);
        phone(ctx, it.x, it.y, col, it.st === 1 ? "✓" : (it.st >= 2 ? "✕" : ""));
        if(it.x > w + 20 || (it.st === 3 && now - it.t > 1600)) items.splice(i, 1);
      }
      if(!STILL) requestAnimationFrame(frame);
    }
    if(STILL){ /* senza movimento: dieci telefoni fermi, colorati secondo la resa */
      const ctx = geo.ctx; for(let i = 0; i < 10; i++){ phone(ctx, 24 + i * 28, geo.h * .45, i < Math.round(resa * 10) ? tone("blue") : tone("red")); }
    } else requestAnimationFrame(frame);
  });
  return box;
}

/* ---------- piega: il Duo in 3D ----------
   Due meta' unite da una cerniera, disegnate con le trasformazioni 3D della
   pagina: niente librerie, niente modelli da scaricare. Trascina per girarlo,
   il cursore apre e chiude. Le proporzioni sono quelle dichiarate (7,6"
   aperto, 5,4" chiuso), i colori indicativi. */
function visPiega(v){
  const box = visFrame(v, "piega");
  const rig = el("div", {class:"duo-rig"});
  const left = el("div", {class:"duo-half duo-l"}, [
    el("div", {class:"duo-face duo-in"}),
    el("div", {class:"duo-face duo-back"}, [el("div", {class:"duo-cam"}, [el("i"), el("i")])])
  ]);
  const right = el("div", {class:"duo-half duo-r"}, [
    el("div", {class:"duo-face duo-in"}),
    el("div", {class:"duo-face duo-back duo-outer"}, [
      el("div", {class:"duo-clock", text:"9:41"}),
      el("div", {class:"duo-date", text:"venerdì 23 ottobre"})
    ])
  ]);
  rig.appendChild(left); rig.appendChild(right);
  const stage = el("div", {class:"duo-stage"}, [rig]);
  box.appendChild(stage);
  const state = el("p", {class:"duo-state"});
  const slider = el("input", {type:"range", min:"0", max:"180", value:"180", "aria-label":"apertura della cerniera"});
  const btn = el("button", {type:"button", class:"vis-btn", text:"Chiudi"});
  const sw = el("div", {class:"duo-swatches"});
  (v.colori || []).forEach(function(c, i){
    const b = el("button", {type:"button", class:"sw" + (i === 0 ? " on" : ""), title:c.nome, "aria-label":c.nome});
    b.style.background = c.hex;
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(sw.children, function(x){ x.classList.toggle("on", x === b); });
      box.style.setProperty("--duo-frame", c.hex); swName.textContent = c.nome;
    });
    sw.appendChild(b);
  });
  const swName = el("span", {class:"sw-name", text:(v.colori && v.colori[0]) ? v.colori[0].nome : ""});
  if(v.colori && v.colori[0]) box.style.setProperty("--duo-frame", v.colori[0].hex);
  box.appendChild(state);
  box.appendChild(el("div", {class:"vis-controls"}, [btn, slider]));
  if(v.colori && v.colori.length) box.appendChild(el("div", {class:"duo-colors"}, [sw, swName]));
  visCaption(box, v);

  let open = 180, target = 180, ry = -28, rx = 20, drag = null, auto = !STILL, t0 = performance.now();
  function paint(){
    right.style.transform = "rotateY(" + (-(180 - open)) + "deg)";
    rig.style.transform = "rotateX(" + rx + "deg) rotateY(" + ry + "deg)";
    slider.value = String(Math.round(open));
    state.textContent = open < 12 ? "Chiuso · schermo esterno da " + (v.esterno || "5,4″")
      : (open > 168 ? "Aperto · schermo interno da " + (v.interno || "7,6″") : "Cerniera a " + Math.round(open) + "°");
    btn.textContent = open > 90 ? "Chiudi" : "Apri";
  }
  function tick(now){
    if(Math.abs(target - open) > .5){ open += (target - open) * .12; }
    else open = target;
    if(auto && !drag) ry = -24 + Math.sin((now - t0) / 2600) * 34;
    paint();
    requestAnimationFrame(tick);
  }
  slider.addEventListener("input", function(){ target = open = +slider.value; auto = false; paint(); });
  btn.addEventListener("click", function(){ target = open > 90 ? 0 : 180; auto = false; });
  stage.addEventListener("pointerdown", function(e){ drag = {x:e.clientX, y:e.clientY, ry:ry, rx:rx}; auto = false; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", function(e){
    if(!drag) return;
    ry = drag.ry + (e.clientX - drag.x) * .5;
    rx = Math.max(-30, Math.min(55, drag.rx - (e.clientY - drag.y) * .35));
  });
  stage.addEventListener("pointerup", function(){ drag = null; });
  stage.addEventListener("pointercancel", function(){ drag = null; });
  paint();
  whenSeen(box, function(){
    if(STILL){ paint(); return; }
    /* una piccola dimostrazione: si chiude e si riapre da solo, poi e' tuo */
    target = 0; setTimeout(function(){ target = 180; }, 1700);
    requestAnimationFrame(tick);
  });
  return box;
}

/* ---------- anno: quando lancia Apple ----------
   L'anno come un quadrante. I lanci veri cadono a grappoli su due stagioni;
   l'interruttore mostra l'obiettivo — lanci lungo tutto l'anno — che e' una
   direzione dichiarata, non un calendario: per questo e' una fascia, non
   dei punti inventati. */
function visAnno(v){
  const box = visFrame(v, "anno");
  const S = 360, C = S / 2, R = 128;
  const svg = sv("svg", {viewBox:"0 0 " + S + " " + S, class:"vis-svg anno", role:"img", "aria-label":v.titolo || "l'anno dei lanci"});
  const ang = function(doy){ return (doy / 365) * Math.PI * 2 - Math.PI / 2; };
  const pt = function(doy, r){ const a = ang(doy); return [C + Math.cos(a) * r, C + Math.sin(a) * r]; };
  svg.appendChild(sv("circle", {cx:C, cy:C, r:R, class:"ring"}));
  const band = sv("circle", {cx:C, cy:C, r:R, class:"band", style:"opacity:0"});
  svg.appendChild(band);
  "GFMAMGLASOND".split("").forEach(function(ch, i){
    const doy = i * 30.4 + 15;
    const p = pt(doy, R + 24);
    svg.appendChild(svText(p[0], p[1] + 4, ch, {class:"mo", "text-anchor":"middle"}));
    const a = pt(i * 30.4, R - 6), b = pt(i * 30.4, R + 6);
    svg.appendChild(sv("line", {x1:a[0], y1:a[1], x2:b[0], y2:b[1], class:"tick"}));
  });
  const evs = (v.eventi || []).map(function(e){
    const d = new Date(e.data + "T12:00:00");
    const start = new Date(d.getFullYear(), 0, 1);
    return {e:e, doy:Math.round((d - start) / 86400000)};
  });
  const big = svText(C, C - 4, String(evs.length), {class:"big", "text-anchor":"middle"});
  const small = svText(C, C + 22, v.centro || "giornate di lancio", {class:"small", "text-anchor":"middle"});
  svg.appendChild(big); svg.appendChild(small);
  const dots = [];
  const detail = el("p", {class:"anno-detail", text:"Tocca un pallino"});
  evs.forEach(function(x, i){
    const p = pt(x.doy, R);
    const g = sv("g", {class:"ev", tabindex:"0", style:"opacity:0"});
    g.appendChild(sv("circle", {cx:p[0], cy:p[1], r:9}));
    const show = function(){ dots.forEach(function(d){ d.classList.remove("sel"); }); g.classList.add("sel");
      detail.textContent = fmtShort(x.e.data) + " — " + x.e.etichetta; };
    g.addEventListener("click", show); g.addEventListener("keydown", function(e){ if(e.key === "Enter") show(); });
    dots.push(g); svg.appendChild(g);
  });
  box.appendChild(svg);
  box.appendChild(detail);
  box.appendChild(toggleRow([["oggi", v.etichetta_oggi || "Com'è oggi"], ["obiettivo", v.etichetta_obiettivo || "L'obiettivo"]], function(mode){
    const goal = mode === "obiettivo";
    band.style.opacity = goal ? 1 : 0;
    dots.forEach(function(d){ d.style.opacity = goal ? .3 : 1; });
    big.textContent = goal ? "12" : String(evs.length);
    small.textContent = goal ? (v.centro_obiettivo || "mesi utili per lanciare") : (v.centro || "giornate di lancio");
    detail.textContent = goal ? (v.obiettivo || "") : "Tocca un pallino";
  }));
  visCaption(box, v);
  whenSeen(box, function(){
    dots.forEach(function(g, i){ setTimeout(function(){ g.style.transition = "opacity .35s"; g.style.opacity = 1; }, STILL ? 0 : 200 + i * 260); });
  });
  return box;
}

/* ---------- raggio: chi viene avvisato ----------
   Una citta' di puntini. Tocchi un punto, parte la segnalazione, e il
   cerchio del raggio dichiarato accende chi ci sta dentro. Serve a capire
   il meccanismo di cui si parla, non a mappare niente di reale. */
function visRaggio(v){
  const box = visFrame(v, "raggio");
  const canvas = el("canvas", {class:"vis-canvas tap", "aria-label":"tocca per simulare una segnalazione", role:"img"});
  const counter = el("p", {class:"raggio-count", text:"Tocca la mappa per simulare una segnalazione"});
  box.appendChild(canvas); box.appendChild(counter);
  visCaption(box, v);
  const WORLD = v.lato_km || 40, RK = v.raggio_km || 8;
  let geo = null, people = [], pings = [];
  function seed(){
    people = [];
    let s = 7;
    const rnd = function(){ s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const hubs = [[.3,.4],[.62,.55],[.5,.25],[.78,.3],[.22,.75]];
    for(let i = 0; i < 900; i++){
      const hb = hubs[i % hubs.length], r = Math.pow(rnd(), .7) * .22, a = rnd() * 7;
      people.push({x:Math.min(.98, Math.max(.02, hb[0] + Math.cos(a) * r * 1.2)), y:Math.min(.97, Math.max(.03, hb[1] + Math.sin(a) * r)), lit:0});
    }
  }
  function draw(now){
    const ctx = geo.ctx, w = geo.w, h = geo.h, kmPx = w / WORLD;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = cssv("--rule"); ctx.lineWidth = 1;
    for(let x = 0; x < w; x += kmPx * 4){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for(let y = 0; y < h; y += kmPx * 4){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    const orange = tone("orange"), ink = cssv("--ink-3"), red = tone("red");
    pings.forEach(function(p){
      const k = STILL ? 1 : Math.min(1, (now - p.t) / 900);
      const r = RK * kmPx * (1 - Math.pow(1 - k, 3));
      ctx.fillStyle = orange + "22"; ctx.strokeStyle = orange; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x * w, p.y * h, r, 0, 7); ctx.fill(); ctx.stroke();
      p.r = r;
    });
    let lit = 0;
    people.forEach(function(q){
      const px = q.x * w, py = q.y * h;
      const inside = pings.some(function(p){ return Math.hypot(px - p.x * w, py - p.y * h) <= (p.r || 0); });
      if(inside) lit++;
      ctx.fillStyle = inside ? orange : ink;
      ctx.beginPath(); ctx.arc(px, py, inside ? 2.6 : 1.8, 0, 7); ctx.fill();
    });
    pings.forEach(function(p){
      ctx.fillStyle = red; ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 6, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 2.2, 0, 7); ctx.fill();
    });
    /* scala */
    ctx.fillStyle = cssv("--ink"); ctx.fillRect(12, h - 16, RK * kmPx, 3);
    ctx.font = "700 10px system-ui"; ctx.textAlign = "left";
    ctx.fillText((v.etichetta_raggio || RK + " km"), 12, h - 22);
    if(pings.length) counter.textContent = "Avvisati " + lit + " puntini su " + people.length + (pings.length > 1 ? " · " + pings.length + " segnalazioni" : "");
    if(!STILL) requestAnimationFrame(draw);
  }
  canvas.addEventListener("click", function(e){
    const r = canvas.getBoundingClientRect();
    pings.push({x:(e.clientX - r.left) / r.width, y:(e.clientY - r.top) / r.height, t:performance.now()});
    if(pings.length > 3) pings.shift();
    if(STILL) draw(performance.now());
  });
  whenSeen(box, function(){
    seed(); geo = crispCanvas(canvas, .62);
    window.addEventListener("resize", function(){ geo = crispCanvas(canvas, .62); });
    pings.push({x:.44, y:.46, t:performance.now() + 400});
    requestAnimationFrame(draw);
  });
  return box;
}

/* ---------- flusso: dove passano i soldi ----------
   Due strade dallo stesso punto di partenza allo stesso negozio. Nel mezzo,
   o c'e' l'ecosistema che incassa sul passaggio, o c'e' un agente. */
function visFlusso(v){
  const box = visFrame(v, "flusso");
  const W = 640, H = 262, Y0 = 84;
  const svg = sv("svg", {viewBox:"0 0 " + W + " " + H, class:"vis-svg flusso", role:"img", "aria-label":v.titolo || "flusso"});
  const main = sv("path", {d:"M 70 " + Y0 + " C 200 " + Y0 + ", 200 " + Y0 + ", 320 " + Y0 + " S 440 " + Y0 + ", 570 " + Y0, class:"road"});
  const branch = sv("path", {d:"M 320 " + Y0 + " C 326 140, 326 170, 320 206", class:"road branch"});
  svg.appendChild(main); svg.appendChild(branch);
  function node(x, y, r, cls){ return sv("circle", {cx:x, cy:y, r:r, class:"node " + cls}); }
  /* le etichette stanno fuori dai cerchi: "Negozio" dentro un pallino non ci stava */
  svg.appendChild(node(70, Y0, 24, "you")); svg.appendChild(svText(70, Y0 + 48, v.partenza || "Tu", {class:"nlabel out", "text-anchor":"middle"}));
  const midBox = sv("rect", {x:196, y:Y0 - 30, width:248, height:60, rx:10, class:"mid"});
  svg.appendChild(midBox);
  const midTxt = svText(320, Y0 + 6, "", {class:"nlabel mid-t", "text-anchor":"middle"});
  svg.appendChild(midTxt);
  svg.appendChild(node(570, Y0, 24, "shop")); svg.appendChild(svText(570, Y0 + 48, v.arrivo || "Negozio", {class:"nlabel out", "text-anchor":"middle"}));
  const sink = node(320, 214, 22, "sink");
  svg.appendChild(sink);
  const sinkTxt = svText(320, 256, "", {class:"nlabel out", "text-anchor":"middle"});
  svg.appendChild(sinkTxt);
  const coins = sv("g");
  svg.appendChild(coins);
  box.appendChild(svg);
  const note = el("p", {class:"flusso-note"});
  box.appendChild(note);
  let mode = "oggi";
  function apply(){
    const m = v[mode] || {};
    midTxt.textContent = m.centro || "";
    sinkTxt.textContent = m.incassa || "";
    note.textContent = m.nota || "";
    box.classList.toggle("agent", mode === "agente");
  }
  box.appendChild(toggleRow([["oggi", (v.oggi || {}).etichetta || "Oggi"], ["agente", (v.agente || {}).etichetta || "Con un agente"]], function(m){ mode = m; apply(); }));
  apply();
  visCaption(box, v);
  whenSeen(box, function(){
    if(STILL) return;
    const L1 = main.getTotalLength(), L2 = branch.getTotalLength();
    const list = [];
    let last = 0;
    function step(now){
      if(now - last > 380){
        const c = sv("circle", {r:6, class:"coin"}); coins.appendChild(c);
        list.push({c:c, s:0, br:Math.random() < .45, done:false}); last = now;
      }
      for(let i = list.length - 1; i >= 0; i--){
        const k = list[i];
        k.s += 3.2;
        let p;
        if(k.br && k.s > L1 / 2){
          const s2 = k.s - L1 / 2;
          if(s2 > L2){ k.c.remove(); list.splice(i, 1); continue; }
          p = branch.getPointAtLength(s2);
        } else {
          if(k.s > L1){ k.c.remove(); list.splice(i, 1); continue; }
          p = main.getPointAtLength(k.s);
        }
        k.c.setAttribute("cx", p.x); k.c.setAttribute("cy", p.y);
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
  return box;
}

/* ---------- onde: la cancellazione del rumore ----------
   Nel kit per la prima notizia che la tocchera': il rumore, l'onda opposta
   che le cuffie generano, e quello che resta. Il cursore sposta il ritardo
   dell'antirumore: si vede perche' conta la velocita' del chip. */
function visOnde(v){
  const box = visFrame(v, "onde");
  const canvas = el("canvas", {class:"vis-canvas", "aria-hidden":"true"});
  box.appendChild(canvas);
  const slider = el("input", {type:"range", min:"0", max:"100", value:"4", "aria-label":"ritardo dell'antirumore"});
  const lab = el("b", {class:"big", text:""});
  const on = el("button", {type:"button", class:"vis-btn", text:"Antirumore: acceso"});
  let active = true, delay = .04;
  box.appendChild(el("div", {class:"vis-controls"}, [on, el("label", {class:"lbl"}, [el("span", {text:"Ritardo"}), lab]), slider]));
  visCaption(box, v);
  on.addEventListener("click", function(){ active = !active; on.textContent = "Antirumore: " + (active ? "acceso" : "spento"); });
  slider.addEventListener("input", function(){ delay = +slider.value / 100; });
  whenSeen(box, function(){
    let geo = crispCanvas(canvas, .5);
    function noise(t, x){ return Math.sin(x * .045 + t * 2.1) * .55 + Math.sin(x * .11 - t * 3.3) * .3 + Math.sin(x * .023 + t) * .15; }
    function frame(now){
      const t = now / 1000, ctx = geo.ctx, w = geo.w, h = geo.h, rows = [h * .2, h * .5, h * .8], amp = h * .11;
      ctx.clearRect(0, 0, w, h);
      lab.textContent = Math.round(delay * 100) + "%";
      const lines = [["rumore", tone("red"), function(x){ return noise(t, x); }],
                     ["antirumore", tone("blue"), function(x){ return active ? -noise(t, x - delay * 60) : 0; }],
                     ["quello che senti", cssv("--ink"), function(x){ return noise(t, x) + (active ? -noise(t, x - delay * 60) : 0); }]];
      lines.forEach(function(L, i){
        ctx.strokeStyle = L[1]; ctx.lineWidth = i === 2 ? 3 : 2; ctx.beginPath();
        for(let x = 0; x <= w; x += 3){ const y = rows[i] + L[2](x) * amp; if(x) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
        ctx.stroke();
        ctx.fillStyle = L[1]; ctx.font = "700 10px system-ui"; ctx.fillText(L[0].toUpperCase(), 8, rows[i] - amp - 4);
      });
      if(!STILL) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
  return box;
}


/* ---------- esploso: l'oggetto scomposto a strati ----------
   Le parti una sopra l'altra, come in un'illustrazione tecnica. "Scomponi"
   le allontana nello spazio; ogni strato si tocca e racconta la sua parte.
   Serve per un telefono, un paio di AirPods, un chip: gli strati li scrive
   l'edizione, il disegno e' lo stesso. */
function visEsploso(v){
  const box = visFrame(v, "esploso");
  const strati = v.strati || [];
  const stack = el("div", {class:"xp-stack"});
  const plates = [];
  const info = el("div", {class:"xp-info"}, [el("b", {text:"Tocca uno strato"}), el("span", {text:v.invito || ""})]);
  strati.forEach(function(s, i){
    const pl = el("button", {type:"button", class:"xp-plate" + (s.stato === "problema" ? " warn" : ""), "aria-label":s.nome});
    pl.style.setProperty("--i", String(i));
    pl.style.setProperty("--n", String(strati.length));
    pl.style.setProperty("--c", tone(s.colore || (s.stato === "problema" ? "red" : "ink-3")));
    pl.appendChild(el("span", {class:"xp-face"}));
    pl.appendChild(el("span", {class:"xp-tag", text:s.nome}));
    pl.addEventListener("click", function(){
      plates.forEach(function(p){ p.classList.remove("sel"); }); pl.classList.add("sel");
      info.innerHTML = "";
      info.appendChild(el("b", {text:s.nome}));
      info.appendChild(el("span", {text:s.nota || ""}));
      if(!box.classList.contains("open")) toggle(true);
    });
    plates.push(pl); stack.appendChild(pl);
  });
  const scene = el("div", {class:"xp-scene"}, [stack]);
  box.appendChild(scene);
  const btn = el("button", {type:"button", class:"vis-btn", text:"Scomponi"});
  function toggle(force){
    const on = typeof force === "boolean" ? force : !box.classList.contains("open");
    box.classList.toggle("open", on);
    btn.textContent = on ? "Ricomponi" : "Scomponi";
  }
  btn.addEventListener("click", function(){ toggle(); });
  box.appendChild(el("div", {class:"vis-controls"}, [btn]));
  box.appendChild(info);
  visCaption(box, v);
  whenSeen(box, function(){ if(!STILL) setTimeout(function(){ toggle(true); }, 500); });
  return box;
}

/* ================= ascolta =================
   La voce del sistema, dentro la pagina: nessun file da scaricare, niente
   da pagare. Legge a frasi, cosi' si puo' fermare e riprendere dal punto
   giusto e la barra sa a che punto sei. Finche' legge tiene lo schermo
   acceso: con lo schermo bloccato iOS ferma la voce. */
const Voice = (function(){
  const ok = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
  let chunks = [], idx = 0, playing = false, rate = 1, voice = null, title = "", lock = null, bar = null;
  const RATES = [1, 1.15, 1.3, .9];

  function pickVoice(){
    const all = ok ? speechSynthesis.getVoices() : [];
    const it = all.filter(function(x){ return /^it(-|_|$)/i.test(x.lang); });
    const score = function(x){
      let s = 0;
      if(/premium|enhanced|neural|natural|siri/i.test(x.name)) s += 4;
      if(/google/i.test(x.name)) s += 2;
      if(/alice|federica|emma|luca|paola/i.test(x.name)) s += 1;
      if(x.localService) s += 1;
      return s;
    };
    it.sort(function(a, b){ return score(b) - score(a); });
    voice = it[0] || null;
  }
  if(ok){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  function split(text){
    const out = [];
    String(text || "").replace(/\s+/g, " ").split(/(?<=[.!?…»”])\s+(?=[A-ZÀ-Ý«“"0-9])/).forEach(function(s){
      s = s.trim(); if(!s) return;
      while(s.length > 240){
        const cut = s.lastIndexOf(",", 240) > 80 ? s.lastIndexOf(",", 240) + 1 : 240;
        out.push(s.slice(0, cut).trim()); s = s.slice(cut).trim();
      }
      out.push(s);
    });
    return out;
  }

  function script(brief, n){
    const a = n.approfondimento, parts = [n.title + "."];
    if(!a){ parts.push(n.sintesi || ""); parts.push(n.descrizione || ""); return parts; }
    if(a.punto) parts.push(a.punto);
    (a.visivi || []).forEach(function(v){ if(v.didascalia) parts.push(v.didascalia); });
    if(a.sotto && a.sotto.length){ parts.push("Cosa c'è sotto."); [].concat(a.sotto).forEach(function(p){ parts.push(p); }); }
    if(a.tappe && a.tappe.length){
      parts.push("Come ci siamo arrivati.");
      a.tappe.forEach(function(t){ parts.push((/^\d{4}-\d{2}$/.test(t.data) ? "A " : "Il ") + spokenDate(t.data) + ": " + t.testo); });
    }
    if(a.fonti){ parts.push("Chi lo dice."); parts.push(a.fonti); }
    if(a.dopo && a.dopo.length){
      parts.push("Cosa aspettarsi.");
      a.dopo.forEach(function(d){ parts.push((d.data ? "Il " + spokenDate(d.data) + ": " : "") + d.testo); });
    }
    parts.push("Fine dell'approfondimento.");
    return parts;
  }

  function ui(){
    if(bar) return bar;
    const pp = el("button", {type:"button", class:"pp", "aria-label":"pausa", text:"❚❚"});
    const what = el("div", {class:"what"}, [el("b"), el("span")]);
    const sp = el("button", {type:"button", class:"sp", text:"1×", "aria-label":"velocità"});
    const x = el("button", {type:"button", class:"x", text:"✕", "aria-label":"chiudi"});
    const prog = el("div", {class:"bar"}, [el("i")]);
    bar = el("div", {class:"player", hidden:"hidden", role:"region", "aria-label":"Lettura ad alta voce"}, [pp, what, sp, x, prog]);
    pp.addEventListener("click", function(){ playing ? pause() : resume(); });
    sp.addEventListener("click", function(){
      rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
      sp.textContent = String(rate).replace(".", ",") + "×";
      if(playing){ speechSynthesis.cancel(); speak(); }
    });
    x.addEventListener("click", stop);
    document.body.appendChild(bar);
    return bar;
  }
  function paint(){
    const b = ui();
    b.hidden = false;
    b.querySelector(".what b").textContent = title;
    b.querySelector(".what span").textContent = (playing ? "In ascolto" : "In pausa") + " · " + Math.min(idx + 1, chunks.length) + "/" + chunks.length;
    b.querySelector(".pp").textContent = playing ? "❚❚" : "▶";
    b.querySelector(".bar i").style.width = (chunks.length ? idx / chunks.length * 100 : 0) + "%";
  }
  async function wake(on){
    try{
      if(on && navigator.wakeLock && !lock){ lock = await navigator.wakeLock.request("screen"); }
      if(!on && lock){ lock.release(); lock = null; }
    }catch(e){}
  }
  function speak(){
    if(idx >= chunks.length){ stop(); return; }
    const u = new SpeechSynthesisUtterance(chunks[idx]);
    u.lang = "it-IT"; u.rate = rate; if(voice) u.voice = voice;
    u.onend = function(){ if(!playing) return; idx++; paint(); speak(); };
    u.onerror = function(e){ if(e.error === "interrupted" || e.error === "canceled") return; idx++; if(playing) speak(); };
    speechSynthesis.speak(u);
  }
  function play(brief, n){
    if(!ok) return;
    speechSynthesis.cancel();
    chunks = [];
    script(brief, n).forEach(function(p){ chunks = chunks.concat(split(p)); });
    idx = 0; playing = true; title = n.title;
    if("mediaSession" in navigator){
      try{ navigator.mediaSession.metadata = new MediaMetadata({title:n.title, artist:"The Morning Brief", album:fmtShort(brief.date)}); }catch(e){}
    }
    wake(true); paint(); speak();
  }
  function pause(){ playing = false; speechSynthesis.cancel(); wake(false); paint(); }
  function resume(){ if(!chunks.length) return; playing = true; wake(true); paint(); speak(); }
  function stop(){ playing = false; speechSynthesis.cancel(); wake(false); chunks = []; idx = 0; if(bar) bar.hidden = true; }
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && playing && lock === null) wake(true); });
  return {ok:ok, play:play, stop:stop};
})();


function storyNode(brief, n, index){
  const k = key(brief.date, n.id);
  const wrap = el("article", {class:"story", id:"s-" + n.id});
  const m0 = mk(k);
  if(m0 && m0.read_at) wrap.classList.add("is-read");

  /* Una riga di pastiglie sola: il tag, e sui rumor quanto e' solido. Su una
     notizia confermata "affidabilita' alta" e' ovvio, e categoria e numero di
     puntata erano scritte in piu' che nessuno leggeva (30 settembre 2026). */
  const chips = el("div", {class:"chips"});
  if(n.tag) chips.appendChild(el("span", {class:tagClass(n.tag), text:n.tag}));
  if(n.tag === "RUMOR" && n.reliability){
    const lv = {alta:3, media:2, bassa:1}[n.reliability] || 0;
    const meter = el("span", {class:"meter m-" + n.reliability, role:"img",
      "aria-label":"affidabilità " + n.reliability, title:"affidabilità " + n.reliability});
    for(let i = 1; i <= 3; i++) meter.appendChild(el("i", {class:i <= lv ? "on" : ""}));
    chips.appendChild(meter);
  }
  if(n.approfondimento) chips.appendChild(el("span", {class:"chip deep-mark", text:"approfondita"}));
  const thread = n.thread ? THREADS[n.thread] : null;

  const head = el("div", {class:"story-head"}, [
    bead(typeof index === "number" ? index : 0, String(typeof index === "number" ? index + 1 : (n.rank || 0))),
    chips,
    el("h3", {text:n.title}),
    el("p", {class:"lede", text:n.sintesi || ""})
  ]);
  if(n.image){
    head.classList.add("with-thumb");
    head.appendChild(el("img", {class:"thumb", src:n.image, alt:"", loading:"lazy", decoding:"async"}));
  }

  const body = el("div", {class:"story-body", hidden:"hidden"});
  body.appendChild(el("p", {text:n.descrizione || ""}));
  const nums = numbersNode(n.facts);
  if(nums) body.appendChild(nums);

  /* Approfondisci e Ascolta: il primo apre il pezzo lungo scritto la mattina
     per le prime notizie, il secondo lo legge ad alta voce (o legge la
     notizia, se l'approfondimento non c'e'). */
  const deep = n.approfondimento ? deepNode(brief, n) : null;
  const acts = el("div", {class:"deep-acts"});
  if(deep){
    const openBtn = el("button", {type:"button", class:"deep-open", "aria-expanded":"false"}, [
      el("span", {text:"Approfondisci"}), el("i", {"aria-hidden":"true", text:"↓"})
    ]);
    openBtn.addEventListener("click", function(ev){
      ev.stopPropagation();
      const on = deep.hidden;
      deep.hidden = !on;
      openBtn.setAttribute("aria-expanded", on ? "true" : "false");
      openBtn.classList.toggle("on", on);
      if(on) setTimeout(function(){ deep.scrollIntoView({behavior:"smooth", block:"start"}); }, 30);
    });
    acts.appendChild(openBtn);
  }
  const listen = el("button", {type:"button", class:"listen-btn"}, [
    el("i", {"aria-hidden":"true", text:"▶"}),
    el("span", {text:deep ? "Ascolta l'approfondimento" : "Ascolta"})
  ]);
  listen.addEventListener("click", function(ev){ ev.stopPropagation(); Voice.play(brief, n); });
  if(Voice.ok) acts.appendChild(listen);
  if(acts.childNodes.length) body.appendChild(acts);
  if(deep) body.appendChild(deep);
  if(n.reliability_note){
    body.appendChild(el("div", {class:"rel-note"}, [
      el("b", {text:"Nota sulla fonte"}), el("span", {text:n.reliability_note})
    ]));
  }
  /* La previsione di un rumor si mostra solo dopo che qualcuno l'ha chiusa:
     aperta e' contabilita' interna, verificata e' una notizia. Il conto per
     fonte non sta nell'app — si legge con pipeline/claims.py score. */
  if(n.claim && n.claim.id){
    const c = claimById(n.claim.id);
    if(c && c.res){
      const box = el("div", {class:"claim closed"}, [
        el("span", {class:"lbl", text:"Come è andata a finire"}),
        el("p", {class:"txt", text:n.claim.text || ""}),
        el("div", {class:"foot"}, [
          el("span", {class:"verdict v-" + c.state, text:c.state}),
          el("span", {class:"eyebrow", text:"verificata il " + fmtShort(c.res.date)})
        ])
      ]);
      if(c.res.note) box.appendChild(el("span", {text:c.res.note}));
      box.appendChild(el("button", {class:"act", type:"button", text:"Vedi la notizia che l'ha chiusa",
        onclick:function(ev){ ev.stopPropagation(); jumpTo(c.res.date, c.res.news.id); }}));
      body.appendChild(box);
    }
  }

  (n.resolves || []).forEach(function(r){
    const c = claimById(r.claim);
    const box = el("div", {class:"claim closed"}, [
      el("span", {class:"lbl", text:"Chiude una previsione"}),
      el("p", {class:"txt", text:c ? c.text : r.claim})
    ]);
    box.appendChild(el("div", {class:"foot"}, [
      el("span", {class:"verdict v-" + (r.verdict || "aperto"), text:r.verdict || ""}),
      c ? el("span", {class:"eyebrow", text:c.source + " · " + fmtShort(c.date)}) : null
    ]));
    if(r.note) box.appendChild(el("span", {text:r.note}));
    if(c){
      box.appendChild(el("button", {class:"act", type:"button", text:"Vedi dove era stata detta",
        onclick:function(ev){ ev.stopPropagation(); jumpTo(c.date, c.news.id); }}));
    }
    body.appendChild(box);
  });

  const read = el("div", {class:"readmore"});
  const primary = safeUrl(n.link);
  if(primary) read.appendChild(el("a", {class:"primary", href:primary, target:"_blank", rel:"noopener noreferrer", text:"Leggi l'articolo →"}));
  (n.extra_links || []).forEach(function(l){
    const u = safeUrl(l.url);
    if(u) read.appendChild(el("a", {href:u, target:"_blank", rel:"noopener noreferrer", text:l.label}));
  });
  if(read.childNodes.length) body.appendChild(read);
  if(n.sources && n.sources.length){
    body.appendChild(el("p", {class:"sources", text:n.sources.length + (n.sources.length === 1 ? " fonte — " : " fonti — ") + n.sources.join(", ")}));
  }
  const ver = verificaText(n.verifica);
  if(ver) body.appendChild(el("p", {class:"sources verifica", text:ver}));

  head.addEventListener("click", function(){
    body.hidden = !body.hidden;
    wrap.classList.toggle("is-open", !body.hidden);
    if(!body.hidden && NOTES && !(mk(k) && mk(k).read_at)){
      mark(k).read_at = new Date().toISOString();
      wrap.classList.add("is-read");
      touched(k);
    }
  });

  wrap.appendChild(head);
  wrap.appendChild(body);
  if(!NOTES) return wrap;   /* copia di sola lettura: niente appunti */

  const tools = itemTools(k, {
    ref:{date:brief.date, id:n.id, title:n.title},
    onNote:function(){ body.hidden = false; wrap.classList.add("is-open"); }
  });
  wrap.appendChild(tools.bar);
  wrap.appendChild(tools.panel);
  return wrap;
}

    id:"d" + Date.now() + Math.random().toString(36).slice(2,6),
    ts:Date.now(), text:"", tags:[], link:null, ref:null,
    updated_at:now, deleted_at:null, dirty:true
  }, fields));

  const e = S.diary.filter(function(x){ return x.id === id; })[0];
  if(!e) return;
  e.deleted_at = new Date().toISOString();
  e.updated_at = e.deleted_at;
  e.dirty = true;
  save(); queueSync(); refreshCounts();
}

/* ================= archivio ================= */
/* il mese aperto nell'archivio: resta quello scelto finche' non se ne sceglie
   un altro, cosi' tornare indietro da un'edizione non riporta in cima */
let archiveMonth = null;

function openEdition(date){
  currentDate = date; renderEdition(); show("oggi"); window.scrollTo(0,0);
}

function renderArchive(){
  const root = document.getElementById("view-archivio");
  root.innerHTML = "";
  const col = el("div", {class:"col-main"});
  col.appendChild(el("div", {class:"section-head"}, [
    el("span", {class:"pip"}), el("h2", {text:"Archivio"}),
    el("span", {class:"eyebrow hint", text:BRIEFS.length + (BRIEFS.length === 1 ? " edizione" : " edizioni")})
  ]));
  if(!BRIEFS.length){ root.appendChild(col); return; }

  /* le edizioni per mese, dal piu' recente; l'indice in BRIEFS da' il colore
     del pallino, lo stesso che la notizia ha ovunque nell'app */
  const byMonth = {};
  BRIEFS.forEach(function(b, i){
    const m = String(b.date).slice(0,7);
    (byMonth[m] = byMonth[m] || []).push({b:b, i:i});
  });
  const months = Object.keys(byMonth).sort().reverse();
  if(!archiveMonth || !byMonth[archiveMonth]) archiveMonth = months[0];

  const strip = el("div", {class:"months", role:"tablist"});
  months.forEach(function(m){
    const y = m.slice(0,4), mi = parseInt(m.slice(5,7), 10) - 1;
    /* l'anno si scrive solo quando ce n'e' piu' d'uno in archivio */
    const sameYear = months.every(function(x){ return x.slice(0,4) === y; });
    const label = MESI[mi] + (sameYear ? "" : " " + y);
    strip.appendChild(el("button", {type:"button", role:"tab",
      "aria-current": m === archiveMonth ? "true" : null,
      onclick:function(){ archiveMonth = m; renderArchive(); }}, [
      el("span", {text:label}),
      el("span", {class:"count", text:String(byMonth[m].length)})
    ]));
  });
  col.appendChild(strip);

  /* il calendario del mese: lunedi' in testa, un pallino pieno dove c'e'
     un'edizione, il numero spento dove non c'e' */
  const y = parseInt(archiveMonth.slice(0,4), 10), mi = parseInt(archiveMonth.slice(5,7), 10) - 1;
  const first = new Date(y, mi, 1), nDays = new Date(y, mi + 1, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const byDay = {};
  byMonth[archiveMonth].forEach(function(e){ byDay[parseInt(e.b.date.slice(8,10), 10)] = e; });

  const cal = el("div", {class:"cal", role:"grid", "aria-label":MESI[mi] + " " + y});
  ["lun","mar","mer","gio","ven","sab","dom"].forEach(function(w){ cal.appendChild(el("span", {class:"wd", text:w})); });
  for(let k = 0; k < offset; k++) cal.appendChild(el("span", {class:"day void"}));
  for(let d = 1; d <= nDays; d++){
    const e = byDay[d];
    if(!e){ cal.appendChild(el("span", {class:"day none", text:String(d)})); continue; }
    const v = BEADS[e.i % BEADS.length];
    const btn = el("button", {type:"button",
      class:"day has" + (e.b.date === currentDate ? " current" : ""),
      "aria-label":fmtDate(e.b.date), title:(e.b.top3 || [""])[0],
      onclick:function(){ openEdition(e.b.date); }}, [document.createTextNode(String(d))]);
    btn.style.background = "var(" + v + ")";
    if(v === "--ink") btn.style.color = "var(--bone)";
    cal.appendChild(btn);
  }
  col.appendChild(cal);

  /* le edizioni del mese, dalla piu' recente: il titolo d'apertura e' quello
     che fa ricordare "ah, quel giorno" */
  const ul = el("ul", {class:"archive-list"});
  byMonth[archiveMonth].forEach(function(e){
    const b = e.b, n = (b.news || []).length;
    const starred = (b.news || []).filter(function(x){ const m = mk(key(b.date, x.id)); return m && m.starred_at; }).length;
    ul.appendChild(el("li", {}, [
      el("button", {type:"button", onclick:function(){ openEdition(b.date); }}, [
        bead(e.i, String(new Date(b.date + "T12:00:00").getDate())),
        el("span", {}, [
          el("span", {class:"eyebrow d", text:fmtDate(b.date)}),
          el("span", {class:"h", text:(b.top3 || [""])[0]}),
          el("span", {class:"m", text:n + " notizie" + (starred ? " · " + starred + " salvate" : "")})
        ])
      ])
    ]));
  });
  col.appendChild(ul);
  root.appendChild(col);
}

/* Una voce breve salvata — radar, banco, recap — fuori dalla sua sezione:
   basta dire da dove viene, cosa era e come ritrovarla. */
function briefNode(x){
  const it = x.item;
  const u = safeUrl(it.link);
  const wrap = el("article", {class:"story brief-item"});
  wrap.appendChild(el("div", {class:"chips"}, [
    el("span", {class:"chip cat", text:x.label}),
    it.kind ? el("span", {class:"chip", text:it.kind}) : null
  ]));
  wrap.appendChild(el("h3", {}, [
    u ? el("a", {href:u, target:"_blank", rel:"noopener noreferrer", text:it.title})
      : el("span", {text:it.title})
  ]));
  if(it.note) wrap.appendChild(el("p", {class:"lede", text:it.note}));
  if(it.source) wrap.appendChild(el("p", {class:"sources", text:it.source}));
  if(NOTES){
    const tools = itemTools(x.k, {ref:{date:x.brief.date, id:x.kind + ":" + it.id, title:it.title}});
    wrap.appendChild(tools.bar);
    wrap.appendChild(tools.panel);
  }
  return wrap;
}
