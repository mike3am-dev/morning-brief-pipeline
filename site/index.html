  else sessionStorage.removeItem(VISTA_KEY);
}catch(e){}
function magazine(){ return VISTA === "magazine"; }
document.documentElement.classList.toggle("vista-magazine", magazine());

/* la notizia a tutto schermo, con il tasto indietro di vetro */
const Sheet = (function(){
  let box = null, art = null, cur = null, timer = null;
  function ensure(){
    if(box) return;
    const back = el("button", {type:"button", class:"sheet-back glass", "aria-label":"Torna all'edizione"}, [
      el("i", {"aria-hidden":"true", text:"‹"}), el("span", {text:"Edizione"})
    ]);
    art = el("article", {class:"sheet-art", "aria-live":"polite"});
    box = el("div", {class:"sheet", hidden:"hidden", role:"dialog", "aria-modal":"true", "aria-label":"Notizia"}, [back, art]);
    back.addEventListener("click", function(){ close(); });
    document.addEventListener("keydown", function(ev){ if(ev.key === "Escape" && cur) close(); });
    document.body.appendChild(box);
    swipe();
  }
  /* Indietro con il dito (2 novembre 2026, Mike): si trascina la notizia verso
     destra e sotto ricompare l'edizione; oltre un quarto di schermo, o con uno
     strattone, si chiude, altrimenti torna al suo posto. Solo se il gesto e'
     orizzontale, e mai sopra un grafico o un carosello, che il dito lo usano gia'. */
  function swipe(){
    let sx = 0, sy = 0, dx = 0, t0 = 0, decided = false, drag = false;
    box.addEventListener("touchstart", function(e){
      if(e.touches.length !== 1){ decided = true; drag = false; return; }
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; t0 = Date.now(); decided = false; drag = false;
    }, {passive:true});
    box.addEventListener("touchmove", function(e){
      if(!cur || e.touches.length !== 1) return;
      const mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
      if(!decided){
        if(Math.abs(mx) < 10 && Math.abs(my) < 10) return;
        decided = true;
        drag = mx > 0 && Math.abs(mx) > Math.abs(my) * 1.3 &&
               !(e.target.closest && e.target.closest(".deep-carousel, .vis, input, textarea, .workspace"));
        if(drag){ box.style.transition = "none"; box.classList.add("dragging"); }
      }
      if(!drag) return;
      dx = Math.max(0, mx);
      box.style.transform = "translateX(" + dx + "px)";
      e.preventDefault();
    }, {passive:false});
    const end = function(){
      if(!drag) return;
      drag = false;
      box.style.transition = "";
      box.classList.remove("dragging");
      const fast = dx / Math.max(1, Date.now() - t0) > .55;
      box.style.transform = "";
      if(dx > window.innerWidth * .26 || (fast && dx > 40)) close();
    };
    box.addEventListener("touchend", end);
    box.addEventListener("touchcancel", end);
  }
  function restore(){
    if(!cur) return;
    const w = cur, p = w._parts;
    w.appendChild(p.body);
    if(p.bar) w.appendChild(p.bar);
    if(p.panel) w.appendChild(p.panel);
    p.body.hidden = true;
    if(w._deep) w._deep(false);
    w.classList.remove("is-open");
    art.innerHTML = "";
    art.classList.remove("is-open");
    cur = null;
  }
  function open(w, opts){
    if(!w || !w._parts) return;
    ensure();
    clearTimeout(timer);
    if(cur && cur !== w) restore();
    const p = w._parts;
    if(cur !== w){
      art.appendChild(w._readerHead());
      art.appendChild(p.body);
      if(p.bar) art.appendChild(p.bar);
      if(p.panel) art.appendChild(p.panel);
    }
    p.body.hidden = false;
    /* l'approfondimento e' parte della notizia: aperto da subito, senza
       pulsante (Mike, 2 novembre 2026). Non conta come «approfondita» (d):
       non l'ha chiesto lui, e la taratura lo prenderebbe per un gesto. */
    if(w._deep) w._deep(true);
    cur = w;
    w.classList.add("is-open");
    art.classList.add("is-open");
    if(w._markRead) w._markRead();
    box.hidden = false;
    document.body.classList.add("sheet-open");
    box.scrollTop = 0;
    if(opts && opts.instant) box.classList.add("in");
    else requestAnimationFrame(function(){ requestAnimationFrame(function(){ box.classList.add("in"); }); });
    Motion.swap(art);
    /* dalla citazione: l'approfondimento aperto, fino alle voci */
    if(opts && opts.deep && w._deep){
      setTimeout(function(){
        const t = art.querySelector(".deep-voci") || art.querySelector(".deep");
        if(t) box.scrollTo({top:Math.max(0, t.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 90), behavior:"smooth"});
      }, 420);
    }
  }
  function close(){
    if(!box || !cur) return;
    box.classList.remove("in");
    document.body.classList.remove("sheet-open");
    timer = setTimeout(function(){ restore(); box.hidden = true; }, 340);
  }
  function state(){ return cur ? {id:cur.id, top:box.scrollTop} : null; }
  function top(v){ if(box) box.scrollTop = v || 0; }
  /* l'edizione si ridisegna (sincronizzazione): i pezzi tornano alla notizia vecchia */
  function drop(){ clearTimeout(timer); restore(); if(box){ box.hidden = true; box.classList.remove("in"); } document.body.classList.remove("sheet-open"); }
  return {open:open, close:close, state:state, top:top, drop:drop, holds:function(w){ return !!w && cur === w; }};
})();

/* la testata senza le parentesi: "Macitynet (Digital Chat Station, Weibo)" -> "Macitynet" */
function srcName(n){ return String((n.sources || [])[0] || "").replace(/\s*\(.*\)\s*$/, "").trim(); }
/* quante testate l'hanno data: lo stesso conto di «quanto gira» */
function testate(n){
  const v = n.verifica || {};
  return v.testate || Math.max((n.sources || []).length, 1 + (n.extra_links || []).length);
}
/* da quanto e' uscita: «3 ore fa», contato dall'ora in cui l'ha data la prima
   delle nostre testate (Mike preferisce cosi' all'orario, 2 novembre 2026) */
function tempoFa(n){
  const iso = n.verifica && n.verifica.primo && n.verifica.primo.ora;
  const t = iso ? new Date(iso) : null;
  if(!t || isNaN(t)) return "";
  const min = Math.round((Date.now() - t) / 60000);
  if(min < 1) return "adesso";
  if(min < 60) return min + " min fa";
  const h = Math.round(min / 60);
  if(h < 24) return h + (h === 1 ? " ora fa" : " ore fa");
  const d = Math.round(h / 24);
  return d === 1 ? "ieri" : d + " giorni fa";
}
/* chi l'ha detta per primo, e basta: niente «via 9to5Mac» (Mike, 2 novembre
   2026: «vorrei un riferimento supremo, per capire da dove viene»). Lo scrive
   la corsa in `origine`; per le edizioni di prima, l'origine trovata da
   verify.py o la testata che abbiamo letto */
function testataDi(n){
  if(n.origine) return {nome:n.origine};
  const indip = ((n.verifica || {}).origini || []).filter(function(o){ return OFFICIAL_ORIGINS.indexOf(o) < 0; });
  return {nome:indip.length ? indip[0] : srcName(n)};
}

function magCard(brief, n, i, w, kind){
  const k = key(brief.date, n.id);
  /* «parola di Apple» mai su un rumor: le due cose si contraddicono */
  const src = testataDi(n), count = testate(n), official = !!(n.verifica && n.verifica.ufficiale) && n.tag !== "RUMOR";
  /* le brevi sono solo testo: le fotine nell'angolo erano «orrende» (Mike) */
  const img = kind === "brief" ? null : ((kind === "hero" ? (n.hero || n.image) : n.image) || null);

  /* il piede: tempo fa, copertura, la stella sempre a portata e i «•••» */
  const cov = el("span", {class:"card-cov" + (official ? " t-blue" : n.tag === "RUMOR" && count <= 1 ? " t-yellow" : ""),
    title:official ? "C'è la parola di Apple" : count === 1 ? "Una testata" : count + " testate"});
  for(let j = 0; j < 5; j++) cov.appendChild(el("i", {class:j < count ? "on" : ""}));
  /* il numero sempre; il blu dice che c'e' anche la parola di Apple */
  cov.appendChild(el("b", {text:count === 1 ? "1 testata" : count + " testate"}));
  /* solo la stellina: appunti e «non mi interessa» stanno nella notizia aperta */
  const star = el("button", {type:"button", class:"card-btn card-star", "aria-label":"Leggi più tardi", title:"Leggi più tardi", html:I_STAR});
  const when = tempoFa(n);
  const foot = el("div", {class:"card-foot tools", "data-sig":k}, [
    when ? el("span", {class:"card-when", text:when}) : null, cov,
    /* il rilascio di un sistema: quante novita' ci sono dentro */
    n.novita && n.novita.length ? el("span", {class:"card-nov", text:n.novita.length + " novità"}) : null,
    el("span", {class:"card-gap"}), star
  ]);
  const paintStar = function(){ const on = !!(mk(k) && mk(k).starred_at); star.classList.toggle("on", on); star.setAttribute("aria-pressed", on ? "true" : "false"); };
  paintStar();
  const barBtn = function(cls){ return w && w._parts && w._parts.bar ? w._parts.bar.querySelector(cls) : null; };

  });

    ]),

  ]);

  card.addEventListener("click", go);
  card.addEventListener("keydown", function(ev){ if(ev.key === "Enter") go(); });
  return Motion.once(card, "rise");

/* «L'ultima parola»: la frase che fa entrare nell'approfondimento. La scrive
   la corsa del mattino (brief.citazione); per le edizioni senza, si prende
   la voce piu' forte fra quelle degli approfondimenti — mai un anonimo. */
function citazioneDi(brief){
  const news = brief.news || [];
  if(brief.citazione && brief.citazione.testo) return brief.citazione;
  const pesi = {apple:4, esperto:3, analista:3, testata:2, storia:1};
  let best = null, score = 0;
  news.slice(0, 5).forEach(function(n){
    ((n.approfondimento || {}).voci || []).forEach(function(v){
      const s = pesi[v.tipo] || 0;
      if(!s || !v.chi || /^(un|una) /i.test(v.chi) || !v.testo || v.testo.length > 220) return;
      if(s > score){ score = s; best = {testo:v.testo, chi:v.chi, dove:v.dove, notizia:n.id}; }
    });
  });
  return best;
}
function magQuote(brief, wraps){
  const c = citazioneDi(brief);
  if(!c) return null;
  const idx = (brief.news || []).findIndex(function(n){ return n.id === c.notizia; });
  const w = idx >= 0 ? wraps[idx] : null;
  const fig = el("figure", {class:"mag-quote" + (w ? " is-link" : ""), tabindex:w ? "0" : null,
    style:"--n:" + String(c.testo).length}, [
    el("span", {class:"eyebrow", text:"L'ultima parola"}),
    /* la frase compare parola per parola, come sul gobbo, poi il cursore e il nome */
    /* lettera per lettera, come una mano che scrive; le parole restano intere
       a capo, poi il cursore e il nome */
    (function(){
      const words = String(c.testo).split(/\s+/);
      let k = 0;
      const kids = [];
      words.forEach(function(w, i){
        const ww = el("span", {class:"ww", "aria-hidden":"true"});
        Array.prototype.forEach.call(w, function(ch){
          const sp = el("span", {class:"w", text:ch});
          sp.style.setProperty("--k", k++);
          ww.appendChild(sp);
        });
        kids.push(ww);
        if(i < words.length - 1){ kids.push(document.createTextNode(" ")); k++; }
      });
      kids.unshift(el("i", {class:"tw-wait", "aria-hidden":"true"}));
      kids.push(el("i", {class:"tw-cursor", "aria-hidden":"true"}));
      return Motion.once(el("blockquote", {"aria-label":c.testo}, kids), "type");
    })(),
    el("figcaption", {}, [el("b", {text:c.chi}), c.dove ? el("span", {text:c.dove}) : null]),
    w ? el("p", {class:"mag-quote-go", text:(c.contesto || brief.news[idx].title) + " →"}) : null
  ]);
  if(w){
    const go = function(){ Sig.bump(key(brief.date, brief.news[idx].id), "o"); Sheet.open(w, {deep:true}); };
    fig.addEventListener("click", go);
    fig.addEventListener("keydown", function(ev){ if(ev.key === "Enter") go(); });
  }
  return Motion.once(fig, "rise");
}

/* «Il punto»: il commento della redazione, scritto da Claude la mattina e
   ancorato alle notizie dell'edizione (brief.editoriale). Il titolo e' in
   graziato, come i pezzi lunghi delle riviste: si capisce subito che qui si
   ragiona, non si riferisce. Si firma, perche' e' un'opinione. */
function magPunto(brief, wraps){
  const e = brief.editoriale;
  if(!e || !e.titolo || !e.testo) return null;
  /* solo titolo e testo: i link alle notizie e la firma facevano un muro di
     parole sotto (Mike). Che sia il commento lo dice gia' l'intestazione */
  /* la scheda c'e' gia', col titolo e il cursore che aspetta; quando arrivi il
     testo si scrive parola per parola. Lo spazio e' gia' tenuto, niente salta */
  let k = 0;
  const paras = [].concat(e.testo).map(function(p){
    const words = String(p).split(/\s+/);
    const kids = [];
    words.forEach(function(w, i){
      const sp = el("span", {class:"w", text:w});
      sp.style.setProperty("--k", k++);
      kids.push(sp);
      if(i < words.length - 1) kids.push(document.createTextNode(" "));
    });
    return el("p", {}, kids);
  });
  const sec = el("section", {class:"mag-punto", "aria-label":e.titolo}, [
    el("h2", {class:"punto-title"}, [document.createTextNode(e.titolo), el("i", {class:"tw-wait", "aria-hidden":"true"})]),
    el("div", {class:"punto-text"}, paras)
  ]);
  sec.style.setProperty("--n", k);
  return Motion.once(sec, "write");
}

/* La scritta che scorre del telegiornale, in cima a «In breve»: la fascia
   nera, l'etichetta gialla, i titoli che passano piano. Si ferma sotto il
   dito; toccare un titolo apre la notizia. Due giri dello stesso testo, cosi'
   il nastro non ha buchi. Con «Riduci movimento» sta fermo e si scorre a mano. */
function magTicker(brief, wraps){
  const items = (brief.news || []).slice(5);
  const track = el("div", {class:"tg-track"});
  [0, 1].forEach(function(copy){
    items.forEach(function(n, j){
      const i = j + 5;
      track.appendChild(el("button", {type:"button", class:"tg-item", tabindex:copy ? "-1" : null, "aria-hidden":copy ? "true" : null,
        onclick:function(){ Sig.bump(key(brief.date, n.id), "o"); Sheet.open(wraps[i]); }}, [
        el("b", {text:reparto(n)}), el("span", {text:n.title})
      ]));
    });
  });
  const box = el("div", {class:"tg", role:"marquee", "aria-label":"In breve"}, [
    el("span", {class:"tg-label"}, [el("i"), document.createTextNode("Ultim'ora")]),
    el("div", {class:"tg-window"}, [track])
  ]);
  tickerRun(box, track);
  return box;
}

/* Il nastro scorre a velocita' costante (px al secondo, non «un giro in N secondi»: con
   dieci titoli o con due la lettura e' la stessa). Si ferma solo mentre ci tieni il dito
   sopra e riparte da dove era, un istante dopo; fuori schermo non consuma niente. */
function tickerRun(box, track){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const SPEED = 90;
  let x = 0, last = 0, half = 0, held = false, shown = false, raf = 0, rel = 0;
  function measure(){ half = track.scrollWidth / 2; }
  function frame(t){
    raf = 0;
    if(!box.isConnected || !shown) return;
    if(last && !held && half > 0){
      x = (x + (t - last) * SPEED / 1000) % half;
      track.style.transform = "translate3d(" + (-x).toFixed(1) + "px,0,0)";
    }
    last = t;
    raf = requestAnimationFrame(frame);
  }
  function go(){ if(!raf && shown){ last = 0; measure(); raf = requestAnimationFrame(frame); } }
  function hold(){ clearTimeout(rel); held = true; }
  function release(){ clearTimeout(rel); rel = setTimeout(function(){ held = false; }, 900); }
  box.addEventListener("pointerdown", hold);
  box.addEventListener("pointerup", release);
  box.addEventListener("pointercancel", release);
  box.addEventListener("pointerleave", function(ev){ if(ev.pointerType === "mouse") release(); });
  box.addEventListener("pointerenter", function(ev){ if(ev.pointerType === "mouse") hold(); });
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(es){
      shown = es[es.length - 1].isIntersecting;
      if(shown) go();
    }).observe(box);
  }else{ shown = true; go(); }
  if("ResizeObserver" in window) new ResizeObserver(measure).observe(track);
}

function magFeed(brief, wraps){
  const news = brief.news || [];
  const feed = el("div", {class:"mag"});
  if(!news.length) return feed;
  const card = function(i, kind){ return news[i] ? magCard(brief, news[i], i, wraps[i], kind) : null; };

  feed.appendChild(magSection("apertura", "In apertura"));
  feed.appendChild(card(0, "hero"));
  if(news[1] || news[2]) feed.appendChild(el("div", {class:"mag-row two"}, [card(1, "std"), card(2, "std")]));

  const q = magQuote(brief, wraps);
  if(q) feed.appendChild(q);

  if(news[3] || news[4]){
    feed.appendChild(magSection("primo", "In primo piano", null, "--blue"));
    /* due orizzontali a specchio: una sola scheda a tutta larghezza con la foto
       sopra diventava una foto grande quanto lo schermo (HomePod, 2 novembre 2026) */
    if(news[3]) feed.appendChild(card(3, "wide"));
    if(news[4]){ const c5 = card(4, "wide"); c5.classList.add("flip"); feed.appendChild(c5); }
  }

  const p = magPunto(brief, wraps);
  if(p){ feed.appendChild(magSection("punto", "Il punto", "il commento della redazione", "--red")); feed.appendChild(p); }

  if(news.length > 5){
    feed.appendChild(magSection("breve", "In breve", "il resto, in due righe", "--yellow"));
    feed.appendChild(magTicker(brief, wraps));
    const list = el("div", {class:"mag-brevi"});
    news.slice(5).forEach(function(n, j){ list.appendChild(magCard(brief, n, j + 5, wraps[j + 5], "brief")); });
    feed.appendChild(list);
  }
  return feed;
}

/* La barretta di vetro: salta fra le sezioni dell'edizione e dice dove sei.
   Galleggia in basso, sopra il contenuto, solo nella vista Magazine. */
const MagNav = (function(){
  let nav = null, io = null;
  function build(root){
    if(io){ io.disconnect(); io = null; }
    if(nav){ nav.remove(); nav = null; }
    if(!magazine() || !root) return;
    const secs = Array.prototype.filter.call(root.querySelectorAll(".section-head"), function(h){ return !h.classList.contains("news-head"); });
    if(secs.length < 2) return;
    nav = el("nav", {class:"mag-nav glass", "aria-label":"Sezioni dell'edizione"});
    secs.forEach(function(h){
      const label = h.dataset.label || (h.querySelector("h2") || {}).textContent || "";
      const b = el("button", {type:"button", text:label.replace(/^Se te lo fossi perso$/, "Perso").replace(/^Nelle discussioni$/, "Discussioni")});
      b.addEventListener("click", function(){ h.scrollIntoView({behavior:"smooth", block:"start"}); });
      b._h = h;
      nav.appendChild(b);
    });
    document.body.appendChild(nav);
    sveglia();
    if("IntersectionObserver" in window){
      io = new IntersectionObserver(function(es){
        es.forEach(function(e){
          if(!e.isIntersecting) return;
          Array.prototype.forEach.call(nav.children, function(b){ b.classList.toggle("on", b._h === e.target); });
          const on = nav.querySelector(".on");
          if(on) on.scrollIntoView({block:"nearest", inline:"center"});
        });
      }, {rootMargin:"-20% 0px -70% 0px"});
      secs.forEach(function(h){ io.observe(h); });
    }
  }
  /* all'apertura dalla Home, a volte iOS lascia la pagina qualche centimetro piu'
     giu' e la rimette a posto solo al primo scorrimento (Mike, 3 novembre 2026):
     quel primo scorrimento lo facciamo noi, di un punto, e torniamo su */
  function assesta(){
    if(window.scrollY > 2) return;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      if(window.scrollY > 2) return;
      window.scrollTo(0, 1); window.scrollTo(0, 0);
    }); });
  }
  window.addEventListener("pageshow", assesta);
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") assesta(); });
  window.addEventListener("load", assesta);
  function sveglia(){ if(nav) nav.classList.toggle("dorme", window.scrollY < 24); }
  window.addEventListener("scroll", sveglia, {passive:true});
  function visible(v){ if(nav) nav.hidden = !v; }
  return {build:build, visible:visible};
})();

/* Le tre sezioni in fondo, nella vista Magazine, prendono ciascuna una forma
   che si riconosce prima di leggere (2 novembre 2026, Mike: «devo arrivare
   li' e l'occhio gia' sapere che e' una sezione diversa»). */

/* «Se te lo fossi perso» su una linea del tempo: un righello degli ultimi
   dieci giorni con i pallini dove cadono le voci, e le voci appese a una
   linea verticale, con il «quando» in grande. */
function magTimeline(ul, brief){
  const span = 10;
  const track = el("div", {class:"tl-track"});
  for(let d = span; d >= 0; d--){
    const t = el("i", {class:"tl-tick" + (d === 0 ? " now" : "")});
    t.style.left = ((span - d) / span * 100) + "%";
    track.appendChild(t);
  }
  /* sul righello un pallino per voce e, sotto, la data del giorno in cui e' uscita;
     a sinistra di ogni voce la stessa data, come su un calendario */
  /* il riavvolgimento: una testina parte da «oggi» e corre all'indietro; ogni
     pallino si accende quando la testina ci passa sopra */
  const days = {};
  let far = 0;
  (brief.recap || []).forEach(function(m){ far = Math.max(far, Math.min(span, -(daysUntil(m.when, brief.date) || 0))); });
  const RUN = 1.1;
  (brief.recap || []).forEach(function(m, i){
    const back = -(daysUntil(m.when, brief.date) || 0);
    const pos = Math.max(0, Math.min(span, back));
    const k = days[pos] = (days[pos] || 0) + 1;
    const left = ((span - pos) / span * 100) + "%";
    const blip = el("span", {class:"tl-blip"});
    blip.style.left = left;
    blip.style.setProperty("--d", (.15 + (far ? pos / far : 1) * RUN + (k - 1) * .12) + "s");
    if(k > 1){ blip.style.marginTop = (-7 - (k - 1) * 18) + "px"; blip.classList.add("up"); }
    track.appendChild(blip);
    const dt = new Date(String(m.when).slice(0, 10) + "T12:00:00");
    if(k === 1 && !isNaN(dt)){
      const lab = el("span", {class:"tl-day", text:dt.getDate() + " " + MESI[dt.getMonth()].slice(0, 3)});
      lab.style.left = left;
      lab.style.setProperty("--d", (.15 + (far ? pos / far : 1) * RUN) + "s");
      track.appendChild(lab);
    }
    const li = ul.children[i];
    if(li && !isNaN(dt)) li.insertBefore(el("span", {class:"tl-date"}, [
      el("b", {text:String(dt.getDate())}), el("span", {text:MESI[dt.getMonth()].slice(0, 3)})
    ]), li.firstChild);
  });
  const head = el("i", {class:"tl-head"});
  head.style.setProperty("--to", ((span - far) / span * 100) + "%");
  head.style.setProperty("--run", RUN + "s");
  track.appendChild(head);
  const ruler = el("div", {class:"tl-ruler", "aria-hidden":"true"}, [
    track, el("div", {class:"tl-labels"}, [el("span", {text:span + " giorni fa"}), el("span", {text:"oggi"})])
  ]);
  ul.classList.add("tl");
  return Motion.once(ruler, "ruler");
}

/* Il radar come un radar: il quadrante con i cerchi, il fascio che gira, e
   ogni voce un puntino numerato che si accende quando il fascio ci passa. */
function magRadar(ul, brief){
  const PERIOD = 4.8;
  const scope = el("div", {class:"rd-scope", "aria-hidden":"true"}, [el("i", {class:"rd-sweep"})]);
  scope.style.setProperty("--rd-period", PERIOD + "s");
  (brief.radar || []).forEach(function(r, i){
    const ang = (52 + i * 137.5) % 360, dist = [.62, .38, .78, .5, .7][i % 5];
    const rad = ang * Math.PI / 180;
    const b = el("span", {class:"rd-blip", text:String(i + 1)});
    b.style.left = (50 + Math.sin(rad) * dist * 50) + "%";
    b.style.top = (50 - Math.cos(rad) * dist * 50) + "%";
    b.style.setProperty("--rd-delay", (ang / 360 * PERIOD) + "s");
    scope.appendChild(b);
    const li = ul.children[i];
    if(li) li.insertBefore(el("span", {class:"rd-num", text:String(i + 1)}), li.firstChild);
  });
  const n = (brief.radar || []).length;
  scope.appendChild(el("span", {class:"rd-count", text:n === 1 ? "1 segnale" : n + " segnali"}));
  return el("div", {class:"rd-wrap"}, [scope]);
}

/* Le discussioni come una chat: un pannello scuro, i fumetti, la piattaforma
   come mittente e i numeri della discussione come reazioni sotto il fumetto. */
function magTalk(ul, brief){
  const plats = [];
  const who = function(raw){
    raw = String(raw || "");
    if(/^reddit/i.test(raw)) return {nome:"Reddit", sigla:"r/", cls:"reddit"};
    if(/^hacker news/i.test(raw)) return {nome:"Hacker News", sigla:"Y", cls:"hn"};
    if(/^(x|twitter)\b/i.test(raw)) return {nome:"X", sigla:"X", cls:"x"};
    const n = raw.replace(/\s*\(.*\)\s*$/, "").split(" ")[0] || "?";
    return {nome:n, sigla:n.charAt(0).toUpperCase(), cls:"altro"};
  };
  /* ogni discussione e' un post a se': l'avatar della piattaforma, il luogo,
     e la voce entra come un messaggio che arriva, uno dopo l'altro */
  (brief.social || []).forEach(function(x, i){
    const w = who(x.platform || x.source);
    if(plats.indexOf(w.nome) < 0) plats.push(w.nome);
    const li = ul.children[i];
    if(!li) return;
    li.insertBefore(el("span", {class:"post-av av-" + w.cls, "aria-hidden":"true", text:w.sigla}), li.firstChild);
    li.appendChild(el("span", {class:"typing", "aria-hidden":"true"}, [el("i"), el("i"), el("i")]));
    li.style.setProperty("--mo-i", i);
  });
  ul.classList.add("chat");
  return el("div", {class:"chat-bar", "aria-hidden":"true"}, [
    el("span", {class:"chat-dots"}, [el("i"), el("i"), el("i")]),
    el("b", {text:plats.join(" · ") || "Discussioni"}),
    el("span", {text:(brief.social || []).length === 1 ? "1 discussione" : (brief.social || []).length + " discussioni"})
  ]);
}

/* ================= la testata della Magazine =================
   Nella Magazine il giornale ha il suo nome in testa, grande, come una
   testata vera (2 novembre 2026, Mike: «sembra che questo magazine si chiami
   2 novembre, e The Morning Brief e' finito lassu', appiccicato nell'angolo»).
   Sotto il nome una riga sola con la data, detta una volta. La barra che resta
   attaccata in cima porta le sezioni e, quando la testata grande esce di
   scena, il marchio piccolo. Le icone sparse (tema, esporta, importa, esci,
   i tre puntini di Archivio, Salvati, Diario, Cerca) diventano un menu con le
   parole scritte: «non si capisce niente dell'interfaccia». */
const Testata = (function(){
  let menu = null;
  const inner = document.querySelector("#masthead .masthead-inner");
  if(!inner) return {date:function(){}};
  const mini = el("div", {class:"mt-mini", "aria-hidden":"true"}, [

      el("span", {class:"mrn"}, [document.createTextNode("M"), el("i", {class:"o"}), document.createTextNode("rning")]),
      el("span", {class:"brf", text:"Brief"})])
  ]);
  const I_LENTE = ico("M6.8 1.8a5 5 0 0 1 4 8l3.4 3.4-1.1 1.1-3.4-3.4a5 5 0 1 1-2.9-9.1zm0 1.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z");
  const I_MENU = ico("M2 3.2h12v1.6H2zM2 7.2h12v1.6H2zM2 11.2h12v1.6H2z");
  const search = el("button", {type:"button", class:"mt-btn mt-search", "aria-label":"Cerca", html:I_LENTE,
    onclick:function(){ close(); show("cerca"); }});
  /* la vista sta fuori dal menu, accanto alla lente, con la sua icona */
  const vista = el("button", {type:"button", class:"mt-btn mt-vista", onclick:function(){ close(); setVista(magazine() ? "classica" : "magazine"); }});
  paintVistaBtn(vista);
  const dot = el("i", {class:"mt-sync"});
  const menuBtn = el("button", {type:"button", class:"mt-btn mt-menu-btn glass", "aria-label":"Menu", "aria-haspopup":"true", "aria-expanded":"false"},
    [el("span", {html:I_MENU}), dot]);
  inner.appendChild(mini);
  inner.appendChild(el("div", {class:"mt-actions"}, [VISTA_PULSANTE ? vista : null, search, menuBtn]));

  /* il pallino della sincronizzazione segue quello di sempre */
  const pip = document.getElementById("syncPip");
  const paintDot = function(){ dot.dataset.state = pip ? (pip.dataset.state || "ok") : "ok"; };
  if(pip && "MutationObserver" in window) new MutationObserver(paintDot).observe(pip, {attributes:true});
  paintDot();

  function dark(){
    const r = document.documentElement;
    return r.getAttribute("data-theme") === "dark" ||
      (!r.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme:dark)").matches);
  }
  function seg(label, opts, on, pick){
    return el("div", {class:"mm-seg-wrap"}, [
      el("span", {class:"mm-label", text:label}),
      el("div", {class:"mm-seg"}, opts.map(function(o){
        return el("button", {type:"button", class:o[0] === on ? "on" : "", text:o[1],
          onclick:function(ev){ ev.stopPropagation(); if(o[0] !== on){ close(); pick(o[0]); } }});
      }))
    ]);
  }
  function row(label, count, fn, cls){
    return el("button", {type:"button", class:"mm-row" + (cls ? " " + cls : ""), onclick:function(ev){ ev.stopPropagation(); close(); fn(); }}, [
      el("span", {text:label}), count ? el("b", {text:count}) : el("i", {"aria-hidden":"true", text:"›"})
    ]);
  }
  function txt(id){ const e = document.getElementById(id); return e ? e.textContent.trim() : ""; }
  function clickId(id){ const b = document.getElementById(id); if(b) b.click(); }
  function open(){
    close();
    const states = {ok:"Sincronizzato", busy:"Sincronizzazione…", offline:"Offline: le modifiche partono appena torna la rete", error:"Errore di sincronizzazione"};
    menu = el("div", {class:"mt-menu glass", role:"dialog", "aria-label":"Menu"}, [
      el("div", {class:"mm-head"}, [
        el("b", {text:"The Morning Brief"}),
        el("span", {class:"mm-sync", "data-state":dot.dataset.state, text:states[dot.dataset.state] || states.ok})
      ]),
      seg("Tema", [["light", "Chiaro"], ["dark", "Scuro"]], dark() ? "dark" : "light", function(){ clickId("themeBtn"); }),
      el("div", {class:"mm-list"}, [
        /* sul Duo chiuso la lente sta qui: nella barra lascia il posto alle sezioni */
        search.offsetParent === null ? row("Cerca", "", function(){ show("cerca"); }) : null,
        row("Archivio", "", function(){ show("archivio"); }),
        row("Diario", txt("cDiary"), function(){ show("diario"); })
      ]),
      el("div", {class:"mm-list"}, [
        row("Esporta gli appunti", "", function(){ clickId("exportBtn"); }),
        row("Importa gli appunti", "", function(){ clickId("importBtn"); })
      ]),
      el("div", {class:"mm-list"}, [row("Esci", "", function(){ clickId("outBtn"); }, "out")])
    ]);
    document.body.appendChild(menu);
    menuBtn.setAttribute("aria-expanded", "true");
    /* sotto il pulsante se c'e' posto; se no sale, fino a stare tutto a schermo */
    const r = menuBtn.getBoundingClientRect();
    const h = menu.offsetHeight;
    menu.style.top = Math.max(12, Math.min(r.bottom + 8, window.innerHeight - h - 12)) + "px";
    menu.style.right = Math.max(12, window.innerWidth - r.right) + "px";
    setTimeout(function(){ document.addEventListener("click", outside); }, 0);
  }
  function outside(ev){ if(menu && !menu.contains(ev.target)) close(); }
  function close(){
    if(menu){ menu.remove(); menu = null; }
    menuBtn.setAttribute("aria-expanded", "false");
    document.removeEventListener("click", outside);
  }
  menuBtn.addEventListener("click", function(ev){ ev.stopPropagation(); menu ? close() : open(); });
  document.addEventListener("keydown", function(ev){ if(ev.key === "Escape") close(); });

  /* la testata grande esce di scena: nella barra compare il marchio piccolo */
  const np = document.getElementById("nameplate");
  if(np && "IntersectionObserver" in window){
    new IntersectionObserver(function(es){
      es.forEach(function(e){
        document.documentElement.classList.toggle("np-out", !e.isIntersecting);
        /* le pillole si stringono: la pillola nera le segue */
        setTimeout(tabInk, 380);
      });
    }, {rootMargin:"-60px 0px 0px 0px"}).observe(np);
  }
  /* la data, detta una volta sola, sotto il nome */
  function date(brief){
    const t = document.getElementById("npDate");
    if(!t || !brief) return;
    const d = new Date(brief.date + "T12:00:00");
    const g = isNaN(d) ? brief.date : GIORNI[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()] + " " + d.getFullYear();
    /* il giorno sopra, la data sotto: a destra del logo si legge come un timbro */
    t.textContent = "";
    if(isNaN(d)){ t.textContent = brief.date; return; }
    t.appendChild(el("span", {class:"np-day", text:GIORNI[d.getDay()]}));
    t.appendChild(el("span", {text:d.getDate() + " " + MESI[d.getMonth()] + " " + d.getFullYear()}));
  }
  return {date:date, close:close};
})();

/* ================= la plancia del mattino =================
   A destra della testata, nella Magazine, tre riquadri che fanno «dal vivo»
   (2 novembre 2026, Mike: «qualcosa che dia live, quasi dei widget, visto che e'
   un'edizione del mattino»):
   - il meteo di Milano, sempre Milano, chiesto a Open-Meteo (gratuito, senza
     chiave) a ogni apertura e ogni venti minuti, con l'icona che si muove;
   - Apple in borsa: la chiusura dell'ultima seduta e la curva della settimana,
     che la corsa del mattino scrive in `borsa` (pipeline/borsa.py) — non e' un
     prezzo dal vivo, ed e' scritto: «chiusura di venerdi'»;
   - il prossimo: il lancio o l'evento piu' vicino, da `prossimo`, coi giorni che
     mancano; toccandolo si apre la notizia.
   Un riquadro senza dati non si mostra: niente segnaposto vuoti. */
const Plancia = (function(){
  const MI = {lat:45.4642, lon:9.19};
  const KEY = "tmb-meteo-milano";
  let meteo = null, brief = null, wraps = null;
  try{ const c = JSON.parse(localStorage.getItem(KEY) || "null"); if(c && Date.now() - c.t < 20 * 60000) meteo = c.d; }catch(e){}

  const WMO = function(c){
    if(c === 0) return ["Sereno", "sole"];
    if(c === 1) return ["Quasi sereno", "sole"];
    if(c === 2) return ["Poco nuvoloso", "sole-nube"];
    if(c === 3) return ["Coperto", "nube"];
    if(c === 45 || c === 48) return ["Nebbia", "nebbia"];
    if(c >= 51 && c <= 57) return ["Pioviggine", "pioggia"];
    if((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return ["Pioggia", "pioggia"];
    if((c >= 71 && c <= 77) || c === 85 || c === 86) return ["Neve", "neve"];
    if(c >= 95) return ["Temporale", "temporale"];
    return ["—", "nube"];
  };
  /* la riga del meteo dice la cosa che conta oggi: se piove, nevica, c'e' nebbia o
     temporale lo dice il cielo; altrimenti la pioggia probabile (dal 40%), poi il vento
     (oltre 30 km/h, o raffiche oltre 50); solo se non c'e' niente di tutto questo, il cielo */
  function condizione(m){
    const w = WMO(m.c);
    if(m.c >= 45) return w;
    if(m.p !== null && m.p !== undefined && m.p >= 40) return ["Pioggia " + Math.round(m.p) + "%", m.p >= 70 ? "pioggia" : w[1]];
    if((m.v || 0) >= 30 || (m.r || 0) >= 50) return ["Ventoso", "vento"];
    return w;
  }
  /* le icone sono disegnate qui, e si muovono: i raggi girano, le nuvole passano,
     la pioggia e la neve cadono, il lampo lampeggia, la luna ha la sua stella */
  function icona(tipo, giorno){
    const svg = function(inner){ return '<svg viewBox="0 0 48 48" class="pl-ico pl-' + tipo + '" aria-hidden="true">' + inner + "</svg>"; };
    const sole = '<g class="pl-raggi">' + [0,45,90,135,180,225,270,315].map(function(a){
      return '<rect x="22.6" y="2" width="2.8" height="7" rx="1.4" transform="rotate(' + a + ' 24 24)"/>'; }).join("") +
      '</g><circle class="pl-disco" cx="24" cy="24" r="9"/>';
    const luna = '<path class="pl-luna" d="M30 9a15 15 0 1 0 9 26A12 12 0 0 1 30 9z"/><circle class="pl-stella" cx="12" cy="12" r="1.8"/>';
    const nube = '<path class="pl-nube" d="M14 36h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0 1 13z"/>';
    if(tipo === "sole") return svg(giorno ? sole : luna);
    if(tipo === "sole-nube") return svg('<g transform="translate(-6 -6) scale(.8)">' + (giorno ? sole : luna) + "</g>" + nube);
    if(tipo === "nube") return svg(nube);
    if(tipo === "nebbia") return svg('<g class="pl-banchi"><rect x="6" y="16" width="30" height="3" rx="1.5"/><rect x="12" y="24" width="30" height="3" rx="1.5"/><rect x="6" y="32" width="30" height="3" rx="1.5"/></g>');
    if(tipo === "pioggia") return svg(nube.replace("h20", "h20").replace("M14 36", "M14 30") .replace("0-16", "0-16") +
      '<g class="pl-gocce"><rect x="16" y="34" width="2.2" height="6" rx="1.1"/><rect x="24" y="36" width="2.2" height="6" rx="1.1"/><rect x="32" y="34" width="2.2" height="6" rx="1.1"/></g>');
    if(tipo === "neve") return svg(nube.replace("M14 36", "M14 30") +
      '<g class="pl-fiocchi"><circle cx="17" cy="37" r="2"/><circle cx="25" cy="40" r="2"/><circle cx="33" cy="37" r="2"/></g>');
    if(tipo === "vento") return svg('<g class="pl-soffi"><path d="M6 18h22a5 5 0 1 0-5-5"/><path d="M6 26h32a5 5 0 1 1-5 5"/><path d="M6 34h16"/></g>');
    if(tipo === "temporale") return svg(nube.replace("M14 36", "M14 30") + '<path class="pl-lampo" d="M25 30l-5 9h5l-3 8 9-11h-5l3-6z"/>');
    return svg(nube);
  }
  function chiedi(){
    const u = "https://api.open-meteo.com/v1/forecast?latitude=" + MI.lat + "&longitude=" + MI.lon +
      "&current=temperature_2m,weather_code,is_day,wind_speed_10m,wind_gusts_10m" +
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FRome&forecast_days=1";
    fetch(u).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      if(!d || !d.current) return;
      meteo = {t:d.current.temperature_2m, c:d.current.weather_code, g:d.current.is_day === 1,
               max:d.daily && d.daily.temperature_2m_max ? d.daily.temperature_2m_max[0] : null,
               min:d.daily && d.daily.temperature_2m_min ? d.daily.temperature_2m_min[0] : null,
               v:d.current.wind_speed_10m, r:d.current.wind_gusts_10m,
               p:d.daily && d.daily.precipitation_probability_max ? d.daily.precipitation_probability_max[0] : null};
      try{ localStorage.setItem(KEY, JSON.stringify({t:Date.now(), d:meteo})); }catch(e){}
      disegna();
    }).catch(function(){});
  }
  let ultimo = 0;
  function aggiorna(){ if(Date.now() - ultimo > 20 * 60000){ ultimo = Date.now(); chiedi(); } }
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && magazine()) aggiorna(); });

  function tile(cls, kids, onclick){
    return el(onclick ? "button" : "div", {class:"pl-tile " + cls, type:onclick ? "button" : null, onclick:onclick || null}, kids);
  }
  const fmt = function(v, dec){ return Number(v).toLocaleString("it-IT", {minimumFractionDigits:dec, maximumFractionDigits:dec}); };
  function giornoBreve(iso){
    const d = new Date(String(iso).slice(0, 10) + "T12:00:00");
    return isNaN(d) ? iso : GIORNI[d.getDay()].slice(0, 3) + " " + d.getDate() + " " + MESI[d.getMonth()].slice(0, 3);
  }
  function disegna(){
    const box = document.getElementById("plancia");
    if(!box) return;
    box.innerHTML = "";
    if(!magazine()) return;
    /* il meteo */
    if(meteo){
      const w = condizione(meteo);
      box.appendChild(tile("pl-meteo", [
        el("span", {class:"pl-label"}, [el("i", {class:"pl-live"}), document.createTextNode("Milano")]),
        el("div", {class:"pl-main"}, [el("span", {html:icona(w[1], meteo.g)}), el("b", {text:Math.round(meteo.t) + "°"})]),
        /* minima e massima solo accanto a una parola corta: «Pioggia 65%» sta da sola */
        el("span", {class:"pl-sub", text:w[0] + (meteo.min !== null && w[0].length <= 7 ? " · " + Math.round(meteo.min) + "°/" + Math.round(meteo.max) + "°" : "")})
      ]));
    }
    /* la borsa: il simbolo, la chiusura grande, il triangolo con la variazione. Niente
       grafico: lo stesso passo degli altri due riquadri */
    const b = brief && brief.borsa;
    if(b && b.chiusura){
      const su = b.variazione >= 0;
      box.appendChild(tile("pl-borsa " + (su ? "su" : "giu"), [
        el("span", {class:"pl-label", text:b.simbolo}),
        el("div", {class:"pl-main"}, [el("b", {text:fmt(b.chiusura, 2)})]),
        el("span", {class:"pl-var"}, [el("i", {text:su ? "▲" : "▼"}), document.createTextNode(fmt(Math.abs(b.variazione), 2) + "%")])
      ]));
    }
    /* il prossimo */
    const oggi = brief ? brief.date : null;
    const p = brief && (brief.prossimo || []).map(function(x){ return Object.assign({giorni:daysUntil(x.data, new Date().toISOString().slice(0, 10))}, x); })
      .filter(function(x){ return x.giorni !== null && x.giorni >= 0; }).sort(function(a, c){ return a.giorni - c.giorni; })[0];
    if(p){
      const i = (brief.news || []).findIndex(function(n){ return n.id === p.notizia; });
      const go = i >= 0 && wraps && wraps[i] ? function(){ Sig.bump(key(brief.date, p.notizia), "o"); Sheet.open(wraps[i]); } : null;
      const num = el("b", {class:"pl-num", text:String(p.giorni)});
      box.appendChild(tile("pl-prossimo", [
        el("span", {class:"pl-label", text:p.titolo}),
        el("div", {class:"pl-main"}, p.giorni === 0 ? [el("b", {class:"pl-num pl-oggi", text:"Oggi"})] : [num,
          el("span", {class:"pl-unit", text:p.giorni === 1 ? "giorno" : "giorni"})]),
        el("span", {class:"pl-sub", text:giornoBreve(p.data)})
      ], go));
      if(p.giorni > 1) Motion.count(num);
    }
  }
  function render(b, w){
    brief = b; wraps = w;
    if(magazine()) aggiorna();
    disegna();
  }
  return {render:render};
})();

    if(magazine()){
      const panel = el("div", {class:"chat-panel"}, [magTalk(ul, brief), ul]);
      col.appendChild(Motion.once(panel, "talk"));
    } else col.appendChild(ul);
  }

  /* Il radar sta in fondo (31 ottobre 2026): e' il contorno del contorno.
     Porta solo quello che non spetta ad AI, GAMES, TECH o SPAZIO, e nei
     giorni in cui non c'e' niente del genere non esce. */
  if(brief.radar && brief.radar.length){
    const pipB = el("span", {class:"pip"}); pipB.style.background = "var(--blue)";
    col.appendChild(el("div", {class:"section-head"}, [
      pipB, el("h2", {text:"Radar"}),
      el("span", {class:"eyebrow hint chiosa", text:"quello che non ha una scheda sua"})
    ]));
    const ul = el("ul", {class:"radar"});
    brief.radar.forEach(function(r){
      const u = safeUrl(r.link);
      /* le voci vecchie non hanno id: senza chiave stabile non si salvano */
      const tools = (NOTES && r.id)
        ? itemTools(key(brief.date, "radar:" + r.id),
                    {ref:{date:brief.date, id:"radar:" + r.id, title:r.title}})
        : null;
      const foot = el("div", {class:"radar-foot"}, [
        el("span", {class:"src", text:r.source || ""}),
        tools ? tools.bar : null
      ]);
      ul.appendChild(el("li", {}, [
        /* il tema della sonda: sul telefono non si vede, sul Duo fa da occhiello */
        r.topic ? el("span", {class:"topic", text:String(r.topic).replace(/-/g, " ")}) : null,
        el("h4", {}, [u ? el("a", {href:u, target:"_blank", rel:"noopener noreferrer", text:r.title}) : el("span", {text:r.title})]),
        el("p", {text:r.note || ""}),
        foot,
        tools ? tools.panel : null
      ]));
    });
    if(magazine()){
      const wrap = magRadar(ul, brief);
      wrap.appendChild(ul);
      col.appendChild(Motion.once(wrap, "rise"));
    } else col.appendChild(ul);
  }

  const rail = el("aside", {class:"rail"});
  const readCount = (brief.news || []).filter(function(n){ const m = mk(key(brief.date, n.id)); return m && m.read_at; }).length;
  const starCount = (brief.news || []).filter(function(n){ const m = mk(key(brief.date, n.id)); return m && m.starred_at; }).length;
  const grid = el("div", {class:"statgrid"});
  [[(brief.news||[]).length, "notizie", "--ink"], [readCount, "aperte", "--blue"],
   [starCount, "salvate", "--yellow"], [(brief.radar||[]).length, "sul radar", "--red"]]
   .forEach(function(p){
     const b = el("b", {text:String(p[0])});
     b.style.color = "var(" + p[2] + ")";
     grid.appendChild(el("div", {class:"stat"}, [b, el("span", {text:p[1]})]));
   });
  rail.appendChild(grid);
  rail.appendChild(el("h4", {text:"Sommario"}));
  const nav = el("ol");
  (brief.news || []).forEach(function(n, i){
    const p = el("span", {class:"pip"});
    p.style.background = "var(" + BEADS[i % BEADS.length] + ")";
    nav.appendChild(el("li", {}, [
      el("button", {type:"button", onclick:function(){ openStory(n.id, "start"); }},
         [p, el("span", {text:n.title})])
    ]));
  });
  rail.appendChild(nav);
  /* Lo stato delle fonti non compare piu' nell'app: e' diagnostica della
     pipeline, la legge chi la manutiene. `feed_notes` resta nell'edizione e
     si guarda dal Mac, con lint.py e feedcheck.py. */

  root.appendChild(el("div", {class:"columns"}, [col, rail]));
  /* nella vista Magazine il feed prende il posto dell'apertura e della lista,
     che restano nella pagina, nascoste: le notizie da aprire sono quelle */
  if(magazine()) col.insertBefore(magFeed(brief, wraps), col.querySelector(".hero"));
  Reader.mount(magazine() ? null : newsbox, function(){ return frontPage(brief, wraps); });
  Motion.scan(root);
  setTimeout(function(){ MagNav.build(root); MagNav.visible(currentView === "oggi"); }, 0);
  Plancia.render(brief, wraps);
  dotfield(canvas);

  const srcs = {};
  (brief.news || []).forEach(function(n){ (n.sources || []).forEach(function(s){ srcs[s] = 1; }); });
  document.getElementById("colophonSrc").textContent = "Fonti di questa edizione — " + Object.keys(srcs).join(", ");
  document.getElementById("colophonNote").textContent = CLOUD
    ? "Appunti e diario sincronizzati tra i tuoi dispositivi"
    : (NOTES ? "Appunti e diario salvati su questo dispositivo — usa ↧ per farne una copia"
             : "Copia di sola lettura");
  /* il numero sulla scheda AI e' quello dell'edizione aperta: cambiando
     giorno dall'archivio va rifatto qui, o resta indietro di un giorno */
  refreshCounts();
  return brief;
}

/* ================= archivio ================= */
/* il mese aperto nell'archivio: resta quello scelto finche' non se ne sceglie
   un altro, cosi' tornare indietro da un'edizione non riporta in cima */
let archiveMonth = null;

function openEdition(date){
  currentDate = date; renderEdition(); show("oggi"); window.scrollTo(0,0);
}

function renderArchive(){
  const root = document.getElementById("view-archivio");
  root.innerHTML = "";
  const col = el("div", {class:"col-main"});
  col.appendChild(el("div", {class:"section-head"}, [
    el("span", {class:"pip"}), el("h2", {text:"Archivio"}),
    el("span", {class:"eyebrow hint", text:BRIEFS.length + (BRIEFS.length === 1 ? " edizione" : " edizioni")})
  ]));
  if(!BRIEFS.length){ root.appendChild(col); return; }

  /* le edizioni per mese, dal piu' recente; l'indice in BRIEFS da' il colore
     del pallino, lo stesso che la notizia ha ovunque nell'app */
  const byMonth = {};
  BRIEFS.forEach(function(b, i){
    const m = String(b.date).slice(0,7);
    (byMonth[m] = byMonth[m] || []).push({b:b, i:i});
  });
  const months = Object.keys(byMonth).sort().reverse();
  if(!archiveMonth || !byMonth[archiveMonth]) archiveMonth = months[0];

  const strip = el("div", {class:"months", role:"tablist"});
  months.forEach(function(m){
    const y = m.slice(0,4), mi = parseInt(m.slice(5,7), 10) - 1;
    /* l'anno si scrive solo quando ce n'e' piu' d'uno in archivio */
    const sameYear = months.every(function(x){ return x.slice(0,4) === y; });
    const label = MESI[mi] + (sameYear ? "" : " " + y);
    strip.appendChild(el("button", {type:"button", role:"tab",
      "aria-current": m === archiveMonth ? "true" : null,
      onclick:function(){ archiveMonth = m; renderArchive(); }}, [
      el("span", {text:label}),
      el("span", {class:"count", text:String(byMonth[m].length)})
    ]));
  });
  col.appendChild(strip);

  /* il calendario del mese: lunedi' in testa, un pallino pieno dove c'e'
     un'edizione, il numero spento dove non c'e' */
  const y = parseInt(archiveMonth.slice(0,4), 10), mi = parseInt(archiveMonth.slice(5,7), 10) - 1;
  const first = new Date(y, mi, 1), nDays = new Date(y, mi + 1, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const byDay = {};
  byMonth[archiveMonth].forEach(function(e){ byDay[parseInt(e.b.date.slice(8,10), 10)] = e; });

  const cal = el("div", {class:"cal", role:"grid", "aria-label":MESI[mi] + " " + y});
  ["lun","mar","mer","gio","ven","sab","dom"].forEach(function(w){ cal.appendChild(el("span", {class:"wd", text:w})); });
  for(let k = 0; k < offset; k++) cal.appendChild(el("span", {class:"day void"}));
  for(let d = 1; d <= nDays; d++){
    const e = byDay[d];
    if(!e){ cal.appendChild(el("span", {class:"day none", text:String(d)})); continue; }
    const v = BEADS[e.i % BEADS.length];
    const btn = el("button", {type:"button",
      class:"day has" + (e.b.date === currentDate ? " current" : ""),
      "aria-label":fmtDate(e.b.date), title:(e.b.top3 || [""])[0],
      onclick:function(){ openEdition(e.b.date); }}, [document.createTextNode(String(d))]);
    btn.style.background = "var(" + v + ")";
    if(v === "--ink") btn.style.color = "var(--bone)";
    cal.appendChild(btn);
  }
  col.appendChild(cal);

  /* le edizioni del mese, dalla piu' recente: il titolo d'apertura e' quello
     che fa ricordare "ah, quel giorno" */
  const ul = el("ul", {class:"archive-list"});
  byMonth[archiveMonth].forEach(function(e){
    const b = e.b, n = (b.news || []).length;
    const starred = (b.news || []).filter(function(x){ const m = mk(key(b.date, x.id)); return m && m.starred_at; }).length;
    ul.appendChild(el("li", {}, [
      el("button", {type:"button", onclick:function(){ openEdition(b.date); }}, [
        bead(e.i, String(new Date(b.date + "T12:00:00").getDate())),
        el("span", {}, [
          el("span", {class:"eyebrow d", text:fmtDate(b.date)}),
          el("span", {class:"h", text:(b.top3 || [""])[0]}),
          el("span", {class:"m", text:n + " notizie" + (starred ? " · " + starred + " salvate" : "")})
        ])
      ])
    ]));
  });
  col.appendChild(ul);
  root.appendChild(col);
}

   basta dire da dove viene, cosa era e come ritrovarla. */
function briefNode(x){

  wrap.appendChild(el("div", {class:"chips"}, [
    el("span", {class:"chip cat", text:x.label}),

/* ================= diario ================= */
const TAGS = ["Idea", "Lavoro", "Da approfondire", "Video", "Contenuto", "Personale"];
let draftTags = [];

function renderDiary(){
  const root = document.getElementById("view-diario");
  root.innerHTML = "";
  const col = el("div", {class:"col-main"});
  const rows0 = liveDiary();
  const pipR = el("span", {class:"pip"}); pipR.style.background = "var(--red)";
  col.appendChild(el("div", {class:"section-head"}, [
    pipR, el("h2", {text:"Diario"}),
    el("span", {class:"eyebrow hint", text:rows0.length + " voci"})
  ]));

  const ta = el("textarea", {placeholder:"Un'idea, un angolo da sviluppare, un appunto sulla giornata…"});
  const picker = el("div", {class:"tagpicker"});
  draftTags = [];
  TAGS.forEach(function(t){
    const b = el("button", {type:"button", text:t});
    b.addEventListener("click", function(){
      const i = draftTags.indexOf(t);
      if(i >= 0) draftTags.splice(i,1); else draftTags.push(t);
      b.classList.toggle("on", draftTags.indexOf(t) >= 0);
    });
    picker.appendChild(b);
  });
  const linkIn = el("input", {type:"url", placeholder:"link o video da allegare (facoltativo)"});
  const addBtn = el("button", {class:"btn", type:"button", text:"Salva nel diario", onclick:function(){
    const txt = ta.value.trim();
    if(!txt){ toast("Scrivi qualcosa prima di salvare"); return; }
    addDiary({text:txt, tags:draftTags.slice(), link:safeUrl(linkIn.value)});
    renderDiary(); toast("Salvato");
  }});

  col.appendChild(el("div", {class:"composer"}, [
    ta, picker, el("div", {class:"linkrow"}, [linkIn]),
    el("div", {class:"composer-foot"}, [el("span", {class:"spacer"}), addBtn])
  ]));

  if(!rows0.length){
    col.appendChild(el("div", {class:"empty", html:"<b>Il diario è vuoto</b>Scrivi qui le idee, oppure mandale al diario dagli appunti di una notizia."}));
  } else {
    const filterRow = el("div", {class:"tagpicker", style:"margin:.4rem 0 1.2rem"});
    const active = {v:null};
    ["Tutte"].concat(TAGS).concat(["Da una notizia"]).forEach(function(t){
      const b = el("button", {type:"button", text:t});
      if(t === "Tutte") b.classList.add("on");
      b.addEventListener("click", function(){
        active.v = (t === "Tutte") ? null : t;
        Array.prototype.forEach.call(filterRow.children, function(c){ c.classList.toggle("on", c === b); });
        paint();
      });
      filterRow.appendChild(b);
    });
    col.appendChild(filterRow);

    const list = el("div", {});
    function paint(){
      list.innerHTML = "";
      const rows = liveDiary().filter(function(e){ return !active.v || (e.tags || []).indexOf(active.v) >= 0; });
      if(!rows.length){ list.appendChild(el("div", {class:"empty", text:"Nessuna voce con questa etichetta."})); return; }
      rows.forEach(function(e){
        const meta = el("div", {class:"entry-meta"}, [el("time", {text:fmtStamp(e.ts)})]);
        (e.tags || []).forEach(function(t){ meta.appendChild(el("span", {class:"chip", text:t})); });
        meta.appendChild(el("button", {class:"kill", type:"button", text:"elimina", onclick:function(){
          removeDiary(e.id); renderDiary();
        }}));
        const node = el("div", {class:"entry"}, [meta, el("p", {class:"entry-text", text:e.text})]);
        const eu = safeUrl(e.link);
        if(eu) node.appendChild(el("p", {}, [el("a", {href:eu, target:"_blank", rel:"noopener noreferrer", text:eu})]));
        if(e.ref) node.appendChild(el("p", {class:"ctx", text:"da: " + e.ref.title + " · " + fmtShort(e.ref.date)}));
        list.appendChild(node);
      });
    }
    paint();
    col.appendChild(list);
  }
  root.appendChild(col);
}

/* ================= ricerca ================= */
function renderSearch(){
  const root = document.getElementById("view-cerca");
  root.innerHTML = "";
  const col = el("div", {class:"col-main"});
  const input = el("input", {type:"search", placeholder:"Cerca…"});
  const results = el("div", {});
  col.appendChild(el("div", {class:"searchbar"}, [input]));
  col.appendChild(el("p", {class:"eyebrow", text:NOTES ? "archivio notizie, appunti e diario" : "archivio notizie"}));
  col.appendChild(results);
  root.appendChild(col);

  function hl(text, q){
    const i = text.toLowerCase().indexOf(q);
    if(i < 0) return esc(text.slice(0, 180));
    const from = Math.max(0, i - 60);
    const snip = (from > 0 ? "…" : "") + text.slice(from, i + q.length + 120);
    const j = snip.toLowerCase().indexOf(q);
    return esc(snip.slice(0, j)) + "<mark>" + esc(snip.slice(j, j + q.length)) + "</mark>" + esc(snip.slice(j + q.length));
  }

  input.addEventListener("input", function(){
    const q = input.value.trim().toLowerCase();
    results.innerHTML = "";
    if(q.length < 2) return;

    const hits = ALL.filter(function(x){
      const m = mk(x.k);
      const hay = [x.news.title, x.news.sintesi, x.news.descrizione,
                   (x.news.sources || []).join(" "), (m && m.note) || ""].join("   ");
      return hay.toLowerCase().indexOf(q) >= 0;
    });
    results.appendChild(el("div", {class:"section-head"}, [
      el("span", {class:"pip"}), el("h2", {text:"Notizie"}),
      el("span", {class:"eyebrow hint", text:hits.length + " risultati"})
    ]));
    if(!hits.length) results.appendChild(el("div", {class:"empty", text:"Nessuna notizia trovata."}));
    hits.slice(0, 40).forEach(function(x){
      const m = mk(x.k);
      results.appendChild(el("div", {class:"entry"}, [
        el("div", {class:"entry-meta"}, [
          el("time", {text:fmtShort(x.brief.date)}),
          el("span", {class:tagClass(x.news.tag), text:x.news.tag || ""})
        ]),
        el("h4", {}, [el("a", {href:"#", onclick:function(ev){
          ev.preventDefault(); jumpTo(x.brief.date, x.news.id);
        }, text:x.news.title})]),
        el("p", {class:"entry-text", html:hl(x.news.descrizione || x.news.sintesi || "", q)}),
        (m && m.note) ? el("p", {class:"ctx", text:"tuo appunto: " + m.note.slice(0,140)}) : null
      ]));
    });

    if(!NOTES) return;
    const dhits = liveDiary().filter(function(e){
      return (e.text + " " + (e.tags || []).join(" ")).toLowerCase().indexOf(q) >= 0;
    });
    if(dhits.length){
      const p = el("span", {class:"pip"}); p.style.background = "var(--red)";
      results.appendChild(el("div", {class:"section-head"}, [
        p, el("h2", {text:"Diario"}),
        el("span", {class:"eyebrow hint", text:dhits.length + " voci"})
      ]));
      dhits.slice(0, 25).forEach(function(e){
        results.appendChild(el("div", {class:"entry"}, [
          el("div", {class:"entry-meta"}, [el("time", {text:fmtStamp(e.ts)})]),
          el("p", {class:"entry-text", html:hl(e.text, q)})
        ]));
      });
    }
  });
}

/* ================= AI ================= */
const AI_LAB = {uso:1, demo:1, trucco:1, sapevi:1};
const AI_LABS = [["anthropic","Anthropic"],["openai","OpenAI"],["google","Google"],["meta","Meta"],["apple","Apple"],["robot","Robot"],["altri","Altri"]];
function labName(l){ const m = AI_LABS.filter(function(x){ return x[0] === l; })[0]; return m ? m[1] : (l || "Altri"); }
function isLab(a){ return !!AI_LAB[String(a.kind || "").toLowerCase()]; }

function aiFoot(date, a, extra){
  const u = safeUrl(a.link);
  const foot = el("div", {class:"foot"});
  if(u) foot.appendChild(el("a", {class:"primary", href:u, target:"_blank", rel:"noopener noreferrer",
                              text:(/youtube\.com|youtu\.be/.test(u) ? "Guarda il video →" : "Apri →")}));
  if(a.source) foot.appendChild(el("span", {class:"sources", text:a.source}));
  if(extra) foot.appendChild(extra);
  const tools = (NOTES && a.id)
    ? itemTools(key(date, "ai:" + a.id), {ref:{date:date, id:"ai:" + a.id, title:a.title}}) : null;
  if(tools) foot.appendChild(tools.bar);
  return {foot:foot, panel:tools ? tools.panel : null};
}

/* una riga del dispaccio: laboratorio, titolo e la miniatura; il resto al tocco */
function wireRow(date, a, senzaApple){
  const li = el("li", {id:"a-" + a.id});
  const row = el("div", {class:"row"}, [
    el("div", {class:"rowtext"}, [
      el("span", {class:"chip lab-name", text:labName(String(a.lab || "altri").toLowerCase())}),
      el("h4", {text:a.title}),
      a.sintesi ? el("p", {class:"sintesi", text:a.sintesi}) : null,
      segueNode(date, a)
    ]),
    a.image ? el("img", {class:"thumb", src:a.image, alt:"", loading:"lazy", decoding:"async"}) : null
  ]);
  const body = el("div", {class:"body", hidden:"hidden"});
  if(a.note) body.appendChild(el("p", {text:a.note}));
  if(a.apple && !senzaApple) body.appendChild(el("p", {class:"apple", text:a.apple}));
  const f = aiFoot(date, a, a.kind ? el("span", {class:"sources", text:a.kind}) : null);
  body.appendChild(f.foot);
  if(f.panel) body.appendChild(f.panel);
  row.addEventListener("click", function(){ body.hidden = !body.hidden; li.classList.toggle("is-open", !body.hidden); });
  li.appendChild(row); li.appendChild(body);
  return li;
}

/* una scheda della galleria: la foto e' il risultato, sotto il come provarlo */
function labCard(date, a){
  const card = el("article", {class:"labcard" + (a.image ? "" : " noshot"), id:"a-" + a.id});
  const body = el("div", {class:"body", hidden:"hidden"});
  const toggle = function(){ body.hidden = !body.hidden; card.classList.toggle("is-open", !body.hidden); };
  if(a.image) card.appendChild(el("span", {class:"breath"}, [el("img", {class:"shot", src:a.image, alt:"", loading:"lazy", decoding:"async", onclick:toggle})]));
  card.appendChild(el("div", {class:"chips"}, [
    el("span", {class:"chip k-lab", text:"LAB · " + String(a.kind || "")}),
    el("span", {class:"chip lab-name", text:labName(String(a.lab || "altri").toLowerCase())})
  ]));
  card.appendChild(el("h4", {text:a.title, onclick:toggle}));
  const seg = segueNode(date, a);
  if(seg) card.appendChild(seg);
  if(a.prova) card.appendChild(el("p", {class:"prova", text:a.prova}));
  if(a.note) body.appendChild(el("p", {text:a.note}));
  card.appendChild(body);
  const f = aiFoot(date, a, null);
  card.appendChild(f.foot);
  if(f.panel) card.appendChild(f.panel);
  return card;
}

/* i due blocchi di un giorno, nell'ordine in cui si leggono: prima cosa e'

/* il fronte si ricava dall'archivio: l'ultima voce di genere "modello" per
   laboratorio. Niente registro a parte: vive dentro le edizioni come tutto */
function fronte(){
  const out = {};
  BRIEFS.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; }).forEach(function(b){
    (b.ai || []).forEach(function(a){
      if(String(a.kind || "").toLowerCase() !== "modello") return;
      const l = String(a.lab || "altri").toLowerCase();
      if(!out[l]) out[l] = {a:a, date:b.date};
    });
  });
  return AI_LABS.map(function(x){ return out[x[0]] ? [x[1], out[x[0]]] : null; }).filter(Boolean);
}

/* una voce AI e' "vista" quando e' comparsa nella scheda: segno read_at sulla

   iPhone. Serve al numero sulla scheda, che conta solo il nuovo */
function aiKey(date, a){ return key(date, "ai:" + a.id); }
function aiRead(date, a){ if(!a.id) return false; const m = mk(aiKey(date, a)); return !!(m && m.read_at); }
function aiMarkSeen(date, a){
  if(!NOTES || !a.id || aiRead(date, a)) return false;
  const m = mark(aiKey(date, a)); m.read_at = new Date().toISOString(); m.updated_at = m.read_at; m.dirty = true;
  return true;
}

/* ================= AI nella Magazine (5 novembre 2026) =================
   Un feed solo, senza le due schede Notizie/LAB: la testatina, il fronte come un
   tabellone, «In apertura» tipografica sul rosso (le foto della cronaca sono
   illustrazioni generiche), «E Apple?» una volta sola, «Cosa puoi provare» con la foto
   del risultato e il foglietto «Prova», e il dispaccio in righe. */
const FRONTE_COL = [["anthropic","Anthropic"],["openai","OpenAI"],["google","Google"],["meta","Meta"],
                    ["apple","Apple"],["aperti","Aperti"],["altri","Altri"],["robot","Robot"]];
const NON_PUNTA = /\b(haiku|sonnet|mini|nano|flash|lite|small|spark|live|veloce)\b/i;
const LAB_PAROLE = /^(anthropic|openai|google|deepmind|google deepmind|meta|apple|xai|liberai|runway|agility robotics|moonshot|black forest labs|reflection ai|typesafe ai)\s+/i;
/* il nome breve: dal campo `modello.nome`; per le voci vecchie, dal titolo — il primo
   gruppo di parole con una cifra («GPT-6.1 Terra», «Claude Opus 5.5»), o la prima serie di
   maiuscole dopo il nome del laboratorio («Muse Wonder Full») */
function nomeModello(a){
  if(a.modello && a.modello.nome) return a.modello.nome;
  const t = String(a.title || "").split(/[:,;—–]| - /)[0];
  const parti = t.match(/(?:[A-Z][\w.\-]*|\d[\w.\-]*|"[^"]+"|«[^»]+»)(?:\s+(?:[A-Z][\w.\-]*|\d[\w.\-]*|"[^"]+"|«[^»]+»))*/g) || [];
  let n = parti.filter(function(x){ return /\d/.test(x); })[0] || parti.filter(function(x){ return !LAB_PAROLE.test(x + " ") || x.split(" ").length > 1; })[0] || "";
  n = n.replace(LAB_PAROLE, "").replace(/["«»]/g, "").trim();
  return n.length > 22 ? n.slice(0, 21) + "…" : n;
}
function fronteTab(date){
  const ultimi = {};
  BRIEFS.filter(function(b){ return b.date <= date; }).sort(function(a, b){ return a.date < b.date ? 1 : -1; }).forEach(function(b){
    (b.ai || []).forEach(function(a){
      if(String(a.kind || "").toLowerCase() !== "modello") return;
      const l = String(a.lab || "altri").toLowerCase();
      const punta = a.modello && a.modello.famiglia ? a.modello.famiglia === "punta" : !NON_PUNTA.test(nomeModello(a));
      const cur = ultimi[l];
      /* «ultimo» non e' «di punta» (Anthropic mostrava Haiku): vince il piu' recente di punta */
      if(!cur || (!cur.punta && punta)) ultimi[l] = {a:a, date:b.date, punta:punta};
    });
  });
  return FRONTE_COL.map(function(x){ return ultimi[x[0]] ? {lab:x[1], m:ultimi[x[0]]} : null; }).filter(Boolean);
}
function giorniFra(a, b){ return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000); }
function fronteNode(brief){
  const cols = fronteTab(brief.date);
  if(cols.length < 2) return null;
  const board = el("div", {class:"fr-board", role:"list"});
  cols.forEach(function(c){
    const d = giorniFra(c.m.date, brief.date), oggi = d === 0, sett = Math.min(8, Math.floor(d / 7));
    const u = safeUrl(c.m.a.link);
    const dots = el("span", {class:"fr-dots", title:oggi ? "uscito oggi" : "in carica da " + d + " giorni"});
    for(let i = 0; i < 8; i++) dots.appendChild(el("i", {class:i < sett ? "on" : ""}));
    const cell = el("div", {class:"fr-col" + (oggi ? " oggi" : ""), role:"listitem", tabindex:u ? "0" : null}, [
      el("span", {class:"fr-lab", text:c.lab}),
      el("b", {class:"fr-nome", text:nomeModello(c.m.a)}),
      /* se l'ultimo del laboratorio non e' di punta, lo si dice invece di farlo passare per tale */
      c.m.punta ? null : el("span", {class:"fr-fam", text:(c.m.a.modello && c.m.a.modello.famiglia === "aperto") ? "aperto" : "veloce"}),
      dots,
      el("span", {class:"fr-when", text:oggi ? "oggi" : d < 7 ? d + (d === 1 ? " giorno" : " giorni") : sett + (sett === 1 ? " settimana" : " settimane")})
    ]);
    if(u) cell.addEventListener("click", function(){ window.open(u, "_blank", "noopener"); });
    board.appendChild(oggi ? Motion.once(cell, "rise") : cell);
  });
  /* la settimana dei laboratori: sette giorni, un segno per voce
     (pieno = modello, anello = funzione, quadrato = affari, punto = il resto) */
  const giorni = [];
  for(let i = 6; i >= 0; i--){

    giorni.push(d.toISOString().slice(0, 10));

  }))));

    week.appendChild(el("div", {class:"fr-wrow"}, [el("span", {class:"fr-wlab", text:x[1]})].concat(giorni.map(function(g){
      const ks = per[x[0]][g] || [];
      const k = ks.indexOf("modello") >= 0 ? "m" : ks.indexOf("funzione") >= 0 ? "f" : ks.indexOf("affari") >= 0 ? "a" : ks.length ? "r" : "";
      return el("span", {}, [k ? el("i", {class:"k-" + k}) : null]);

  return el("section", {class:"fronte-tab", "aria-label":"Il fronte"}, [
    el("div", {class:"fr-head"}, [el("span", {text:"Il fronte"}), el("span", {class:"fr-sub", text:"l'ultimo modello di punta di ogni laboratorio"})]),
    board,
    Object.keys(per).length ? week : null,
    Object.keys(per).length ? el("p", {class:"fr-leg", html:"<i class='k-m'></i> modello <i class='k-f'></i> funzione <i class='k-a'></i> affari <i class='k-r'></i> altro · ultimi sette giorni"}) : null
  ]);
}

/* ================= GAMES, TECH, SCIENZA =================
   Tre schede alla pari con APPLE e AI (2 ottobre 2026). Le compone
   pipeline/rubriche.py: solo quello che merita, mai riempita. Le tre voci

const RUB = {

function rubKey(date, kind, it){ return key(date, kind + ":" + it.id); }
function rubRead(date, kind, it){ if(!it.id) return false; const m = mk(rubKey(date, kind, it)); return !!(m && m.read_at); }
function rubMarkSeen(date, kind, it){

  return true;
}
function rubWhen(it){

  if(!g || !g.uscita) return null;

  const d = Math.round((b - a) / 86400000);
  if(d > 1) return {n:String(d), t:"giorni all'uscita"};
  if(d === 1) return {n:"1", t:"giorno all'uscita"};
  if(d === 0) return {n:"OGGI", t:"esce GTA VI"};
  return {n:String(-d), t:(-d === 1 ? "giorno" : "giorni") + " dall'uscita"};

const views = ["oggi","ai","games","spazio","archivio","salvati","diario","cerca"];
let currentView = "oggi";

function show(name){
  currentView = name;
  views.forEach(function(v){ document.getElementById("view-" + v).hidden = (v !== name); });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    const on = t.classList.contains("more") ? ["archivio","salvati","diario","cerca"].indexOf(name) >= 0 : t.dataset.view === name;
    t.setAttribute("aria-current", on ? "true" : "false");
    /* con sei schede la barra sul telefono non ci sta: la scheda attiva si
       porta sempre dentro la finestra, cosi' non resta mezza tagliata */
    if(on && t.scrollIntoView) t.scrollIntoView({block:"nearest", inline:"nearest"});
  });
  tabsOverflow();
  if(name === "ai") renderAI();
  if(RUB[name]) renderRubrica(name);

  if(name === "salvati") renderStarred();
  if(name === "diario") renderDiary();
  if(name === "cerca"){ renderSearch(); const i = document.querySelector("#view-cerca input"); if(i) i.focus(); }
  Motion.scan(document.getElementById("view-" + name));
  tabInk();
  MagNav.visible(name === "oggi");

/* la lineetta sotto la scheda attiva scivola da una scheda all'altra, e
   prende il colore della scheda (arancione APPLE, rosso AI, giallo GAMES…) */
const TAB_INK = {ai:"--red", games:"--yellow", spazio:"--night"};
function tabInk(){
  const nav = document.querySelector("nav.tabs");
  if(!nav || STILL) return;
  let ink = nav.querySelector(".tab-ink");
  const on = nav.querySelector('.tab[aria-current="true"]');
  if(!on || !on.offsetWidth){ if(ink) ink.style.opacity = "0"; return; }
  const first = !ink;
  if(first){ ink = el("span", {class:"tab-ink", "aria-hidden":"true"}); nav.appendChild(ink); nav.classList.add("has-ink"); }
  if(first) ink.style.transition = "none";
  ink.style.opacity = "1";
  ink.style.width = on.offsetWidth + "px";
  ink.style.transform = "translateX(" + on.offsetLeft + "px)";
  /* nella Magazine la lineetta e' una pillola nera dietro la sezione attiva */
  ink.classList.toggle("pill", magazine());
  ink.style.top = (magazine() ? on.offsetTop : on.offsetTop + on.offsetHeight - 2) + "px";
  ink.style.height = magazine() ? on.offsetHeight + "px" : "";
  ink.style.background = magazine() ? "" : "var(" + (TAB_INK[on.dataset.view] || "--orange") + ")";
  if(first){ void ink.offsetWidth; ink.style.transition = ""; }
}

/* Sfumatura sul bordo della barra quando ci sono schede oltre il margine:
   dice che si scorre senza aggiungere frecce o altro arredo. */
function tabsOverflow(){
  const nav = document.querySelector("nav.tabs");
  if(!nav) return;
  const max = nav.scrollWidth - nav.clientWidth;
  nav.classList.toggle("more-right", max - nav.scrollLeft > 4);
  nav.classList.toggle("more-left", nav.scrollLeft > 4);
}
(function(){
  const nav = document.querySelector("nav.tabs");

document.getElementById("themeBtn").addEventListener("click", function(){
  const btn = this;
  const apply = function(){
    const r = document.documentElement;
    const dark = r.getAttribute("data-theme") === "dark" ||
      (!r.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme:dark)").matches);
    r.setAttribute("data-theme", dark ? "light" : "dark");
    try{ localStorage.setItem("tmb-theme", dark ? "light" : "dark"); }catch(e){}
    dotfield(document.getElementById("dotfield"));
  };
  /* il tema nuovo si allarga a cerchio dal pulsante, invece di scattare */
  if(STILL || !document.startViewTransition){ apply(); return; }
  const rc = btn.getBoundingClientRect(), x = rc.left + rc.width / 2, y = rc.top + rc.height / 2;
  const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const t = document.startViewTransition(apply);
  t.ready.then(function(){
    document.documentElement.animate(
      {clipPath:["circle(0px at " + x + "px " + y + "px)", "circle(" + R + "px at " + x + "px " + y + "px)"]},
      {duration:560, easing:"cubic-bezier(.4,0,.2,1)", pseudoElement:"::view-transition-new(root)"});
  }).catch(function(){});
});

}catch(e){}

    if(window.claude && window.claude.downloads && window.claude.downloads.save){
      await window.claude.downloads.save({filename:name, data:payload});
      toast("Copia salvata"); return;
    }
  }catch(err){ toast("Salvataggio annullato"); return; }
  const blob = new Blob([payload], {type:"application/json"});
  const a = el("a", {href:URL.createObjectURL(blob), download:name});
  document.body.appendChild(a); a.click(); a.remove();
  toast("Copia scaricata");
});
document.getElementById("importBtn").addEventListener("click", function(){
  document.getElementById("fileInput").click();
});
document.getElementById("fileInput").addEventListener("change", function(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onload = function(){
    try{
      const parsed = JSON.parse(fr.result);
      const d = parsed.data || parsed;
      const now = new Date().toISOString();
      /* versione 1: stars/notes/links/read separati */
      if(d.stars || d.notes || d.links || d.read){
        const keys = {};
        ["stars","notes","links","read"].forEach(function(fl){
          Object.keys(d[fl] || {}).forEach(function(k){ keys[k] = 1; });
        });
        Object.keys(keys).forEach(function(k){
          const m = mark(k);
          if(d.stars && d.stars[k] && !m.starred_at) m.starred_at = new Date(d.stars[k]).toISOString();
          if(d.read && d.read[k] && !m.read_at) m.read_at = new Date(d.read[k]).toISOString();
          if(d.notes && d.notes[k] && !m.note) m.note = d.notes[k];
          if(d.links && d.links[k] && !(m.links || []).length) m.links = d.links[k];
          m.updated_at = now; m.dirty = true;
        });
      }
      /* versione 2: marks già nella forma giusta */
      Object.keys(d.marks || {}).forEach(function(k){
        const inc = d.marks[k], cur = S.marks[k];
        if(!cur || (inc.updated_at || "") > (cur.updated_at || "")){
          S.marks[k] = Object.assign({}, inc, {updated_at:now, dirty:true});
        }
      });
      (d.diary || []).forEach(function(e){
        if(!e || !e.id) return;
        if(!S.diary.some(function(x){ return x.id === e.id; })){
          S.diary.push(Object.assign({deleted_at:null}, e, {updated_at:now, dirty:true}));
        }
      });
      S.diary.sort(function(a,b){ return b.ts - a.ts; });
      saveNow(); queueSync(); repaint(); show("oggi");
      toast("Appunti importati");
    }catch(e){
      toast("File non leggibile: serve un export di questa app");
    }
  };
  fr.readAsText(f);
  ev.target.value = "";
});

/* ================= avvio ================= */
function boot(){
  document.getElementById("gate").hidden = true;
  document.getElementById("masthead").hidden = false;
  document.getElementById("main").hidden = false;
  document.getElementById("colophon").hidden = false;
  if(!NOTES){
    ["salvati","diario"].forEach(function(v){
      const t = document.querySelector('#tabmenu [data-go="' + v + '"]');
      if(t) t.hidden = true;
    });
    ["exportBtn","importBtn"].forEach(function(id){
      const n = document.getElementById(id);
      if(n) n.hidden = true;
    });
  }
  if(!CLOUD){
    ["syncPip","outBtn"].forEach(function(id){
      const n = document.getElementById(id);
      if(n) n.hidden = true;
    });
  }
  indexAll();
  if(!currentDate && BRIEFS[0]) currentDate = BRIEFS[0].date;
  refreshCounts();
  renderEdition();
  show("oggi");
  if(CLOUD){
    loadBriefs();
    sync();
    setInterval(function(){ if(!document.hidden) sync(); }, 90000);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) sync(); });
    window.addEventListener("online", sync);
    window.addEventListener("offline", function(){ pip("offline", "Offline — gli appunti restano sul dispositivo"); });
  }
}

function openGate(msg){
  const g = document.getElementById("gate");
  g.hidden = false;
  document.getElementById("masthead").hidden = true;
  document.getElementById("main").hidden = true;
  document.getElementById("colophon").hidden = true;
  if(msg) document.getElementById("gateErr").textContent = msg;
  dotfield(document.getElementById("gatefield"));
}

document.getElementById("gateForm").addEventListener("submit", async function(ev){
  ev.preventDefault();
  const btn = document.getElementById("gateBtn");
  const err = document.getElementById("gateErr");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Un attimo…";
  try{
    await login(document.getElementById("gateEmail").value.trim(), document.getElementById("gatePass").value);
    boot();
  }catch(e){
    err.textContent = /invalid/i.test(e.message) ? "Email o password non corrette." : e.message;
  }finally{
    btn.disabled = false; btn.textContent = "Entra";
  }
});
document.getElementById("outBtn").addEventListener("click", function(){
  clearAuth();
  localStorage.removeItem(K_BRIEFS);
  location.reload();
});

if(CLOUD && !(AUTH && AUTH.refresh_token)) openGate();
else boot();
})();
</script>
