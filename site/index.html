.xp-info{background:var(--bone); border-radius:6px; padding:.7rem .85rem; display:flex; flex-direction:column; gap:.25rem; min-height:4.2em}
.xp-info b{font-family:var(--display); font-weight:700; font-size:1.05rem; text-transform:uppercase}
.xp-info span{font-size:.9rem; line-height:1.45; color:var(--ink-2)}
@media (max-width:600px){
  /* sul telefono la pila va a sinistra, cosi' le etichette hanno spazio */
  .xp-scene{height:250px; justify-items:start; padding-left:4%}
  .xp-stack{width:132px; height:96px}
  .vis-esploso.open .xp-plate{transform:translateZ(calc(var(--i) * 38px))}
  .xp-tag{font-size:9.5px; margin-left:18px; letter-spacing:.05em}
}

/* ---------------- approfondimento compatto ----------------
   Una scheda alla volta, i grafici di lato, la barra per uscire. */
.story,.deep{scroll-margin-top:7.4rem}
@media (max-width:600px){ .story,.deep{scroll-margin-top:5.6rem} }
.deep-gallery{display:flex; flex-direction:column; gap:.5rem}
.deep-carousel{display:flex; align-items:flex-start; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory;
  scrollbar-width:none; gap:0; margin:0 -.2rem; -webkit-overflow-scrolling:touch; transition:height .35s ease}
.deep-carousel::-webkit-scrollbar{display:none}
.deep-carousel .slide{flex:0 0 100%; scroll-snap-align:start; padding:.2rem .2rem .6rem; box-sizing:border-box}
.deep-gallery-foot{display:flex; justify-content:space-between; align-items:center}
.deep-pips{display:flex; gap:.4rem}
.deep-pips button{width:9px; height:9px; border-radius:50%; border:0; padding:0; background:var(--rule-strong); cursor:pointer}
.deep-pips button.on{background:var(--ink); width:22px; border-radius:5px}
.deep-links{display:flex; flex-direction:column}
.deep-link{display:grid; grid-template-columns:auto 1fr auto; gap:.2rem .7rem; align-items:start; padding:.65rem 0;
  border-top:1px solid var(--rule); text-decoration:none; color:var(--ink)}
.deep-link:first-child{border-top:0}
.deep-link .k{font-size:.56rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; padding:.2rem .45rem;
  border-radius:2px; color:#17181B; margin-top:.15rem}
.deep-link .k.leggi{background:var(--blue)}
.deep-link .k.ascolta{background:var(--orange)}
.deep-link .k.guarda{background:var(--red); color:#FFF}
.deep-link .body{display:flex; flex-direction:column; gap:.15rem; min-width:0}
.deep-link b{font-family:var(--display); font-weight:600; font-size:1.02rem; line-height:1.2}
.deep-link .src{font-size:.8rem; line-height:1.4; color:var(--ink-3)}
.deep-link i{font-style:normal; color:var(--ink-3); margin-top:.1rem}
.deep-bar{
  position:sticky; bottom:calc(.7rem + env(safe-area-inset-bottom)); z-index:20;
  display:flex; gap:.5rem; justify-content:space-between; margin-top:.4rem;
  background:var(--ink); border-radius:999px; padding:.3rem; box-shadow:0 10px 28px -12px rgba(0,0,0,.55)}
.deep-bar button{border:0; cursor:pointer; border-radius:999px; padding:.55rem 1rem; display:inline-flex; gap:.45rem; align-items:center;
  font-family:var(--display); font-weight:700; font-size:.92rem; letter-spacing:.04em; text-transform:uppercase}
.deep-bar .close{background:none; color:var(--bone)}
.deep-bar .next{background:var(--yellow); color:#17181B}
.deep-bar i{font-style:normal}
body.has-player .deep-bar{bottom:calc(6.4rem + env(safe-area-inset-bottom))}

footer.colophon{
  max-width:1240px; margin:0 auto; padding:1.8rem var(--gutter) 3.5rem;
  border-top:1.5px solid var(--ink); color:var(--ink-3);
  display:flex; flex-wrap:wrap; gap:.6rem 2rem; align-items:baseline;
}
footer.colophon[hidden]{display:none}
footer.colophon .sp{flex:1}
/* ---------------- telefono: testata compatta ----------------
   Sta in fondo apposta: a parita' di specificita' vince chi viene dopo, e
   queste devono vincere su .tab, .hero e .section-head scritte sopra.
   Meno schede, piu' grandi: Diario e Cerca vanno sotto i tre puntini. */

  .tab{font-size:.88rem; margin-right:.85rem; letter-spacing:.02em; padding:.35rem 0 .5rem}
  .tab .count{margin-left:.2rem}
  .tab.more{margin-left:auto}
  .masthead-inner{padding-top:.4rem}
  nav.tabs{margin-top:.15rem}
  .hero{padding-top:.6rem}
  .col-main > .section-head:first-child{padding-top:1.1rem}
}

/* ================= segnali di lettura =================
   Mike non preme i pollici (1 ottobre 2026: "non li uso"). La rassegna
   impara allora da come si legge: quali voci si vedono e si saltano, quali
   si aprono, quanto ci si resta sopra, cosa si approfondisce, cosa si ascolta,
   quali articoli si aprono. Resta solo il pollice giu', per dire "questo
   proprio no". pipeline/taste.py trasforma questi segnali in gusti.

   Tutto in UNA riga per giorno e per lettore: chiave "segnali/AAAA-MM-GG" in
   brief_marks, il JSON nel campo note. Niente migrazioni, niente una riga per
   voce: la tabella non cresce di centinaia di righe al giorno. Le schede che
   elencano i segni (Salvati, i contatori) guardano solo le chiavi delle voci,
   quindi questa riga non la vede nessuno.

   Per voce: v vista (almeno un secondo e mezzo a schermo), o aperta, t secondi
   passati con la voce aperta e a schermo, d approfondimento aperto, a ascoltata,
   l articolo aperto. */
const SIG_PREFIX = "segnali/";
const Sig = (function(){
  const pending = {};        /* giorno -> {id -> campi} da scrivere */
  let timer = null;
  function parse(t){ try{ const o = JSON.parse(t || "{}"); return o && typeof o === "object" ? o : {}; }catch(e){ return {}; } }
  /* due dispositivi scrivono la stessa riga: si tiene il massimo di ogni campo */
  function merge(a, b){
    const x = parse(a), y = parse(b);
    Object.keys(y).forEach(function(id){
      const e = x[id] || (x[id] = {});
      Object.keys(y[id] || {}).forEach(function(f){ e[f] = Math.max(e[f] || 0, y[id][f] || 0); });
    });
    return JSON.stringify(x);
  }
  function flush(){
    timer = null;
    Object.keys(pending).forEach(function(day){
      const k = SIG_PREFIX + day, m = mark(k);
      const cur = parse(m.note), add = pending[day];
      Object.keys(add).forEach(function(id){
        const e = cur[id] || (cur[id] = {});
        Object.keys(add[id]).forEach(function(f){
          e[f] = f === "t" ? Math.min(1800, (e[f] || 0) + add[id][f]) : Math.max(e[f] || 0, add[id][f]);
        });
      });
      delete pending[day];
      m.note = JSON.stringify(cur);
      touched(k);
    });
  }
  function bump(k, f, val){
    if(!k || k.length < 12 || k.indexOf(SIG_PREFIX) === 0) return;
    const day = k.slice(0, 10), id = k.slice(11);
    const d = pending[day] || (pending[day] = {}), e = d[id] || (d[id] = {});
    e[f] = f === "t" ? (e[f] || 0) + (val || 0) : Math.max(e[f] || 0, val || 1);
    if(!timer) timer = setTimeout(flush, 6000);
  }
  /* la voce a cui appartiene un elemento: quella che porta la barra dei
     segni (stella, appunti, pollice) con la sua chiave */
  function itemOf(node){
    let it = node && node.closest ? node.closest("article, li") : null;
    while(it){
      const bar = it.querySelector(".tools[data-sig]");
      if(bar && bar.closest("article, li") === it) return {el:it, k:bar.getAttribute("data-sig")};
      it = it.parentElement ? it.parentElement.closest("article, li") : null;
    }
    return null;
  }
  function isOpen(el){ return el.classList.contains("is-open") || !!el.querySelector(".is-open"); }

  /* vista: almeno un secondo e mezzo con buona parte della voce a schermo */
  const seenTimers = new WeakMap(), watched = new WeakSet(), onScreen = new Set();
  const io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){
    es.forEach(function(e){
      const el = e.target, big = e.intersectionRect.height > window.innerHeight * .4;
      const vis = e.isIntersecting && (e.intersectionRatio >= .6 || big);
      if(vis){
        onScreen.add(el);
        if(!seenTimers.get(el)) seenTimers.set(el, setTimeout(function(){
          const it = itemOf(el.querySelector(".tools[data-sig]") || el);
          if(it && document.visibilityState === "visible") bump(it.k, "v");
        }, 1500));
      } else {
        onScreen.delete(el);
        clearTimeout(seenTimers.get(el)); seenTimers.delete(el);
      }
    });
  }, {threshold:[0, .6]}) : null;
  function scan(){
    if(!io) return;
    Array.prototype.forEach.call(document.querySelectorAll(".tools[data-sig]"), function(bar){
      const it = bar.closest("article, li");
      if(it && !watched.has(it)){ watched.add(it); io.observe(it); }
    });
  }
  let scanTimer = null;
  new MutationObserver(function(){ if(!scanTimer) scanTimer = setTimeout(function(){ scanTimer = null; scan(); }, 400); })
    .observe(document.body, {childList:true, subtree:true});

  /* il tempo: ogni cinque secondi, alle voci aperte e a schermo */
  setInterval(function(){
    if(document.visibilityState !== "visible") return;
    onScreen.forEach(function(el){
      if(!el.isConnected){ onScreen.delete(el); return; }
      if(!isOpen(el)) return;
      const it = itemOf(el.querySelector(".tools[data-sig]") || el);
      if(it) bump(it.k, "t", 5);
    });
  }, 5000);

  /* i tocchi: un link apre l'articolo, il resto apre la voce */
  document.addEventListener("click", function(ev){
    const it = itemOf(ev.target);
    if(!it || ev.target.closest(".tools")) return;
    const a = ev.target.closest("a[href]");
    if(a && /^https?:/i.test(a.getAttribute("href") || "")){ bump(it.k, "l"); return; }
    setTimeout(function(){ if(isOpen(it.el)) bump(it.k, "o"); }, 0);
  }, true);

  document.addEventListener("visibilitychange", function(){ if(document.hidden && timer){ clearTimeout(timer); flush(); } });
  window.addEventListener("pagehide", function(){ if(timer){ clearTimeout(timer); flush(); } });
  return {bump:bump, merge:merge};
})();

/* ================= utilità ================= */
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const BEADS = ["--red","--yellow","--blue","--orange","--ink"];

function fmtDate(iso){
  const d = new Date(iso + "T12:00:00");
  if(isNaN(d)) return iso;
  return GIORNI[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()] + " " + d.getFullYear();
}
function fmtShort(iso){
  const d = new Date(iso + "T12:00:00");
  if(isNaN(d)) return iso;
  return d.getDate() + " " + MESI[d.getMonth()].slice(0,3) + " " + d.getFullYear();
}
/* "6 giorni fa", contato rispetto al giorno dell'edizione e non a oggi: una
   vecchia edizione riletta fra un mese deve restare vera. */
function fmtAgo(iso, refIso){
  const a = new Date(String(iso || "").slice(0,10) + "T12:00:00");
  const b = new Date(String(refIso || "").slice(0,10) + "T12:00:00");
  if(isNaN(a) || isNaN(b)) return fmtShort(iso);
  const d = Math.round((b - a) / 86400000);
  if(d <= 0) return "oggi";
  if(d === 1) return "ieri";
  if(d < 14) return d + " giorni fa";
  return Math.round(d / 7) + " settimane fa";
}
/* Il giorno va letto nel fuso di chi guarda, non in UTC: toISOString() dava
   la data di Londra accanto all'ora di casa, e un appunto scritto all'una di
   notte compariva datato al giorno prima. */
function localDay(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
       + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtStamp(ts){
  const d = new Date(ts);
  if(isNaN(d)) return "";          /* una voce importata male non rompe la lista */
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return fmtShort(localDay(d)) + " · " + hh + ":" + mm;
}
function el(tag, attrs, kids){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === "class") n.className = attrs[k];
    else if(k === "text") n.textContent = attrs[k];
    else if(k === "html") n.innerHTML = attrs[k];
    else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}
function bead(i, txt, cls){
  const v = BEADS[i % BEADS.length];
  const n = el("span", {class:cls || "bead", text:txt});
  n.style.background = "var(" + v + ")";
  if(v === "--ink") n.style.color = "var(--bone)";
  return n;
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function key(dateStr, id){ return dateStr + "/" + id; }
function safeUrl(u){
  const s = String(u || "").trim();
  return /^https?:\/\//i.test(s) ? s : null;
}
function tagClass(tag){ return "chip t-" + String(tag || "").toLowerCase().replace(/[^a-z]/g,""); }
/* Il reparto della notizia: l'argomento in una parola, che nella lista del
   Duo dice che notizia aspettarsi. Dal 2 novembre 2026 la corsa lo scrive nel
   campo "reparto"; per le edizioni di prima si ricava da "category", che era
   testo libero ("iphone duo", "Casa intelligente", "legale"…). */
const REPARTI = [
  ["Mac", /^(mac|macbook|imac|chip)/],
  ["iPhone", /^(iphone|ios$)/],
  ["iPad", /^ipad/],
  ["Watch", /watch/],
  ["Casa", /^(casa|smart home|homepod|homeview)/],
  ["Servizi", /^(servizi|app store|apple music|apple tv|apple wallet|apple pay|app$)/],
  ["Software", /^(software|ios|macos|siri)/],
  ["Mercato", /^(mercat|vendite|cina|catena|manifattura|concorrenza|operatori|retail|apple store)/],
  ["Regole", /^(regolament|legale|antitrust|privacy|brevetti|sicurezza)/],
  ["Azienda", /^(azienda|leadership|dirigenza|organizzazione|strategia|acquisizioni)/],
  ["Eventi", /^(eventi|calendario)/],
  ["Accessori", /^(accessori|audio|airpods)/],
  ["AI", /^ai$/]
];
function reparto(n){
  if(n.reparto) return n.reparto;
  const c = String(n.category || "").trim().toLowerCase();
  for(let i = 0; i < REPARTI.length; i++) if(REPARTI[i][1].test(c)) return REPARTI[i][0];
  return "Apple";
}

/* ================= accesso ================= */
let AUTH = null;
try{ AUTH = JSON.parse(localStorage.getItem(K_AUTH) || "null"); }catch(e){}

function storeAuth(j){
  AUTH = {
    access_token:j.access_token,
    refresh_token:j.refresh_token,
    expires_at:Date.now() + (j.expires_in || 3600) * 1000,
    user_id:(j.user && j.user.id) || (AUTH && AUTH.user_id)
  };
  localStorage.setItem(K_AUTH, JSON.stringify(AUTH));
}
function clearAuth(){ AUTH = null; localStorage.removeItem(K_AUTH); }

async function login(email, password){
  let res;
  try{
    res = await fetch(CFG.url + "/auth/v1/token?grant_type=password", {
      method:"POST",
      headers:{"apikey":CFG.anon_key, "Content-Type":"application/json"},
      body:JSON.stringify({email:email, password:password})
    });
  }catch(e){
    throw new Error("Non riesco a raggiungere il server. Controlla la connessione e riprova.");
  }
  const j = await res.json().catch(function(){ return {}; });
  if(!res.ok) throw new Error(j.error_description || j.msg || j.message || "Accesso non riuscito");
  storeAuth(j);
}
async function refreshToken(){
  if(!AUTH || !AUTH.refresh_token) return false;
  try{
    const res = await fetch(CFG.url + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST",
      headers:{"apikey":CFG.anon_key, "Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:AUTH.refresh_token})
    });
    if(!res.ok) return false;
    storeAuth(await res.json());
    return true;
  }catch(e){ return false; }
}
async function sb(path, opts, retried){
  opts = opts || {};
  if(AUTH && AUTH.expires_at && Date.now() > AUTH.expires_at - 60000 && !retried){
    await refreshToken();
  }
  const headers = Object.assign({
    "apikey":CFG.anon_key,
    "Content-Type":"application/json"
  }, opts.headers || {});
  if(AUTH && AUTH.access_token) headers["Authorization"] = "Bearer " + AUTH.access_token;
  const res = await fetch(CFG.url + path, Object.assign({}, opts, {headers:headers}));
  if(res.status === 401 && !retried && await refreshToken()) return sb(path, opts, true);
  return res;
}

/* ================= sincronizzazione ================= */
let syncTimer = null, syncing = false;
function pip(state, title){
  const p = document.getElementById("syncPip");
  if(!p) return;
  p.dataset.state = state;
  p.title = title;
}
function queueSync(){
  if(!CLOUD) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, 1500);
}

/* diventa false se Supabase non conosce ancora la colonna del voto */
let VOTE_SYNC = true;

function markRow(k, m){
  const row = {
    user_id:AUTH.user_id, story:k,
    starred_at:m.starred_at || null, read_at:m.read_at || null,
    note:m.note || "", links:m.links || []
  };
  if(VOTE_SYNC) row.vote = m.vote || 0;
  return row;
}
function diaryRow(e){
  return {
    user_id:AUTH.user_id, id:e.id, ts:new Date(e.ts).toISOString(),
    text:e.text || "", tags:e.tags || [], link:e.link || null,
    ref:e.ref || null, deleted_at:e.deleted_at || null
  };
}

async function sync(){
  if(!CLOUD || !AUTH || syncing) return;
  if(!navigator.onLine){ pip("offline", "Offline — gli appunti restano sul dispositivo"); return; }
  syncing = true;
  pip("busy", "Sincronizzazione…");
  try{
    /* 1. spinge quello che è cambiato qui */
    /* Si segna l'ora di ogni riga *prima* di spedirla. Fra la partenza e la
       risposta passano dei secondi in cui si continua a scrivere, e marcare
       pulito quello che nel frattempo e' cambiato ancora vuol dire perderlo:
       resterebbe solo qui, senza piu' niente che lo spinga su. */
    const dirtyMarks = Object.keys(S.marks).filter(function(k){ return S.marks[k].dirty; });
    const sentAt = {};
    dirtyMarks.forEach(function(k){ sentAt[k] = S.marks[k].updated_at; });
    if(dirtyMarks.length){
      const invia = function(){
        return sb("/rest/v1/brief_marks?on_conflict=user_id,story", {
          method:"POST",
          headers:{"Prefer":"resolution=merge-duplicates,return=representation"},
          body:JSON.stringify(dirtyMarks.map(function(k){ return markRow(k, S.marks[k]); }))
        });
      };
      let res = await invia();
      /* Se la colonna del voto non c'è ancora (migrazione non lanciata), la
         riga verrebbe respinta tutta, portandosi dietro appunti e salvati.
         Meglio rinunciare al voto e salvare il resto: tornerà al prossimo giro. */
      if(!res.ok && res.status === 400){
        const detail = (await res.clone().text()).toLowerCase();
        if(detail.indexOf("vote") >= 0 && VOTE_SYNC){
          VOTE_SYNC = false;
          console.warn("Colonna 'vote' assente su brief_marks: i pollici restano locali.");
          res = await invia();
        }
      }
      if(!res.ok) throw new Error("brief_marks " + res.status + " " + (await res.text()).slice(0,140));
      (await res.json()).forEach(function(row){
        const m = S.marks[row.story];
        if(!m || m.updated_at !== sentAt[row.story]) return;   /* ritoccata nel frattempo */
        m.updated_at = row.updated_at; m.dirty = false;
      });
    }
    const dirtyDiary = S.diary.filter(function(e){ return e.dirty; });
    const diarySentAt = {};
    dirtyDiary.forEach(function(e){ diarySentAt[e.id] = e.updated_at; });
    if(dirtyDiary.length){
      const res = await sb("/rest/v1/brief_diary?on_conflict=user_id,id", {
        method:"POST",
        headers:{"Prefer":"resolution=merge-duplicates,return=representation"},
        body:JSON.stringify(dirtyDiary.map(diaryRow))
      });
      if(!res.ok) throw new Error("brief_diary " + res.status + " " + (await res.text()).slice(0,140));
      (await res.json()).forEach(function(row){
        const e = S.diary.filter(function(x){ return x.id === row.id; })[0];
        if(!e || e.updated_at !== diarySentAt[row.id]) return;
        e.updated_at = row.updated_at; e.dirty = false;
      });
    }

    /* 2. tira quello che è cambiato altrove */
    const since = S.lastPull || "1970-01-01T00:00:00Z";
    const [rm, rd] = await Promise.all([
      sb("/rest/v1/brief_marks?select=*&updated_at=gt." + encodeURIComponent(since)),
      sb("/rest/v1/brief_diary?select=*&updated_at=gt." + encodeURIComponent(since))
    ]);
    if(!rm.ok || !rd.ok) throw new Error("lettura " + rm.status + "/" + rd.status);

    let changed = false;
    (await rm.json()).forEach(function(row){
      const local = S.marks[row.story];
      if(row.story.indexOf(SIG_PREFIX) === 0){
        /* i segnali di due dispositivi si sommano: nessuno dei due vince */
        const merged = local ? Sig.merge(local.note, row.note) : (row.note || "{}");
        S.marks[row.story] = Object.assign({}, local || {}, {starred_at:null, read_at:null, links:[], vote:0,
          note:merged, updated_at:row.updated_at, dirty:merged !== (row.note || "{}") || !!(local && local.dirty)});
        return;
      }
      if(local && local.dirty) return;                       /* il locale non ancora spinto vince */
      if(local && local.updated_at && local.updated_at >= row.updated_at) return;
      S.marks[row.story] = {
        starred_at:row.starred_at, read_at:row.read_at, note:row.note || "",
        links:row.links || [], vote:row.vote || 0, updated_at:row.updated_at, dirty:false
      };
      changed = true;
    });
    (await rd.json()).forEach(function(row){
      const i = S.diary.findIndex(function(x){ return x.id === row.id; });
      const entry = {
        id:row.id, ts:new Date(row.ts).getTime(), text:row.text, tags:row.tags || [],
        link:row.link, ref:row.ref, updated_at:row.updated_at,
        deleted_at:row.deleted_at, dirty:false
      };
      if(i < 0){ S.diary.push(entry); changed = true; }
      else if(!S.diary[i].dirty && (!S.diary[i].updated_at || S.diary[i].updated_at < row.updated_at)){
        S.diary[i] = entry; changed = true;
      }
    });
    if(changed){
      S.diary.sort(function(a,b){ return b.ts - a.ts; });
      repaint();
    }

    S.lastPull = new Date(Date.now() - 5000).toISOString();
    saveNow();
    refreshCounts();
    pip("ok", "Sincronizzato");
  }catch(err){
    /* il motivo va almeno in console: il pallino rosso dice che qualcosa non
       va, non dice cosa, e senza questa riga non restava traccia da nessuna parte */
    console.warn("Sincronizzazione non riuscita:", err && err.message ? err.message : err);
    pip("error", "Sincronizzazione non riuscita — riprovo tra poco");
  }finally{
    syncing = false;
  }
}

/* la cache locale delle edizioni non ha spazio garantito: l'archivio
   cresce di circa 150-200 KB al giorno (foto incorporate comprese) e prima
   o poi supera la quota di localStorage. Invece di lasciar fallire lo
   scrive in silenzio (e restare bloccati per sempre sull'ultimo salvataggio
   riuscito, magari di settimane prima), si scarta la coda piu' vecchia
   finche' non ci sta */
function saveBriefsCache(list){
  let slice = list;
  while(slice.length){
    try{ localStorage.setItem(K_BRIEFS, JSON.stringify(slice)); return; }
    catch(e){ slice = slice.slice(0, Math.max(1, Math.floor(slice.length / 2))); }
  }
  try{ localStorage.removeItem(K_BRIEFS); }catch(e){}
}

/* l'impronta dell'edizione a schermo: se il download porta la stessa, non
   si ridisegna niente (sul cellulare arriva dopo secondi, e intanto magari
   hai gia' aperto una notizia) */
function shownSig(){
  const b = BRIEFS.filter(function(x){ return x.date === currentDate; })[0] || BRIEFS[0];
  return b ? b.date + ":" + JSON.stringify(b).length : "";
}
async function loadBriefs(){
  if(!CLOUD){ indexAll(); return; }
  try{
    const cached = JSON.parse(localStorage.getItem(K_BRIEFS) || "null");
    if(cached && cached.length){ BRIEFS = cached; indexAll(); repaint(); }
  }catch(e){}
  const before = BRIEFS.length ? shownSig() : "";
  try{
    const res = await sb("/rest/v1/brief_editions?select=payload&order=date.desc&limit=400");
    if(!res.ok) throw new Error("brief_editions " + res.status);
    const rows = await res.json();
    if(rows.length){
      BRIEFS = rows.map(function(r){ return r.payload; });
      saveBriefsCache(BRIEFS);
      indexAll();
      if(!currentDate || !BRIEFS.some(function(b){ return b.date === currentDate; })){
        currentDate = BRIEFS[0].date;
      }
      if(before && (currentView === "oggi" || currentView === "ai") && shownSig() === before) refreshCounts();
      else repaint();
    }
  }catch(err){
    if(!BRIEFS.length) toast("Nessuna edizione scaricata — controlla la connessione");
  }
}

function indexAll(){
  ALL = [];
  EXTRAS = [];
  BRIEFS.forEach(function(b){
    (b.news || []).forEach(function(n){ ALL.push({brief:b, news:n, k:key(b.date, n.id)}); });
    /* radar, banco e recap non sono notizie ma si salvano lo stesso: un video
       da guardare dopo deve ricomparire fra i salvati come tutto il resto */
    [["radar", "Radar"], ["banco", "Sul banco"], ["recap", "Se te lo fossi perso"],
     ["games", "Games"], ["tech", "Tech"], ["spazio", "Scienza"], ["gta", "GTA VI"]]
      .forEach(function(sez){
        (sez[0] === "gta" ? ((b.gta && b.gta.voci) || b.gta_notizie || []) : (b[sez[0]] || [])).forEach(function(it){
          if(!it.id) return;
          if(it.nota && !it.note) it = Object.assign({}, it, {note:it.nota});
          EXTRAS.push({brief:b, item:it, kind:sez[0], label:sez[1],
                       k:key(b.date, sez[0] + ":" + it.id)});
        });
      });
  });
  indexThreads();
  indexClaims();
  indexFacts();
}

/* ================= fili e previsioni =================
   Nessuna tabella in piu' da sincronizzare: fili e previsioni stanno dentro
   le edizioni, e qui vengono ricostruiti a ogni caricamento. Per questo la
   copia Artifact, che non puo' fare rete, si comporta esattamente uguale. */

let THREADS = {};   /* slug -> {label, note, episodes} */
let CLAIMS = [];    /* previsioni con il loro stato di oggi */

function byDate(desc){
  return BRIEFS.slice().sort(function(a, b){
    return (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) * (desc ? -1 : 1);
  });
}

function indexThreads(){
  THREADS = {};
  byDate(true).forEach(function(b){
    const labels = b.threads || {};
    /* notizie e voci AI: un filo puo' passare dall'una all'altra sezione
       (Muse di Meta e' nata nella scheda AI ed e' arrivata fra le notizie) */
    (b.news || []).map(function(n){ return [n, "news"]; })
      .concat((b.ai || []).map(function(a){ return [a, "ai"]; }))
      .forEach(function(pair){
      const n = pair[0], section = pair[1];
      if(!n.thread) return;
      let t = THREADS[n.thread];
      if(!t) t = THREADS[n.thread] = {slug:n.thread, label:n.thread, note:"", episodes:[]};
      /* l'etichetta piu' recente vince: se la rinomini, l'archivio si adegua */
      const lab = labels[n.thread];
      if(lab && !t.named){
        t.label = (typeof lab === "string") ? lab : (lab.label || n.thread);
        t.note = (typeof lab === "string") ? "" : (lab.note || "");
        t.named = true;
      }
      t.episodes.push({date:b.date, brief:b, news:n, section:section});
    });
  });
  Object.keys(THREADS).forEach(function(s){
    THREADS[s].episodes.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  });
}

const VERDICTS = ["confermato", "parziale", "smentito", "scaduto", "aperto"];

const SOURCE_ALIASES = {
  "gurman":"Mark Gurman (Bloomberg)", "mark gurman":"Mark Gurman (Bloomberg)",
  "bloomberg":"Mark Gurman (Bloomberg)", "kuo":"Ming-Chi Kuo",
  "ming-chi kuo":"Ming-Chi Kuo", "ross young":"Ross Young",
  "counterpoint":"Counterpoint Research", "idc":"IDC",
  "digitimes":"Digitimes", "etnews":"ETNews"
};

/* "9to5Mac (stime di analisti)" e "9to5Mac" sono la stessa fonte;
   "Mark Gurman (Bloomberg)" no: la maiuscola distingue l'editore
   dalla precisazione. */
function canonSource(s){
  let out = String(s || "ignota").replace(/\s+/g, " ").trim();
  const m = out.match(/^(.*?)\s*\(([^)]*)\)$/);
  if(m && m[2] && m[2][0] === m[2][0].toLowerCase() && m[2][0] !== m[2][0].toUpperCase()){
    out = m[1].trim();
  }
  return SOURCE_ALIASES[out.toLowerCase()] || out;
}

function indexClaims(){
  const opened = {}, closed = {};
  byDate(false).forEach(function(b){
    (b.news || []).forEach(function(n){
      if(n.claim && n.claim.id && !opened[n.claim.id]){
        opened[n.claim.id] = {
          id:n.claim.id, text:n.claim.text || "", horizon:n.claim.horizon || "",
          source:canonSource(n.claim.source || (n.sources || [])[0]),
          date:b.date, brief:b, news:n
        };
      }
      (n.resolves || []).forEach(function(r){
        if(r && r.claim) closed[r.claim] = {
          verdict:r.verdict, note:r.note || "", date:b.date, brief:b, news:n
        };
      });
    });
  });
  const today = localDay(new Date());
  CLAIMS = Object.keys(opened).map(function(id){
    const c = opened[id], res = closed[id];
    if(res && VERDICTS.indexOf(res.verdict) >= 0 && res.verdict !== "aperto"){
      c.state = res.verdict; c.res = res;
    } else if(c.horizon && c.horizon.slice(0, 10) < today){
      c.state = "scaduto";
    } else {
      c.state = "aperto";
    }
    c.left = c.horizon ? Math.round((new Date(c.horizon.slice(0,10) + "T12:00:00") - new Date()) / 86400000) : null;
    return c;
  });
  CLAIMS.sort(function(a, b){ return (a.horizon || "9999") < (b.horizon || "9999") ? -1 : 1; });
}

function claimById(id){
  for(let i = 0; i < CLAIMS.length; i++){ if(CLAIMS[i].id === id) return CLAIMS[i]; }
  return null;
}

/* ================= i numeri che si muovono ================= */
let FACTS = {};   /* chiave -> letture in ordine di data */

const UNIT_FMT = {
  "USD":["$",""], "EUR":[""," €"], "%":["","%"], "mAh":[""," mAh"],
  "mm":[""," mm"], "g":[""," g"], "pollici":["","”"],
  "milioni":[""," mln"], "miliardi":[""," mld"], "":["",""]
};
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;

function isDateVal(v){ return typeof v === "string" && ISO_DATE.test(v); }

function fmtVal(value, unit){
  if(isDateVal(value)) return fmtShort(value);
  const u = UNIT_FMT[unit || ""] || ["", " " + (unit || "")];
  if(typeof value !== "number") return (u[0] + value + u[1]).trim();
  /* Separatori italiani scritti a mano: toLocaleString("it-IT") non raggruppa
     i numeri di quattro cifre (1299 resta 1299) e non coinciderebbe con quello
     che stampa facts.py sul terminale. */
  const neg = value < 0;
  const parts = String(Math.round(Math.abs(value) * 100) / 100).split(".");
  const body = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".")
             + (parts[1] ? "," + parts[1] : "");
  return ((neg ? "-" : "") + u[0] + body + u[1]).trim();
}

function indexFacts(){
  FACTS = {};
  byDate(false).forEach(function(b){
    (b.news || []).forEach(function(n){
      (n.facts || []).forEach(function(f){
        if(!f || !f.key) return;
        (FACTS[f.key] || (FACTS[f.key] = [])).push({
          key:f.key, label:f.label || f.key, unit:f.unit || "",
          value:f.value, kind:f.kind || "stima", source:f.source || "",
          date:b.date, brief:b, news:n
        });
      });
    });
  });
  Object.keys(FACTS).forEach(function(k){
    FACTS[k].sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  });
}

/* Di quanto si è mossa una serie: testo e verso. */
function factDelta(a, b){
  if(isDateVal(a.value) && isDateVal(b.value)){
    const days = Math.round((new Date(b.value + "T12:00:00") - new Date(a.value + "T12:00:00")) / 86400000);
    if(!days) return {text:"ferma", dir:0};
    return {text:(days > 0 ? "slittata di " : "anticipata di ") + Math.abs(days) + " giorni",
            dir:days > 0 ? 1 : -1};
  }
  const x = Number(a.value), y = Number(b.value);
  if(!isFinite(x) || !isFinite(y)) return {text:"", dir:0};
  if(x === y) return {text:"stabile", dir:0};
  const diff = y - x;
  const pct = x ? Math.round(100 * diff / Math.abs(x)) : null;
  return {text:(diff > 0 ? "+" : "") + fmtVal(diff, a.unit) + (pct !== null ? " (" + (pct > 0 ? "+" : "") + pct + "%)" : ""),
          dir:diff > 0 ? 1 : -1};
}

/* Il blocco dei numeri: una riga per metrica, con la storia se ce l'ha. */
function numbersNode(facts, title){
  const keys = [];
  (facts || []).forEach(function(f){ if(f && f.key && keys.indexOf(f.key) < 0) keys.push(f.key); });
  if(!keys.length) return null;

  const box = el("div", {class:"numbers"}, [el("span", {class:"lbl", text:title || "I numeri"})]);
  keys.forEach(function(k){
    const series = FACTS[k] || [];
    if(!series.length) return;
    const last = series[series.length - 1];
    const row = el("div", {class:"num-row"}, [
      el("div", {class:"num-head"}, [
        el("span", {class:"lab", text:last.label}),
        el("span", {class:"val", text:fmtVal(last.value, last.unit)}),
        el("span", {class:"kind k-" + last.kind, text:last.kind})
      ])
    ]);
    if(series.length > 1){
      const hist = el("div", {class:"hist"});
      series.slice(0, -1).forEach(function(r){
        hist.appendChild(el("span", {class:"past", text:fmtVal(r.value, r.unit)}));
        hist.appendChild(el("span", {class:"when", text:fmtShort(r.date)}));
      });
      const d = factDelta(series[0], last);
      hist.appendChild(el("span", {
        class:"move " + (d.dir > 0 ? "up" : d.dir < 0 ? "down" : "flat"),
        text:(d.dir > 0 ? "↑ " : d.dir < 0 ? "↓ " : "= ") + d.text
      }));
      hist.appendChild(el("span", {text:"su " + series.length + " letture"}));
      row.appendChild(hist);
    } else if(last.source){
      row.appendChild(el("div", {class:"hist"}, [el("span", {text:last.source})]));
    }
    box.appendChild(row);
  });
  return box.childNodes.length > 1 ? box : null;
}

/* La notizia dentro l'edizione, non altrove: lo stesso identificativo esiste

function storyEl(id){

/* Porta la vista sulla notizia e la apre — *solo* apre. Un .click() secco sul
   titolo e' un interruttore: chiamato su una notizia gia' aperta la chiudeva,
   ed e' quello che succedeva arrivandoci dal sommario o dalla ricerca. */
function openStory(id, block){
  const t = storyEl(id);
  if(!t) return null;
  if(magazine()){ Sheet.open(t); return t; }
  t.scrollIntoView({behavior:(block === "start" ? "smooth" : "auto"),
                    block:block || "center"});
  const head = t.querySelector(".story-head");
  const body = t.querySelector(".story-body");

  return t;

/* Apre una puntata di un filo dove sta davvero: nell'edizione se e' una
   notizia, nella scheda AI di quel giorno se e' una voce AI. */
function openEpisode(ep){
  if(!ep) return;
  if(ep.section === "ai"){
    currentDate = ep.date;
    show("ai");
    setTimeout(function(){
      const t = document.getElementById("a-" + ep.news.id);
      if(!t) return;
      t.scrollIntoView({block:"center"});
      const row = t.querySelector(".row");
      const body = t.querySelector(".body");
      if(row && body && body.hidden) row.click();
    }, 40);
    return;
  }
  jumpTo(ep.date, ep.news.id);
}

/* L'ultima puntata uscita in un giorno *prima* di questo, se la voce sta in
   un filo: {ep, thread} o null. Le puntate dello stesso giorno si leggono
   gia' insieme, "segue da oggi" non direbbe niente. */
function prevEpisode(date, item){
  const thread = item && item.thread ? THREADS[item.thread] : null;
  if(!thread) return null;
  const before = thread.episodes.filter(function(e){ return e.date < date; });
  return before.length ? {ep:before[before.length - 1], thread:thread} : null;
}

/* La riga "segue": dice da quando, e cosa si era detto. Tocca e vai. */
function segueNode(date, item){
  const p = prevEpisode(date, item);
  if(!p) return null;
  /* la sezione si dice solo quando cambia: una voce AI che segue una notizia */
  const where = p.ep.section === "news" ? " · dalle notizie" : "";
  return el("button", {type:"button", class:"segue", title:"Il filo: " + p.thread.label,
    onclick:function(ev){ ev.stopPropagation(); openEpisode(p.ep); }}, [
    el("b", {text:"Segue · " + fmtAgo(p.ep.date, date) + where}),
    el("span", {text:p.ep.news.title})
  ]);
}

/* Porta la vista sulla notizia, cambiando edizione se serve. */
function jumpTo(date, id){
  currentDate = date;
  renderEdition();
  show("oggi");
  setTimeout(function(){ openStory(id); }, 40);
}

/* ================= campo di pallini =================
   Il campo si ridisegna a ogni cambio di edizione, di scheda e di tema. Ogni
   passaggio registrava il suo ascoltatore di ridimensionamento senza togliere
   il precedente: dopo una mattinata di navigazione erano decine, tutti attaccati
   a una tela ormai staccata dalla pagina. Ne resta uno solo, e a cambiarlo e'
   l'ultimo campo acceso — che e' anche l'unico visibile. */
let dotLive = null;

function dotfield(canvas){
  if(!canvas) return;
  if(dotLive){ dotLive.stop(); dotLive = null; }
  const ctx = canvas.getContext("2d");
  const still = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const css = getComputedStyle(document.documentElement);
  const palette = ["--red","--yellow","--blue","--orange"].map(function(v){ return css.getPropertyValue(v).trim(); });
  let dots = [], raf = null, t0 = 0;

  function layout(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if(!w || !h) return;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const step = 19, r = 5.4;
    dots = [];
    for(let y = step/2; y < h; y += step){
      for(let x = step/2; x < w; x += step){
        if(Math.random() < 0.30 + 0.55 * (1 - x / w)){
          dots.push({x:x, y:y, r:r, c:palette[(Math.random()*palette.length)|0], d:(x/w)*520 + Math.random()*260});
        }
      }
    }
  }
  function draw(now){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    let done = true;
    for(let i = 0; i < dots.length; i++){
      const p = dots[i];
      let k = still ? 1 : (now - t0 - p.d) / 460;
      if(k < 0){ k = 0; done = false; } else if(k < 1){ done = false; } else k = 1;
      if(k <= 0) continue;
      const e = 1 - Math.pow(1 - k, 3);
      ctx.globalAlpha = e;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * e, 0, 6.2832);
      ctx.fillStyle = p.c;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if(!done) raf = requestAnimationFrame(draw);
  }
  layout(); t0 = performance.now();
  raf = requestAnimationFrame(draw);

  /* stop() legge "raf" dalla chiusura invece di una copia: draw() lo riassegna
     a ogni fotogramma, e una copia presa qui sarebbe gia' vecchia al primo. */
  const live = {timer:null, onResize:null, stop:function(){
    window.removeEventListener("resize", live.onResize);
    clearTimeout(live.timer);
    cancelAnimationFrame(raf);
  }};
  live.onResize = function(){
    clearTimeout(live.timer);
    live.timer = setTimeout(function(){
      layout(); t0 = performance.now() - 2000;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(draw);
    }, 180);
  };
  window.addEventListener("resize", live.onResize);
  dotLive = live;
}

/* Il pannello degli appunti: testo, link allegati, invio al diario. Era dentro

  const panel = el("div", {class:"workspace", hidden:"hidden"});

    placeholder:"Cosa ti serve ricordare — un'idea, un angolo da approfondire, un follow-up."});
  ta.value = (mk(k) && mk(k).note) || "";
  const flag = el("span", {class:"saved-flag", text:""});

  ta.addEventListener("input", function(){
    mark(k).note = ta.value;
    touched(k); onPaint();
    flag.textContent = "salvato";
    clearTimeout(ta._t); ta._t = setTimeout(function(){ flag.textContent = ""; }, 1400);
  });

  const linkList = el("ul", {class:"saved-links"});
  function paintLinks(){
    linkList.innerHTML = "";
    ((mk(k) && mk(k).links) || []).forEach(function(l, i){
      /* l'indirizzo si ricontrolla qui e non solo in scrittura: questi appunti
         arrivano anche da un file importato e dalla sincronizzazione, e un
         "javascript:" salvato altrove diventerebbe un bottone da premere */
      const lu = safeUrl(l && l.url);
      linkList.appendChild(el("li", {}, [
        lu ? el("a", {href:lu, target:"_blank", rel:"noopener noreferrer", text:(l.label || lu)})
           : el("span", {class:"broken", text:(l && l.label) || "indirizzo non valido"}),
        el("button", {class:"kill", type:"button", title:"Rimuovi", text:"✕", onclick:function(){
          mark(k).links.splice(i, 1); touched(k); paintLinks(); onPaint();
        }})
      ]));
    });
  }
  paintLinks();

  const urlIn = el("input", {type:"url", placeholder:"https:// video, articolo, thread…"});
  const labIn = el("input", {type:"text", placeholder:"etichetta (facoltativa)"});
  const addBtn = el("button", {class:"btn ghost", type:"button", text:"Aggiungi", onclick:function(){
    const u = safeUrl(urlIn.value);
    if(!u){ toast("Serve un indirizzo che inizi con http:// o https://"); return; }
    const m = mark(k);
    if(!m.links) m.links = [];
    m.links.push({url:u, label:labIn.value.trim() || u.replace(/^https?:\/\//,"").split("/")[0]});
    urlIn.value = ""; labIn.value = "";
    touched(k); paintLinks(); onPaint();
  }});

  const diaryBtn = el("button", {class:"btn ghost", type:"button", text:"Manda al diario", onclick:function(){
    const txt = (ta.value || "").trim();
    if(!txt){ toast("Scrivi prima un appunto"); return; }
    addDiary({text:txt, tags:["Da una notizia"], ref:ref});
    toast("Aggiunto al diario");
  }});

  panel.appendChild(ta);
  panel.appendChild(el("div", {class:"linkrow"}, [urlIn, labIn, addBtn]));
  panel.appendChild(linkList);
  panel.appendChild(el("div", {class:"linkrow"}, [diaryBtn, flag]));
  panel.focusNote = function(){ ta.focus(); };
  return panel;
}

function itemTools(k, opts){
  opts = opts || {};
  const bar = el("div", {class:"tools"});
  const star = toolBtn("t-star", "Salva", I_STAR);
  const note = toolBtn("t-note", "Appunti", I_PEN);
  /* resta solo il pollice giu': il resto lo dicono i segnali di lettura */
  const down = toolBtn("t-down vote", "Non mi interessa", I_THUMB);
  const panel = notesPanel(k, opts.ref, paintNote);

  function paintStar(){
    const on = !!(mk(k) && mk(k).starred_at);
    star.classList.toggle("on", on);
    star.setAttribute("aria-pressed", on ? "true" : "false");
    star.title = on ? "Salvata — togli" : "Salva";
  }
  function paintNote(){
    const m = mk(k);
    const n = (m && m.links ? m.links.length : 0);
    const on = !!(m && ((m.note || "").trim() || n));
    note.classList.toggle("on", on);
    note.setAttribute("data-count", n > 0 ? String(n) : "");
  }
  function paintVote(){
    const v = (mk(k) && mk(k).vote) || 0;
    down.classList.toggle("on", v < 0);
    down.setAttribute("aria-pressed", v < 0 ? "true" : "false");
  }

  star.addEventListener("click", function(ev){
    ev.stopPropagation();
    const m = mark(k);
    m.starred_at = m.starred_at ? null : new Date().toISOString();
    paintStar(); touched(k); refreshCounts();
    if(m.starred_at){ Motion.burst(star); if(magazine()) Motion.fly(star); }
    toast(magazine() ? (m.starred_at ? "Da leggere più tardi" : "Tolta da Più tardi") : (m.starred_at ? "Salvata" : "Tolta dai salvati"));
  });
  note.addEventListener("click", function(ev){
    ev.stopPropagation();
    panel.hidden = !panel.hidden;
    if(!panel.hidden){
      if(opts.onNote) opts.onNote();
      panel.focusNote();
    }
  });
  function vota(v){
    const m = mark(k);
    m.vote = (m.vote === v) ? 0 : v;
    paintVote(); touched(k);
    toast(m.vote < 0 ? "Segnato: non mi interessa" : "Tolto");
  }
  down.addEventListener("click", function(ev){ ev.stopPropagation(); vota(-1); });

  paintStar(); paintNote(); paintVote();
  bar.setAttribute("data-sig", k);
  bar.appendChild(star); bar.appendChild(note); bar.appendChild(down);
  return {bar:bar, panel:panel};
}

/* Quanto gira la notizia (1 novembre 2026). Mike non leggeva l'elenco dei
   nomi delle testate ne' i titoli dei link in piu': gli interessa quante, per
   capire se e' una voce isolata o la ripetono tutti, e chi l'ha detta per
   primo. Il conto viene da verify.py (testate, origini, primo); per le
   edizioni vecchie, dalle fonti e dai link della notizia.

   Una testata che non dice da dove viene non e' sospetta — spesso e' la fonte
   di se stessa — quindi «origine non dichiarata» non si scrive mai. */
const OFFICIAL_ORIGINS = ["Apple", "documenti SEC", "atti giudiziari", "Commissione europea"];
function echoNode(n){
  const v = n.verifica || {};
  const count = v.testate || Math.max((n.sources || []).length, 1 + (n.extra_links || []).length);
  const indip = (v.origini || []).filter(function(o){ return OFFICIAL_ORIGINS.indexOf(o) < 0; });
  let label, tone = "ink";
  if(v.ufficiale && n.tag !== "RUMOR"){ label = "C'è la parola di Apple"; tone = "blue"; }
  else if(count <= 1){ label = n.tag === "RUMOR" ? "Una voce sola" : "Una testata sola"; if(n.tag === "RUMOR") tone = "yellow"; }
  else if(count <= 3) label = count + " testate";
  else if(count <= 7) label = "Ripresa da " + count + " testate";
  else label = "Ne parlano tutti · " + count + " testate";
  if(v.ufficiale && n.tag !== "RUMOR" && count > 1) label += " · " + count + " testate";

  let origin = "";
  if(n.origine){ if(n.origine !== (n.sources || [])[0]) origin = "All'origine: " + n.origine; }
  else if(indip.length >= 2) origin = "Fonti indipendenti: " + indip.slice(0, 3).join(", ");
  else if(indip.length === 1) origin = "All'origine: " + indip[0];
  else if(v.primo && v.primo.testata && count > 1){
    const t = v.primo.ora ? new Date(v.primo.ora) : null;
    origin = "Prima a darla: " + v.primo.testata + (t && !isNaN(t) ? ", " + fmtShort(t.toISOString().slice(0, 10)).replace(/ \d{4}$/, "") +
      " alle " + t.toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"}) : "");
  }

  /* dieci caselle: quante si accendono dice la rarita' a colpo d'occhio */
  const meter = el("span", {class:"echo-meter t-" + tone, "aria-hidden":"true"});
  for(let i = 0; i < 10; i++) meter.appendChild(el("i", {class:i < count ? "on" : ""}));
  if(count > 10) meter.appendChild(el("em", {text:"+"}));
  Motion.stagger(meter.children);
  Motion.once(meter, "fill");

  const primary = safeUrl(n.link);
  const name = (n.sources || [])[0];
  return el("div", {class:"echo"}, [
    meter,
    el("div", {class:"echo-txt"}, [el("b", {text:label}), origin ? el("span", {text:origin}) : null]),
    primary ? el("a", {class:"echo-read", href:primary, target:"_blank", rel:"noopener noreferrer",
      text:(name ? "Leggi su " + name : "Leggi l'articolo") + " →"}) : null
  ]);
}

/* ================= tutte le novita' =================
   Quando Apple rilascia un sistema (beta o finale) Mike vuole sapere tutto
   quello che cambia, non quattro notizie sparse (5 novembre 2026). La notizia
   del rilascio porta «novita»: [{sistema, area, cosa, dettaglio, fonte, link}].
   Qui diventa un elenco dentro la notizia aperta, fra la descrizione e
   l'approfondimento: per sistema, col pallino del suo colore, poi per area.
   Oltre le dodici voci se ne vedono otto e il resto sta dietro «Mostra tutte». */
const NOV_SHOW = 8, NOV_FOLD = 12;
function novFamily(s){
  const t = String(s || "").toLowerCase().replace(/\s+/g, "");
  const fams = [["ios", "blue"], ["ipados", "orange"], ["macos", "red"], ["watchos", "yellow"],
                ["visionos", "ink"], ["tvos", "ink"], ["homepod", "ink"], ["xcode", "ink"]];
  for(let i = 0; i < fams.length; i++) if(t.indexOf(fams[i][0]) === 0) return {rank:i, color:fams[i][1]};
  return {rank:fams.length, color:"ink-3"};
}
/* «iOS · iPadOS · macOS 27.3 beta 1» invece di ripetere la versione a ogni nome */
function novOf(systems){
  const parts = systems.map(function(s){ const m = s.name.match(/^(\S+)\s*(.*)$/); return m ? [m[1], m[2]] : [s.name, ""]; });
  const rest = parts[0][1];
  if(rest && parts.every(function(p){ return p[1] === rest; }))
    return parts.map(function(p){ return p[0]; }).join(" · ") + " " + rest;
  return systems.map(function(s){ return s.name; }).join(" · ");
}
function novitaNode(n){
  const all = (n.novita || []).filter(function(v){ return v && v.cosa; });
  if(!all.length) return null;
  /* i gruppi: sistema nell'ordine di famiglia (iOS, iPadOS, macOS…), dentro
     le aree nell'ordine in cui la corsa le ha scritte */
  const systems = [];
  all.forEach(function(v, i){
    const name = String(v.sistema || "Altro").trim();
    let s = systems.find(function(x){ return x.name === name; });
    if(!s){ s = {name:name, fam:novFamily(name), first:i, areas:[]}; systems.push(s); }
    const an = String(v.area || "Generale").trim();
    let a = s.areas.find(function(x){ return x.name === an; });
    if(!a){ a = {name:an, items:[]}; s.areas.push(a); }
    a.items.push(v);
  });
  systems.sort(function(a, b){ return a.fam.rank - b.fam.rank || a.first - b.first; });

  const fold = all.length > NOV_FOLD;
  let shown = 0;
  const meter = el("span", {class:"nov-meter", "aria-hidden":"true"});
  const blocks = systems.map(function(s){
    const count = s.areas.reduce(function(t, a){ return t + a.items.length; }, 0);
    const dot = el("i", {class:"on"}); dot.style.setProperty("--c", "var(--" + s.fam.color + ")");
    meter.appendChild(dot);
    const pip = el("i", {class:"nov-pip"}); pip.style.setProperty("--c", "var(--" + s.fam.color + ")");
    const sys = el("div", {class:"nov-sys"}, [
      el("h5", {class:"nov-sys-h"}, [pip, el("span", {text:s.name}), el("b", {text:String(count)})])
    ]);
    let sysVisible = false;
    s.areas.forEach(function(a){
      const list = el("ul", {class:"nov-list"});
      let areaVisible = false;
      a.items.forEach(function(v){
        const extra = fold && shown >= NOV_SHOW;
        shown++;
        if(!extra) areaVisible = true;
        const href = safeUrl(v.link);
        list.appendChild(el("li", {class:"nov-item" + (extra ? " nov-extra" : "")}, [
          el("span", {class:"nov-cosa", text:v.cosa}),
          v.dettaglio ? el("span", {class:"nov-det", text:v.dettaglio}) : null,
          v.fonte ? (href ? el("a", {class:"nov-src", href:href, target:"_blank", rel:"noopener noreferrer", text:v.fonte})
                          : el("span", {class:"nov-src", text:v.fonte})) : null
        ]));
      });
      if(areaVisible) sysVisible = true;
      sys.appendChild(el("div", {class:"nov-area" + (areaVisible ? "" : " nov-extra")}, [
        el("h6", {class:"nov-area-h", text:a.name}), list
      ]));
    });
    if(!sysVisible) sys.classList.add("nov-extra");
    return sys;
  });
  Motion.stagger(meter.children);
  Motion.once(meter, "fill");

  const box = el("section", {class:"novita" + (fold ? " is-short" : ""), "aria-label":"Tutte le novità"}, [
    el("header", {class:"nov-head"}, [
      el("b", {class:"nov-n", text:String(all.length)}),
      el("div", {class:"nov-title"}, [
        el("h4", {class:"nov-h", text:"Tutte le novità"}),
        el("span", {class:"nov-of", text:novOf(systems)})
      ]),
      meter
    ])
  ].concat(blocks));
  if(fold){
    const more = el("button", {type:"button", class:"nov-more", text:"Mostra tutte (" + all.length + ")"});
    more.addEventListener("click", function(ev){
      ev.stopPropagation();
      const open = box.classList.toggle("is-short") === false;
      more.textContent = open ? "Mostra meno" : "Mostra tutte (" + all.length + ")";
      if(!open) box.scrollIntoView({block:"start"});
    });
    box.appendChild(more);
  }
  return box;
}

/* ================= notizia ================= */
/* ================= approfondimento =================
   Il pezzo lungo che la corsa del mattino scrive per le prime cinque notizie.
   La parte di testo e' dati (punto, sotto, tappe, fonti, dopo, approfondire).
   Le visualizzazioni invece sono codice, e stanno *qui*: l'edizione dice solo
   quale usare e con quali numeri ("visivi": [{"tipo": "resa", ...}]). Cosi'
   dal database non arriva mai codice da eseguire, e ogni visualizzazione
   costruita una volta resta nel kit per tutte le mattine dopo. */

const STILL = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function cssv(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function tone(c){ return cssv("--" + (c || "blue")) || c; }
/* per i colori messi nello stile degli elementi: un riferimento alla variabile,
   non il valore di adesso, cosi' seguono il cambio di tema */
function toneVar(c){ c = c || "blue"; return /^[a-z][a-z0-9-]*$/.test(c) ? "var(--" + c + ", " + c + ")" : c; }
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, kids){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in (attrs || {})){ if(attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]); }
  (kids || []).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}
function svText(x, y, txt, attrs){ const t = sv("text", Object.assign({x:x, y:y}, attrs || {})); t.textContent = txt; return t; }

/* "2025-04" -> "apr 2025", "2026-09-30" -> "30 set 2026" */
function fmtDeepDate(d){
  d = String(d || "");
  if(/^\d{4}-\d{2}$/.test(d)) return MESI[+d.slice(5,7) - 1].slice(0,3) + " " + d.slice(0,4);
  return fmtShort(d);
}
function spokenDate(d){
  d = String(d || "");
  if(/^\d{4}-\d{2}$/.test(d)) return MESI[+d.slice(5,7) - 1] + " " + d.slice(0,4);
  const x = new Date(d.slice(0,10) + "T12:00:00");
  return isNaN(x) ? d : x.getDate() + " " + MESI[x.getMonth()];
}
function daysUntil(d, ref){
  const a = new Date(String(d).slice(0,10) + "T12:00:00"), b = new Date(String(ref).slice(0,10) + "T12:00:00");
  return (isNaN(a) || isNaN(b)) ? null : Math.round((a - b) / 86400000);
}

/* Parte quando la visualizzazione entra nello schermo, una volta sola: le
   animazioni viste a pannello chiuso sarebbero sprecate. */
function whenSeen(node, fn){
  if(!("IntersectionObserver" in window)){ setTimeout(fn, 60); return; }
  const io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ io.disconnect(); fn(); } });
  }, {threshold:.35});
  io.observe(node);
}

/* ================= le chicche =================
   Piccoli movimenti che fanno sembrare la rassegna viva (1 novembre 2026:
   Mike ha visto i pallini della prima pagina e il sottopancia, e li vuole
   «qua e la' in tutto l'editoriale, senza che risultino troppo»). Un
   linguaggio solo, preso dalla sigla: le cose entrano da sinistra come una
   banda (wipe), si accendono come i pallini (pop), o salgono di poco (rise).
   Ognuna parte una volta, quando arriva a schermo, e dura meno di un
   secondo. Con «Riduci movimento» non parte niente e tutto e' gia' al suo
   posto: le classi non si mettono nemmeno. */
const Motion = (function(){
  /* basta che se ne veda un pezzo: con la soglia piu' alta di whenSeen un
     elemento attraversato in fretta poteva restare in attesa */
  /* Parte quando l'elemento ha superato un margine dal basso: nell'ultimo
     terzo dello schermo e' appena spuntato, e chi scorre piano leggendo se lo
     perdeva — quando ci arrivava con gli occhi era gia' finito (Mike, 2 novembre
     2026). Le cose in fondo alla pagina, che a quell'altezza non salgono mai,
     partono quando si arriva in fondo: alla pagina o alla notizia aperta. */
  const pending = new Map();
  const io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      const fn = pending.get(e.target);
      io.unobserve(e.target); pending.delete(e.target);
      if(fn) fn();
    });
  }, {rootMargin:"0px 0px -30% 0px", threshold:0}) : null;
  function atEnd(ev){
    if(!pending.size) return;
    const t = ev && ev.target && ev.target.nodeType === 1 ? ev.target : document.scrollingElement;
    if(!t || t.scrollTop + t.clientHeight < t.scrollHeight - 40) return;
    pending.forEach(function(fn, node){
      const r = node.getBoundingClientRect();
      if(r.top < window.innerHeight && r.bottom > 0){ io.unobserve(node); pending.delete(node); fn(); }
    });
  }
  document.addEventListener("scroll", atEnd, {passive:true, capture:true});
  function seen(node, fn){
    if(!io){ setTimeout(fn, 60); return; }
    pending.set(node, fn);
    io.observe(node);
  }
  function once(node, kind){
    if(STILL || !node || node.classList.contains("mo")) return node;
    node.classList.add("mo", "mo-" + kind);
    seen(node, function(){ node.classList.add("mo-in"); });
    return node;
  }
  /* i figli in fila, uno dopo l'altro */
  function stagger(nodes){
    Array.prototype.forEach.call(nodes, function(n, i){ n.style.setProperty("--mo-i", i); });
  }
  /* un numero che conta da zero fino al suo valore: «+550%», «2.899 $»,
     «1,5 mln». Se dopo il numero ce n'e' un altro («15 → 66 $») si lascia stare. */
  function count(b){
    if(STILL || !b) return;
    const txt = b.textContent, m = txt.match(/^([^\d]*)(\d[\d.]*(?:,\d+)?)(\D*)$/);
    if(!m) return;
    const dec = m[2].indexOf(",") >= 0 ? m[2].split(",")[1].length : 0;
    const to = parseFloat(m[2].replace(/\./g, "").replace(",", "."));
    if(!(to > 0)) return;
    const fmt = function(v){ return m[1] + v.toLocaleString("it-IT", {minimumFractionDigits:dec, maximumFractionDigits:dec}) + m[3]; };
    /* il valore vero resta scritto finche' non si vede: se l'osservatore non
       scatta mai, si legge il numero giusto, non uno zero */
    seen(b, function(){
      const t0 = performance.now(), dur = 900;
      (function step(now){
        const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        b.textContent = k < 1 ? fmt(dec ? to * e : Math.round(to * e)) : txt;
        if(k < 1) requestAnimationFrame(step);
      })(t0);
      /* se i fotogrammi si fermano (app in secondo piano) il numero vero arriva comunque */
      setTimeout(function(){ b.textContent = txt; }, dur + 200);
    });
  }
  /* il pannello che cambia notizia: il contenuto nuovo sale al suo posto */
  function swap(node){
    if(STILL || !node) return;
    node.classList.remove("mo-swap"); void node.offsetWidth; node.classList.add("mo-swap");
  }
  /* salvare: uno scoppio di pallini nei quattro colori */
  function burst(btn){
    if(STILL || !btn) return;
    const b = el("span", {class:"burst", "aria-hidden":"true"});
    ["--red", "--yellow", "--blue", "--orange", "--red", "--yellow", "--blue", "--orange"].forEach(function(c, i){
      const d = el("i"); d.style.background = "var(" + c + ")"; d.style.setProperty("--a", (i * 45) + "deg"); b.appendChild(d);
    });
    btn.appendChild(b);
    setTimeout(function(){ b.remove(); }, 700);
  }
  /* quello che entra in una vista: titoli di sezione e foto */
  function scan(root){
    if(STILL || !root) return;
    Array.prototype.forEach.call(root.querySelectorAll(".section-head"), function(h){ once(h, "head"); });
    Array.prototype.forEach.call(root.querySelectorAll("img"), function(i, n){
      once(i, "img");
      /* ogni foto respira col suo passo, non tutte insieme */
      i.style.setProperty("--kb", (-Math.random() * 24).toFixed(1) + "s");
      i.style.setProperty("--kbo", ["60% 40%", "35% 60%", "50% 30%", "70% 65%"][n % 4]);
    });
  }
  /* salvare per dopo: una stellina parte dal pulsante e vola fino alla pillola
     «Più tardi», che fa un piccolo sobbalzo all'arrivo */
  function fly(from){
    if(STILL || !from) return;
    const to = document.querySelector(".tab-dopo");
    const a = from.getBoundingClientRect(), b = to ? to.getBoundingClientRect() : null;
    if(!a.width || !b || !b.width) return;
    const s = el("span", {class:"fly-star", "aria-hidden":"true", text:"★"});
    s.style.left = (a.left + a.width / 2 - 9) + "px";
    s.style.top = (a.top + a.height / 2 - 9) + "px";
    document.body.appendChild(s);
    const dx = (b.left + 16) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    const anim = s.animate([
      {transform:"translate(0,0) scale(1)", opacity:1},
      {transform:"translate(" + dx * .5 + "px," + (dy * .5 - 60) + "px) scale(1.6)", opacity:1, offset:.45},
      {transform:"translate(" + dx + "px," + dy + "px) scale(.6)", opacity:.9}
    ], {duration:720, easing:"cubic-bezier(.4,0,.2,1)"});
    anim.onfinish = function(){
      s.remove();
      to.classList.remove("bump"); void to.offsetWidth; to.classList.add("bump");
    };
  }
  /* il vento: scorrendo la pagina i foglietti «Al banco» ondeggiano e l'angolo si
     solleva, poi tornano fermi. La velocita' dello scorrimento si scrive in --wind
     sulla sola lista del banco, cosi' il ricalcolo resta li' dentro */
  let windEl = null, windV = 0, windRaf = null, lastY = 0, lastT = 0;
  function windTick(){
    windV *= .88;
    if(windEl) windEl.style.setProperty("--wind", windV.toFixed(3));
    windRaf = Math.abs(windV) > .01 ? requestAnimationFrame(windTick) : null;
    if(!windRaf && windEl) windEl.style.setProperty("--wind", "0");
  }
  if(!STILL) window.addEventListener("scroll", function(){
    const now = performance.now(), dy = window.scrollY - lastY, dt = Math.max(16, now - lastT);
    lastY = window.scrollY; lastT = now;
    if(!windEl || !windEl.isConnected) return;
    windV = windV * .6 + Math.max(-1, Math.min(1, dy / dt / 2.2)) * .4;
    windEl.style.setProperty("--wind", windV.toFixed(3));
    if(!windRaf) windRaf = requestAnimationFrame(windTick);
  }, {passive:true});
  function wind(node){ if(!STILL) windEl = node; }
  return {once:once, stagger:stagger, count:count, swap:swap, burst:burst, scan:scan, fly:fly, wind:wind};
})();

/* Un'animazione che gira solo mentre si vede. Fuori schermo si ferma e
   riparte al ritorno; quando il nodo esce dalla pagina (l'edizione ridisegnata)
   finisce per sempre, invece di accumularsi a ogni nuovo disegno. Se il passo
   lancia un errore il ciclo non muore: il fotogramma dopo si chiede prima. */
function liveLoop(node, step){
  let vis = false, on = false;
  const io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){
    vis = es[es.length - 1].isIntersecting;
    if(vis && !on){ on = true; requestAnimationFrame(run); }
  }) : null;
  function run(t){
    if(!node.isConnected){ if(io) io.disconnect(); on = false; return; }
    if(!vis){ on = false; return; }
    requestAnimationFrame(run);
    step(t);
  }
  if(io) io.observe(node); else { vis = true; on = true; requestAnimationFrame(run); }
}
/* La tela si ridimensiona con il suo contenitore. ResizeObserver invece di
   window resize: non si accumula e non tiene in vita le edizioni staccate. */
function onResize(node, fn){
  if("ResizeObserver" in window){
    let w = node.clientWidth;
    new ResizeObserver(function(){ if(node.clientWidth !== w){ w = node.clientWidth; fn(); } }).observe(node);
  }
}

/* Un canvas nitido sugli schermi densi, che segue la larghezza del contenitore */
function crispCanvas(canvas, ratio){
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = canvas.clientWidth || canvas.parentNode.clientWidth || 320;
  const h = Math.round(w * ratio);
  canvas.style.height = h + "px";
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return {ctx:ctx, w:w, h:h};
}

function visFrame(v, kind){
  const box = el("figure", {class:"vis vis-" + kind});
  if(v.titolo) box.appendChild(el("figcaption", {class:"vis-title", text:v.titolo}));
  return box;
}
function visCaption(box, v){
  if(v.didascalia) box.appendChild(el("p", {class:"vis-cap", text:v.didascalia}));
  if(v.fonte) box.appendChild(el("p", {class:"vis-src", text:"Fonte: " + v.fonte}));
}
function toggleRow(options, onPick){
  const row = el("div", {class:"vis-toggle", role:"tablist"});
  options.forEach(function(o, i){
    const b = el("button", {type:"button", role:"tab", "aria-selected":i === 0 ? "true" : "false", text:o[1]});
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(row.children, function(x){ x.setAttribute("aria-selected", x === b ? "true" : "false"); });
      onPick(o[0]);
    });
    row.appendChild(b);
  });
  return row;
}

/* ---------- stime: i numeri che si muovono, disegnati ----------
   Le stime come anelli, il dato vero come pallino pieno: si vede a colpo
   d'occhio chi ci aveva preso. Legge dai numeri dell'archivio (chiave) o
   dai punti scritti nell'edizione. */
function visStime(v){
  const box = visFrame(v, "stime");
  let pts = v.punti;
  let unit = v.unita || "";
  if(!pts && v.chiave && FACTS[v.chiave]){
    pts = FACTS[v.chiave].map(function(r){ return {data:r.date, valore:r.value, fonte:r.source, tipo:r.kind}; });
    unit = unit || (FACTS[v.chiave][0] || {}).unit || "";
  }
  pts = (pts || []).filter(function(p){ return typeof p.valore === "number"; });
  if(pts.length < 2){ return null; }
  const W = 640, H = 300, L = 70, R = 28, T = 34, B = 46;
  const ts = pts.map(function(p){ return new Date(p.data + "T12:00:00").getTime(); });
  let t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts);
  if(t0 === t1){ t0 -= 864e5; t1 += 864e5; }
  const span = t1 - t0; t0 -= span * .05; t1 += span * .05;
  const vs = pts.map(function(p){ return p.valore; });
  let v0 = Math.min.apply(null, vs), v1 = Math.max.apply(null, vs);
  const m = (v1 - v0) || Math.abs(v1) * .1 || 1; v0 -= m * .35; v1 += m * .35;
  const X = function(t){ return L + (t - t0) / (t1 - t0) * (W - L - R); };
  const Y = function(x){ return T + (1 - (x - v0) / (v1 - v0)) * (H - T - B); };
  const svg = sv("svg", {viewBox:"0 0 " + W + " " + H, class:"vis-svg", role:"img", "aria-label":v.titolo || "serie di stime"});
  /* tacche su cifre tonde: 2.000, 2.050, 2.100 — non 2.077 */
  const raw = (v1 - v0) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(function(k){ return k * mag; }).filter(function(k){ return k >= raw; })[0] || raw;
  for(let val = Math.ceil(v0 / step) * step; val <= v1; val += step){
    const y = Y(val);
    svg.appendChild(sv("line", {x1:L, x2:W - R, y1:y, y2:y, class:"grid"}));
    svg.appendChild(svText(L - 10, y + 4, fmtVal(Math.round(val * 100) / 100, unit), {class:"ax", "text-anchor":"end"}));
  }
  let d = "";
  pts.forEach(function(p, i){ d += (i ? " L" : "M") + X(ts[i]).toFixed(1) + " " + Y(p.valore).toFixed(1); });
  const path = sv("path", {d:d, class:"line"});
  svg.appendChild(path);
  const tip = svText(L, 18, "Tocca un punto per vedere chi l'ha detto", {class:"tip"});
  svg.appendChild(tip);
  const dots = [];
  pts.forEach(function(p, i){
    const real = p.tipo === "dato";
    const g = sv("g", {class:"pt" + (real ? " real" : ""), tabindex:"0", style:"opacity:0"});
    g.appendChild(sv("circle", {cx:X(ts[i]), cy:Y(p.valore), r:real ? 11 : 8}));
    g.appendChild(svText(X(ts[i]), Y(p.valore) - 17, fmtVal(p.valore, unit), {class:"val", "text-anchor":"middle"}));
    g.appendChild(svText(X(ts[i]), H - B + 22, fmtShort(p.data).replace(/ \d{4}$/, ""), {class:"ax", "text-anchor":"middle"}));
    const show = function(){
      dots.forEach(function(x){ x.classList.remove("sel"); });
      g.classList.add("sel");
      tip.textContent = (real ? "DATO · " : "STIMA · ") + fmtShort(p.data) + " · " + (p.fonte || "");
    };
    g.addEventListener("click", show);
    g.addEventListener("keydown", function(e){ if(e.key === "Enter") show(); });
    dots.push(g); svg.appendChild(g);
  });
  box.appendChild(svg);
  box.appendChild(el("div", {class:"vis-legend"}, [
    el("span", {}, [el("i", {class:"lg ring"}), el("span", {text:"stima"})]),
    el("span", {}, [el("i", {class:"lg full"}), el("span", {text:"dato ufficiale"})])
  ]));
  visCaption(box, v);
  whenSeen(box, function(){
    const len = path.getTotalLength ? path.getTotalLength() : 1000;
    path.style.strokeDasharray = len; path.style.strokeDashoffset = STILL ? 0 : len;
    requestAnimationFrame(function(){ path.style.transition = "stroke-dashoffset 1.6s ease"; path.style.strokeDashoffset = 0; });
    dots.forEach(function(g, i){ setTimeout(function(){ g.style.transition = "opacity .4s"; g.style.opacity = 1; }, STILL ? 0 : 250 + i * 320); });
  });
  return box;
}

/* ---------- barre: le grandezze a confronto ----------
   Forchette vere (min-max), non numeri tondi: la parte piena e' il minimo,
   quella tratteggiata arriva al massimo. */
function visBarre(v){
  const box = visFrame(v, "barre");
  const voci = v.voci || [];
  const top = Math.max.apply(null, voci.map(function(x){ return x.max || x.min || 0; })) || 1;
  const list = el("div", {class:"bars"});
  const fills = [];
  voci.forEach(function(x){
    const lo = x.min || 0, hi = x.max || lo;
    const bar = el("div", {class:"bar-track"});
    const full = el("i", {class:"bar-full"}); full.style.background = toneVar(x.colore);
    const ext = el("i", {class:"bar-ext"}); ext.style.borderColor = toneVar(x.colore);
    bar.appendChild(full); bar.appendChild(ext);
    fills.push([full, ext, lo / top * 100, (hi - lo) / top * 100]);
    list.appendChild(el("div", {class:"bar-row"}, [
      el("div", {class:"bar-head"}, [
        el("span", {class:"bar-label", text:x.etichetta}),
        el("b", {text:(hi > lo ? fmtNum(lo) + "–" + fmtNum(hi) : fmtNum(lo)) + (v.unita ? " " + v.unita : "")})
      ]),
      bar,
      x.nota ? el("span", {class:"bar-note", text:x.nota}) : null
    ]));
  });
  box.appendChild(list);
  visCaption(box, v);
  whenSeen(box, function(){
    fills.forEach(function(f, i){
      setTimeout(function(){
        f[0].style.width = f[2] + "%";
        f[1].style.left = f[2] + "%"; f[1].style.width = f[3] + "%";
      }, STILL ? 0 : 120 + i * 260);
    });
  });
  return box;
}
function fmtNum(x){
  const neg = x < 0, parts = String(Math.round(Math.abs(x) * 100) / 100).split(".");
  return (neg ? "-" : "") + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (parts[1] ? "," + parts[1] : "");
}

/* ---------- resa: la linea di montaggio ----------
   I telefoni escono dal nastro, passano il controllo o finiscono nel cesto.
   Il cursore cambia la resa, e il conto in basso dice quanti ne vanno montati
   per arrivare all'obiettivo. Aritmetica, niente di inventato. */
function visResa(v){
  const box = visFrame(v, "resa");
  const canvas = el("canvas", {class:"vis-canvas", "aria-hidden":"true"});
  box.appendChild(canvas);
  let resa = Math.max(.05, Math.min(.99, v.resa || .6));
  const slider = el("input", {type:"range", min:"30", max:"99", value:String(Math.round(resa * 100)), "aria-label":"resa di assemblaggio"});
  const pct = el("b", {class:"big", text:Math.round(resa * 100) + "%"});
  const counts = el("span", {class:"counts"});
  const need = el("p", {class:"need"});
  box.appendChild(el("div", {class:"vis-controls"}, [
    el("label", {class:"lbl"}, [el("span", {text:"Resa"}), pct]), slider
  ]));
  box.appendChild(counts);
  box.appendChild(need);
  const goal = v.obiettivo || 0;
  let made = 0, good = 0, bad = 0, geo = null;
  const items = [];
  function phone(ctx, x, y, col, mark){
    ctx.fillStyle = col;
    const w = 18, h = 24, r = 4;
    ctx.beginPath();
    ctx.moveTo(x - w/2 + r, y - h/2); ctx.arcTo(x + w/2, y - h/2, x + w/2, y + h/2, r);
    ctx.arcTo(x + w/2, y + h/2, x - w/2, y + h/2, r); ctx.arcTo(x - w/2, y + h/2, x - w/2, y - h/2, r);
    ctx.arcTo(x - w/2, y - h/2, x + w/2, y - h/2, r); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y - h/2 + 3); ctx.lineTo(x, y + h/2 - 3); ctx.stroke();
    if(mark){ ctx.fillStyle = "#fff"; ctx.font = "700 11px system-ui"; ctx.textAlign = "center"; ctx.fillText(mark, x, y + 4); }
  }
  /* senza movimento: dieci telefoni fermi, colorati secondo la resa */
  function drawStill(){
    if(!geo) return;
    geo.ctx.clearRect(0, 0, geo.w, geo.h);
    for(let i = 0; i < 10; i++) phone(geo.ctx, 24 + i * 28, geo.h * .45, i < Math.round(resa * 10) ? tone("blue") : tone("red"));
  }
  function readout(){
    pct.textContent = Math.round(resa * 100) + "%";
    counts.textContent = "Montati " + made + " · passano " + good + " · scartati " + bad;
    if(goal){
      const n = goal / resa;
      need.innerHTML = "";
      need.appendChild(el("span", {text:"Per " + (v.etichetta_obiettivo || fmtNum(goal) + " buoni") + " ne vanno montati "}));
      need.appendChild(el("b", {text:(n >= 1e6 ? fmtNum(Math.round(n / 1e5) / 10) + " milioni" : fmtNum(Math.round(n)))}));
      need.appendChild(el("span", {text:" — su 100 che escono dalla linea, " + Math.round(resa * 100) + " passano il controllo."}));
    }
  }
  /* i telefoni gia' sul nastro contano come montati: cosi' promossi e
     scartati non superano mai i montati */
  slider.addEventListener("input", function(){
    resa = +slider.value / 100;
    made = items.filter(function(it){ return it.st === 0; }).length; good = bad = 0;
    readout(); if(STILL) drawStill();
  });
  readout();
  visCaption(box, v);

  whenSeen(box, function(){
    geo = crispCanvas(canvas, .36);
    onResize(canvas, function(){ geo = crispCanvas(canvas, .36); if(STILL) drawStill(); });
    let last = 0;
    function frame(now){
      /* i colori si leggono a ogni fotogramma: cambiando tema a grafico
         aperto, niente resta chiaro su chiaro */
      const blue = tone("blue"), red = tone("red"), ink = cssv("--ink"), rule = cssv("--rule-strong"), paper = cssv("--paper-2");
      const ctx = geo.ctx, w = geo.w, h = geo.h;
      const beltY = h * .42, gate = w * .56;
      ctx.clearRect(0, 0, w, h);
      /* nastro */
      ctx.fillStyle = paper; ctx.fillRect(0, beltY + 14, w, 8);
      ctx.fillStyle = rule;
      for(let x = ((now / 18) % 22); x < w; x += 22){ ctx.beginPath(); ctx.arc(x, beltY + 18, 2.2, 0, 7); ctx.fill(); }
      /* controllo qualita' */
      ctx.fillStyle = ink; ctx.fillRect(gate - 2, beltY - 30, 4, 44);
      ctx.fillRect(gate - 16, beltY - 34, 32, 6);
      ctx.font = "700 9px system-ui"; ctx.textAlign = "center"; ctx.fillText("CONTROLLO", gate, beltY - 40);
      /* cesto degli scarti */
      ctx.strokeStyle = red; ctx.lineWidth = 2;
      ctx.strokeRect(gate + 30, h - 34, 64, 26);
      ctx.fillStyle = red; ctx.font = "700 9px system-ui"; ctx.fillText("SCARTI", gate + 62, h - 40);
      if(now - last > (STILL ? 1e9 : 520)){ items.push({x:-14, y:beltY, st:0}); last = now; made++; readout(); }
      for(let i = items.length - 1; i >= 0; i--){
        const it = items[i];
        if(it.st === 0){ it.x += 1.6; if(it.x >= gate){ it.st = Math.random() < resa ? 1 : 2; if(it.st === 1) good++; else bad++; readout(); } }
        else if(it.st === 1){ it.x += 1.6; }
        else { it.x += .9; it.y += 2.2; if(it.y > h - 22){ it.y = h - 22; it.x = Math.min(it.x, gate + 86); it.st = 3; it.t = now; } }
        const col = it.st === 0 ? ink : (it.st === 1 ? blue : red);
        phone(ctx, it.x, it.y, col, it.st === 1 ? "✓" : (it.st >= 2 ? "✕" : ""));
        if(it.x > w + 20 || (it.st === 3 && now - it.t > 1600)) items.splice(i, 1);
      }
    }
    if(STILL) drawStill(); else liveLoop(box, frame);
  });
  return box;
}

/* ---------- piega: il Duo in 3D ----------
   Due meta' unite da una cerniera, disegnate con le trasformazioni 3D della
   pagina: niente librerie, niente modelli da scaricare. Trascina per girarlo,
   il cursore apre e chiude. Le proporzioni sono quelle dichiarate (7,6"
   aperto, 5,4" chiuso), i colori indicativi. */
function visPiega(v){
  const box = visFrame(v, "piega");
  const rig = el("div", {class:"duo-rig"});
  const left = el("div", {class:"duo-half duo-l"}, [
    el("div", {class:"duo-face duo-in"}),
    el("div", {class:"duo-face duo-back"}, [el("div", {class:"duo-cam"}, [el("i"), el("i")])])
  ]);
  const right = el("div", {class:"duo-half duo-r"}, [
    el("div", {class:"duo-face duo-in"}),
    el("div", {class:"duo-face duo-back duo-outer"}, [
      el("div", {class:"duo-clock", text:"9:41"}),
      el("div", {class:"duo-date", text:"venerdì 23 ottobre"})
    ])
  ]);
  rig.appendChild(left); rig.appendChild(right);
  const stage = el("div", {class:"duo-stage"}, [rig]);
  box.appendChild(stage);
  const state = el("p", {class:"duo-state"});
  const slider = el("input", {type:"range", min:"0", max:"180", value:"180", "aria-label":"apertura della cerniera"});
  const btn = el("button", {type:"button", class:"vis-btn", text:"Chiudi"});
  const sw = el("div", {class:"duo-swatches"});
  (v.colori || []).forEach(function(c, i){
    const b = el("button", {type:"button", class:"sw" + (i === 0 ? " on" : ""), title:c.nome, "aria-label":c.nome});
    b.style.background = c.hex;
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(sw.children, function(x){ x.classList.toggle("on", x === b); });
      box.style.setProperty("--duo-frame", c.hex); swName.textContent = c.nome;
    });
    sw.appendChild(b);
  });
  const swName = el("span", {class:"sw-name", text:(v.colori && v.colori[0]) ? v.colori[0].nome : ""});
  if(v.colori && v.colori[0]) box.style.setProperty("--duo-frame", v.colori[0].hex);
  box.appendChild(state);
  box.appendChild(el("div", {class:"vis-controls"}, [btn, slider]));
  if(v.colori && v.colori.length) box.appendChild(el("div", {class:"duo-colors"}, [sw, swName]));
  visCaption(box, v);

  let open = 180, target = 180, ry = -28, rx = 20, drag = null, auto = !STILL, t0 = performance.now();
  function paint(){
    right.style.transform = "rotateY(" + (-(180 - open)) + "deg)";
    rig.style.transform = "rotateX(" + rx + "deg) rotateY(" + ry + "deg)";
    slider.value = String(Math.round(open));
    state.textContent = open < 12 ? "Chiuso · schermo esterno da " + (v.esterno || "5,4″")
      : (open > 168 ? "Aperto · schermo interno da " + (v.interno || "7,6″") : "Cerniera a " + Math.round(open) + "°");
    btn.textContent = open > 90 ? "Chiudi" : "Apri";
  }
  function tick(now){
    if(Math.abs(target - open) > .5){ open += (target - open) * .12; }
    else open = target;
    if(auto && !drag) ry = -24 + Math.sin((now - t0) / 2600) * 34;
    paint();
  }
  slider.addEventListener("input", function(){ target = open = +slider.value; auto = false; paint(); });
  /* senza movimento il ciclo non gira: si salta subito alla posizione */
  btn.addEventListener("click", function(){ target = open > 90 ? 0 : 180; auto = false; if(STILL){ open = target; paint(); } });
  /* sul telefono il gesto verticale e' della pagina (touch-action:pan-y):
     il dito gira il modello solo in orizzontale, il mouse anche in verticale */
  stage.addEventListener("pointerdown", function(e){ drag = {x:e.clientX, y:e.clientY, ry:ry, rx:rx, moved:false}; try{ stage.setPointerCapture(e.pointerId); }catch(err){} });
  stage.addEventListener("pointermove", function(e){
    if(!drag) return;
    if(!drag.moved && Math.abs(e.clientX - drag.x) < 4 && Math.abs(e.clientY - drag.y) < 4) return;
    drag.moved = true; auto = false;
    ry = drag.ry + (e.clientX - drag.x) * .5;
    if(e.pointerType !== "touch") rx = Math.max(-30, Math.min(55, drag.rx - (e.clientY - drag.y) * .35));
    if(STILL) paint();
  });
  stage.addEventListener("pointerup", function(){ drag = null; });
  stage.addEventListener("pointercancel", function(){ drag = null; });
  paint();
  whenSeen(box, function(){
    if(STILL){ paint(); return; }
    /* una piccola dimostrazione: si chiude e si riapre da solo, poi e' tuo */
    target = 0; setTimeout(function(){ target = 180; }, 1700);
    liveLoop(box, tick);
  });
  return box;
}

/* ---------- anno: quando lancia Apple ----------
   L'anno come un quadrante. I lanci veri cadono a grappoli su due stagioni;
   l'interruttore mostra l'obiettivo — lanci lungo tutto l'anno — che e' una
   direzione dichiarata, non un calendario: per questo e' una fascia, non
   dei punti inventati. */
function visAnno(v){
