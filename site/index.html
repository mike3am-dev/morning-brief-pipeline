  line-height:1.3; letter-spacing:-.006em; margin:0; color:var(--ink); text-wrap:pretty; transition:color .15s}
#view-oggi.duo .newslist .story:not(.top) h3{font-weight:500; font-size:.96rem; line-height:1.32}
#view-oggi.duo .newslist .story.is-read:not(.is-reading) h3{color:var(--ink-3)}
#view-oggi.duo .newslist .story.is-read:not(.is-reading) .thumb{opacity:.45}
#view-oggi.duo .newslist .story:hover h3{color:var(--ink)}
/* quella che stai leggendo: la barra arancione di «sei qui» e il titolo pieno.
   Niente fondo: in TMB le campiture hanno un ruolo, e «selezionato» non c'e'. */
#view-oggi.duo .newslist .story::before{content:""; position:absolute; left:0; top:.8rem; bottom:.85rem;
  width:4px; background:var(--orange); transform:scaleY(0); transform-origin:top;
  transition:transform .18s ease}
#view-oggi.duo .newslist .story.is-reading::before{transform:scaleY(1)}
#view-oggi.duo .newslist .story.is-reading h3{font-weight:700; color:var(--ink)}
#view-oggi.duo .newslist .story.is-reading .kicker{color:var(--orange-ink)}
.list-sec{display:none}
/* il Duo in verticale: la colonna e' stretta, e con la foto accanto un titolo
   andava su sette righe. Li' la foto si toglie e il titolo prende la riga. */
#view-oggi.duo .newslist{container-type:inline-size}
@container (max-width:330px){
  #view-oggi.duo .newslist .story.top .story-head.with-thumb{grid-template-columns:minmax(0,1fr); grid-template-areas:"kicker" "title"}
  #view-oggi.duo .newslist .story.top .story-head .thumb{display:none}
}

/* il pannello: resta agganciato sotto la testata e scorre per conto suo */
#view-oggi.duo .reader{
  display:block; position:sticky; top:calc(var(--mast, 7rem) + .5rem);
  max-height:calc(100vh - var(--mast, 7rem) - 1rem);
  max-height:calc(100dvh - var(--mast, 7rem) - 1rem);
  overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  padding:.9rem 0 2.5rem 1.5rem; border-left:1px solid var(--rule);
}
.reader-head{display:flex; flex-direction:column; gap:.6rem; padding-bottom:.2rem}
.reader-kicker{display:flex; align-items:center; gap:.6rem}
.reader-rep{font-size:.66rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--orange-ink)}
.reader-kicker .eyebrow{margin:0}
.reader-head .chips{margin:0}
.reader-head h2{font-family:var(--display); font-weight:600; font-size:clamp(1.55rem, 3.4vw, 2.05rem);
  line-height:1.08; letter-spacing:-.008em; margin:0}
.reader-shot{display:block; width:100%; aspect-ratio:16/9; object-fit:cover;
  border-radius:3px; background:var(--paper-2)}
.reader-head .lede{font-size:1.04rem; line-height:1.5; color:var(--ink-2); margin:0}
.reader .story-body{padding:1rem 0 0}
.reader .workspace{padding-left:0}
.reader .tools{padding-left:0}
/* ---------------- la prima pagina del Duo ---------------- */
.fp-entry{display:none}
#view-oggi.duo .fp-entry{
  display:grid; grid-template-columns:24px minmax(0,1fr); column-gap:.7rem; align-items:center;
  width:100%; margin:0; padding:.95rem .25rem .95rem .85rem; position:relative;
  background:none; border:0; border-top:1.5px solid var(--ink); border-radius:0;
  color:inherit; font:inherit; text-align:left; cursor:pointer;
}
#view-oggi.duo .fp-entry::before{content:""; position:absolute; left:0; top:.85rem; bottom:.85rem;
  width:4px; background:var(--orange); transform:scaleY(0); transform-origin:top; transition:transform .18s ease}
#view-oggi.duo .fp-entry.is-reading::before{transform:scaleY(1)}
.fp-mark{display:grid; grid-template-columns:repeat(2, 9px); gap:5px; justify-content:center}
.fp-mark i{width:9px; height:9px; border-radius:50%; background:var(--red)}
.fp-mark i:nth-child(2){background:var(--yellow)}
.fp-mark i:nth-child(3){background:var(--blue)}
.fp-mark i:nth-child(4){background:var(--orange)}
.fp-entry-t b{display:block; font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:1.12rem; letter-spacing:.03em; line-height:1.05}
.fp-entry-t .eyebrow{display:block; margin-top:.28rem}

#view-oggi.duo .reader{container-type:inline-size}
.fp{display:flex; flex-direction:column; gap:1.15rem; padding-top:.15rem}

/* la testata del giorno */
.fp-head{display:flex; align-items:flex-end; justify-content:space-between; gap:.8rem 1rem; flex-wrap:wrap}
.fp-when .eyebrow{display:block}
.fp-date{font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:clamp(2.3rem, 10cqi, 3.5rem); line-height:.88; letter-spacing:-.012em; margin:.3rem 0 0}

/* la fila dei pallini: entrano uno dopo l'altro, come nella sigla */
.fp-row{display:flex; align-items:center; flex-wrap:wrap; gap:.6rem 1rem;
  padding:.9rem 0; border-top:1.5px solid var(--ink); border-bottom:1px solid var(--rule)}
.fp-beads{display:flex; flex-wrap:wrap; gap:6px}
.fp-bead{background:none; border:0; padding:0; margin:0; cursor:pointer; border-radius:50%;
  animation:fp-pop .42s cubic-bezier(.2,1.4,.4,1) both; animation-delay:calc(var(--i) * 45ms)}
.fp-bead .bead{width:30px; height:30px; font-size:.84rem; margin:0}
.fp-bead.is-read .bead{opacity:.28}
.fp-bead:active .bead{transform:scale(.9)}
.fp-count{margin:0}
@keyframes fp-pop{from{transform:scale(0); opacity:0} to{transform:scale(1); opacity:1}}

/* l'apertura: la foto, e sopra il sottopancia — fascia gialla, titolo su nero */
.fp-lead{position:relative; margin:0; cursor:pointer; border-radius:3px; overflow:hidden; background:var(--paper-2)}
.fp-lead img{display:block; width:100%; aspect-ratio:16/9; object-fit:cover}
.fp-chyron{position:absolute; left:0; bottom:0; max-width:88%;
  display:flex; flex-direction:column; align-items:flex-start}
.fp-tag{background:var(--yellow); color:#17181B; font-family:var(--display); font-weight:700;
  text-transform:uppercase; font-size:.72rem; letter-spacing:.14em; padding:.34rem .75rem .26rem;
  animation:fp-wipe .38s ease-out .15s both}
.fp-title{background:#17181B; color:#F8F6F2; font-family:var(--display); font-weight:600;
  font-size:clamp(1.2rem, 4.8cqi, 1.65rem); line-height:1.1; letter-spacing:-.003em;
  padding:.55rem .85rem .65rem; text-wrap:balance; animation:fp-wipe .5s ease-out .3s both}
.fp-lead.no-img{background:none; overflow:visible}
.fp-lead.no-img .fp-chyron{position:static; max-width:none}
@keyframes fp-wipe{from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)}}
.fp-lede{margin:-.35rem 0 0; font-size:1rem; line-height:1.5; color:var(--ink-2)}

/* la seconda e la terza */
.fp-seconds{display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; padding-top:1rem; border-top:1.5px solid var(--ink)}
.fp-second{display:flex; flex-direction:column; gap:.55rem; background:none; border:0; padding:0; margin:0;
  color:inherit; font:inherit; text-align:left; cursor:pointer}
.fp-second img{display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:2px; background:var(--paper-2)}
.fp-k{display:flex; align-items:center; gap:.5rem}
.fp-k .bead{width:22px; height:22px; font-size:.7rem; margin:0}
.fp-k .chip{background:none; box-shadow:none; padding:0; color:var(--ink-3); font-size:.56rem; letter-spacing:.13em}
.fp-second h3{font-family:var(--display); font-weight:600; font-size:1.14rem; line-height:1.14; margin:0; text-wrap:pretty}

/* il quadro della giornata */
.fp-quadro{padding-top:1rem; border-top:1px solid var(--rule)}
.fp-quadro .eyebrow{display:block; margin-bottom:.5rem}
.fp-quadro p{margin:0; font-size:1rem; line-height:1.58; color:var(--ink-2)}
.fp-quadro b{color:var(--ink); font-weight:650}
.fp-foot{margin:0; padding-top:.2rem}

/* il pannello stretto del Duo in verticale: il sottopancia scende sotto la
   foto, la seconda e la terza vanno in fila con la foto piccola a sinistra */
@container (max-width:430px){
  .fp-chyron{position:static; max-width:none}
  .fp-title{text-wrap:pretty}
  .fp-seconds{grid-template-columns:1fr}
  .fp-second{display:grid; grid-template-columns:112px minmax(0,1fr); grid-template-areas:"img k" "img t"; column-gap:.8rem; row-gap:.35rem; align-items:start}
  .fp-second img{grid-area:img}
  .fp-second .fp-k{grid-area:k}
  .fp-second h3{grid-area:t; font-size:1.04rem}
  .fp-head{align-items:flex-start}
}

/* La barra "Chiudi / Prossima notizia" in fondo all'approfondimento e' fatta
   per il telefono, dove la lista non si vede. Nel pannello galleggiava sopra
   il testo, e la prossima notizia si sceglie gia' a sinistra (Mike, 31 ottobre
   2026). Per chiudere resta il pulsante in cima, "Chiudi approfondimento". */
.reader .deep-bar{display:none}
@media (max-width:600px){
  /* Sul telefono la notizia ha un solo bordo a sinistra: numero e metadati in
     cima, poi titolo, sintesi e azioni tutti allineati a filo di colonna. Il
     numero e' l'unico elemento che rientra, ed e' in testa: fa da segnaposto,
     non da colonna. */
  .story-body,.story .tools,.workspace{padding-left:0}
  .story-head{
    grid-template-columns:auto minmax(0,1fr);
    grid-template-areas:"bead chips" "title title" "lede lede";
    column-gap:.5rem;
  }
  /* La foto prende tutta la colonna sotto la sintesi: alla larghezza del
     telefono una miniatura di lato resta un francobollo e lascia mezzo schermo
     vuoto. Sorgente a 480px (images.py), qui mostrata a ~341: regge. */
  .story-head.with-thumb{
    grid-template-areas:"bead chips" "title title" "lede lede" "thumb thumb";
  }
  .story-head .bead{align-self:center}
  .bead{width:22px; height:22px; font-size:.72rem; margin-top:0}
  .thumb{
    width:100%; height:auto; aspect-ratio:16/9; margin:.9rem 0 .1rem; border-radius:3px;
  }
  /* Una riga sola di metadati: il tag, che porta il colore, e il pallino
     dell'affidabilita'. Categoria e puntata del filo restano al desktop. */
  .chips{gap:.25rem .5rem; margin-bottom:.55rem}
  .chip{font-size:.58rem; letter-spacing:.1em; padding:.18rem .42rem}
  .chip.cat,.chip.filo{display:none}
  .chip.rel{gap:.3rem}
  .chip .long{display:none}
  .story h3{font-size:1.44rem; margin-bottom:.55rem}
  .lede{font-size:.94rem; line-height:1.45}
}
textarea.note{
  width:100%; min-height:5.6rem; resize:vertical; font:inherit; font-size:.95rem;
  background:var(--paper); color:var(--ink); border:0;
  box-shadow:inset 0 0 0 1.5px var(--rule); border-radius:4px; padding:.65rem .75rem;
}
textarea.note:focus{box-shadow:inset 0 0 0 2px var(--blue); outline:none}
.saved-flag{font-size:.65rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ok)}
.linkrow{display:flex; gap:.4rem; flex-wrap:wrap; align-items:center}
.linkrow input{
  flex:1 1 12rem; min-width:0; font:inherit; font-size:.88rem; padding:.45rem .65rem;
  background:var(--paper); color:var(--ink); border:0;
  box-shadow:inset 0 0 0 1.5px var(--rule); border-radius:4px;
}
.linkrow input:focus{box-shadow:inset 0 0 0 2px var(--blue); outline:none}
.btn{
  background:var(--ink); color:var(--bone); border:0; border-radius:999px;
  padding:.45rem 1.05rem; font-size:.82rem; font-weight:700;
}
.btn:hover{background:var(--red); color:#FFF}
.btn:disabled{opacity:.45; cursor:default}
.btn.ghost{background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); color:var(--ink-2)}
.btn.ghost:hover{background:none; box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.btn.wide{width:100%; padding:.7rem 1rem; font-size:.95rem}
.saved-links{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.25rem}
.saved-links li{display:flex; gap:.5rem; align-items:baseline; font-size:.88rem}
.saved-links .kill{background:none; border:0; color:var(--ink-3); padding:0 .2rem}
.saved-links .kill:hover{color:var(--red)}
/* un indirizzo salvato che non regge il controllo resta visibile ma spento:
   sparire sarebbe peggio, perche' l'appunto c'era e va potuto cancellare */
.saved-links .broken{color:var(--ink-3); text-decoration:line-through}

/* ---------------- radar ---------------- */
.radar{list-style:none; margin:0; padding:0}
.radar li{border-top:1px solid var(--rule); padding:.9rem 0; display:grid; gap:.25rem}
.radar h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.radar p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.radar .src{font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}

/* ---------------- sul banco ----------------
   Non e' rassegna, e' materiale da lavoro: la concorrenza e chi la prova.
   La riga gialla e' la sezione — dice perche' quella cosa ti serve dietro al
   banco. Senza quella riga sarebbe una recensione qualsiasi. */
.banco{list-style:none; margin:0; padding:0}
.banco li{border-top:1px solid var(--rule); padding:.95rem 0; display:grid; gap:.35rem}
.banco h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.banco p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.banco .kind{
  justify-self:start; font-size:.6rem; font-weight:700; letter-spacing:.13em;
  text-transform:uppercase; padding:.2rem .45rem; border-radius:2px;
  background:var(--yellow); color:var(--on-fill);
}
.banco .kind.k-video{background:var(--red); color:#FFF}
.banco .kind.k-confronto{background:var(--blue); color:#FFF}
.banco .why{
  font-size:.89rem; color:var(--ink); line-height:1.5; margin-top:.1rem;
  padding-left:.9rem; box-shadow:inset 3px 0 0 var(--yellow);
}
.banco .foot,.recap .foot{display:flex; align-items:center; gap:.6rem; margin-top:.15rem}
.banco .src,.recap .src{
  font-size:.68rem; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3);
}

/* ---------------- Duo aperto: le sezioni sotto le notizie ----------------
   Sotto la lista c'e' tutta la larghezza dello schermo, e quattro sezioni che
   portano materiali diversi. Ognuna prende la forma di quello che porta:
     radar        una griglia di segnali, ognuno sotto la sua barra blu
     sul banco    una scheda da lavoro, con la domanda del cliente su un
                  foglietto giallo accanto — e' la riga che fa la sezione
     ripescaggio  una linea del tempo: "quando" in grande, a sinistra
     discussioni  un muro di fumetti: sono voci, non fatti, e devono sembrarlo
   Il colore e' sempre quello del pallino della sezione. Sul telefono e sul
   Mac non cambia niente: li' sono colonne di righe, ed e' giusto cosi'. */
.radar .topic{display:none}

/* nelle schede il titolo e' un titolo, non un link arancione sottolineato */
#view-oggi.duo :is(.radar, .banco, .recap, .talk) h4 a{color:var(--ink); text-decoration:none}
#view-oggi.duo :is(.radar, .banco, .recap, .talk) h4 a:hover{text-decoration:underline;
  text-decoration-thickness:1.5px; text-underline-offset:3px}

/* radar: due colonne di segnali; con un numero dispari il primo sta largo */
#view-oggi.duo .radar{display:grid; grid-template-columns:repeat(2, minmax(0,1fr));
  gap:1.7rem 1.6rem; padding-top:.5rem}
#view-oggi.duo .radar li{border-top:4px solid var(--blue); padding:.7rem 0 0;
  display:flex; flex-direction:column; gap:.4rem}
#view-oggi.duo .radar li:first-child:nth-last-child(odd){grid-column:1 / -1}
#view-oggi.duo .radar li:first-child:nth-last-child(odd) h4{font-size:1.55rem; line-height:1.08}
#view-oggi.duo .radar .topic{display:block; font-size:.6rem; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--blue-ink)}
#view-oggi.duo .radar h4{font-size:1.22rem; line-height:1.13}
#view-oggi.duo .radar p{font-size:.92rem}
/* i pulsanti in fondo alla scheda, allineati fra le schede della stessa riga */
#view-oggi.duo .radar .radar-foot{margin-top:auto; padding-top:.2rem}
/* nei piedi delle schede i pulsanti stanno sulla riga della fonte: il
   margine sopra serve solo quando la barra sta da sola sotto una notizia */
#view-oggi.duo :is(.radar-foot, .banco .foot, .recap .foot) .tools{padding-top:0}

/* sul banco: a sinistra la cosa, a destra il foglietto giallo "al banco" */
#view-oggi.duo .banco li{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);
  grid-template-areas:"kind why" "title why" "note why" "foot why" "panel panel";
  column-gap:1.6rem; row-gap:.4rem; align-items:start; padding:1.25rem 0 1.1rem}
#view-oggi.duo .banco .kind{grid-area:kind}
#view-oggi.duo .banco h4{grid-area:title; font-size:1.32rem; line-height:1.1}
#view-oggi.duo .banco li > p:not(.why){grid-area:note}
#view-oggi.duo .banco .foot{grid-area:foot; margin-top:.2rem}
#view-oggi.duo .banco .workspace{grid-area:panel}
#view-oggi.duo .banco .why{grid-area:why; align-self:start; margin:0;
  background:var(--yellow); color:#17181B; box-shadow:none; border-radius:3px;
  padding:.85rem 1rem 1rem; font-size:.95rem; line-height:1.45}
#view-oggi.duo .banco .why::before{content:"Al banco"; display:block; margin-bottom:.45rem;
  font-family:var(--display); font-weight:700; font-size:.82rem; letter-spacing:.06em;
  text-transform:uppercase}

/* se te lo fossi perso: il "quando" in grande, come su una linea del tempo */
#view-oggi.duo .recap li{grid-template-columns:8.5rem minmax(0,1fr);
  grid-template-areas:"when title" "when note" "when signal" "when foot" "panel panel";
  column-gap:1.6rem; row-gap:.4rem; align-items:start; padding:1.25rem 0 1.1rem}
#view-oggi.duo .recap .head{display:contents}
#view-oggi.duo .recap .when{grid-area:when; align-self:stretch; background:none; padding:0 0 0 .75rem;
  border-radius:0; box-shadow:inset 4px 0 0 var(--orange); color:var(--orange-ink);
  font-family:var(--display); font-weight:700; font-size:1.55rem; line-height:1.02;
  letter-spacing:-.005em}
#view-oggi.duo .recap h4{grid-area:title; font-size:1.3rem; line-height:1.1}
#view-oggi.duo .recap li > p{grid-area:note}
#view-oggi.duo .recap .signal{grid-area:signal; font-size:.72rem; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-2)}
#view-oggi.duo .recap .foot{grid-area:foot}
/* "uscita qui il…" delle perse da te: sotto il quando, in fondo alla colonna */
#view-oggi.duo .recap .signal.origin{grid-area:when; align-self:end; padding-left:.75rem;
  font-size:.6rem; letter-spacing:.12em; color:var(--ink-3); position:relative; z-index:1}
#view-oggi.duo .recap .workspace{grid-area:panel}

/* nelle discussioni: fumetti su due colonne, campiti e con l'angolo della battuta */
#view-oggi.duo .talk{display:grid; grid-template-columns:repeat(2, minmax(0,1fr));
  gap:1rem; padding-top:.3rem}
#view-oggi.duo .talk li{border-top:0; background:var(--paper); border-radius:18px 18px 18px 4px;
  padding:1rem 1.15rem 1.15rem; gap:.45rem; align-content:start}
#view-oggi.duo .talk li:first-child:nth-last-child(odd){grid-column:1 / -1}
#view-oggi.duo .talk h4{font-size:1.14rem}
#view-oggi.duo .talk p{font-size:.9rem}
#view-oggi.duo .talk .where{background:var(--paper-2)}
#view-oggi.duo .talk .where.new{background:var(--red); color:#FFF}

/* ---------------- AI ----------------
   Due blocchi, due forme. "Cosa e' successo" e' un dispaccio: righe fitte,
   niente foto (nelle notizie AI la foto e' un logo, e un logo non dice
   niente). "Cosa puoi provare" e' una galleria: la foto e' il risultato —
   la citta' in 3D, il pellicano renderizzato — ed e' lei che fa dire
   "ah, si puo' fare questo?". */
.chip.lab-name{background:var(--ink); color:var(--bone)}
.chip.k-lab{background:var(--yellow); color:var(--on-fill)}
.subhead{
  display:flex; align-items:baseline; gap:.6rem; margin:1.6rem 0 .5rem;
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:1.05rem; letter-spacing:.02em;
}
.subhead .eyebrow{margin-left:auto}
/* il selettore della scheda AI: due schede grandi, una sola scelta, si ricorda */
.aiswitch{display:grid; grid-template-columns:1fr 1fr; margin:.2rem 0 1.1rem; border-bottom:1.5px solid var(--ink)}
.aiswitch button{
  background:none; border:0; padding:.7rem .4rem .75rem; position:relative;
  font-family:var(--display); font-weight:700; font-size:1.15rem; text-transform:uppercase;
  letter-spacing:.04em; color:var(--ink-3);
}
.aiswitch button .count{font-family:var(--body); font-size:.62rem; font-weight:700; margin-left:.4rem; vertical-align:.35em; letter-spacing:0}
.aiswitch button[aria-current="true"]{color:var(--ink)}
.aiswitch button[aria-current="true"]::after{content:""; position:absolute; left:0; right:0; bottom:-1.5px; height:4px; background:var(--ink)}
.aiswitch button[data-mode="lab"][aria-current="true"]::after{background:var(--yellow)}
.subhead.lab::before{content:""; width:.7rem; height:.7rem; background:var(--yellow); border-radius:2px; align-self:center}
.subhead.wire::before{content:""; width:.7rem; height:.7rem; background:var(--ink); border-radius:50%; align-self:center}

/* ---------------- GAMES, TECH, SPAZIO ---------------- */
.rub-head{
  --rc:var(--yellow); --on:#17181B;
  margin:1.1rem 0 1.2rem; padding:1.1rem 1.1rem 1rem; border-radius:10px; position:relative; overflow:hidden;
  background:var(--rc); color:var(--on); display:flex; flex-direction:column; gap:.2rem;
}
.rub-head h2{font-family:var(--display); font-weight:700; font-size:2.6rem; line-height:.95; text-transform:uppercase; letter-spacing:.01em}
.rub-head .eyebrow{color:inherit; opacity:.78}
/* il disegno di ogni scheda: pixel per Games, griglia per Tech, stelle per Spazio */
.rub-games .rub-head{background-image:linear-gradient(45deg, rgba(23,24,27,.1) 25%, transparent 25%, transparent 75%, rgba(23,24,27,.1) 75%),
  linear-gradient(45deg, rgba(23,24,27,.1) 25%, transparent 25%, transparent 75%, rgba(23,24,27,.1) 75%);
  background-size:22px 22px; background-position:0 0, 11px 11px}
.rub-spazio .rub-head{
  background-image:radial-gradient(1.2px 1.2px at 12% 30%, #fff, transparent), radial-gradient(1px 1px at 38% 70%, #fff, transparent),
    radial-gradient(1.6px 1.6px at 62% 25%, #fff, transparent), radial-gradient(1px 1px at 84% 60%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 92% 22%, #fff, transparent), radial-gradient(1px 1px at 52% 88%, #fff, transparent);
  box-shadow:inset 0 0 0 1.5px var(--rule-strong)}
.rub-tops{display:grid; gap:1.2rem}
@media (min-width:760px){ .rub-tops{grid-template-columns:repeat(3, 1fr)} }
.rub-card{background:var(--paper); border-radius:8px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column}
.rub-card .shot{width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--paper-2)}
.rub-body{padding:.85rem 1rem 1rem; display:flex; flex-direction:column; gap:.45rem}
.rub-meta{font-size:.62rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); display:flex; flex-wrap:wrap; gap:.3rem .6rem; align-items:center}
.rub-tag{background:var(--paper-2); color:var(--ink-2); padding:.12rem .4rem; border-radius:2px; letter-spacing:.08em}
.rub-tag.hot{background:var(--orange); color:#17181B}
.rub-card h3{font-family:var(--display); font-weight:700; font-size:1.4rem; line-height:1.1}
.rub-card h3 a{color:inherit; text-decoration:none}
.rub-nota{font-size:.95rem; line-height:1.45; color:var(--ink-2)}
.rub-orig{font-size:.78rem; line-height:1.35; color:var(--ink-3); font-style:italic}
.rub-sub{margin-top:1.6rem}
.rub-sub.hot::before{content:""; width:.7rem; height:.7rem; background:var(--orange); border-radius:50%; align-self:center}
.rub-rows .row h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.rub-rows .row .rowtext{display:flex; flex-direction:column; gap:.3rem}

/* ---- GAMES, TECH, SCIENZA nella Magazine (5 novembre 2026) ----
   La testatina della scheda e' piatta, angoli quasi vivi, nel colore della
   scheda e col suo disegno (pixel per Games, griglia per Tech, cielo per
   Scienza); sotto, le schede su carta della Magazine. */
.rub-mag{max-width:62rem; container-type:inline-size}
.rubm-head{position:relative; overflow:hidden; display:flex; align-items:flex-end; gap:1rem;
  margin:1.1rem 0 .4rem; padding:1.15rem 1.15rem 1rem; border-radius:4px; color:#17181B; background:var(--yellow)}
.rubm-name{flex:1; min-width:0; display:flex; flex-direction:column; gap:.3rem; position:relative}
.rubm-head h2{font-family:var(--display); font-weight:800; font-size:clamp(2.6rem, 11cqi, 4.2rem); line-height:.86;
  text-transform:uppercase; letter-spacing:-.005em}
.rubm-sub{font-size:.66rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; opacity:.78}
.rubm-stamp{position:relative; flex:none; display:flex; flex-direction:column; align-items:flex-end; line-height:1;
  padding-bottom:.1rem}
.rubm-stamp b{font-family:var(--display); font-weight:800; font-size:2.2rem; line-height:.85}
.rubm-stamp span{font-size:.62rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; margin-top:.2rem}
.rubm-stamp small{font-size:.6rem; font-weight:600; letter-spacing:.06em; opacity:.72; margin-top:.35rem}
.rubm-dots{position:absolute; top:.85rem; right:1rem; display:flex; gap:5px}
.rubm-dots i{width:9px; height:9px; border-radius:50%; background:#17181B}
.rubm-dots i:nth-child(2){background:var(--orange)}
.rubm-dots i:nth-child(3){background:var(--red)}
.rubm-games{background-color:var(--yellow);
  background-image:linear-gradient(45deg, rgba(23,24,27,.09) 25%, transparent 25%, transparent 75%, rgba(23,24,27,.09) 75%),
    linear-gradient(45deg, rgba(23,24,27,.09) 25%, transparent 25%, transparent 75%, rgba(23,24,27,.09) 75%);
  background-size:22px 22px; background-position:0 0, 11px 11px}
/* Scienza: il blu notte con le stelle, e l'accento giallo */
.rubm-spazio{background-color:var(--night); color:#F1EEE8;
  background-image:radial-gradient(1.2px 1.2px at 12% 30%, #fff, transparent), radial-gradient(1px 1px at 38% 70%, #fff, transparent),
    radial-gradient(1.6px 1.6px at 62% 25%, #fff, transparent), radial-gradient(1px 1px at 84% 60%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 92% 22%, #fff, transparent), radial-gradient(1px 1px at 52% 88%, #fff, transparent),
    radial-gradient(1px 1px at 24% 82%, #fff, transparent), radial-gradient(1.4px 1.4px at 73% 78%, #fff, transparent)}
.rubm-spazio .rubm-sub, .rubm-spazio .rubm-stamp span{color:var(--yellow); opacity:1}
.rubm-spazio .rubm-stamp b{color:var(--yellow)}
.rubm-spazio .rubm-dots i:nth-child(1){background:var(--yellow)}
.rub-mag .mag{padding-top:.4rem}
/* l'occhiello della disciplina in Scienza */
.rub-mag .card-src .disc{color:var(--night); font-weight:800}
:root[data-theme="dark"] .rub-mag .card-src .disc{color:#9DB0FF}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .rub-mag .card-src .disc{color:#9DB0FF} }


/* ---- AI nella Magazine (5 novembre 2026) ---- */
.rubm-ai{background-color:var(--red); color:#fff;
  background-image:linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
  background-size:18px 18px}
.rubm-ai .rubm-dots i:nth-child(1){background:#fff}
.rubm-ai .rubm-dots i:nth-child(3){background:var(--yellow)}
/* «In apertura»: solo tipografica, sul rosso */
.ai-hero{background:var(--red); color:#fff; border-radius:4px; padding:1.2rem 1.2rem .6rem; cursor:pointer; display:flex; flex-direction:column; gap:.55rem}
.ai-hero:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.ai-hero-meta{display:flex; gap:.6rem; align-items:baseline; font-size:.6rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase}
.ai-hero-meta b{font-family:var(--display); font-size:1.05rem; letter-spacing:.01em; text-transform:none}
.ai-hero h3{font-family:var(--display); font-weight:800; font-size:clamp(1.7rem, 7.2cqi, 2.6rem); line-height:1.02; text-wrap:balance}
.ai-hero-dek{font-size:1rem; line-height:1.45; color:rgba(255,255,255,.92); text-wrap:pretty}
.ai-foot{display:flex; align-items:center; gap:.6rem; font-size:.74rem; padding:.2rem 0 0; color:rgba(255,255,255,.8)}
.ai-hero .card-btn{color:rgba(255,255,255,.8)} .ai-hero .card-star.on{color:var(--yellow)}
/* il fronte: un tabellone nero, una colonna per laboratorio */
.fronte-tab{background:#111214; color:#F1EEE8; border-radius:4px; padding:.9rem 0 .8rem; margin:.4rem 0}
.fr-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:.2rem .7rem; padding:0 1rem .7rem}
.fr-head > span:first-child{font-family:var(--display); font-weight:800; font-size:1.35rem; text-transform:uppercase; letter-spacing:.02em}
.fr-sub{font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:rgba(241,238,232,.6)}
.fr-board{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(7.4rem, 1fr); overflow-x:auto; scroll-snap-type:x proximity;
  border-top:1px solid rgba(255,255,255,.14); border-bottom:1px solid rgba(255,255,255,.14); scrollbar-width:none}
.fr-board::-webkit-scrollbar{display:none}
.fr-col{display:flex; flex-direction:column; gap:.35rem; padding:.75rem .8rem .7rem; border-right:1px solid rgba(255,255,255,.14);
  scroll-snap-align:start; cursor:pointer; min-width:0}
.fr-col:last-child{border-right:0}
.fr-col.oggi{background:var(--red)}
.fr-lab{font-size:.56rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:rgba(241,238,232,.62)}
.fr-col.oggi .fr-lab{color:#fff}
.fr-nome{font-family:var(--display); font-weight:800; font-size:1.18rem; line-height:1.02; text-transform:uppercase; letter-spacing:.005em;
  overflow-wrap:anywhere}
.fr-fam{align-self:flex-start; font-size:.55rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  color:#111214; background:rgba(241,238,232,.75); padding:.08rem .35rem; border-radius:2px}
.fr-dots{display:flex; gap:3px}
.fr-dots i{width:6px; height:6px; border-radius:50%; box-shadow:inset 0 0 0 1.2px rgba(241,238,232,.35)}
.fr-dots i.on{background:var(--yellow); box-shadow:none}
.fr-when{font-size:.66rem; color:rgba(241,238,232,.7)}
.fr-col.oggi .fr-when{color:#fff; font-weight:700}
.fr-week{display:grid; gap:.3rem; padding:.8rem 1rem 0}
.fr-wrow{display:grid; grid-template-columns:5.2rem repeat(7, 1fr); align-items:center; gap:.2rem}
.fr-wrow span{display:flex; justify-content:center; font-size:.56rem; font-weight:700; letter-spacing:.1em; color:rgba(241,238,232,.5)}
.fr-wrow .fr-wlab{justify-content:flex-start; color:rgba(241,238,232,.82); letter-spacing:.06em; text-transform:uppercase}
.fr-week i, .fr-leg i{display:inline-block; width:9px; height:9px}
.k-m{border-radius:50%; background:var(--red)}
.k-f{border-radius:50%; box-shadow:inset 0 0 0 2px var(--yellow)}
.k-a{background:var(--blue); border-radius:1px}
.k-r{border-radius:50%; background:rgba(241,238,232,.5); transform:scale(.55)}
.fr-leg{padding:.6rem 1rem 0; font-size:.62rem; color:rgba(241,238,232,.6); display:flex; flex-wrap:wrap; align-items:center; gap:.25rem .4rem}
/* «E Apple?» */
.ai-apple{background:var(--paper); border-radius:4px; padding:.9rem 1.1rem .4rem; box-shadow:inset 4px 0 0 var(--orange)}
.ai-apple h3{display:flex; align-items:center; gap:.5rem; font-family:var(--display); font-weight:800; font-size:1.25rem; text-transform:uppercase; margin-bottom:.4rem}
.ai-apple h3 i{width:10px; height:10px; border-radius:50%; background:var(--orange)}
.ai-apple-row{padding:.55rem 0 .65rem; border-top:1px solid var(--rule); cursor:pointer}
.ai-apple-t{display:block; font-weight:700; font-size:.95rem; line-height:1.3}
.ai-apple-row p{font-size:.9rem; line-height:1.45; color:var(--ink-2); margin-top:.2rem}
/* LAB: la foto e' il risultato, poi il foglietto «Prova» */
.ai-labgrid{align-items:start}
.ai-lab{position:relative; display:flex; flex-direction:column; background:var(--paper); border-radius:18px; overflow:hidden; cursor:pointer;
  box-shadow:0 1px 2px rgba(23,24,27,.05), 0 12px 30px -22px rgba(23,24,27,.4)}
.ai-lab .card-img{aspect-ratio:16/9}
.ai-lab .card-body{padding:1rem 1.1rem 0}
.ai-k{color:var(--yellow-ink) !important}
.ai-prova{margin:.35rem 0 .2rem; background:color-mix(in srgb, var(--yellow) 26%, var(--paper)); border-radius:3px; padding:.65rem .75rem .6rem;
  display:flex; flex-direction:column; gap:.4rem; transform:rotate(-.4deg)}
.ai-prova-k{font-family:var(--display); font-weight:800; font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; color:var(--yellow-ink)}
.ai-prova p{font-size:.93rem; line-height:1.45; color:var(--ink)}
.ai-prompt{position:relative}
.ai-prompt pre{margin:0; white-space:pre-wrap; font:500 .8rem/1.45 ui-monospace, "SF Mono", Menlo, monospace; background:rgba(23,24,27,.07);
  padding:.55rem .6rem 1.9rem; border-radius:3px; color:var(--ink); max-height:12rem; overflow:auto}
.ai-copia{position:absolute; right:.4rem; bottom:.35rem; border:0; border-radius:999px; background:var(--ink); color:var(--bone);
  font-size:.7rem; font-weight:700; padding:.25rem .7rem}
.ai-prova-meta{font-size:.7rem; color:var(--ink-2); font-weight:600}
.ai-wire .row h4{font-family:var(--body); font-weight:700; font-size:1rem; line-height:1.28}

/* ---- GTA VI: i colori di Vice City, campiture piatte (5 novembre 2026) ----
   rosa neon, arancio tramonto, viola notte, turchese. Niente logo: solo i colori. */
.gta{--g-pink:#FF3D8B; --g-orange:#FF8A3D; --g-purple:#2A0B4D; --g-teal:#19D3C5; --g-yellow:#FFD84A;
  margin:.4rem 0 1.4rem; border-radius:4px; overflow:hidden; color:#fff;
  background:linear-gradient(165deg, #12062B 0%, var(--g-purple) 34%, #7A1B6B 66%, #D6336C 88%, var(--g-orange) 100%)}
.gta-head{display:flex; flex-wrap:wrap; align-items:flex-end; gap:.8rem 1rem; padding:1.15rem 1.15rem .9rem; position:relative}
.gta-head .gta-sint{flex:0 0 100%; max-width:none}
.gta-name{flex:1; min-width:0; display:flex; flex-direction:column; gap:.35rem}
.gta-kicker{font-size:.62rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--g-teal)}
.gta-head h2{font-family:var(--display); font-weight:800; font-size:clamp(3rem, 14cqi, 5rem); line-height:.82; letter-spacing:.01em;
  text-transform:uppercase; color:#fff}
.gta-head h2 em{font-style:normal; background:linear-gradient(90deg, var(--g-yellow), var(--g-orange) 45%, var(--g-pink));
  -webkit-background-clip:text; background-clip:text; color:transparent}
.gta-sint{font-size:.92rem; line-height:1.4; color:rgba(255,255,255,.88); max-width:38rem; text-wrap:pretty}
.gta-count{flex:none; display:flex; flex-direction:column; align-items:flex-end; line-height:1; text-align:right;
  background:var(--g-teal); color:#0B1A2B; padding:.55rem .7rem .5rem; border-radius:3px}
.gta-count b{font-family:var(--display); font-weight:800; font-size:2.4rem; line-height:.85}
.gta-count span{font-size:.55rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase; margin-top:.3rem}
.gta-grid{display:grid; grid-template-columns:minmax(0,1fr); gap:.75rem; padding:.2rem .9rem 1rem}
.gcard{position:relative; display:flex; flex-direction:column; background:rgba(12,4,30,.62); color:#fff; border-radius:4px; overflow:hidden;
  cursor:pointer; border-left:4px solid var(--c, var(--g-pink)); transition:transform .18s ease}
.gcard:active{transform:scale(.99)}
.gcard:focus-visible{outline:2px solid var(--g-yellow); outline-offset:2px}
.gt-ufficiale{--c:var(--g-teal)} .gt-scoperta{--c:var(--g-pink)} .gt-curiosita{--c:var(--g-orange)}
.gt-leak{--c:var(--g-yellow)} .gt-reazione{--c:#B58CFF} .gt-notizia{--c:#fff}
.gt-img{display:block; width:100%; aspect-ratio:16/9; object-fit:cover; max-height:min(38vh, 300px); background:#12062B}
.gt-body{display:flex; flex-direction:column; gap:.4rem; padding:.85rem 1rem .2rem; min-width:0}
.gt-meta{display:flex; flex-wrap:wrap; align-items:baseline; gap:.2rem .6rem; font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
.gt-meta b{font-family:var(--display); font-size:.98rem; letter-spacing:.005em; text-transform:none; color:#fff}
.gt-tipo{background:var(--c); color:#12062B; padding:.14rem .45rem; border-radius:2px}
.gt-sign{color:rgba(255,255,255,.7)}
.gt-sign.s-confermato{color:var(--g-teal)} .gt-sign.s-voce{color:var(--g-yellow)} .gt-sign.s-daverificare{color:var(--g-pink)}
.gcard h3{font-family:var(--body); font-weight:700; font-size:1.12rem; line-height:1.26; letter-spacing:-.01em; text-wrap:pretty}
.gcard.big h3{font-size:clamp(1.3rem, 4.6cqi, 1.7rem)}
.gcard blockquote{margin:0; padding-left:.8rem; border-left:2px solid var(--c); font-style:italic; font-size:.95rem; line-height:1.4; color:rgba(255,255,255,.92)}
.gt-nota{font-size:.93rem; line-height:1.45; color:rgba(255,255,255,.84); text-wrap:pretty}
.gt-foot{display:flex; align-items:center; gap:.6rem; padding:.5rem .6rem .6rem 1rem; font-size:.72rem; color:rgba(255,255,255,.7)}
.gt-segnale{font-weight:700; letter-spacing:.04em}
.gta .card-btn{color:rgba(255,255,255,.7)} .gta .card-btn:hover{background:rgba(255,255,255,.12); color:#fff}
.gta .card-star.on{color:var(--g-yellow)}
@container (min-width:620px){
  .gta-grid{grid-template-columns:1fr 1fr}
  .gcard.big{grid-column:1 / -1}
  .gcard.big.has-img{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  .gcard.big.has-img .gt-img{grid-row:1 / span 2; height:100%; max-height:none; aspect-ratio:auto; min-height:240px}
}
.rub-mag .card-orig{margin:0; font-size:.76rem; line-height:1.35; color:var(--ink-3); font-style:italic; text-wrap:pretty}
.rub-mag .card-src .hot{color:var(--orange-ink)}
.rub-mag .empty{border-top:0}
@container (max-width:460px){
  .rubm-head{padding:1rem 1rem .9rem}
  .rubm-stamp b{font-size:1.8rem}
}

/* il dispaccio */
.wire{list-style:none; margin:0 0 .4rem; padding:0}
.subhead + .wire{border-top:1.5px solid var(--ink)}
.wire li{border-bottom:1px solid var(--rule)}
/* pastiglia sopra, titolo e sintesi a filo di colonna: con la pastiglia di
   fianco i titoli partivano ognuno a una larghezza diversa */
.wire .row{display:flex; align-items:flex-start; gap:.9rem; padding:.75rem 0 .65rem; cursor:pointer}
.wire .row .rowtext{flex:1; min-width:0; display:grid; grid-template-columns:minmax(0,1fr); row-gap:.3rem}
.wire .row .chip{font-size:.55rem; padding:.18rem .4rem; justify-self:start}
.wire .row h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.wire .row .sintesi{margin-top:0; font-size:.93rem; color:var(--ink-2); line-height:1.45}
/* la memoria della sezione AI: "segue da ieri" porta alla puntata prima */
.segue{
  justify-self:start; background:none; border:0; padding:0; text-align:left;
  font-size:.72rem; font-weight:600; letter-spacing:.02em; color:var(--ink-3);
  line-height:1.35; cursor:pointer;
}
.segue b{font-weight:700; letter-spacing:.12em; text-transform:uppercase; font-size:.6rem; margin-right:.35rem; color:var(--ink-2)}
.segue:hover{color:var(--ink)}
.labcard .segue{margin:.1rem 0 .35rem}
/* la miniatura quadrata a destra, come in un lettore di feed: non e' il
   risultato (quello e' il LAB, e la' la foto e' grande), e' il punto d'appoggio
   per l'occhio che scorre una colonna di soli titoli */
.wire .row .thumb{
  flex:none; width:5.2rem; aspect-ratio:1; object-fit:cover;
  border-radius:5px; background:var(--paper-2);
}
.wire .body{padding:0 0 .9rem; display:flex; flex-direction:column; gap:.7rem}
.wire .body[hidden]{display:none}
.wire .body p{font-size:.93rem; color:var(--ink-2); line-height:1.5}
.wire .body .apple{
  color:var(--ink); padding-left:.9rem; box-shadow:inset 3px 0 0 var(--rule-strong);
}
.wire .foot{display:flex; align-items:center; gap:.6rem .9rem; flex-wrap:wrap; font-size:.9rem}
.wire .foot .tools{margin-left:auto}

/* la galleria */
.labcard{padding:.9rem 0 1rem; border-bottom:1px solid var(--rule)}
.labcard .shot{
  display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:5px;
  background:var(--paper-2); cursor:pointer;
}
.labcard .chips{margin:.7rem 0 .35rem}
.labcard h4{font-family:var(--display); font-weight:700; font-size:1.32rem; line-height:1.12; cursor:pointer}
.labcard .prova{
  margin-top:.45rem; font-size:.97rem; color:var(--ink); line-height:1.5;
  padding-left:.9rem; box-shadow:inset 3px 0 0 var(--yellow);
}
.labcard .body{margin-top:.7rem; display:flex; flex-direction:column; gap:.7rem}
.labcard .body[hidden]{display:none}
.labcard .body p{font-size:.93rem; color:var(--ink-2); line-height:1.5}
.labcard .foot{display:flex; align-items:center; gap:.6rem .9rem; flex-wrap:wrap; margin-top:.6rem; font-size:.9rem}
.labcard .foot .tools{margin-left:auto}
.labcard.noshot .shot{display:none}
@media (min-width:700px){
  .labgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 1.6rem}
}

/* il fronte: l'ultimo modello di ogni laboratorio */
.fronte{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(10rem,1fr)); gap:.8rem;
  margin:.2rem 0 .4rem; padding-bottom:1.2rem; border-bottom:1.5px solid var(--ink);
}
.fronte .lab{font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.fronte b{display:block; font-family:var(--display); font-weight:700; font-size:1.2rem; line-height:1.1; margin:.2rem 0 .15rem}
.fronte b a{color:var(--ink); text-decoration:none}
.fronte .when{font-size:.7rem; color:var(--ink-3)}

/* ---------------- se te lo fossi perso ----------------
   Roba vecchia di giorni: la cornice deve dire subito quanto, altrimenti
   sembra che la rassegna sia in ritardo. */
.recap{list-style:none; margin:0; padding:0}
.recap li{border-top:1px solid var(--rule); padding:.95rem 0; display:grid; gap:.3rem}
.recap h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.recap p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.recap .head{display:flex; flex-wrap:wrap; gap:.3rem .7rem; align-items:center}
.recap .when{
  font-size:.6rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  padding:.2rem .45rem; border-radius:2px; background:var(--orange); color:var(--on-fill);
}
.recap .signal{font-size:.7rem; font-weight:600; letter-spacing:.06em; color:var(--ink-3)}

/* ---------------- nelle discussioni ----------------
   Non sono fatti: sono opinioni e voci. La cornice deve dirlo da sola,
   quindi niente pastiglie di tag e un rientro che le stacca dalle notizie. */
.talk{list-style:none; margin:0; padding:0}
.talk li{border-top:1px solid var(--rule); padding:.95rem 0; display:grid; gap:.3rem}
.talk h4{font-family:var(--display); font-weight:600; font-size:1.14rem; line-height:1.18}
.talk p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.talk .who{display:flex; flex-wrap:wrap; gap:.3rem .7rem; align-items:center}
.talk .where{
  font-size:.6rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  padding:.2rem .45rem; border-radius:2px; background:var(--paper-2); color:var(--ink-2);
}
.talk .heat{font-size:.68rem; font-weight:600; letter-spacing:.08em; color:var(--ink-3)}
.talk .new{background:var(--red); color:#FFF}
.caveat{
  margin:.2rem 0 1rem; font-size:.85rem; color:var(--ink-3); line-height:1.5;
  padding-left:.9rem; box-shadow:inset 3px 0 0 var(--rule-strong);
}

/* ---------------- colonna laterale ---------------- */
.rail h4{
  font-size:.63rem; font-weight:700; letter-spacing:.19em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:.85rem;
}
.rail ol{list-style:none; margin:0 0 2.2rem; padding:0}
.rail ol button{
  background:none; border:0; text-align:left; width:100%; padding:.3rem 0;
  font-size:.83rem; line-height:1.34; color:var(--ink-2);
  display:grid; grid-template-columns:1.15rem 1fr; gap:.45rem; align-items:start;
}
.rail ol button:hover{color:var(--ink)}
.rail ol .pip{width:9px; height:9px; border-radius:50%; margin-top:.4rem; flex:none}
.statgrid{
  display:grid; grid-template-columns:1fr 1fr; gap:1rem .8rem; margin-bottom:2.2rem;
  padding-bottom:1.6rem; border-bottom:1.5px solid var(--ink);
}
.stat b{
  display:block; font-family:var(--display); font-weight:700; font-size:2rem;
  line-height:1; font-variant-numeric:tabular-nums;
}
.stat span{font-size:.66rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.rail .notice{display:flex; flex-direction:column; gap:.5rem; font-size:.78rem; color:var(--ink-3); line-height:1.45}

/* ---------------- archivio ----------------
   Un mese alla volta. La striscia dei mesi sceglie, il calendario a pallini
   dice quali giorni hanno un'edizione — e' lo stesso campo di pallini della
   testata, messo in riga — e la lista sotto le racconta. */
.months{display:flex; flex-wrap:wrap; gap:.45rem; margin:.1rem 0 1.5rem}
.months button{
  background:none; border:0; border-radius:999px; padding:.42rem .9rem;
  font-family:var(--display); font-weight:600; font-size:.95rem;
  text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3);
  box-shadow:inset 0 0 0 1.5px var(--rule-strong); transition:color .15s;
}
.months button:hover{color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink)}
.months button[aria-current="true"]{background:var(--ink); color:var(--bone); box-shadow:none}
.months .count{
  font-family:var(--body); font-size:.6rem; font-weight:700;
  margin-left:.4rem; vertical-align:.3em; letter-spacing:0; opacity:.75;
}
.cal{
  display:grid; grid-template-columns:repeat(7,1fr); gap:.4rem .3rem;
  max-width:24rem; margin:0 0 2.4rem;
}
.cal .wd{
  text-align:center; padding-bottom:.35rem; font-size:.58rem; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);
}
.cal .day{
  aspect-ratio:1; display:grid; place-items:center; border-radius:50%;
  background:none; border:0; font-size:.88rem; font-weight:600;
  font-variant-numeric:tabular-nums; color:var(--ink-3); transition:transform .12s;
}
.cal .day.void{visibility:hidden}
.cal .day.none{color:var(--rule-strong); cursor:default}
.cal .day.has{color:var(--on-fill); font-weight:700}
.cal .day.has:hover{transform:scale(1.12)}
.cal .day.has.current{box-shadow:0 0 0 2.5px var(--bone), 0 0 0 4.5px var(--ink)}

.archive-list{list-style:none; margin:0; padding:0}
.archive-list li{border-top:1px solid var(--rule)}
.archive-list li:last-child{border-bottom:1px solid var(--rule)}
.archive-list button{
  background:none; border:0; width:100%; text-align:left; padding:1.1rem 0;
  display:grid; grid-template-columns:2.5rem 1fr; gap:.75rem; align-items:start;
}
.archive-list .h{font-family:var(--display); font-weight:600; font-size:1.28rem; line-height:1.14; color:var(--ink)}
.archive-list .d{display:block; margin-bottom:.25rem}
.archive-list .m{display:block; margin-top:.3rem; font-size:.72rem; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.archive-list button:hover .h{color:var(--accent-ink)}

/* ---------------- diario ---------------- */
.composer{
  background:var(--paper); border-radius:6px; padding:1.1rem;
  display:flex; flex-direction:column; gap:.8rem; margin:.5rem 0 2.2rem;
  box-shadow:var(--shadow);
}
.composer textarea{
  width:100%; min-height:6.2rem; resize:vertical; font:inherit; font-size:1.02rem;
  background:none; color:var(--ink); border:0; padding:0;
}
.composer textarea:focus{outline:none}
.tagpicker{display:flex; flex-wrap:wrap; gap:.35rem}
.tagpicker button{
  background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); border:0; border-radius:999px;
  padding:.22rem .7rem; font-size:.75rem; font-weight:600; color:var(--ink-3);
}
.tagpicker button.on{background:var(--blue); box-shadow:none; color:#17181B}
.composer-foot{display:flex; gap:.5rem; align-items:center}
.composer-foot .spacer{flex:1}

.entry{border-top:1px solid var(--rule); padding:1.15rem 0; display:flex; flex-direction:column; gap:.5rem}
.entry-meta{display:flex; gap:.55rem; align-items:center; flex-wrap:wrap}
.entry-meta time{font-size:.66rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.entry-text{white-space:pre-wrap; font-size:1rem}
.entry h4{font-family:var(--display); font-weight:600; font-size:1.2rem; line-height:1.16}
.entry .ctx{font-size:.82rem; color:var(--ink-3)}
.entry .kill{margin-left:auto; background:none; border:0; color:var(--ink-3);
  font-size:.66rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase}
.entry .kill:hover{color:var(--red)}

/* ---------------- ricerca ---------------- */
.searchbar{display:flex; gap:.5rem; margin:1.8rem 0 .4rem}
.searchbar input{
  flex:1; font-family:var(--display); font-weight:600; font-size:1.35rem;
  padding:.6rem .9rem; background:var(--paper); color:var(--ink); border:0;
  box-shadow:inset 0 0 0 1.5px var(--rule); border-radius:4px;
}
.searchbar input:focus{box-shadow:inset 0 0 0 2.5px var(--blue); outline:none}
mark{background:var(--yellow); color:#17181B; border-radius:2px; padding:0 .12em}

.empty{padding:3.2rem 0; color:var(--ink-3); font-size:.95rem; text-align:center; border-top:1px solid var(--rule)}
.empty b{display:block; font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:1.3rem; color:var(--ink-2); margin-bottom:.35rem}

.toast{
  position:fixed; left:50%; bottom:1.6rem; transform:translateX(-50%) translateY(1rem);
  background:var(--ink); color:var(--bone); padding:.6rem 1.15rem; border-radius:999px;
  font-size:.85rem; font-weight:600; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; z-index:60; max-width:90vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
/* col lettore aperto il messaggio sale sopra di lui, invece di finirci sotto */
body.has-player .toast{bottom:calc(6.6rem + env(safe-area-inset-bottom))}

/* ---------------- fili e previsioni ----------------
   Il filo e' la storia lunga di cui una notizia e' una puntata; la
   previsione e' quel che un rumor si impegna a far succedere. Entrambi
   vivono dentro le edizioni, quindi l'app li ricostruisce da sola. */
.chip.filo{
  background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); color:var(--ink-2);
  cursor:pointer; letter-spacing:.1em;
}
.chip.filo:hover{box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.chip.filo b{font-weight:700}

.claim{
  font-size:.9rem; color:var(--ink-2); background:var(--paper);
  padding:.75rem .9rem; border-radius:3px; box-shadow:inset 4px 0 0 var(--orange);
  display:flex; flex-direction:column; gap:.4rem;
}
.claim.closed{box-shadow:inset 4px 0 0 var(--blue)}
.claim .lbl{
  font-size:.6rem; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3);
}
.claim .txt{color:var(--ink); font-size:.95rem}
.claim .foot{display:flex; flex-wrap:wrap; gap:.35rem .9rem; align-items:center}
.verdict{
  font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  padding:.22rem .5rem; border-radius:2px; background:var(--paper-2); color:var(--ink-2);
}
.v-confermato{background:var(--blue); color:#17181B}
.v-parziale{background:var(--yellow); color:#17181B}
.v-smentito{background:var(--red); color:#FFF}
.v-scaduto{background:var(--ink); color:var(--bone)}
.v-aperto{background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); color:var(--ink-3)}

/* ---------------- i numeri che si muovono ----------------
   Una stima che cambia tre volte in un mese e' una notizia. La serie si
   legge da sinistra: le letture vecchie in grigio, l'ultima in evidenza. */
.numbers{background:var(--paper); border-radius:3px; padding:.35rem .9rem .6rem;
  box-shadow:inset 4px 0 0 var(--rule-strong)}
.numbers > .lbl{
  display:block; padding-top:.4rem; font-size:.6rem; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);
}
.num-row{padding:.55rem 0; border-top:1px solid var(--rule)}
.num-row:first-of-type{border-top:0}
.num-head{display:flex; gap:.5rem 1rem; align-items:baseline; flex-wrap:wrap}
.num-head .lab{font-size:.88rem; color:var(--ink-2); flex:1 1 10rem; min-width:0}
.num-head .val{
  font-family:var(--display); font-weight:700; font-size:1.22rem; line-height:1;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.kind{
  font-size:.55rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  padding:.15rem .4rem; border-radius:2px; background:var(--paper-2); color:var(--ink-3);
}
.kind.k-dato{background:var(--blue); color:#17181B}
.hist{display:flex; flex-wrap:wrap; gap:.25rem .45rem; align-items:baseline;
  margin-top:.3rem; font-size:.76rem; color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.hist .past{text-decoration:line-through; text-decoration-thickness:1px}
.hist .move{font-weight:700; letter-spacing:.02em}
.hist .up{color:var(--orange)}
.hist .down{color:var(--blue)}
.hist .flat{color:var(--ink-3)}
.hist .when{font-size:.68rem; letter-spacing:.06em; text-transform:uppercase}

/* ---------------- vista dei fili ---------------- */
.thread{border-top:1px solid var(--rule); padding:1.3rem 0 1.1rem}
.thread:first-of-type{border-top:1.5px solid var(--ink)}
.thread h3{
  font-family:var(--display); font-weight:600; font-size:1.5rem; line-height:1.12;
  letter-spacing:-.008em; margin-bottom:.3rem;
}
.thread .note{color:var(--ink-2); font-size:.94rem; margin-bottom:.15rem}
.thread .span{display:flex; flex-wrap:wrap; gap:.3rem 1.1rem; margin:.5rem 0 .9rem}
.timeline{list-style:none; margin:0; padding:0 0 0 .55rem; border-left:2px solid var(--rule)}
.timeline li{position:relative; padding:.42rem 0 .42rem .95rem}
.timeline li::before{
  content:""; position:absolute; left:-6px; top:.92rem; width:9px; height:9px;
  border-radius:50%; background:var(--rule-strong);
}
.timeline li.last::before{background:var(--orange)}
.timeline button{
  background:none; border:0; text-align:left; width:100%; padding:0;
  display:grid; grid-template-columns:auto 1fr; gap:.15rem .7rem; align-items:baseline;
}
.timeline .when{
  font-size:.63rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap;
}
.timeline .what{font-size:.97rem; line-height:1.4; color:var(--ink)}
.timeline button:hover .what{color:var(--accent-ink)}
.timeline .more{grid-column:1/-1; font-size:.88rem; color:var(--ink-2)}
@media (max-width:600px){
  .timeline button{grid-template-columns:1fr}
  .timeline .when{grid-column:1}
}
.thread .expand{
  background:none; border:0; padding:.5rem 0 0 .95rem; font-size:.78rem;
  font-weight:600; color:var(--ink-3);
}
.thread .expand:hover{color:var(--ink)}

/* ---------------- affidabilita' dei rumor: tre pallini ----------------
   Solo sui rumor: su una notizia confermata e' ovvia, e le parole
   "affidabilita' alta" su ogni scheda erano scritte in piu'. */
.meter{display:inline-flex; gap:3px; align-items:center; padding:0 .15rem}
.meter i{width:7px; height:7px; border-radius:50%; background:var(--rule-strong); display:block}
.meter.m-alta i.on{background:var(--blue)}
.meter.m-media i.on{background:var(--yellow)}
.meter.m-bassa i.on{background:var(--red)}
.chip.deep-mark{background:none; box-shadow:inset 0 0 0 1.5px var(--yellow); color:var(--yellow-ink)}

/* ---------------- approfondisci ---------------- */
.deep-acts{display:flex; flex-wrap:wrap; gap:.5rem; margin:.2rem 0 .1rem}
.deep-open{
  display:inline-flex; align-items:center; gap:.5rem; border:0; border-radius:999px;
  padding:.5rem 1.05rem; font-family:var(--display); font-weight:700; font-size:.95rem;
  letter-spacing:.04em; text-transform:uppercase; cursor:pointer;
}
.deep-open{background:var(--yellow); color:#17181B}
.deep-open i{font-style:normal; transition:transform .2s}
.deep-open.on i{transform:rotate(180deg)}

.deep{
  margin:.4rem 0 .6rem; padding:1.1rem 0 .4rem; border-top:3px solid var(--ink);
  display:flex; flex-direction:column; gap:1.1rem;
}
.deep[hidden]{display:none}
.deep-top{display:flex; align-items:center; gap:.6rem}
.deep-top .dots{display:flex; gap:3px}
.deep-top .dots i{width:9px; height:9px; border-radius:50%; display:block}
/* l'approfondimento come articolo: titolo suo, sommario, numeri, testo,
   voci, letture — una colonna sola, niente schede */
.deep-title{font-family:var(--display); font-weight:700; font-size:clamp(1.45rem, 4.6vw, 1.85rem);
  line-height:1.08; letter-spacing:-.008em; margin:-.2rem 0 0; text-wrap:balance}
.deep-deck{font-size:1.06rem; line-height:1.48; color:var(--ink-2); margin:-.35rem 0 0; text-wrap:pretty}
.deep-nums{display:grid; grid-template-columns:repeat(auto-fit, minmax(118px, 1fr)); gap:.9rem 1rem;
  padding:.85rem 0; border-top:1.5px solid var(--ink); border-bottom:1px solid var(--rule)}
.deep-num{display:flex; flex-direction:column; gap:.2rem; padding-left:.7rem; border-left:4px solid var(--orange)}
.deep-num:nth-child(2){border-left-color:var(--blue)}
.deep-num:nth-child(3){border-left-color:var(--red)}
.deep-num b{font-family:var(--display); font-weight:700; font-size:1.7rem; line-height:1; letter-spacing:-.01em}
.deep-num span{font-size:.82rem; line-height:1.35; color:var(--ink-2); hyphens:auto; overflow-wrap:break-word}
.deep-num small{font-size:.56rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.deep-body{display:flex; flex-direction:column; gap:.95rem}
.deep-body p{font-size:1.02rem; line-height:1.66; margin:0}
/* il capolettera arancione, come l'attacco di un pezzo di rivista */
.deep-body > p:first-child::first-letter{float:left; font-family:var(--display); font-weight:700;
  font-size:3.3em; line-height:.82; padding:.06em .1em 0 0; color:var(--orange)}
.deep-part{display:flex; flex-direction:column; gap:.75rem}
/* ---------------- tutte le novita' ----------------
   L'elenco completo di un rilascio: il numero grande nel condensato, i pallini
   dei sistemi che si accendono, poi per sistema e per area una riga a voce. */
.novita{margin:1.1rem 0 .4rem; padding-top:.9rem; border-top:4px solid var(--ink)}
.nov-head{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:.2rem .8rem}
.nov-n{font-family:var(--display); font-weight:800; font-size:2.6rem; line-height:.85; letter-spacing:-.01em;
  color:var(--ink); font-variant-numeric:tabular-nums}
.nov-title{min-width:0; display:flex; flex-direction:column; gap:.2rem}
.nov-h{margin:0; font-family:var(--display); font-weight:800; font-size:1.15rem; letter-spacing:.03em;
  text-transform:uppercase; line-height:1; color:var(--ink)}
.nov-of{font-size:.72rem; color:var(--ink-3); line-height:1.3}
.nov-meter{display:flex; gap:5px; align-self:start; padding-top:.2rem}
.nov-meter i{width:10px; height:10px; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--rule-strong)}
.nov-meter i.on{background:var(--c, var(--ink)); box-shadow:none}
.nov-sys{margin-top:1rem}
.nov-sys-h{display:flex; align-items:center; gap:.5rem; margin:0 0 .3rem; padding-bottom:.35rem;
  border-bottom:2px solid var(--ink); font-family:var(--display); font-weight:800; font-size:1rem;
  letter-spacing:.04em; text-transform:uppercase; color:var(--ink)}
.nov-sys-h b{margin-left:auto; font-weight:700; font-size:.85rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.nov-pip{width:11px; height:11px; border-radius:50%; flex:none; background:var(--c, var(--ink))}
.nov-area{margin-top:.55rem}
.nov-area-h{margin:0 0 .1rem; font-size:.6rem; font-weight:700; letter-spacing:.17em; text-transform:uppercase; color:var(--ink-3)}
.nov-list{list-style:none; margin:0; padding:0}
.nov-item{display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"c s" "d d";
  gap:.15rem .8rem; padding:.5rem 0; border-top:1px solid var(--rule)}
.nov-list .nov-item:first-child{border-top:0}
.nov-cosa{grid-area:c; font-size:.95rem; line-height:1.35; color:var(--ink); text-wrap:pretty}
.nov-det{grid-area:d; font-size:.8rem; line-height:1.4; color:var(--ink-2); text-wrap:pretty}
.nov-src{grid-area:s; align-self:start; padding-top:.15rem; font-family:var(--display); font-weight:700; font-size:.78rem;
  letter-spacing:.02em; color:var(--ink-3); text-decoration:none; white-space:nowrap}
a.nov-src:hover{color:var(--ink); text-decoration:underline}
.novita.is-short .nov-extra{display:none}
.nov-more{margin-top:.7rem; width:100%; padding:.7rem 1rem; border:0; border-radius:999px; cursor:pointer;
  background:var(--ink); color:var(--bone); font-family:var(--display); font-weight:800; font-size:.9rem;
  letter-spacing:.06em; text-transform:uppercase}
.nov-more:hover{background:var(--ink-2)}
.card-nov{font-family:var(--display); font-weight:700; font-size:.74rem; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-2); white-space:nowrap; padding-left:.65rem; border-left:1px solid var(--rule-strong)}
.deep-h{font-size:.62rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3);
  margin:0; padding-top:.95rem; border-top:1px solid var(--rule)}
.deep-voci{display:flex; flex-direction:column; gap:1rem}
.voce-link{text-decoration:none; color:inherit; display:block}
.voce{margin:0; padding:.05rem 0 .05rem 1rem; border-left:3px solid var(--ink)}
.voce.v-social{border-left-color:var(--yellow)}
.voce.v-apple{border-left-color:var(--blue)}
.voce.v-storia{border-left-color:var(--rule-strong)}
.voce blockquote{margin:0; font-family:var(--display); font-weight:500; font-size:1.16rem; line-height:1.28; text-wrap:pretty}
.voce blockquote::before{content:"«"}
.voce blockquote::after{content:"»"}
.voce figcaption{display:flex; flex-wrap:wrap; gap:.15rem .6rem; align-items:baseline; margin-top:.4rem; font-size:.8rem; color:var(--ink-3)}
.voce figcaption b{font-weight:700; color:var(--ink)}
.voce figcaption .sig{font-size:.6rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase}
.voce-link:hover blockquote{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px}
.deep-foot{font-size:.62rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}

/* ---------------- il lettore: la barra in fondo mentre ascolti ---------------- */
.player{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(.9rem + env(safe-area-inset-bottom));
  z-index:70; width:min(560px, calc(100% - 1.4rem));
  background:var(--ink); color:var(--bone); border-radius:14px; box-shadow:0 12px 36px -12px rgba(0,0,0,.55);
  display:grid; grid-template-columns:auto 1fr auto auto; gap:.2rem .75rem; align-items:center;
  padding:.6rem .7rem .6rem .6rem;
}
.player[hidden]{display:none}
.player .pp{
  width:44px; height:44px; border-radius:50%; border:0; background:var(--yellow); color:#17181B;
  font-size:1rem; display:grid; place-items:center; cursor:pointer;
}
.player .what{min-width:0; display:flex; flex-direction:column; gap:.1rem}
.player .what b{font-family:var(--display); font-weight:600; font-size:.98rem; line-height:1.15;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.player .what span{font-size:.62rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; opacity:.7}
/* la traccia: una fascia da 24px che si tocca bene, con la linea da 3px al centro */
.player .bar{grid-column:1 / -1; position:relative; height:24px; margin:-7px 0 -9px; cursor:pointer; touch-action:manipulation;
  background:linear-gradient(color-mix(in srgb, var(--bone) 30%, transparent), color-mix(in srgb, var(--bone) 30%, transparent)) center / 100% 3px no-repeat}
.player .bar i{position:absolute; left:0; top:50%; height:3px; margin-top:-1.5px; width:0; border-radius:2px;
  background:var(--yellow); transition:width .3s}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .player .bar i{background:var(--bone)} }
:root[data-theme="dark"] .player .bar i{background:var(--bone)}
.player .sp,.player .x{
  border:0; background:none; color:var(--bone); cursor:pointer; font-weight:700; font-size:.8rem;
  padding:.4rem .45rem; border-radius:6px; opacity:.85;
}
.player .sp:hover,.player .x:hover{background:rgba(255,255,255,.1); opacity:1}

/* ---------------- visualizzazioni degli approfondimenti ----------------
   Tutte nello stesso sistema: fondo carta, campiture piatte, i quattro
   colori con il loro ruolo, condensato per i numeri grandi. */
.vis{margin:0; background:var(--paper); border-radius:8px; padding:1rem 1rem .9rem;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:.7rem; overflow:hidden}
.vis-title{font-family:var(--display); font-weight:700; font-size:1.12rem; line-height:1.15; text-transform:uppercase; letter-spacing:.01em}
.vis-cap{font-size:.86rem; line-height:1.5; color:var(--ink-2)}
.vis-src{font-size:.6rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.vis-svg{width:100%; height:auto; display:block; overflow:visible}
.vis-canvas{width:100%; display:block; border-radius:4px}
.vis-canvas.tap{cursor:crosshair; touch-action:manipulation}
.vis-controls{display:flex; align-items:center; gap:.8rem; flex-wrap:wrap}
.vis-controls input[type=range]{flex:1 1 160px; accent-color:var(--orange); min-width:0}
.vis-controls .lbl{display:flex; align-items:baseline; gap:.45rem; font-size:.62rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.vis .big{font-family:var(--display); font-weight:700; font-size:1.7rem; line-height:1; color:var(--ink); letter-spacing:0}
.vis-btn{border:0; border-radius:999px; background:var(--ink); color:var(--bone); padding:.45rem 1rem;
  font-family:var(--display); font-weight:700; font-size:.88rem; letter-spacing:.05em; text-transform:uppercase; cursor:pointer}
.vis-toggle{display:inline-flex; align-self:flex-start; background:var(--paper-2); border-radius:999px; padding:3px}
.vis-toggle button{border:0; background:none; border-radius:999px; padding:.38rem .9rem; cursor:pointer;
  font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.vis-toggle button[aria-selected=true]{background:var(--ink); color:var(--bone)}
.vis-legend{display:flex; gap:1rem; font-size:.7rem; color:var(--ink-3); align-items:center}
.vis-legend span{display:inline-flex; gap:.35rem; align-items:center}
.vis-legend .lg{width:11px; height:11px; border-radius:50%; display:block}
.vis-legend .lg.ring{box-shadow:inset 0 0 0 2.5px var(--orange)}
.vis-legend .lg.full{background:var(--blue)}

/* stime */
.vis-stime .grid{stroke:var(--rule); stroke-width:1}
.vis-stime .ax{fill:var(--ink-3); font-size:15px; font-weight:600}
.vis-stime .line{fill:none; stroke:var(--ink-3); stroke-width:2.5; stroke-dasharray:0}
.vis-stime .tip{fill:var(--ink-2); font-size:17px; font-weight:700}
.vis-stime .pt{cursor:pointer}
.vis-stime .pt circle{fill:var(--paper); stroke:var(--orange); stroke-width:4}
.vis-stime .pt.real circle{fill:var(--blue); stroke:none}
.vis-stime .pt.sel circle{stroke:var(--ink); stroke-width:5}
.vis-stime .val{fill:var(--ink); font-size:18px; font-weight:800}

/* barre */
.bars{display:flex; flex-direction:column; gap:.95rem}
.bar-head{display:flex; justify-content:space-between; gap:.8rem; align-items:baseline}
.bar-label{font-size:.9rem; color:var(--ink-2)}
.bar-head b{font-family:var(--display); font-weight:700; font-size:1.2rem; white-space:nowrap}
.bar-track{position:relative; height:14px; background:var(--paper-2); border-radius:3px; margin-top:.3rem; overflow:hidden}
.bar-full,.bar-ext{position:absolute; top:0; bottom:0; left:0; width:0; transition:width 1.1s cubic-bezier(.2,.8,.2,1), left 1.1s cubic-bezier(.2,.8,.2,1)}
.bar-ext{border:2px dashed; border-left:0; border-radius:0 3px 3px 0; box-sizing:border-box; opacity:.8}
.bar-note{display:block; font-size:.72rem; color:var(--ink-3); margin-top:.25rem}

/* resa */
.vis-resa .counts{font-size:.72rem; font-weight:600; letter-spacing:.06em; color:var(--ink-3); font-variant-numeric:tabular-nums}
.vis-resa .need{font-size:.98rem; line-height:1.45}
.vis-resa .need b{font-family:var(--display); font-size:1.3rem; color:var(--red)}

/* densita */
.dens-read{font-size:.92rem; line-height:1.45; color:var(--ink-2); min-height:2.8em}
.vis-btn.ghost{background:none; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--rule-strong)}
/* supporto */
.sup-svg{max-width:420px; align-self:center}
.sup-wall{fill:transparent}
.sup-wall.on{fill:var(--paper-2)}
.sup-shadow{fill:rgba(0,0,0,.18)}
.sup-base{fill:var(--bone); stroke:var(--rule-strong); stroke-width:1.5}
.sup-base.flat{fill:var(--rule-strong)}
.sup-hole{fill:var(--ink-3)}
.sup-arm{fill:none; stroke:var(--ink-3); stroke-width:9; stroke-linecap:round}
.sup-arm-hi{fill:none; stroke:rgba(255,255,255,.45); stroke-width:2.5; stroke-linecap:round; transform:translateX(-2px)}
.sup-frame{fill:#111215}
.sup-glass{fill:#1d2a3a}
.sup-sheen{fill:#fff}
.sup-clock{fill:#F1EEE8; font-family:var(--display); font-weight:700; font-size:30px}
.sup-dim{stroke:var(--orange); stroke-width:1.5}
.sup-dimt{fill:var(--orange); font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase}
.sup-note{font-size:.92rem; line-height:1.45; color:var(--ink-2); min-height:1.4em}
/* roadmap */
.rm-wrap{overflow-x:auto; margin:0 -.2rem; padding:0 .2rem}
.rm-grid{display:grid; grid-template-columns:minmax(6.5rem, 1.2fr) repeat(var(--cols), minmax(5.4rem, 1fr)); gap:.35rem .4rem; align-items:center; min-width:min-content}
.rm-h{font-size:.58rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.rm-line{font-family:var(--display); font-weight:600; font-size:.95rem; line-height:1.15}
.rm-cell{min-height:2rem; display:flex; align-items:center}
.rm-chip{border:0; border-radius:999px; padding:.3rem .65rem; font-size:.74rem; font-weight:700; cursor:pointer; white-space:nowrap; color:#17181B}
.rm-chip.uscito{background:var(--blue)}
.rm-chip.previsto{background:var(--yellow)}
.rm-chip.saltato{background:none; color:var(--red); box-shadow:inset 0 0 0 1.5px var(--red); text-decoration:line-through}
.rm-chip.sel{outline:2px solid var(--ink); outline-offset:2px}
.rm-grid .rm-chip.in{animation:rmIn .35s ease both}
@keyframes rmIn{from{opacity:0; transform:scale(.8)}to{opacity:1; transform:none}}
.rm-legend{display:flex; gap:.4rem; flex-wrap:wrap}
.rm-legend .rm-chip{cursor:default; font-size:.62rem}
.rm-info{font-size:.92rem; line-height:1.45; color:var(--ink-2)}
.rm-tl{display:none; list-style:none; margin:0; padding:0 0 0 .9rem; border-left:2px solid var(--rule)}
.rm-per{position:relative; padding:.1rem 0 .7rem}
.rm-per::before{content:""; position:absolute; left:calc(-.9rem - 6px); top:.25rem; width:10px; height:10px; border-radius:50%; background:var(--ink)}
.rm-per ul{list-style:none; margin:.35rem 0 0; padding:0; display:flex; flex-direction:column; gap:.35rem}
.rm-row{display:flex; align-items:center; gap:.55rem; font-family:var(--display); font-weight:600; font-size:.98rem}
.rm-tl .rm-chip.in{animation:rmIn .35s ease both}
@media (max-width:600px){ .vis-roadmap .rm-wrap{display:none} .vis-roadmap .rm-tl{display:block} }
/* catena */
.ch-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.ch-step{display:grid; grid-template-columns:2rem 1fr; gap:.7rem; padding:.45rem 0; position:relative; cursor:pointer; opacity:.45; transition:opacity .3s}
.ch-step:not(:last-child)::after{content:""; position:absolute; left:.95rem; top:2.2rem; bottom:-.45rem; width:2px; background:var(--rule)}
.ch-step.on{opacity:1}
.ch-step.on .ch-dot{background:var(--red); color:#fff}
.ch-step.off{opacity:.25; text-decoration:line-through}
.ch-dot{width:2rem; height:2rem; border-radius:50%; display:grid; place-items:center; background:var(--paper-2); font-weight:700; font-size:.8rem; transition:background .3s}
.ch-t{display:flex; flex-direction:column; gap:.1rem}
.ch-t b{font-family:var(--display); font-weight:600; font-size:1.02rem; line-height:1.2}
.ch-t span{font-size:.86rem; line-height:1.4; color:var(--ink-2)}
.ch-stop{display:none; grid-template-columns:2rem 1fr; gap:.7rem; align-items:center; padding:.5rem .6rem; margin:.2rem 0;
  background:var(--blue); color:#17181B; border-radius:8px; font-size:.88rem; font-weight:600}
.vis-catena.safe .ch-stop{display:grid}
.ch-shield{width:2rem; height:2rem; border-radius:50%; background:#17181B; color:var(--blue); display:grid; place-items:center; font-weight:700}
.ch-info{font-size:.92rem; line-height:1.45; color:var(--ink-2); min-height:1.4em}
/* chat */
.chat-phone{align-self:center; width:min(100%, 340px); background:var(--bone); border-radius:22px; box-shadow:inset 0 0 0 1.5px var(--rule); overflow:hidden}
.chat-head{display:flex; align-items:center; gap:.5rem; padding:.6rem .8rem; border-bottom:1px solid var(--rule); font-size:.9rem}
.chat-av{width:1.8rem; height:1.8rem; border-radius:50%; background:var(--red); color:#fff; display:grid; place-items:center; font-weight:700}
.chat-list{height:300px; overflow-y:auto; padding:.7rem; display:flex; flex-direction:column; gap:.4rem; scroll-behavior:smooth}
.chat-b{max-width:82%; padding:.45rem .7rem; border-radius:16px; font-size:.88rem; line-height:1.35; animation:chatIn .25s ease}
.chat-b.me{align-self:flex-end; background:#0A84FF; color:#fff; border-bottom-right-radius:4px}
.chat-b.it{align-self:flex-start; background:var(--paper-2); color:var(--ink); border-bottom-left-radius:4px}
.chat-b.typing{display:flex; gap:3px; padding:.6rem .7rem}
.chat-b.typing i{width:6px; height:6px; border-radius:50%; background:var(--ink-3); animation:chatDot 1s infinite}
.chat-b.typing i:nth-child(2){animation-delay:.15s} .chat-b.typing i:nth-child(3){animation-delay:.3s}
.chat-cart{margin-top:.45rem; background:var(--paper); border-radius:10px; padding:.45rem .55rem; display:flex; flex-direction:column; gap:.3rem}
.chat-item{display:flex; align-items:center; gap:.45rem; font-size:.82rem}
.chat-item i{width:26px; height:26px; border-radius:6px; background:linear-gradient(135deg, var(--orange), var(--yellow))}
.chat-pay{align-self:flex-start; margin-top:.2rem; background:#17181B; color:#fff; border-radius:999px; padding:.25rem .7rem; font-size:.74rem; font-weight:700}
@keyframes chatIn{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
@keyframes chatDot{0%,100%{opacity:.3}50%{opacity:1}}

/* piega: il Duo in 3D */
.duo-stage{height:250px; perspective:1100px; display:grid; place-items:center; cursor:grab; touch-action:pan-y;
  background:radial-gradient(circle at 50% 60%, var(--paper-2), transparent 70%)}
.duo-stage:active{cursor:grabbing}
.duo-rig{position:relative; width:220px; height:152px; transform-style:preserve-3d}
.duo-half{position:absolute; top:0; width:110px; height:152px; transform-style:preserve-3d}
.duo-l{left:0; transform:translateZ(-1px)}
.duo-r{left:110px; transform-origin:0 50%}
.duo-face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--duo-frame, #E9E6E0); box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.duo-l .duo-face{border-radius:14px 0 0 14px}
.duo-r .duo-face{border-radius:0 14px 14px 0}
.duo-in{padding:6px; background:#0d0e12}
/* lo sfondo e' uno solo, largo il doppio: ogni meta' ne mostra la sua parte,
   cosi' da aperto l'immagine continua da uno schermo all'altro */
.duo-in::after{content:""; position:absolute; inset:5px; border-radius:inherit;
  background:radial-gradient(circle at 18% 30%, var(--orange) 0 5%, transparent 5.5%),
             radial-gradient(circle at 44% 64%, var(--blue) 0 7%, transparent 7.5%),
             radial-gradient(circle at 62% 26%, var(--red) 0 4.5%, transparent 5%),
             radial-gradient(circle at 80% 72%, var(--yellow) 0 6%, transparent 6.5%),
             radial-gradient(circle at 30% 82%, var(--yellow) 0 3.5%, transparent 4%),
             linear-gradient(160deg, #1d2130, #0f1116);
  background-size:200% 100%}
.duo-l .duo-in::after{border-radius:10px 0 0 10px; background-position:0 0}
.duo-r .duo-in::after{border-radius:0 10px 10px 0; background-position:100% 0}
.duo-back{transform:rotateY(180deg)}
.duo-l .duo-back{border-radius:0 14px 14px 0}
.duo-r .duo-back{border-radius:14px 0 0 14px}
.duo-outer{padding:8px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2px;
  background:#101216; color:#fff}
.duo-outer .duo-clock{font-family:var(--display); font-weight:700; font-size:34px; line-height:1}
.duo-outer .duo-date{font-size:8px; letter-spacing:.08em; text-transform:uppercase; opacity:.75}
.duo-cam{position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:9px; background:rgba(0,0,0,.14);
  display:grid; grid-template-columns:1fr 1fr; gap:3px; padding:5px}
.duo-cam i{width:11px; height:11px; border-radius:50%; background:#1b1d22; box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.duo-state{font-family:var(--display); font-weight:700; font-size:1.05rem; text-transform:uppercase; letter-spacing:.03em; text-align:center}
.duo-colors{display:flex; align-items:center; gap:.6rem}
.duo-swatches{display:flex; gap:.45rem}
.duo-swatches .sw{width:26px; height:26px; border-radius:50%; border:0; cursor:pointer; box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25)}
.duo-swatches .sw.on{box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--ink)}
.duo-colors .sw-name{font-size:.72rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}

/* anno */
.vis-anno .anno{max-width:360px; margin:0 auto}
.vis-anno .ring{fill:none; stroke:var(--rule-strong); stroke-width:10}
.vis-anno .band{fill:none; stroke:var(--yellow); stroke-width:10; transition:opacity .6s}
.vis-anno .tick{stroke:var(--paper); stroke-width:2}
.vis-anno .mo{fill:var(--ink-3); font-size:13px; font-weight:700}
.vis-anno .ev{cursor:pointer}
.vis-anno .ev circle{fill:var(--blue); stroke:var(--paper); stroke-width:3; transition:r .2s}
.vis-anno .ev.sel circle{fill:var(--orange)}
.vis-anno .big{font-family:var(--display); font-size:64px; font-weight:700; fill:var(--ink)}
.vis-anno .small{font-size:12px; font-weight:700; letter-spacing:.08em; fill:var(--ink-3); text-transform:uppercase}
.anno-detail{text-align:center; font-size:.92rem; min-height:1.4em; color:var(--ink-2)}

/* raggio */
.raggio-count{font-family:var(--display); font-weight:700; font-size:1.05rem; text-transform:uppercase; letter-spacing:.02em}

/* flusso */
.vis-flusso .road{fill:none; stroke:var(--rule-strong); stroke-width:10; stroke-linecap:round}
.vis-flusso .node{stroke:var(--paper); stroke-width:4}
.vis-flusso .node.you{fill:var(--ink)}
.vis-flusso .node.shop{fill:var(--ink)}
.vis-flusso .node.sink{fill:var(--blue); transition:fill .4s}
.vis-flusso .mid{fill:var(--blue); transition:fill .4s}
.vis-flusso .nlabel{fill:var(--bone); font-size:19px; font-weight:800; pointer-events:none}
.vis-flusso .nlabel.out{fill:var(--ink); font-size:21px}
.vis-flusso .coin{fill:var(--yellow); stroke:#17181B; stroke-width:1.5}
.vis-flusso.agent .mid{fill:var(--red)}
.vis-flusso.agent .node.sink{fill:var(--red)}
.flusso-note{font-size:.95rem; line-height:1.5; min-height:3em}

@media (max-width:600px){
  .vis-flusso .nlabel{font-size:23px}
  .vis-flusso .nlabel.out{font-size:25px}
  .vis-stime .ax{font-size:20px} .vis-stime .val{font-size:22px} .vis-stime .tip{font-size:22px}
}

/* esploso */
.xp-scene{height:280px; perspective:1000px; display:grid; place-items:center; overflow:visible}
.xp-stack{position:relative; width:200px; height:146px; transform-style:preserve-3d;
  transform:rotateX(58deg) rotateZ(-38deg); transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.xp-plate{position:absolute; inset:0; border:0; padding:0; background:none; cursor:pointer; transform-style:preserve-3d;
  transform:translateZ(calc(var(--i) * 6px)); transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.vis-esploso.open .xp-plate{transform:translateZ(calc(var(--i) * 46px))}
.vis-esploso.open .xp-stack{transform:rotateX(62deg) rotateZ(-38deg) translateZ(-60px)}
.xp-face{position:absolute; inset:0; border-radius:18px; background:var(--c); opacity:.92;
  box-shadow:0 0 0 2px var(--paper) inset, 0 10px 24px -12px rgba(0,0,0,.6)}
.xp-plate.warn .xp-face{background:repeating-linear-gradient(45deg, var(--c) 0 10px, color-mix(in srgb, var(--c) 70%, #fff) 10px 20px)}
.xp-plate.sel .xp-face{box-shadow:0 0 0 4px var(--yellow) inset, 0 10px 24px -12px rgba(0,0,0,.6)}
.xp-tag{position:absolute; left:100%; top:50%; margin-left:26px; white-space:nowrap;
  transform:rotateZ(38deg) rotateX(-58deg); transform-origin:0 0;
  font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink);
  background:var(--paper); padding:2px 6px; border-radius:3px; opacity:0; transition:opacity .4s .3s}
.vis-esploso.open .xp-tag{opacity:1}
