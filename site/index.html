<title>The Morning Brief</title>

<style>
/* =========================================================
   Identità: campiture piatte, campo di pallini, condensato
   pesante su fondo osso — riferimento alla sigla di
   The Morning Show. Quattro colori saturi con ruolo
   semantico: giallo = rumor, blu = confermato, arancio =
   dati, rosso = analisi e opinione.
   ========================================================= */
:root{
  --bone:#EDEAE3;
  --paper:#F8F6F2;
  --paper-2:#E3DFD6;
  --ink:#17181B;
  --ink-2:#4B4D53;
  --ink-3:#7C7F87;
  --rule:#D7D2C7;
  --rule-strong:#BDB7AA;

  --yellow:#F5C518;
  --orange:#F0821E;
  --red:#E01F3D;
  --blue:#0E9CD8;
  --brand:#E0AB00;

  --yellow-ink:#7A5F00;
  --orange-ink:#93490A;
  --red-ink:#A5122A;
  --blue-ink:#0A5E82;

  --accent:var(--orange);
  --accent-ink:#93490A;
  --on-fill:#17181B;
  --ok:#2C7A46;

  --display:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue",
            "Arial Narrow",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;

  --gutter:clamp(1.1rem,4.5vw,3rem);
  --shadow:0 2px 3px rgba(23,24,27,.05), 0 14px 34px -22px rgba(23,24,27,.45);
}

@media (prefers-color-scheme:dark){
  :root{
    --bone:#131418; --paper:#1B1D22; --paper-2:#24272E;
    --ink:#F1EEE8; --ink-2:#B5B3AD; --ink-3:#84868D;
    --rule:#2B2E35; --rule-strong:#414550;
    --yellow:#F7CE3C; --orange:#F8963A; --red:#F0435C; --blue:#35B6EC;
    --brand:#F7CE3C;
    --yellow-ink:#F7CE3C; --orange-ink:#F8963A; --red-ink:#F0435C; --blue-ink:#35B6EC;
    --accent:#F8963A; --accent-ink:#F8963A; --on-fill:#131418; --ok:#6FBF87;
    --shadow:0 2px 4px rgba(0,0,0,.5), 0 16px 38px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bone:#131418; --paper:#1B1D22; --paper-2:#24272E;
  --ink:#F1EEE8; --ink-2:#B5B3AD; --ink-3:#84868D;
  --rule:#2B2E35; --rule-strong:#414550;
  --yellow:#F7CE3C; --orange:#F8963A; --red:#F0435C; --blue:#35B6EC;
  --brand:#F7CE3C;
  --yellow-ink:#F7CE3C; --orange-ink:#F8963A; --red-ink:#F0435C; --blue-ink:#35B6EC;
  --accent:#F8963A; --accent-ink:#F8963A; --on-fill:#131418; --ok:#6FBF87;
  --shadow:0 2px 4px rgba(0,0,0,.5), 0 16px 38px -24px rgba(0,0,0,.9);
}
:root[data-theme="light"]{
  --bone:#EDEAE3; --paper:#F8F6F2; --paper-2:#E3DFD6;
  --ink:#17181B; --ink-2:#4B4D53; --ink-3:#7C7F87;
  --rule:#D7D2C7; --rule-strong:#BDB7AA;
  --yellow:#F5C518; --orange:#F0821E; --red:#E01F3D; --blue:#0E9CD8;
  --brand:#E0AB00;
  --yellow-ink:#7A5F00; --orange-ink:#93490A; --red-ink:#A5122A; --blue-ink:#0A5E82;
  --accent:#F0821E; --accent-ink:#93490A; --on-fill:#17181B; --ok:#2C7A46;
  --shadow:0 2px 3px rgba(23,24,27,.05), 0 14px 34px -22px rgba(23,24,27,.45);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--bone); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.62;
  -webkit-text-size-adjust:100%; overflow-x:clip;
}
h1,h2,h3,h4{margin:0; line-height:1.08; text-wrap:balance}
p{margin:0}
a{color:var(--accent-ink); text-underline-offset:3px; text-decoration-thickness:from-font}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

.eyebrow{
  font-size:.63rem; font-weight:600; letter-spacing:.19em;
  text-transform:uppercase; color:var(--ink-3);
}

/* ---------------- marchio ---------------- */
/* Il marchio ricalca la sigla di The Morning Show: tre righe incolonnate sulla
   larghezza della parola grande — "The" piccolo in alto a filo sinistro, la
   parola grande con la O sostituita da un cerchio pieno, la terza parola
   piccola sotto a filo destro. Tutto in stampatello, tutto giallo. */
.wordmark{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  color:var(--brand); letter-spacing:-.012em; line-height:.84;
  display:grid; grid-template-columns:auto; justify-content:start;
}
.wordmark .the{font-size:.33em; letter-spacing:.06em; justify-self:start; padding-bottom:.1em}
.wordmark .mrn{font-size:1em; white-space:nowrap}
.wordmark .brf{font-size:.36em; letter-spacing:.06em; justify-self:end; padding-top:.16em}
/* la O piena: un cerchio poco piu' alto delle maiuscole, come nella sigla */
.wordmark .o{
  display:inline-block; width:.73em; height:.73em; border-radius:50%;
  background:currentColor; vertical-align:-.035em; margin:0 .015em;
}

/* ---------------- accesso ---------------- */
.gate{
  position:fixed; inset:0; z-index:100; background:var(--bone);
  display:grid; place-items:center; padding:var(--gutter);
}
.gate[hidden]{display:none}
.gate-card{width:100%; max-width:23rem; display:flex; flex-direction:column; gap:1.1rem}
.gate canvas{display:block; width:100%; height:60px}
.gate .wordmark{font-size:2.6rem}
.gate form{display:flex; flex-direction:column; gap:.55rem}
.gate input{
  font:inherit; font-size:1rem; padding:.65rem .8rem; background:var(--paper);
  color:var(--ink); border:0; box-shadow:inset 0 0 0 1.5px var(--rule); border-radius:4px;
}
.gate input:focus{box-shadow:inset 0 0 0 2.5px var(--blue); outline:none}
.gate .err{color:var(--red); font-size:.85rem; min-height:1.2rem}
.gate .hint{font-size:.85rem; color:var(--ink-3); line-height:1.5}

/* ---------------- testata ---------------- */
.masthead{
  position:sticky; top:0; z-index:30; background:var(--bone);
  border-bottom:2px solid var(--ink);
}
.masthead[hidden]{display:none}
.masthead-inner{max-width:1240px; margin:0 auto; padding:.55rem var(--gutter) 0}
.brand{display:flex; align-items:center; gap:.7rem}
.brand .wordmark{font-size:1.62rem}
.dot-mark{display:flex; gap:3px; align-items:center}
.dot-mark i{width:9px; height:9px; border-radius:50%; display:block}
.brand .edition{
  font-size:.63rem; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap;
}
.brand-tools{margin-left:auto; display:flex; gap:.15rem; align-items:center}
.icon-btn{
  background:none; border:0; color:var(--ink-3); width:34px; height:34px;
  border-radius:50%; display:grid; place-items:center; font-size:1rem;
  transition:background .15s, color .15s;
}
.icon-btn:hover{background:var(--paper-2); color:var(--ink)}
#syncPip{
  width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none;
  margin:0 .35rem 0 .15rem; transition:background .2s, opacity .2s;
}
#syncPip[data-state="busy"]{background:var(--blue); animation:pulse 1s ease-in-out infinite}
#syncPip[data-state="offline"]{background:var(--rule-strong)}
#syncPip[data-state="error"]{background:var(--red)}
@keyframes pulse{50%{opacity:.25}}

nav.tabs{display:flex; overflow-x:auto; scrollbar-width:none; margin-top:.35rem}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs.more-right{
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
}
nav.tabs.more-left.more-right{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 34px),transparent);
}
nav.tabs.more-left:not(.more-right){
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22px);
  mask-image:linear-gradient(90deg,transparent,#000 22px);
}
.tab{
  background:none; border:0; padding:.5rem 0 .65rem; margin-right:1.5rem; white-space:nowrap;
  font-family:var(--display); font-size:1rem; font-weight:600; text-transform:uppercase;
  letter-spacing:.05em; color:var(--ink-3); position:relative; transition:color .15s;
}
.tab[hidden]{display:none}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{color:var(--ink)}
.tab[aria-current="true"]::after{
  content:""; position:absolute; left:0; right:0; bottom:-2px; height:4px; background:var(--orange);
}
.tab .count{
  font-family:var(--body); font-size:.6rem; font-weight:700; color:var(--ink-3);
  margin-left:.35rem; vertical-align:.35em; letter-spacing:0;
}

/* schermi stretti: la testata sta dentro la finestra, niente scorrimento laterale */
@media (max-width:600px){
  .brand{gap:.5rem; min-width:0}
  .brand .wordmark{font-size:1.22rem; min-width:0}
  .brand .edition{display:none}
  .dot-mark i{width:7px; height:7px}
  .brand-tools{gap:0}
  .icon-btn{width:29px; height:29px; font-size:.92rem}
  #syncPip{margin:0 .2rem 0 .1rem}
  .tab{font-size:.82rem; margin-right:.95rem; letter-spacing:.03em}
  .tab:last-child{margin-right:0}
}
.tab.more{display:none}
.masthead-inner{position:relative}
.tabmenu{
  position:absolute; right:var(--gutter); top:100%; z-index:20; min-width:11rem;
  background:var(--paper); border-radius:6px; box-shadow:var(--shadow), 0 0 0 1.5px var(--rule);
  padding:.4rem; display:flex; flex-direction:column;
}
.tabmenu[hidden]{display:none}
.tabmenu button{
  background:none; border:0; text-align:left; padding:.6rem .8rem; border-radius:4px;
  font-family:var(--display); font-weight:600; font-size:1rem; text-transform:uppercase;
  letter-spacing:.05em; color:var(--ink-2);
}
.tabmenu button:hover{background:var(--paper-2); color:var(--ink)}
.tabmenu .count{font-family:var(--body); font-size:.6rem; font-weight:700; color:var(--ink-3); margin-left:.35rem; vertical-align:.35em; letter-spacing:0}

/* ---------------- impaginato ---------------- */
main{max-width:1240px; margin:0 auto; padding:0 var(--gutter) 5rem}
.view[hidden]{display:none}
.columns{display:block}
.rail{display:none}
@media (min-width:1040px){
  .columns{display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:4rem; align-items:start}
  .rail{display:block; position:sticky; top:7.2rem; padding-top:2.6rem}
}
.col-main{min-width:0; max-width:70ch}

.banner{
  margin:1.4rem 0 0; padding:.75rem .95rem; background:var(--paper); border-radius:4px;
  box-shadow:inset 4px 0 0 var(--blue); font-size:.88rem; color:var(--ink-2);
}
.banner a{font-weight:700}

/* ---------------- apertura ---------------- */
.hero{padding:1.6rem 0 0}
#dotfield{display:block; width:100%; height:74px; margin-bottom:1.4rem}
.hero .date{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:clamp(1.7rem,6vw,2.6rem); letter-spacing:-.01em; margin-bottom:.15rem;
}
.hero .window{margin-bottom:1.6rem}

.top3{list-style:none; margin:0 0 1.8rem; padding:0}
.top3 li{
  display:grid; grid-template-columns:2.1rem 1fr; gap:.75rem; align-items:start;
  padding:.85rem 0; border-top:1.5px solid var(--ink);
}
.top3 li:last-child{border-bottom:1.5px solid var(--ink)}
.top3 .bead{
  width:26px; height:26px; margin-top:.16rem; font-size:.85rem;
}
.top3 .txt{
  font-family:var(--display); font-weight:600; font-size:1.34rem; line-height:1.16;
  letter-spacing:-.005em;
}
.intro{color:var(--ink-2); font-size:1.03rem; max-width:62ch}
.meta-line{
  margin-top:1.3rem; padding-top:.8rem; border-top:1px solid var(--rule);
  display:flex; flex-wrap:wrap; gap:.3rem 1.4rem;
}

/* ---------------- intestazioni di sezione ---------------- */
.section-head{display:flex; align-items:center; flex-wrap:wrap; gap:.3rem .7rem; padding:2.8rem 0 .9rem}
.section-head h2{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:1.42rem; letter-spacing:.005em; white-space:nowrap;
}
.section-head .hint{margin-left:auto}
.section-head .pip{width:12px; height:12px; border-radius:50%; background:var(--orange); flex:none}
@media (max-width:600px){
  .section-head .hint{margin-left:0; flex-basis:100%; padding-left:1.7rem}
}

/* ---------------- immagini ---------------- */
.hero-shot{
  display:block; width:100%; aspect-ratio:16/9; object-fit:cover;
  border-radius:3px; margin:0 0 1.7rem; background:var(--paper-2);
}
.thumb{
  width:132px; height:74px; object-fit:cover; border-radius:2px;
  background:var(--paper-2); margin-top:.3rem; flex:none;
}

/* ---------------- notizia ---------------- */
.story{border-top:1px solid var(--rule); padding:1.45rem 0 1.15rem}
.story:first-of-type{border-top:1.5px solid var(--ink)}
/* Il capo della notizia e' una griglia a zone: cosi' la stessa marcatura si
   riordina fra desktop (miniatura di fianco) e telefono (miniatura sotto il
   titolo, accanto alla sintesi) senza toccare il DOM. */
.story-head{
  display:grid; column-gap:.75rem; cursor:pointer;
  grid-template-columns:2.5rem minmax(0,1fr);
  grid-template-areas:"bead chips" "bead title" "bead lede";
}
.story-head.with-thumb{
  grid-template-columns:2.5rem minmax(0,1fr) auto;
  grid-template-areas:"bead chips thumb" "bead title thumb" "bead lede thumb";
}
.story-head .bead{grid-area:bead}
.story-head .chips{grid-area:chips}
.story-head h3{grid-area:title}
.story-head .lede{grid-area:lede}
.story-head .thumb{grid-area:thumb; align-self:start}
.bead{
  width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--display); font-weight:700; font-size:.92rem; color:var(--on-fill);
  margin-top:.2rem; transition:transform .18s ease;
}
.story.is-read .bead{opacity:.32}
.story.is-open .bead{transform:scale(1.14)}
/* align-items:center, altrimenti una pastiglia che va a capo si stira
   sull'altezza della riga e sembra una scatola vuota. */
.chips{display:flex; flex-wrap:wrap; align-items:center; gap:.3rem; margin-bottom:.45rem}
.chip{
  font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  padding:.22rem .5rem; border-radius:2px; background:var(--paper-2); color:var(--ink-2);
  white-space:nowrap; line-height:1.4;
}
.chip.t-rumor{background:var(--yellow); color:#17181B}
.chip.t-confermato{background:var(--blue); color:#17181B}
.chip.t-dati{background:var(--orange); color:#17181B}
.chip.t-analisi,.chip.t-opinione{background:var(--red); color:#FFF}
.chip.t-contorno,.chip.t-contesto,.chip.t-servizio{background:var(--ink); color:var(--bone)}
.chip.cat{background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); color:var(--ink-3)}
.chip.rel{background:none; color:var(--ink-3); display:inline-flex; align-items:center; gap:.35rem; padding-left:0}
.dot{width:8px; height:8px; border-radius:50%; background:var(--ink-3); flex:none}
.rel-alta .dot{background:var(--blue)}
.rel-media .dot{background:var(--yellow)}
.rel-bassa .dot{background:var(--red)}
.story h3{
  font-family:var(--display); font-weight:600; font-size:1.62rem; line-height:1.1;
  letter-spacing:-.008em; margin-bottom:.4rem;
}
.lede{color:var(--ink-2); font-size:.98rem; line-height:1.5}
.story-body{padding:1rem 0 0 3.25rem; display:flex; flex-direction:column; gap:.9rem}
.story-body[hidden]{display:none}
.rel-note{
  font-size:.87rem; color:var(--ink-2); background:var(--paper);
  padding:.7rem .9rem; border-radius:3px; box-shadow:inset 4px 0 0 var(--yellow);
}
.rel-note b{display:block; margin-bottom:.2rem; font-size:.6rem; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.readmore{display:flex; flex-wrap:wrap; gap:.4rem .95rem; align-items:center; font-size:.92rem}
.readmore .primary{font-weight:700}
.sources{font-size:.72rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}

.story .tools{padding-left:3.25rem}
.act{
  background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); border:0; border-radius:999px;
  padding:.28rem .8rem; font-size:.78rem; font-weight:600; color:var(--ink-2);
  transition:box-shadow .15s, color .15s, background .15s;
}
.act:hover{box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.act.on{background:var(--yellow); box-shadow:none; color:#17181B}

/* I quattro pulsanti: stessa forma e stessa misura, in fondo a destra di ogni
   voce. Il colore acceso distingue il gesto — giallo quello che serve a te,
   blu e rosso il giudizio sulla rassegna. */
.tools{display:flex; gap:.4rem; justify-content:flex-end; align-items:center;
       margin-left:auto; padding-top:.7rem}
.tool{
  width:36px; height:36px; flex:none; border:0; border-radius:50%;
  background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong);
  color:var(--ink-3); display:grid; place-items:center; position:relative;
  transition:box-shadow .15s, color .15s, background .15s;
}
.tool:hover{box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.tool .ico{display:block}
.tool.t-down .ico{transform:rotate(180deg)}
.tool.t-star.on{background:var(--yellow); box-shadow:none; color:#17181B}
.tool.t-note.on{background:var(--paper-2); box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.tool.t-up.on{background:var(--blue); box-shadow:none; color:#17181B}
.tool.t-down.on{background:var(--red); box-shadow:none; color:#FFF}
/* quanti link allegati, senza aggiungere un altro bottone */
.tool.t-note[data-count]:not([data-count=""])::after{
  content:attr(data-count); position:absolute; top:-2px; right:-2px;
  min-width:15px; height:15px; padding:0 3px; border-radius:999px;
  background:var(--ink); color:var(--bone); font-family:var(--body);
  font-size:.58rem; font-weight:700; line-height:15px; text-align:center;
}
.radar-foot{display:flex; align-items:center; gap:.6rem; margin-top:.15rem}

.workspace{padding:.75rem 0 0 3.25rem; display:flex; flex-direction:column; gap:.6rem}
.workspace[hidden]{display:none}
@media (max-width:600px){
  /* Sul telefono la notizia ha un solo bordo a sinistra: numero e metadati in
     cima, poi titolo, sintesi e azioni tutti allineati a filo di colonna. Il
     numero e' l'unico elemento che rientra, ed e' in testa: fa da segnaposto,
     non da colonna. */
  .story-body,.story .tools,.workspace{padding-left:0}
  .story-head{
    grid-template-columns:auto minmax(0,1fr);
    grid-template-areas:"bead chips" "title title" "lede lede";
    column-gap:.5rem;
  }
  /* La foto prende tutta la colonna sotto la sintesi: alla larghezza del
     telefono una miniatura di lato resta un francobollo e lascia mezzo schermo
     vuoto. Sorgente a 480px (images.py), qui mostrata a ~341: regge. */
  .story-head.with-thumb{
    grid-template-areas:"bead chips" "title title" "lede lede" "thumb thumb";
  }
  .story-head .bead{align-self:center}
  .bead{width:22px; height:22px; font-size:.72rem; margin-top:0}
  .thumb{
    width:100%; height:auto; aspect-ratio:16/9; margin:.9rem 0 .1rem; border-radius:3px;
  }
  /* Una riga sola di metadati: il tag, che porta il colore, e il pallino
     dell'affidabilita'. Categoria e puntata del filo restano al desktop. */
  .chips{gap:.25rem .5rem; margin-bottom:.55rem}
  .chip{font-size:.58rem; letter-spacing:.1em; padding:.18rem .42rem}
  .chip.cat,.chip.filo{display:none}
  .chip.rel{gap:.3rem}
  .chip .long{display:none}
  .story h3{font-size:1.44rem; margin-bottom:.55rem}
  .lede{font-size:.94rem; line-height:1.45}
}
textarea.note{
  width:100%; min-height:5.6rem; resize:vertical; font:inherit; font-size:.95rem;
  background:var(--paper); color:var(--ink); border:0;
  box-shadow:inset 0 0 0 1.5px var(--rule); border-radius:4px; padding:.65rem .75rem;
}
textarea.note:focus{box-shadow:inset 0 0 0 2px var(--blue); outline:none}
.saved-flag{font-size:.65rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ok)}
.linkrow{display:flex; gap:.4rem; flex-wrap:wrap; align-items:center}
.linkrow input{
  flex:1 1 12rem; min-width:0; font:inherit; font-size:.88rem; padding:.45rem .65rem;
  background:var(--paper); color:var(--ink); border:0;
  box-shadow:inset 0 0 0 1.5px var(--rule); border-radius:4px;
}
.linkrow input:focus{box-shadow:inset 0 0 0 2px var(--blue); outline:none}
.btn{
  background:var(--ink); color:var(--bone); border:0; border-radius:999px;
  padding:.45rem 1.05rem; font-size:.82rem; font-weight:700;
}
.btn:hover{background:var(--red); color:#FFF}
.btn:disabled{opacity:.45; cursor:default}
.btn.ghost{background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); color:var(--ink-2)}
.btn.ghost:hover{background:none; box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.btn.wide{width:100%; padding:.7rem 1rem; font-size:.95rem}
.saved-links{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.25rem}
.saved-links li{display:flex; gap:.5rem; align-items:baseline; font-size:.88rem}
.saved-links .kill{background:none; border:0; color:var(--ink-3); padding:0 .2rem}
.saved-links .kill:hover{color:var(--red)}
/* un indirizzo salvato che non regge il controllo resta visibile ma spento:
   sparire sarebbe peggio, perche' l'appunto c'era e va potuto cancellare */
.saved-links .broken{color:var(--ink-3); text-decoration:line-through}

/* ---------------- radar ---------------- */
.radar{list-style:none; margin:0; padding:0}
.radar li{border-top:1px solid var(--rule); padding:.9rem 0; display:grid; gap:.25rem}
.radar h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.radar p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.radar .src{font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}

/* ---------------- sul banco ----------------
   Non e' rassegna, e' materiale da lavoro: la concorrenza e chi la prova.
   La riga gialla e' la sezione — dice perche' quella cosa ti serve dietro al
   banco. Senza quella riga sarebbe una recensione qualsiasi. */
.banco{list-style:none; margin:0; padding:0}
.banco li{border-top:1px solid var(--rule); padding:.95rem 0; display:grid; gap:.35rem}
.banco h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.banco p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.banco .kind{
  justify-self:start; font-size:.6rem; font-weight:700; letter-spacing:.13em;
  text-transform:uppercase; padding:.2rem .45rem; border-radius:2px;
  background:var(--yellow); color:var(--on-fill);
}
.banco .kind.k-video{background:var(--red); color:#FFF}
.banco .kind.k-confronto{background:var(--blue); color:#FFF}
.banco .why{
  font-size:.89rem; color:var(--ink); line-height:1.5; margin-top:.1rem;
  padding-left:.9rem; box-shadow:inset 3px 0 0 var(--yellow);
}
.banco .foot,.recap .foot{display:flex; align-items:center; gap:.6rem; margin-top:.15rem}
.banco .src,.recap .src{
  font-size:.68rem; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3);
}

/* ---------------- AI ----------------
   Due blocchi, due forme. "Cosa e' successo" e' un dispaccio: righe fitte,
   niente foto (nelle notizie AI la foto e' un logo, e un logo non dice
   niente). "Cosa puoi provare" e' una galleria: la foto e' il risultato —
   la citta' in 3D, il pellicano renderizzato — ed e' lei che fa dire
   "ah, si puo' fare questo?". */
.chip.lab-name{background:var(--ink); color:var(--bone)}
.chip.k-lab{background:var(--yellow); color:var(--on-fill)}
.subhead{
  display:flex; align-items:baseline; gap:.6rem; margin:1.6rem 0 .5rem;
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:1.05rem; letter-spacing:.02em;
}
.subhead .eyebrow{margin-left:auto}
/* il selettore della scheda AI: due schede grandi, una sola scelta, si ricorda */
.aiswitch{display:grid; grid-template-columns:1fr 1fr; margin:.2rem 0 1.1rem; border-bottom:1.5px solid var(--ink)}
.aiswitch button{
  background:none; border:0; padding:.7rem .4rem .75rem; position:relative;
  font-family:var(--display); font-weight:700; font-size:1.15rem; text-transform:uppercase;
  letter-spacing:.04em; color:var(--ink-3);
}
.aiswitch button .count{font-family:var(--body); font-size:.62rem; font-weight:700; margin-left:.4rem; vertical-align:.35em; letter-spacing:0}
.aiswitch button[aria-current="true"]{color:var(--ink)}
.aiswitch button[aria-current="true"]::after{content:""; position:absolute; left:0; right:0; bottom:-1.5px; height:4px; background:var(--ink)}
.aiswitch button[data-mode="lab"][aria-current="true"]::after{background:var(--yellow)}
.subhead.lab::before{content:""; width:.7rem; height:.7rem; background:var(--yellow); border-radius:2px; align-self:center}
.subhead.wire::before{content:""; width:.7rem; height:.7rem; background:var(--ink); border-radius:50%; align-self:center}

/* il dispaccio */
.wire{list-style:none; margin:0 0 .4rem; padding:0}
.subhead + .wire{border-top:1.5px solid var(--ink)}
.wire li{border-bottom:1px solid var(--rule)}
/* pastiglia sopra, titolo e sintesi a filo di colonna: con la pastiglia di
   fianco i titoli partivano ognuno a una larghezza diversa */
.wire .row{display:flex; align-items:flex-start; gap:.9rem; padding:.75rem 0 .65rem; cursor:pointer}
.wire .row .rowtext{flex:1; min-width:0; display:grid; grid-template-columns:minmax(0,1fr); row-gap:.3rem}
.wire .row .chip{font-size:.55rem; padding:.18rem .4rem; justify-self:start}
.wire .row h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.wire .row .sintesi{margin-top:0; font-size:.93rem; color:var(--ink-2); line-height:1.45}
/* la memoria della sezione AI: "segue da ieri" porta alla puntata prima */
.segue{
  justify-self:start; background:none; border:0; padding:0; text-align:left;
  font-size:.72rem; font-weight:600; letter-spacing:.02em; color:var(--ink-3);
  line-height:1.35; cursor:pointer;
}
.segue b{font-weight:700; letter-spacing:.12em; text-transform:uppercase; font-size:.6rem; margin-right:.35rem; color:var(--ink-2)}
.segue:hover{color:var(--ink)}
.labcard .segue{margin:.1rem 0 .35rem}
/* la miniatura quadrata a destra, come in un lettore di feed: non e' il
   risultato (quello e' il LAB, e la' la foto e' grande), e' il punto d'appoggio
   per l'occhio che scorre una colonna di soli titoli */
.wire .row .thumb{
  flex:none; width:5.2rem; aspect-ratio:1; object-fit:cover;
  border-radius:5px; background:var(--paper-2);
}
.wire .body{padding:0 0 .9rem; display:flex; flex-direction:column; gap:.7rem}
.wire .body[hidden]{display:none}
.wire .body p{font-size:.93rem; color:var(--ink-2); line-height:1.5}
.wire .body .apple{
  color:var(--ink); padding-left:.9rem; box-shadow:inset 3px 0 0 var(--rule-strong);
}
.wire .foot{display:flex; align-items:center; gap:.6rem .9rem; flex-wrap:wrap; font-size:.9rem}
.wire .foot .tools{margin-left:auto}

/* la galleria */
.labcard{padding:.9rem 0 1rem; border-bottom:1px solid var(--rule)}
.labcard .shot{
  display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:5px;
  background:var(--paper-2); cursor:pointer;
}
.labcard .chips{margin:.7rem 0 .35rem}
.labcard h4{font-family:var(--display); font-weight:700; font-size:1.32rem; line-height:1.12; cursor:pointer}
.labcard .prova{
  margin-top:.45rem; font-size:.97rem; color:var(--ink); line-height:1.5;
  padding-left:.9rem; box-shadow:inset 3px 0 0 var(--yellow);
}
.labcard .body{margin-top:.7rem; display:flex; flex-direction:column; gap:.7rem}
.labcard .body[hidden]{display:none}
.labcard .body p{font-size:.93rem; color:var(--ink-2); line-height:1.5}
.labcard .foot{display:flex; align-items:center; gap:.6rem .9rem; flex-wrap:wrap; margin-top:.6rem; font-size:.9rem}
.labcard .foot .tools{margin-left:auto}
.labcard.noshot .shot{display:none}
@media (min-width:700px){
  .labgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 1.6rem}
}

/* il fronte: l'ultimo modello di ogni laboratorio */
.fronte{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(10rem,1fr)); gap:.8rem;
  margin:.2rem 0 .4rem; padding-bottom:1.2rem; border-bottom:1.5px solid var(--ink);
}
.fronte .lab{font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.fronte b{display:block; font-family:var(--display); font-weight:700; font-size:1.2rem; line-height:1.1; margin:.2rem 0 .15rem}
.fronte b a{color:var(--ink); text-decoration:none}
.fronte .when{font-size:.7rem; color:var(--ink-3)}

/* ---------------- se te lo fossi perso ----------------
   Roba vecchia di giorni: la cornice deve dire subito quanto, altrimenti
   sembra che la rassegna sia in ritardo. */
.recap{list-style:none; margin:0; padding:0}
.recap li{border-top:1px solid var(--rule); padding:.95rem 0; display:grid; gap:.3rem}
.recap h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.recap p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.recap .head{display:flex; flex-wrap:wrap; gap:.3rem .7rem; align-items:center}
.recap .when{
  font-size:.6rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  padding:.2rem .45rem; border-radius:2px; background:var(--orange); color:var(--on-fill);
}
.recap .signal{font-size:.7rem; font-weight:600; letter-spacing:.06em; color:var(--ink-3)}

/* ---------------- nelle discussioni ----------------
   Non sono fatti: sono opinioni e voci. La cornice deve dirlo da sola,
   quindi niente pastiglie di tag e un rientro che le stacca dalle notizie. */
.talk{list-style:none; margin:0; padding:0}
.talk li{border-top:1px solid var(--rule); padding:.95rem 0; display:grid; gap:.3rem}
.talk h4{font-family:var(--display); font-weight:600; font-size:1.14rem; line-height:1.18}
.talk p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.talk .who{display:flex; flex-wrap:wrap; gap:.3rem .7rem; align-items:center}
.talk .where{
  font-size:.6rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  padding:.2rem .45rem; border-radius:2px; background:var(--paper-2); color:var(--ink-2);
}
.talk .heat{font-size:.68rem; font-weight:600; letter-spacing:.08em; color:var(--ink-3)}
.talk .new{background:var(--red); color:#FFF}
.caveat{
  margin:.2rem 0 1rem; font-size:.85rem; color:var(--ink-3); line-height:1.5;
  padding-left:.9rem; box-shadow:inset 3px 0 0 var(--rule-strong);
}

/* ---------------- colonna laterale ---------------- */
.rail h4{
  font-size:.63rem; font-weight:700; letter-spacing:.19em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:.85rem;
}
.rail ol{list-style:none; margin:0 0 2.2rem; padding:0}
.rail ol button{
  background:none; border:0; text-align:left; width:100%; padding:.3rem 0;
  font-size:.83rem; line-height:1.34; color:var(--ink-2);
  display:grid; grid-template-columns:1.15rem 1fr; gap:.45rem; align-items:start;
}
.rail ol button:hover{color:var(--ink)}
.rail ol .pip{width:9px; height:9px; border-radius:50%; margin-top:.4rem; flex:none}
.statgrid{
  display:grid; grid-template-columns:1fr 1fr; gap:1rem .8rem; margin-bottom:2.2rem;
  padding-bottom:1.6rem; border-bottom:1.5px solid var(--ink);
}
.stat b{
  display:block; font-family:var(--display); font-weight:700; font-size:2rem;
  line-height:1; font-variant-numeric:tabular-nums;
}
.stat span{font-size:.66rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.rail .notice{display:flex; flex-direction:column; gap:.5rem; font-size:.78rem; color:var(--ink-3); line-height:1.45}

/* ---------------- archivio ----------------
   Un mese alla volta. La striscia dei mesi sceglie, il calendario a pallini
   dice quali giorni hanno un'edizione — e' lo stesso campo di pallini della
   testata, messo in riga — e la lista sotto le racconta. */
.months{display:flex; flex-wrap:wrap; gap:.45rem; margin:.1rem 0 1.5rem}
.months button{
  background:none; border:0; border-radius:999px; padding:.42rem .9rem;
  font-family:var(--display); font-weight:600; font-size:.95rem;
  text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3);
  box-shadow:inset 0 0 0 1.5px var(--rule-strong); transition:color .15s;
}
.months button:hover{color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink)}
.months button[aria-current="true"]{background:var(--ink); color:var(--bone); box-shadow:none}
.months .count{
  font-family:var(--body); font-size:.6rem; font-weight:700;
  margin-left:.4rem; vertical-align:.3em; letter-spacing:0; opacity:.75;
}
.cal{
  display:grid; grid-template-columns:repeat(7,1fr); gap:.4rem .3rem;
  max-width:24rem; margin:0 0 2.4rem;
}
.cal .wd{
  text-align:center; padding-bottom:.35rem; font-size:.58rem; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);
}
.cal .day{
  aspect-ratio:1; display:grid; place-items:center; border-radius:50%;
  background:none; border:0; font-size:.88rem; font-weight:600;
  font-variant-numeric:tabular-nums; color:var(--ink-3); transition:transform .12s;
}
.cal .day.void{visibility:hidden}
.cal .day.none{color:var(--rule-strong); cursor:default}
.cal .day.has{color:var(--on-fill); font-weight:700}
.cal .day.has:hover{transform:scale(1.12)}
.cal .day.has.current{box-shadow:0 0 0 2.5px var(--bone), 0 0 0 4.5px var(--ink)}

.archive-list{list-style:none; margin:0; padding:0}
.archive-list li{border-top:1px solid var(--rule)}
.archive-list li:last-child{border-bottom:1px solid var(--rule)}
.archive-list button{
  background:none; border:0; width:100%; text-align:left; padding:1.1rem 0;
  display:grid; grid-template-columns:2.5rem 1fr; gap:.75rem; align-items:start;
}
.archive-list .h{font-family:var(--display); font-weight:600; font-size:1.28rem; line-height:1.14; color:var(--ink)}
.archive-list .d{display:block; margin-bottom:.25rem}
.archive-list .m{display:block; margin-top:.3rem; font-size:.72rem; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.archive-list button:hover .h{color:var(--accent-ink)}

/* ---------------- diario ---------------- */
.composer{
  background:var(--paper); border-radius:6px; padding:1.1rem;
  display:flex; flex-direction:column; gap:.8rem; margin:.5rem 0 2.2rem;
  box-shadow:var(--shadow);
}
.composer textarea{
  width:100%; min-height:6.2rem; resize:vertical; font:inherit; font-size:1.02rem;
  background:none; color:var(--ink); border:0; padding:0;
}
.composer textarea:focus{outline:none}
.tagpicker{display:flex; flex-wrap:wrap; gap:.35rem}
.tagpicker button{
  background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); border:0; border-radius:999px;
  padding:.22rem .7rem; font-size:.75rem; font-weight:600; color:var(--ink-3);
}
.tagpicker button.on{background:var(--blue); box-shadow:none; color:#17181B}
.composer-foot{display:flex; gap:.5rem; align-items:center}
.composer-foot .spacer{flex:1}

.entry{border-top:1px solid var(--rule); padding:1.15rem 0; display:flex; flex-direction:column; gap:.5rem}
.entry-meta{display:flex; gap:.55rem; align-items:center; flex-wrap:wrap}
.entry-meta time{font-size:.66rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.entry-text{white-space:pre-wrap; font-size:1rem}
.entry h4{font-family:var(--display); font-weight:600; font-size:1.2rem; line-height:1.16}
.entry .ctx{font-size:.82rem; color:var(--ink-3)}
.entry .kill{margin-left:auto; background:none; border:0; color:var(--ink-3);
  font-size:.66rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase}
.entry .kill:hover{color:var(--red)}

/* ---------------- ricerca ---------------- */
.searchbar{display:flex; gap:.5rem; margin:1.8rem 0 .4rem}
.searchbar input{
  flex:1; font-family:var(--display); font-weight:600; font-size:1.35rem;
  padding:.6rem .9rem; background:var(--paper); color:var(--ink); border:0;
  box-shadow:inset 0 0 0 1.5px var(--rule); border-radius:4px;
}
.searchbar input:focus{box-shadow:inset 0 0 0 2.5px var(--blue); outline:none}
mark{background:var(--yellow); color:#17181B; border-radius:2px; padding:0 .12em}

.empty{padding:3.2rem 0; color:var(--ink-3); font-size:.95rem; text-align:center; border-top:1px solid var(--rule)}
.empty b{display:block; font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:1.3rem; color:var(--ink-2); margin-bottom:.35rem}

.toast{
  position:fixed; left:50%; bottom:1.6rem; transform:translateX(-50%) translateY(1rem);
  background:var(--ink); color:var(--bone); padding:.6rem 1.15rem; border-radius:999px;
  font-size:.85rem; font-weight:600; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; z-index:60; max-width:90vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------------- fili e previsioni ----------------
   Il filo e' la storia lunga di cui una notizia e' una puntata; la
   previsione e' quel che un rumor si impegna a far succedere. Entrambi
   vivono dentro le edizioni, quindi l'app li ricostruisce da sola. */
.chip.filo{
  background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); color:var(--ink-2);
  cursor:pointer; letter-spacing:.1em;
}
.chip.filo:hover{box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.chip.filo b{font-weight:700}

.claim{
  font-size:.9rem; color:var(--ink-2); background:var(--paper);
  padding:.75rem .9rem; border-radius:3px; box-shadow:inset 4px 0 0 var(--orange);
  display:flex; flex-direction:column; gap:.4rem;
}
.claim.closed{box-shadow:inset 4px 0 0 var(--blue)}
.claim .lbl{
  font-size:.6rem; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3);
}
.claim .txt{color:var(--ink); font-size:.95rem}
.claim .foot{display:flex; flex-wrap:wrap; gap:.35rem .9rem; align-items:center}
.verdict{
  font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  padding:.22rem .5rem; border-radius:2px; background:var(--paper-2); color:var(--ink-2);
}
.v-confermato{background:var(--blue); color:#17181B}
.v-parziale{background:var(--yellow); color:#17181B}
.v-smentito{background:var(--red); color:#FFF}
.v-scaduto{background:var(--ink); color:var(--bone)}
.v-aperto{background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); color:var(--ink-3)}

/* ---------------- i numeri che si muovono ----------------
   Una stima che cambia tre volte in un mese e' una notizia. La serie si
   legge da sinistra: le letture vecchie in grigio, l'ultima in evidenza. */
.numbers{background:var(--paper); border-radius:3px; padding:.35rem .9rem .6rem;
  box-shadow:inset 4px 0 0 var(--rule-strong)}
.numbers > .lbl{
  display:block; padding-top:.4rem; font-size:.6rem; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);
}
.num-row{padding:.55rem 0; border-top:1px solid var(--rule)}
.num-row:first-of-type{border-top:0}
.num-head{display:flex; gap:.5rem 1rem; align-items:baseline; flex-wrap:wrap}
.num-head .lab{font-size:.88rem; color:var(--ink-2); flex:1 1 10rem; min-width:0}
.num-head .val{
  font-family:var(--display); font-weight:700; font-size:1.22rem; line-height:1;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.kind{
  font-size:.55rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  padding:.15rem .4rem; border-radius:2px; background:var(--paper-2); color:var(--ink-3);
}
.kind.k-dato{background:var(--blue); color:#17181B}
.hist{display:flex; flex-wrap:wrap; gap:.25rem .45rem; align-items:baseline;
  margin-top:.3rem; font-size:.76rem; color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.hist .past{text-decoration:line-through; text-decoration-thickness:1px}
.hist .move{font-weight:700; letter-spacing:.02em}
.hist .up{color:var(--orange)}
.hist .down{color:var(--blue)}
.hist .flat{color:var(--ink-3)}
.hist .when{font-size:.68rem; letter-spacing:.06em; text-transform:uppercase}

/* ---------------- vista dei fili ---------------- */
.thread{border-top:1px solid var(--rule); padding:1.3rem 0 1.1rem}
.thread:first-of-type{border-top:1.5px solid var(--ink)}
.thread h3{
  font-family:var(--display); font-weight:600; font-size:1.5rem; line-height:1.12;
  letter-spacing:-.008em; margin-bottom:.3rem;
}
.thread .note{color:var(--ink-2); font-size:.94rem; margin-bottom:.15rem}
.thread .span{display:flex; flex-wrap:wrap; gap:.3rem 1.1rem; margin:.5rem 0 .9rem}
.timeline{list-style:none; margin:0; padding:0 0 0 .55rem; border-left:2px solid var(--rule)}
.timeline li{position:relative; padding:.42rem 0 .42rem .95rem}
.timeline li::before{
  content:""; position:absolute; left:-6px; top:.92rem; width:9px; height:9px;
  border-radius:50%; background:var(--rule-strong);
}
.timeline li.last::before{background:var(--orange)}
.timeline button{
  background:none; border:0; text-align:left; width:100%; padding:0;
  display:grid; grid-template-columns:auto 1fr; gap:.15rem .7rem; align-items:baseline;
}
.timeline .when{
  font-size:.63rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap;
}
.timeline .what{font-size:.97rem; line-height:1.4; color:var(--ink)}
.timeline button:hover .what{color:var(--accent-ink)}
.timeline .more{grid-column:1/-1; font-size:.88rem; color:var(--ink-2)}
@media (max-width:600px){
  .timeline button{grid-template-columns:1fr}
  .timeline .when{grid-column:1}
}
.thread .expand{
  background:none; border:0; padding:.5rem 0 0 .95rem; font-size:.78rem;
  font-weight:600; color:var(--ink-3);
}
.thread .expand:hover{color:var(--ink)}

/* ---------------- affidabilita' dei rumor: tre pallini ----------------
   Solo sui rumor: su una notizia confermata e' ovvia, e le parole
   "affidabilita' alta" su ogni scheda erano scritte in piu'. */
.meter{display:inline-flex; gap:3px; align-items:center; padding:0 .15rem}
.meter i{width:7px; height:7px; border-radius:50%; background:var(--rule-strong); display:block}
.meter.m-alta i.on{background:var(--blue)}
.meter.m-media i.on{background:var(--yellow)}
.meter.m-bassa i.on{background:var(--red)}
.chip.deep-mark{background:none; box-shadow:inset 0 0 0 1.5px var(--yellow); color:var(--yellow-ink)}

/* ---------------- approfondisci e ascolta ---------------- */
.deep-acts{display:flex; flex-wrap:wrap; gap:.5rem; margin:.2rem 0 .1rem}
.deep-open,.listen-btn{
  display:inline-flex; align-items:center; gap:.5rem; border:0; border-radius:999px;
  padding:.5rem 1.05rem; font-family:var(--display); font-weight:700; font-size:.95rem;
  letter-spacing:.04em; text-transform:uppercase; cursor:pointer;
}
.deep-open{background:var(--yellow); color:#17181B}
.deep-open i{font-style:normal; transition:transform .2s}
.deep-open.on i{transform:rotate(180deg)}
.listen-btn{background:none; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink)}
.listen-btn i{font-style:normal; font-size:.7rem}
.listen-btn:hover{background:var(--ink); color:var(--bone)}

.deep{
  margin:.4rem 0 .6rem; padding:1.2rem 0 .4rem; border-top:3px solid var(--ink);
  display:flex; flex-direction:column; gap:1.5rem;
}
.deep[hidden]{display:none}
.deep-top{display:flex; align-items:center; gap:.6rem}
.deep-top .dots{display:flex; gap:3px}
.deep-top .dots i{width:9px; height:9px; border-radius:50%; display:block}
.deep-punto{
  font-family:var(--display); font-weight:700; font-size:clamp(1.3rem,4.4vw,1.75rem);
  line-height:1.16; letter-spacing:-.005em; padding-left:1rem; border-left:6px solid var(--yellow);
  text-wrap:pretty;
}
.deep-sec{display:flex; flex-direction:column; gap:.65rem}
.deep-sec h4{
  display:flex; align-items:center; gap:.55rem; font-size:.66rem; font-weight:700;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink-2);
}
.deep-sec h4 .pip{width:11px; height:11px; border-radius:50%; flex:none}
.deep-sec p{font-size:1rem; line-height:1.62}
.deep-tappe{list-style:none; margin:0; padding:0 0 0 1.1rem; position:relative}
.deep-tappe::before{content:""; position:absolute; left:.28rem; top:.5rem; bottom:.5rem; width:2px; background:var(--rule-strong)}
.deep-tappe li{position:relative; padding:0 0 .9rem .6rem}
.deep-tappe li::before{
  content:""; position:absolute; left:-1.1rem; top:.35rem; width:11px; height:11px; border-radius:50%;
  background:var(--bone); box-shadow:inset 0 0 0 2.5px var(--ink-3);
}
.deep-tappe li.now::before{background:var(--orange); box-shadow:none}
.deep-tappe .d{display:block; font-size:.62rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.deep-tappe .t{font-size:.95rem; line-height:1.5}
.deep-tappe a{font-weight:700; text-decoration:none; margin-left:.25rem}
.deep-fonti{background:var(--paper); border-radius:4px; padding:.85rem 1rem; box-shadow:inset 4px 0 0 var(--blue);
  font-size:.95rem; line-height:1.55; color:var(--ink-2)}
.deep-dopo{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.55rem}
.deep-dopo li{display:grid; grid-template-columns:auto 1fr; gap:.7rem; align-items:baseline; font-size:.95rem; line-height:1.5}
.deep-dopo .when{
  font-size:.62rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap;
  background:var(--orange); color:#17181B; padding:.2rem .45rem; border-radius:2px;
}
.deep-dopo .when.none{background:var(--paper-2); color:var(--ink-3)}
.deep-cards{display:grid; grid-template-columns:1fr; gap:.7rem}
@media (min-width:640px){ .deep-cards{grid-template-columns:1fr 1fr} }
.deep-card{
  display:flex; flex-direction:column; gap:.35rem; text-decoration:none; color:var(--ink);
  background:var(--paper); border-radius:6px; padding:.85rem .95rem .9rem; box-shadow:var(--shadow);
  transition:transform .15s;
}
.deep-card:hover{transform:translateY(-2px)}
.deep-card .k{
  align-self:flex-start; font-size:.6rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  padding:.22rem .5rem; border-radius:2px; color:#17181B;
}
.deep-card .k.leggi{background:var(--blue)}
.deep-card .k.ascolta{background:var(--orange)}
.deep-card .k.guarda{background:var(--red); color:#FFF}
.deep-card b{font-family:var(--display); font-weight:600; font-size:1.08rem; line-height:1.2}
.deep-card .src{font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.deep-card .why{font-size:.88rem; line-height:1.45; color:var(--ink-2)}
.deep-foot{font-size:.62rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}

/* ---------------- il lettore: la barra in fondo mentre ascolti ---------------- */
.player{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(.9rem + env(safe-area-inset-bottom));
  z-index:70; width:min(560px, calc(100% - 1.4rem));
  background:var(--ink); color:var(--bone); border-radius:14px; box-shadow:0 12px 36px -12px rgba(0,0,0,.55);
  display:grid; grid-template-columns:auto 1fr auto auto; gap:.2rem .75rem; align-items:center;
  padding:.6rem .7rem .6rem .6rem;
}
.player[hidden]{display:none}

<script>
(function(){
"use strict";

/* Sostituiti da pipeline/build.py */
const MODE    = "cloud";
const CFG     = {"url":"https://bjwyesqwwyogsdbjlaui.supabase.co","anon_key":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqd3llc3F3d3lvZ3NkYmpsYXVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NDA5MTUsImV4cCI6MjEwNTExNjkxNX0.Ep2SPZogZ0quSVp0OrQ1sLWDUe3peToUj1ghWXu_0oU"};
const EMBED   = [];
const APP_URL = "";

const CLOUD = (MODE === "cloud" && CFG && CFG.url && CFG.anon_key);
// appunti, salvati e diario: presenti anche senza sincronizzazione
const NOTES = (MODE !== "static");
const K_STATE = "tmb-state", K_AUTH = "tmb-auth", K_BRIEFS = "tmb-briefs";

let BRIEFS = EMBED || [];
let ALL = [];
let EXTRAS = [];

/* ================= stato locale ================= */
const blank = {marks:{}, diary:[], lastPull:null};
let S;
try{ S = Object.assign({}, blank, JSON.parse(localStorage.getItem(K_STATE) || "{}")); }
catch(e){ S = JSON.parse(JSON.stringify(blank)); }
if(!S.marks) S.marks = {};
if(!S.diary) S.diary = [];

/* migrazione dalla prima versione (apple-brief-v1) */
(function migrate(){
  let old = null;
  try{ old = JSON.parse(localStorage.getItem("apple-brief-v1") || "null"); }catch(e){}
  if(!old || localStorage.getItem("tmb-migrated")) return;
  const now = new Date().toISOString();
  const keys = {};
  ["stars","notes","links","read"].forEach(function(f){
    Object.keys(old[f] || {}).forEach(function(k){ keys[k] = 1; });
  });
  Object.keys(keys).forEach(function(k){
    const m = S.marks[k] || {starred_at:null, read_at:null, note:"", links:[], updated_at:now, dirty:true};
    if(old.stars && old.stars[k]) m.starred_at = new Date(old.stars[k]).toISOString();
    if(old.read && old.read[k]) m.read_at = new Date(old.read[k]).toISOString();
    if(old.notes && old.notes[k]) m.note = old.notes[k];
    if(old.links && old.links[k]) m.links = old.links[k];
    m.updated_at = now; m.dirty = true;
    S.marks[k] = m;
  });
  (old.diary || []).forEach(function(e){
    if(!S.diary.some(function(x){ return x.id === e.id; })){
      S.diary.push(Object.assign({}, e, {updated_at:now, dirty:true, deleted_at:null}));
    }
  });
  localStorage.setItem("tmb-migrated", "1");
  saveNow();
})();

let saveTimer = null;
function saveNow(){
  try{ localStorage.setItem(K_STATE, JSON.stringify(S)); }
  catch(e){ toast("Spazio esaurito nel browser: esporta gli appunti"); }
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 200); }

function mk(k){ return S.marks[k] || null; }
function mark(k){
  if(!S.marks[k]) S.marks[k] = {starred_at:null, read_at:null, note:"", links:[], vote:0, updated_at:null, dirty:false};
  return S.marks[k];
}
function touched(k){
  const m = mark(k);
  m.updated_at = new Date().toISOString();
  m.dirty = true;
  save(); queueSync();
}

/* ================= utilità ================= */
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const BEADS = ["--red","--yellow","--blue","--orange","--ink"];

function fmtDate(iso){
  const d = new Date(iso + "T12:00:00");
  if(isNaN(d)) return iso;
  return GIORNI[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()] + " " + d.getFullYear();
}
function fmtShort(iso){
  const d = new Date(iso + "T12:00:00");
  if(isNaN(d)) return iso;
  return d.getDate() + " " + MESI[d.getMonth()].slice(0,3) + " " + d.getFullYear();
}
/* "6 giorni fa", contato rispetto al giorno dell'edizione e non a oggi: una
   vecchia edizione riletta fra un mese deve restare vera. */
function fmtAgo(iso, refIso){
  const a = new Date(String(iso || "").slice(0,10) + "T12:00:00");
  const b = new Date(String(refIso || "").slice(0,10) + "T12:00:00");
  if(isNaN(a) || isNaN(b)) return fmtShort(iso);
  const d = Math.round((b - a) / 86400000);
  if(d <= 0) return "oggi";
  if(d === 1) return "ieri";
  if(d < 14) return d + " giorni fa";
  return Math.round(d / 7) + " settimane fa";
}
/* Il giorno va letto nel fuso di chi guarda, non in UTC: toISOString() dava
   la data di Londra accanto all'ora di casa, e un appunto scritto all'una di
   notte compariva datato al giorno prima. */
function localDay(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
       + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtStamp(ts){
  const d = new Date(ts);
  if(isNaN(d)) return "";          /* una voce importata male non rompe la lista */
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return fmtShort(localDay(d)) + " · " + hh + ":" + mm;
}
function el(tag, attrs, kids){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === "class") n.className = attrs[k];
    else if(k === "text") n.textContent = attrs[k];
    else if(k === "html") n.innerHTML = attrs[k];
    else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}
function bead(i, txt, cls){
  const v = BEADS[i % BEADS.length];
  const n = el("span", {class:cls || "bead", text:txt});

}
function toast(msg){

  t.textContent = msg; t.classList.add("show");

function key(dateStr, id){ return dateStr + "/" + id; }
function safeUrl(u){

let AUTH = null;
try{ AUTH = JSON.parse(localStorage.getItem(K_AUTH) || "null"); }catch(e){}

function storeAuth(j){
  AUTH = {
    access_token:j.access_token,
    refresh_token:j.refresh_token,
    expires_at:Date.now() + (j.expires_in || 3600) * 1000,
    user_id:(j.user && j.user.id) || (AUTH && AUTH.user_id)
  };
  localStorage.setItem(K_AUTH, JSON.stringify(AUTH));
}
function clearAuth(){ AUTH = null; localStorage.removeItem(K_AUTH); }

async function login(email, password){
  let res;
  try{
    res = await fetch(CFG.url + "/auth/v1/token?grant_type=password", {
      method:"POST",
      headers:{"apikey":CFG.anon_key, "Content-Type":"application/json"},
      body:JSON.stringify({email:email, password:password})
    });
  }catch(e){
    throw new Error("Non riesco a raggiungere il server. Controlla la connessione e riprova.");
  }
  const j = await res.json().catch(function(){ return {}; });
  if(!res.ok) throw new Error(j.error_description || j.msg || j.message || "Accesso non riuscito");
  storeAuth(j);
}
async function refreshToken(){
  if(!AUTH || !AUTH.refresh_token) return false;
  try{
    const res = await fetch(CFG.url + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST",
      headers:{"apikey":CFG.anon_key, "Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:AUTH.refresh_token})
    });
    if(!res.ok) return false;
    storeAuth(await res.json());
    return true;
  }catch(e){ return false; }
}
async function sb(path, opts, retried){
  opts = opts || {};
  if(AUTH && AUTH.expires_at && Date.now() > AUTH.expires_at - 60000 && !retried){
    await refreshToken();
  }
  const headers = Object.assign({
    "apikey":CFG.anon_key,
    "Content-Type":"application/json"
  }, opts.headers || {});
  if(AUTH && AUTH.access_token) headers["Authorization"] = "Bearer " + AUTH.access_token;
  const res = await fetch(CFG.url + path, Object.assign({}, opts, {headers:headers}));
  if(res.status === 401 && !retried && await refreshToken()) return sb(path, opts, true);
  return res;
}

let syncTimer = null, syncing = false;

  const p = document.getElementById("syncPip");
  if(!p) return;

  p.title = title;
