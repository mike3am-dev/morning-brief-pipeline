  const box = visFrame(v, "anno");
  const S = 360, C = S / 2, R = 128;
  const svg = sv("svg", {viewBox:"0 0 " + S + " " + S, class:"vis-svg anno", role:"img", "aria-label":v.titolo || "l'anno dei lanci"});
  const ang = function(doy){ return (doy / 365) * Math.PI * 2 - Math.PI / 2; };
  const pt = function(doy, r){ const a = ang(doy); return [C + Math.cos(a) * r, C + Math.sin(a) * r]; };
  svg.appendChild(sv("circle", {cx:C, cy:C, r:R, class:"ring"}));
  const band = sv("circle", {cx:C, cy:C, r:R, class:"band", style:"opacity:0"});
  svg.appendChild(band);
  "GFMAMGLASOND".split("").forEach(function(ch, i){
    const doy = i * 30.4 + 15;
    const p = pt(doy, R + 24);
    svg.appendChild(svText(p[0], p[1] + 4, ch, {class:"mo", "text-anchor":"middle"}));
    const a = pt(i * 30.4, R - 6), b = pt(i * 30.4, R + 6);
    svg.appendChild(sv("line", {x1:a[0], y1:a[1], x2:b[0], y2:b[1], class:"tick"}));
  });
  const evs = (v.eventi || []).map(function(e){
    const d = new Date(e.data + "T12:00:00");
    const start = new Date(d.getFullYear(), 0, 1);
    return {e:e, doy:Math.round((d - start) / 86400000)};
  });
  const big = svText(C, C - 4, String(evs.length), {class:"big", "text-anchor":"middle"});
  const small = svText(C, C + 22, v.centro || "giornate di lancio", {class:"small", "text-anchor":"middle"});
  svg.appendChild(big); svg.appendChild(small);
  const dots = [];
  const detail = el("p", {class:"anno-detail", text:"Tocca un pallino"});
  evs.forEach(function(x, i){
    const p = pt(x.doy, R);
    const g = sv("g", {class:"ev", tabindex:"0", style:"opacity:0"});
    g.appendChild(sv("circle", {cx:p[0], cy:p[1], r:9}));
    const show = function(){ dots.forEach(function(d){ d.classList.remove("sel"); }); g.classList.add("sel");
      detail.textContent = fmtShort(x.e.data) + " — " + x.e.etichetta; };
    g.addEventListener("click", show); g.addEventListener("keydown", function(e){ if(e.key === "Enter") show(); });
    dots.push(g); svg.appendChild(g);
  });
  box.appendChild(svg);
  box.appendChild(detail);
  box.appendChild(toggleRow([["oggi", v.etichetta_oggi || "Com'è oggi"], ["obiettivo", v.etichetta_obiettivo || "L'obiettivo"]], function(mode){
    const goal = mode === "obiettivo";
    band.style.opacity = goal ? 1 : 0;
    dots.forEach(function(d){ d.style.opacity = goal ? .3 : 1; });
    big.textContent = goal ? "12" : String(evs.length);
    small.textContent = goal ? (v.centro_obiettivo || "mesi utili per lanciare") : (v.centro || "giornate di lancio");
    detail.textContent = goal ? (v.obiettivo || "") : "Tocca un pallino";
  }));
  visCaption(box, v);
  whenSeen(box, function(){
    dots.forEach(function(g, i){ setTimeout(function(){ g.style.transition = "opacity .35s"; g.style.opacity = 1; }, STILL ? 0 : 200 + i * 260); });
  });
  return box;
}

/* ---------- raggio: chi viene avvisato ----------
   Una citta' di puntini. Tocchi un punto, parte la segnalazione, e il
   cerchio del raggio dichiarato accende chi ci sta dentro. Serve a capire
   il meccanismo di cui si parla, non a mappare niente di reale. */
function visRaggio(v){
  const box = visFrame(v, "raggio");
  const canvas = el("canvas", {class:"vis-canvas tap", "aria-label":"tocca per simulare una segnalazione", role:"img"});
  const counter = el("p", {class:"raggio-count", text:"Tocca la mappa per simulare una segnalazione"});
  box.appendChild(canvas); box.appendChild(counter);
  visCaption(box, v);
  const WORLD = v.lato_km || 40, RK = v.raggio_km || 8;
  let geo = null, people = [], pings = [];
  function seed(){
    people = [];
    let s = 7;
    const rnd = function(){ s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const hubs = [[.3,.4],[.62,.55],[.5,.25],[.78,.3],[.22,.75]];
    for(let i = 0; i < 900; i++){
      const hb = hubs[i % hubs.length], r = Math.pow(rnd(), .7) * .22, a = rnd() * 7;
      people.push({x:Math.min(.98, Math.max(.02, hb[0] + Math.cos(a) * r * 1.2)), y:Math.min(.97, Math.max(.03, hb[1] + Math.sin(a) * r)), lit:0});
    }
  }
  function draw(now){
    const ctx = geo.ctx, w = geo.w, h = geo.h, kmPx = w / WORLD;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = cssv("--rule"); ctx.lineWidth = 1;
    for(let x = 0; x < w; x += kmPx * 4){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for(let y = 0; y < h; y += kmPx * 4){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    const orange = tone("orange"), ink = cssv("--ink-3"), red = tone("red");
    pings.forEach(function(p){
      /* k parte da 0: il primo segnale nasce 400 ms nel futuro, e un raggio
         negativo fa lanciare arc() */
      const k = STILL ? 1 : Math.max(0, Math.min(1, (now - p.t) / 900));
      const r = Math.max(0, RK * kmPx * (1 - Math.pow(1 - k, 3)));
      ctx.fillStyle = orange + "22"; ctx.strokeStyle = orange; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x * w, p.y * h, r, 0, 7); ctx.fill(); ctx.stroke();
      p.r = r;
    });
    let lit = 0;
    people.forEach(function(q){
      const px = q.x * w, py = q.y * h;
      const inside = pings.some(function(p){ return Math.hypot(px - p.x * w, py - p.y * h) <= (p.r || 0); });
      if(inside) lit++;
      ctx.fillStyle = inside ? orange : ink;
      ctx.beginPath(); ctx.arc(px, py, inside ? 2.6 : 1.8, 0, 7); ctx.fill();
    });
    pings.forEach(function(p){
      ctx.fillStyle = red; ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 6, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 2.2, 0, 7); ctx.fill();
    });
    /* scala */
    ctx.fillStyle = cssv("--ink"); ctx.fillRect(12, h - 16, RK * kmPx, 3);
    ctx.font = "700 10px system-ui"; ctx.textAlign = "left";
    ctx.fillText((v.etichetta_raggio || RK + " km"), 12, h - 22);
    if(pings.length) counter.textContent = "Avvisati " + lit + " puntini su " + people.length + (pings.length > 1 ? " · " + pings.length + " segnalazioni" : "");
  }
  canvas.addEventListener("click", function(e){
    const r = canvas.getBoundingClientRect();
    pings.push({x:(e.clientX - r.left) / r.width, y:(e.clientY - r.top) / r.height, t:performance.now()});
    if(pings.length > 3) pings.shift();
    if(STILL && geo) draw(performance.now());
  });
  whenSeen(box, function(){
    seed(); geo = crispCanvas(canvas, .62);
    onResize(canvas, function(){ geo = crispCanvas(canvas, .62); if(STILL) draw(performance.now()); });
    pings.push({x:.44, y:.46, t:performance.now() + 400});
    if(STILL) draw(performance.now()); else liveLoop(box, draw);
  });
  return box;
}

/* ---------- flusso: dove passano i soldi ----------
   Due strade dallo stesso punto di partenza allo stesso negozio. Nel mezzo,
   o c'e' l'ecosistema che incassa sul passaggio, o c'e' un agente. */
function visFlusso(v){
  const box = visFrame(v, "flusso");
  const W = 640, H = 262, Y0 = 84;
  const svg = sv("svg", {viewBox:"0 0 " + W + " " + H, class:"vis-svg flusso", role:"img", "aria-label":v.titolo || "flusso"});
  const main = sv("path", {d:"M 70 " + Y0 + " C 200 " + Y0 + ", 200 " + Y0 + ", 320 " + Y0 + " S 440 " + Y0 + ", 570 " + Y0, class:"road"});
  const branch = sv("path", {d:"M 320 " + Y0 + " C 326 140, 326 170, 320 206", class:"road branch"});
  svg.appendChild(main); svg.appendChild(branch);
  function node(x, y, r, cls){ return sv("circle", {cx:x, cy:y, r:r, class:"node " + cls}); }
  /* le etichette stanno fuori dai cerchi: "Negozio" dentro un pallino non ci stava */
  svg.appendChild(node(70, Y0, 24, "you")); svg.appendChild(svText(70, Y0 + 48, v.partenza || "Tu", {class:"nlabel out", "text-anchor":"middle"}));
  const midBox = sv("rect", {x:196, y:Y0 - 30, width:248, height:60, rx:10, class:"mid"});
  svg.appendChild(midBox);
  const midTxt = svText(320, Y0 + 6, "", {class:"nlabel mid-t", "text-anchor":"middle"});
  svg.appendChild(midTxt);
  svg.appendChild(node(570, Y0, 24, "shop")); svg.appendChild(svText(570, Y0 + 48, v.arrivo || "Negozio", {class:"nlabel out", "text-anchor":"middle"}));
  const sink = node(320, 214, 22, "sink");
  svg.appendChild(sink);
  const sinkTxt = svText(320, 256, "", {class:"nlabel out", "text-anchor":"middle"});
  svg.appendChild(sinkTxt);
  const coins = sv("g");
  svg.appendChild(coins);
  box.appendChild(svg);
  const note = el("p", {class:"flusso-note"});
  box.appendChild(note);
  let mode = "oggi";
  function apply(){
    const m = v[mode] || {};
    midTxt.textContent = m.centro || "";
    sinkTxt.textContent = m.incassa || "";
    note.textContent = m.nota || "";
    box.classList.toggle("agent", mode === "agente");
  }
  box.appendChild(toggleRow([["oggi", (v.oggi || {}).etichetta || "Oggi"], ["agente", (v.agente || {}).etichetta || "Con un agente"]], function(m){ mode = m; apply(); }));
  apply();
  visCaption(box, v);
  whenSeen(box, function(){
    if(STILL) return;
    const L1 = main.getTotalLength(), L2 = branch.getTotalLength();
    const list = [];
    let last = 0;
    function step(now){
      if(now - last > 380){
        const c = sv("circle", {r:6, class:"coin"}); coins.appendChild(c);
        list.push({c:c, s:0, br:Math.random() < .45, done:false}); last = now;
      }
      for(let i = list.length - 1; i >= 0; i--){
        const k = list[i];
        k.s += 3.2;
        let p;
        if(k.br && k.s > L1 / 2){
          const s2 = k.s - L1 / 2;
          if(s2 > L2){ k.c.remove(); list.splice(i, 1); continue; }
          p = branch.getPointAtLength(s2);
        } else {
          if(k.s > L1){ k.c.remove(); list.splice(i, 1); continue; }
          p = main.getPointAtLength(k.s);
        }
        k.c.setAttribute("cx", p.x); k.c.setAttribute("cy", p.y);
      }
    }
    liveLoop(box, step);
  });
  return box;
}

/* ---------- onde: la cancellazione del rumore ----------
   Nel kit per la prima notizia che la tocchera': il rumore, l'onda opposta
   che le cuffie generano, e quello che resta. Il cursore sposta il ritardo
   dell'antirumore: si vede perche' conta la velocita' del chip. */
function visOnde(v){
  const box = visFrame(v, "onde");
  const canvas = el("canvas", {class:"vis-canvas", "aria-hidden":"true"});
  box.appendChild(canvas);
  const slider = el("input", {type:"range", min:"0", max:"100", value:"4", "aria-label":"ritardo dell'antirumore"});
  const lab = el("b", {class:"big", text:""});
  const on = el("button", {type:"button", class:"vis-btn", text:"Antirumore: acceso"});
  let active = true, delay = .04;
  box.appendChild(el("div", {class:"vis-controls"}, [on, el("label", {class:"lbl"}, [el("span", {text:"Ritardo"}), lab]), slider]));
  visCaption(box, v);
  let geo = null, frame = null;
  /* senza movimento il disegno fermo si rifà a ogni tocco */
  const still = function(){ if(STILL && frame) frame(0); };
  on.addEventListener("click", function(){ active = !active; on.textContent = "Antirumore: " + (active ? "acceso" : "spento"); still(); });
  slider.addEventListener("input", function(){ delay = +slider.value / 100; still(); });
  whenSeen(box, function(){
    geo = crispCanvas(canvas, .5);
    onResize(canvas, function(){ geo = crispCanvas(canvas, .5); still(); });
    function noise(t, x){ return Math.sin(x * .045 + t * 2.1) * .55 + Math.sin(x * .11 - t * 3.3) * .3 + Math.sin(x * .023 + t) * .15; }
    frame = function(now){
      const t = now / 1000, ctx = geo.ctx, w = geo.w, h = geo.h, rows = [h * .2, h * .5, h * .8], amp = h * .11;
      ctx.clearRect(0, 0, w, h);
      lab.textContent = Math.round(delay * 100) + "%";
      const lines = [["rumore", tone("red"), function(x){ return noise(t, x); }],
                     ["antirumore", tone("blue"), function(x){ return active ? -noise(t, x - delay * 60) : 0; }],
                     ["quello che senti", cssv("--ink"), function(x){ return noise(t, x) + (active ? -noise(t, x - delay * 60) : 0); }]];
      lines.forEach(function(L, i){
        ctx.strokeStyle = L[1]; ctx.lineWidth = i === 2 ? 3 : 2; ctx.beginPath();
        for(let x = 0; x <= w; x += 3){ const y = rows[i] + L[2](x) * amp; if(x) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
        ctx.stroke();
        ctx.fillStyle = L[1]; ctx.font = "700 10px system-ui"; ctx.fillText(L[0].toUpperCase(), 8, rows[i] - amp - 4);
      });
    };
    if(STILL) frame(0); else liveLoop(box, frame);
  });
  return box;
}


/* ---------- esploso: l'oggetto scomposto a strati ----------
   Le parti una sopra l'altra, come in un'illustrazione tecnica. "Scomponi"
   le allontana nello spazio; ogni strato si tocca e racconta la sua parte.
   Serve per un telefono, un paio di AirPods, un chip: gli strati li scrive
   l'edizione, il disegno e' lo stesso. */
function visEsploso(v){
  const box = visFrame(v, "esploso");
  const strati = v.strati || [];
  const stack = el("div", {class:"xp-stack"});
  const plates = [];
  const info = el("div", {class:"xp-info"}, [el("b", {text:"Tocca uno strato"}), el("span", {text:v.invito || ""})]);
  strati.forEach(function(s, i){
    const pl = el("button", {type:"button", class:"xp-plate" + (s.stato === "problema" ? " warn" : ""), "aria-label":s.nome});
    pl.style.setProperty("--i", String(i));
    pl.style.setProperty("--n", String(strati.length));
    pl.style.setProperty("--c", toneVar(s.colore || (s.stato === "problema" ? "red" : "ink-3")));
    pl.appendChild(el("span", {class:"xp-face"}));
    pl.appendChild(el("span", {class:"xp-tag", text:s.nome}));
    pl.addEventListener("click", function(){
      plates.forEach(function(p){ p.classList.remove("sel"); }); pl.classList.add("sel");
      info.innerHTML = "";
      info.appendChild(el("b", {text:s.nome}));
      info.appendChild(el("span", {text:s.nota || ""}));
      if(!box.classList.contains("open")) toggle(true);
    });
    plates.push(pl); stack.appendChild(pl);
  });
  const scene = el("div", {class:"xp-scene"}, [stack]);
  box.appendChild(scene);
  const btn = el("button", {type:"button", class:"vis-btn", text:"Scomponi"});
  function toggle(force){
    const on = typeof force === "boolean" ? force : !box.classList.contains("open");
    box.classList.toggle("open", on);
    btn.textContent = on ? "Ricomponi" : "Scomponi";
  }
  btn.addEventListener("click", function(){ toggle(); });
  box.appendChild(el("div", {class:"vis-controls"}, [btn]));
  box.appendChild(info);
  visCaption(box, v);
  whenSeen(box, function(){ if(!STILL) setTimeout(function(){ toggle(true); }, 500); });
  return box;
}

/* ---------- densita: i pixel visti da vicino ----------
   Un pezzo di schermo con una zona (il sensore sotto) dove i pixel sono
   meno fitti e piu' luminosi. Il cursore avvicina l'occhio: da lontano la
   zona sparisce, da vicino si vedono i vuoti e cosa ci passa. */
function visDensita(v){
  const box = visFrame(v, "densita");
  const canvas = el("canvas", {class:"vis-canvas", "aria-hidden":"true"});
  box.appendChild(canvas);
  const rap = Math.max(.2, Math.min(1, v.rapporto || .5));
  let zoom = 1, comp = v.compensa !== false, ir = false, geo = null, mine = false;
  const lab = el("b", {class:"big", text:"1×"});
  const slider = el("input", {type:"range", min:"1", max:"14", step:"0.1", value:"1", "aria-label":"avvicinati allo schermo"});
  const bComp = el("button", {type:"button", class:"vis-btn", text:"Luminosità compensata"});
  const bIr = el("button", {type:"button", class:"vis-btn ghost", text:"Accendi l'infrarosso"});
  const read = el("p", {class:"dens-read"});
  box.appendChild(el("div", {class:"vis-controls"}, [el("label", {class:"lbl"}, [el("span", {text:"Avvicinati"}), lab]), slider]));
  box.appendChild(el("div", {class:"vis-controls"}, [bComp, bIr]));
  box.appendChild(read);
  visCaption(box, v);
  function draw(){
    if(!geo) return;
    const ctx = geo.ctx, w = geo.w, h = geo.h;
    const bg = "#0b0c0e", base = 230;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h * .46, rx = w * .2, ry = h * .26;
    const inZone = function(x, y){ const a = (x - cx) / rx, b = (y - cy) / ry; return a * a + b * b <= 1; };
    const pitch = 1.6 * zoom;
    /* lo schermo mostra un grigio chiaro uniforme: la luce di ogni zona e' densita' x luminosita' */
    const lumZone = comp ? 1 : rap;
    if(pitch < 4){
      /* da lontano i pixel non si distinguono: si vede solo la media */
      ctx.fillStyle = "rgb(" + base + "," + base + "," + base + ")"; ctx.fillRect(0, 0, w, h);
      const g = Math.round(base * lumZone);
      ctx.fillStyle = "rgb(" + g + "," + g + "," + g + ")";
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.fill();
    } else {
      const sub = pitch / 3;
      for(let y = 0, j = 0; y < h; y += pitch, j++){
        for(let x = 0, i = 0; x < w; x += pitch, i++){
          const z = inZone(x + pitch / 2, y + pitch / 2);
          if(z && rap <= .5 && (i + j) % 2) continue;          /* meta' dei pixel non c'e' */
          const k = z ? (comp ? 1 / rap : 1) : 1;
          const a = Math.min(1, .62 * k);
          ctx.fillStyle = "rgba(255,40,40," + a + ")"; ctx.fillRect(x + .5, y + .5, sub - 1, pitch - 1);
          ctx.fillStyle = "rgba(40,255,90," + a + ")"; ctx.fillRect(x + sub + .5, y + .5, sub - 1, pitch - 1);
          ctx.fillStyle = "rgba(60,120,255," + a + ")"; ctx.fillRect(x + 2 * sub + .5, y + .5, sub - 1, pitch - 1);
        }
      }
      if(ir){
        /* l'infrarosso passa solo dai vuoti */
        for(let y = 0, j = 0; y < h; y += pitch, j++){
          for(let x = 0, i = 0; x < w; x += pitch, i++){
            if(!inZone(x + pitch / 2, y + pitch / 2) || !((i + j) % 2)) continue;
            const r = Math.max(1.2, pitch * .22);
            ctx.fillStyle = "rgba(255,90,140,.85)";
            ctx.beginPath(); ctx.arc(x + pitch / 2, y + pitch / 2, r, 0, 7); ctx.fill();
          }
        }
      }
    }
    ctx.strokeStyle = "rgba(247,206,60,.9)"; ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(247,206,60,.95)"; ctx.font = "700 10px system-ui"; ctx.textAlign = "center";
    ctx.fillText((v.zona || "SENSORE").toUpperCase(), cx, cy + ry + 14);
    lab.textContent = (Math.round(zoom * 10) / 10).toString().replace(".", ",") + "×";
    read.textContent = pitch < 4
      ? (comp ? "A distanza di lettura la zona non si distingue: meno pixel, ma più luminosi." : "Senza compensare la luminosità, la zona sopra il sensore sarebbe una macchia più scura.")
      : (ir ? "L'infrarosso passa dai vuoti lasciati dai pixel che mancano: è così che il sensore vede il tuo volto."
            : "Da vicino si vede: sopra il sensore c'è un pixel ogni " + Math.round(1 / rap) + (comp ? ", acceso più forte per compensare." : "."));
  }
  slider.addEventListener("input", function(){ mine = true; zoom = +slider.value; draw(); });
  bComp.addEventListener("click", function(){ comp = !comp; bComp.textContent = comp ? "Luminosità compensata" : "Luminosità normale"; bComp.classList.toggle("ghost", !comp); draw(); });
  bIr.addEventListener("click", function(){
    ir = !ir; bIr.textContent = ir ? "Spegni l'infrarosso" : "Accendi l'infrarosso";
    if(ir && zoom < 6){ zoom = 8; slider.value = "8"; }
    draw();
  });
  whenSeen(box, function(){
    geo = crispCanvas(canvas, .62); draw();
    onResize(canvas, function(){ geo = crispCanvas(canvas, .62); draw(); });
    if(STILL) return;
    /* una piccola dimostrazione: ci si avvicina da soli, poi e' tuo */
    const t0 = performance.now();
    const step = function(now){
      const k = Math.min(1, (now - t0) / 1800);
      if(mine) return;                             /* l'hai toccato tu */
      zoom = 1 + 7 * (1 - Math.pow(1 - k, 3)); slider.value = String(zoom); draw();
      if(k < 1) requestAnimationFrame(step);
    };
    setTimeout(function(){ requestAnimationFrame(step); }, 600);
  });
  return box;
}

/* ---------- supporto: uno schermo sul suo braccio ----------
   L'oggetto disegnato com'e': schermo, braccio, base. Il cursore lo inclina,
   l'interruttore passa da una versione all'altra (da banco, da parete). */
function visSupporto(v){
  const box = visFrame(v, "supporto");
  const vars = (v.varianti && v.varianti.length) ? v.varianti : [{nome:"Da banco", base:"semisfera"}];
  const W = 320, H = 272;
  const svg = sv("svg", {viewBox:"0 0 " + W + " " + H, class:"vis-svg sup-svg", role:"img", "aria-label":v.titolo || "supporto"});
  const wall = sv("rect", {x:0, y:0, width:W, height:H, class:"sup-wall"});
  const shadow = sv("ellipse", {cx:160, cy:248, rx:84, ry:9, class:"sup-shadow"});
  const base = sv("g"), arm = sv("g"), screen = sv("g");
  svg.appendChild(wall); svg.appendChild(shadow); svg.appendChild(base); svg.appendChild(arm); svg.appendChild(screen);
  box.appendChild(svg);
  const note = el("p", {class:"sup-note"});
  let cur = 0, tilt = 0, mine = false;
  const range = v.inclinazione || [-20, 25];
  const slider = el("input", {type:"range", min:String(range[0]), max:String(range[1]), value:"0", "aria-label":"inclina lo schermo"});
  const lab = el("b", {class:"big", text:"0°"});
  if(vars.length > 1) box.appendChild(toggleRow(vars.map(function(x, i){ return [String(i), x.nome]; }), function(i){ cur = +i; draw(); }));
  box.appendChild(el("div", {class:"vis-controls"}, [el("label", {class:"lbl"}, [el("span", {text:"Inclina"}), lab]), slider]));
  box.appendChild(note);
  visCaption(box, v);
  function draw(){
    const x = vars[cur], semi = x.base !== "piatta";
    wall.setAttribute("class", "sup-wall" + (semi ? "" : " on"));
    shadow.setAttribute("opacity", semi ? "1" : "0");
    base.innerHTML = ""; arm.innerHTML = ""; screen.innerHTML = "";
    const S = 104, hx = 160, hy = semi ? 150 : 150;                /* lato dello schermo e cerniera */
    if(semi){
      base.appendChild(sv("path", {d:"M 92 244 A 68 54 0 0 1 228 244 Z", class:"sup-base"}));
      for(let r = 0; r < 3; r++){
        const yy = 228 - r * 13, n = 11 - r * 2;
        for(let k = 0; k < n; k++){
          const xx = 160 + (k - (n - 1) / 2) * (9.5 - r);
          base.appendChild(sv("circle", {cx:xx, cy:yy, r:1.5, class:"sup-hole"}));
        }
      }
      /* il collo cromato dell'iMac G4: sale dalla base e si piega verso lo schermo */
      const d = "M 160 194 C 160 176, 168 166, 166 " + (hy + 6) + " S " + hx + " " + (hy - 2) + ", " + hx + " " + (hy - 6);
      arm.appendChild(sv("path", {d:d, class:"sup-arm"}));
      arm.appendChild(sv("path", {d:d, class:"sup-arm-hi"}));
    } else {
      base.appendChild(sv("rect", {x:120, y:hy - 6, width:80, height:12, rx:4, class:"sup-base flat"}));
    }
    const c = Math.cos(tilt * Math.PI / 180), hS = S * c, top = hy - hS - 8;
    const g = sv("g", {transform:"translate(" + (160 - S / 2) + "," + top + ")"});
    g.appendChild(sv("rect", {x:-1, y:-1, width:S + 2, height:hS + 2, rx:10 * c + 2, class:"sup-frame"}));
    const pad = S * (v.cornice_quota || .06);
    g.appendChild(sv("rect", {x:pad, y:pad * c, width:S - 2 * pad, height:hS - 2 * pad * c, rx:6 * c, class:"sup-glass"}));
    g.appendChild(svText(S / 2, hS * .5 + 10 * c, v.schermo || "9:41", {class:"sup-clock", "text-anchor":"middle",
      style:"font-size:" + Math.round(30 * Math.max(.4, c)) + "px"}));
    if(tilt){
      const sh = sv("rect", {x:pad, y:pad * c, width:S - 2 * pad, height:hS - 2 * pad * c, rx:6 * c, class:"sup-sheen"});
      sh.setAttribute("opacity", String(Math.min(.35, Math.abs(tilt) / 60)));
      g.appendChild(sh);
    }
    screen.appendChild(g);
    screen.appendChild(sv("line", {x1:160 - S / 2, y1:top - 8, x2:160 + S / 2, y2:top - 8, class:"sup-dim"}));
    screen.appendChild(svText(160, top - 13, v.pollici ? v.pollici + " · quadrato" : "", {class:"sup-dimt", "text-anchor":"middle"}));
    lab.textContent = Math.round(tilt) + "°";
    note.textContent = x.nota || "";
  }
  slider.addEventListener("input", function(){ mine = true; tilt = +slider.value; draw(); });
  draw();
  whenSeen(box, function(){
    if(STILL) return;
    const t0 = performance.now();
    const step = function(now){
      const k = (now - t0) / 2200;
      if(mine) return;
      if(k > 1){ tilt = 0; slider.value = "0"; draw(); return; }
      tilt = Math.sin(k * Math.PI * 2) * 18; slider.value = String(Math.round(tilt)); draw();
      requestAnimationFrame(step);
    };
    setTimeout(function(){ requestAnimationFrame(step); }, 500);
  });
  return box;
}

/* ---------- roadmap: chi esce quando, e cosa si salta ----------
   Le linee di prodotto in riga, il tempo in colonna. Ogni casella e' un chip
   (uscito, previsto, saltato): si tocca per leggerne la nota. */
function visRoadmap(v){
  const box = visFrame(v, "roadmap");
  const per = v.periodi || [];
  const grid = el("div", {class:"rm-grid"});
  grid.style.setProperty("--cols", String(per.length));
  grid.appendChild(el("span", {class:"rm-h"}));
  per.forEach(function(p){ grid.appendChild(el("span", {class:"rm-h", text:p})); });
  const info = el("p", {class:"rm-info", text:v.invito || "Tocca un chip per leggere cosa arriva."});
  const cells = [];
  (v.linee || []).forEach(function(l){
    grid.appendChild(el("span", {class:"rm-line", text:l.nome}));
    per.forEach(function(p){
      const t = (l.tappe || []).filter(function(x){ return x.quando === p; })[0];
      if(!t){ grid.appendChild(el("span", {class:"rm-cell"})); return; }
      const b = el("button", {type:"button", class:"rm-chip " + (t.stato || "previsto"), text:t.chip});
      b.addEventListener("click", function(){
        cells.forEach(function(c){ c.classList.remove("sel"); }); b.classList.add("sel");
        info.textContent = l.nome + " · " + p + " — " + (t.nota || t.chip);
      });
      cells.push(b);
      grid.appendChild(el("span", {class:"rm-cell"}, [b]));
    });
  });
  box.appendChild(el("div", {class:"rm-wrap"}, [grid]));
  /* sul telefono la tabella non ci sta: la stessa cosa come linea del tempo */
  const tl = el("ol", {class:"rm-tl"});
  per.forEach(function(p){
    const items = [];
    (v.linee || []).forEach(function(l){
      (l.tappe || []).forEach(function(t){
        if(t.quando !== p) return;
        const b = el("button", {type:"button", class:"rm-chip " + (t.stato || "previsto"), text:t.chip});
        b.addEventListener("click", function(){
          cells.forEach(function(c){ c.classList.remove("sel"); }); b.classList.add("sel");
          info.textContent = l.nome + " · " + p + " — " + (t.nota || t.chip);
        });
        cells.push(b);
        items.push(el("li", {class:"rm-row"}, [b, el("span", {text:l.nome})]));
      });
    });
    if(items.length) tl.appendChild(el("li", {class:"rm-per"}, [el("span", {class:"rm-h", text:p}), el("ul", {}, items)]));
  });
  box.appendChild(tl);
  box.appendChild(el("div", {class:"rm-legend"}, [
    el("span", {class:"rm-chip uscito", text:"uscito"}), el("span", {class:"rm-chip previsto", text:"previsto"}),
    el("span", {class:"rm-chip saltato", text:"saltato"})]));
  box.appendChild(info);
  visCaption(box, v);
  whenSeen(box, function(){
    cells.forEach(function(c, i){ c.style.animationDelay = (STILL ? 0 : i * 70) + "ms"; c.classList.add("in"); });
  });
  return box;
}

/* ---------- catena: un processo passo per passo, e dove si spezza ----------
   Per gli attacchi, le procedure, le filiere: si fa partire, i passi si
   accendono uno dopo l'altro. L'interruttore mostra la condizione che ferma
   tutto (l'iPhone aggiornato, la patch, il controllo). */
function visCatena(v){
  const box = visFrame(v, "catena");
  const passi = v.passi || [], rot = v.rottura || null;
  let safe = false, timer = null;
  const ol = el("ol", {class:"ch-list"});
  const info = el("p", {class:"ch-info", text:v.invito || ""});
  const items = passi.map(function(p, i){
    const li = el("li", {class:"ch-step"}, [el("span", {class:"ch-dot", text:String(i + 1)}),
      el("span", {class:"ch-t"}, [el("b", {text:p.titolo}), el("span", {text:p.nota || ""})])]);
    li.addEventListener("click", function(){ info.textContent = p.nota || p.titolo; });
    ol.appendChild(li);
    if(rot && i === rot.dopo){
      const stop = el("li", {class:"ch-stop"}, [el("span", {class:"ch-shield", text:"✕"}), el("span", {text:rot.nota || ""})]);
      ol.appendChild(stop);
    }
    return li;
  });
  const play = el("button", {type:"button", class:"vis-btn", text:v.azione || "Avvia"});
  const row = el("div", {class:"vis-controls"}, [play]);
  if(rot) row.appendChild(toggleRow([["no", rot.senza || "Senza difesa"], ["si", rot.etichetta || "Con difesa"]], function(x){ safe = x === "si"; run(); }));
  box.appendChild(row);
  box.appendChild(ol);
  box.appendChild(info);
  visCaption(box, v);
  function run(){
    clearTimeout(timer);
    box.classList.toggle("safe", safe);
    items.forEach(function(li){ li.classList.remove("on", "off"); });
    let i = 0;
    const next = function(){
      if(i >= items.length) return;
      const blocked = safe && rot && i > rot.dopo;
      items[i].classList.add(blocked ? "off" : "on");
      if(blocked){ for(let j = i; j < items.length; j++) items[j].classList.add("off"); info.textContent = rot.nota || ""; return; }
      info.textContent = passi[i].nota || passi[i].titolo;
      i++; timer = setTimeout(next, STILL ? 0 : 750);
    };
    next();
  }
  play.addEventListener("click", run);
  whenSeen(box, function(){ setTimeout(run, 400); });
  return box;
}

/* ---------- chat: una conversazione d'esempio ----------
   Quando la notizia e' un modo di usare qualcosa (un agente in Messaggi, un
   assistente), la si fa vedere: i messaggi arrivano uno alla volta. */
function visChat(v){
  const box = visFrame(v, "chat");
  const phone = el("div", {class:"chat-phone"});
  const head = el("div", {class:"chat-head"}, [el("span", {class:"chat-av", text:(v.contatto || "A").slice(0, 1)}), el("b", {text:v.contatto || "Agente"})]);
  const list = el("div", {class:"chat-list"});
  phone.appendChild(head); phone.appendChild(list);
  box.appendChild(phone);
  const again = el("button", {type:"button", class:"vis-btn ghost", text:"Rivedi"});
  box.appendChild(el("div", {class:"vis-controls"}, [again]));
  visCaption(box, v);
  let timer = null;
  function bubble(m){
    const b = el("div", {class:"chat-b " + (m.da === "tu" ? "me" : "it")});
    b.appendChild(el("span", {text:m.testo}));
    if(m.carrello && m.carrello.length){
      const card = el("div", {class:"chat-cart"});
      m.carrello.forEach(function(x){ card.appendChild(el("div", {class:"chat-item"}, [el("i"), el("span", {text:x.nome || x})])); });
      if(m.pulsante) card.appendChild(el("span", {class:"chat-pay", text:m.pulsante}));
      b.appendChild(card);
    }
    return b;
  }
  function run(){
    clearTimeout(timer); list.innerHTML = "";
    const msgs = v.messaggi || [];
    let i = 0;
    const next = function(){
      if(i >= msgs.length) return;
      const m = msgs[i];
      if(m.da !== "tu" && !STILL){
        const dots = el("div", {class:"chat-b it typing"}, [el("i"), el("i"), el("i")]);
        list.appendChild(dots); list.scrollTop = list.scrollHeight;
        timer = setTimeout(function(){ dots.remove(); list.appendChild(bubble(m)); list.scrollTop = list.scrollHeight; i++; timer = setTimeout(next, 700); }, 900);
      } else {
        list.appendChild(bubble(m)); list.scrollTop = list.scrollHeight; i++;
        timer = setTimeout(next, STILL ? 0 : 800);
      }
    };
    next();
  }
  again.addEventListener("click", run);
  whenSeen(box, run);
  return box;
}

const VISUALS = {esploso:visEsploso, stime:visStime, barre:visBarre, resa:visResa, piega:visPiega, anno:visAnno,
                 raggio:visRaggio, flusso:visFlusso, onde:visOnde, densita:visDensita, supporto:visSupporto,
                 roadmap:visRoadmap, catena:visCatena, chat:visChat};
function visualNode(v){
  const f = v && VISUALS[v.tipo];
  if(!f) return null;
  try{ return f(v); }catch(e){ return null; }   /* una visualizzazione rotta non rompe la notizia */
}

/* L'approfondimento come pezzo, non come schede (1 novembre 2026). Mike
   leggeva solo «Cosa c'e' sotto»: tappe, «chi lo dice» e «cosa aspettarsi» li
   saltava, e il punto ripeteva il titolo. Ora e' un articolo che va oltre la
   notizia: un titolo suo, un sommario, i numeri che contano, il testo con i
   grafici dentro, le voci degli altri — analisti, testate, commenti — e le
   letture per andare oltre. Le edizioni vecchie, senza titolo ne' voci,
   mostrano il testo, i grafici e le letture; il resto resta nei dati. */
function deepNode(brief, n){
  const a = n.approfondimento || {};
  const box = el("section", {class:"deep", hidden:"hidden", "aria-label":"Approfondimento"});
  box.appendChild(el("div", {class:"deep-top"}, [
    el("span", {class:"dots", "aria-hidden":"true"}, [
      (function(){ const i = el("i"); i.style.background = "var(--red)"; return i; })(),
      (function(){ const i = el("i"); i.style.background = "var(--yellow)"; return i; })(),
      (function(){ const i = el("i"); i.style.background = "var(--blue)"; return i; })()
    ]),
    el("span", {class:"eyebrow", text:"Approfondimento"})
  ]));
  /* il sommario solo sotto un titolo suo: da solo, il punto ripeteva la notizia */
  if(a.titolo){
    box.appendChild(Motion.once(el("h3", {class:"deep-title", text:a.titolo}), "wipe"));
    if(a.punto) box.appendChild(Motion.once(el("p", {class:"deep-deck", text:a.punto}), "rise"));
  }
  Motion.once(box.querySelector(".deep-top .dots"), "dots");

  /* i numeri che contano, grandi, prima del testo */
  const nums = (a.numeri || []).filter(function(x){ return x && x.valore; }).slice(0, 3);
  if(nums.length){
    const strip = el("div", {class:"deep-nums"}, nums.map(function(x){
      const v = el("b", {text:String(x.valore)});
      Motion.count(v);
      return el("div", {class:"deep-num"}, [
        v,
        el("span", {text:x.etichetta || ""}),
        x.fonte ? el("small", {text:x.fonte}) : null
      ]);
    }));
    Motion.stagger(strip.children);
    box.appendChild(Motion.once(strip, "kids"));
  }

  /* I grafici non si impilano: scorrono di lato, uno per schermata, con i
     pallini che dicono quanti sono. */
  const vis = (a.visivi || []).map(visualNode).filter(Boolean);
  let gallery = null;
  if(vis.length === 1) gallery = vis[0];
  if(vis.length > 1){
    const track = el("div", {class:"deep-carousel"});
    vis.forEach(function(x){ track.appendChild(el("div", {class:"slide"}, [x])); });
    const pips = el("div", {class:"deep-pips", role:"tablist"});
    vis.forEach(function(x, i){
      const b = el("button", {type:"button", class:i === 0 ? "on" : "", "aria-label":"grafico " + (i + 1)});
      b.addEventListener("click", function(){ track.scrollTo({left:track.clientWidth * i, behavior:"smooth"}); });
      pips.appendChild(b);
    });
    /* il carosello prende l'altezza del grafico che stai guardando, non del
       piu' alto: altrimenti sotto un grafico basso resta un buco */
    let cur = -1;
    const fit = function(){
      const i = Math.max(0, Math.min(vis.length - 1, Math.round(track.scrollLeft / Math.max(1, track.clientWidth))));
      Array.prototype.forEach.call(pips.children, function(b, j){ b.classList.toggle("on", j === i); });
      const h = track.children[i].firstChild.offsetHeight;
      if(h) track.style.height = (h + 12) + "px";
      cur = i; box.dataset.slide = String(i);
    };
    track.addEventListener("scroll", fit, {passive:true});
    whenSeen(track, fit);
    if("ResizeObserver" in window){
      const ro = new ResizeObserver(function(){ if(cur >= 0) fit(); });
      Array.prototype.forEach.call(track.children, function(sl){ ro.observe(sl.firstChild); });
    } else window.addEventListener("resize", fit);
    /* per ritrovare il grafico giusto dopo un nuovo disegno dell'edizione */
    box._slide = function(i){ track.scrollLeft = track.clientWidth * i; fit(); };
    gallery = el("div", {class:"deep-gallery"}, [track, el("div", {class:"deep-gallery-foot"}, [
      el("span", {class:"eyebrow", text:vis.length + " grafici · scorri"}), pips
    ])]);
  }

  /* il testo, con i grafici dopo il primo paragrafo: si legge, poi si vede */
  const paras = [].concat(a.sotto || []);
  const text = el("div", {class:"deep-body"});
  paras.forEach(function(p, i){
    text.appendChild(el("p", {text:p}));
    if(i === 0 && gallery) text.appendChild(gallery);
  });
  if(!paras.length && gallery) text.appendChild(gallery);
  if(text.childNodes.length) box.appendChild(text);

  /* le voci degli altri: chi lo dice, dove, e quanto pesa la discussione */
  const voci = (a.voci || []).filter(function(v){ return v && v.testo; });
  if(voci.length){
    const list = el("div", {class:"deep-voci"});
    voci.forEach(function(v){
      const u = safeUrl(v.link);
      const cap = el("figcaption", {}, [
        el("b", {text:v.chi || v.dove || ""}),
        (v.chi && v.dove) ? el("span", {text:v.dove}) : null,
        v.segnale ? el("span", {class:"sig", text:v.segnale}) : null
      ]);
      const fig = Motion.once(el("figure", {class:"voce" + (v.tipo ? " v-" + String(v.tipo).toLowerCase() : "")}, [
        el("blockquote", {text:v.testo}), cap
      ]), "quote");
      list.appendChild(u ? el("a", {class:"voce-link", href:u, target:"_blank", rel:"noopener noreferrer"}, [fig]) : fig);
    });
    box.appendChild(el("div", {class:"deep-part"}, [el("h4", {class:"deep-h", text:"Cosa ne dicono"}), list]));
  }

  if(a.approfondire && a.approfondire.length){
    const list = el("div", {class:"deep-links"});
    a.approfondire.forEach(function(x){
      const u = safeUrl(x.link);
      if(!u) return;
      const k = String(x.tipo || "leggi").toLowerCase();
      list.appendChild(el("a", {class:"deep-link", href:u, target:"_blank", rel:"noopener noreferrer"}, [
        el("span", {class:"k " + k, text:k}),
        el("span", {class:"body"}, [
          el("b", {text:x.titolo}),
          el("span", {class:"src", text:[x.fonte, x.durata].filter(Boolean).join(" · ") + (x.perche ? " — " + x.perche : "")})
        ]),
        el("i", {"aria-hidden":"true", text:"↗"})
      ]));
    });
    if(list.childNodes.length) box.appendChild(el("div", {class:"deep-part"}, [el("h4", {class:"deep-h", text:"Per andare oltre"}), list]));
  }
  box.appendChild(el("p", {class:"deep-foot", text:"Approfondimento scritto il " + fmtShort(a.scritto || brief.date)}));

  /* La barra che accompagna la lettura: resta attaccata in fondo allo schermo
     finche' sei dentro l'approfondimento. Chiudi, oppure vai avanti. */
  const bar = el("div", {class:"deep-bar"}, [
    el("button", {type:"button", class:"close", "data-act":"close"}, [el("i", {text:"↑"}), el("span", {text:"Chiudi"})]),
    el("button", {type:"button", class:"next", "data-act":"next"}, [el("span", {text:"Prossima notizia"}), el("i", {text:"→"})])
  ]);
  box.appendChild(bar);
  return box;
}

/* ================= ascolta =================
   La voce del sistema, dentro la pagina: nessun file da scaricare, niente
   da pagare. Legge a frasi, cosi' si puo' fermare e riprendere dal punto
   giusto e la barra sa a che punto sei. Finche' legge tiene lo schermo
   acceso: con lo schermo bloccato iOS ferma la voce. */
const Voice = (function(){
  /* Due voci. Se l'approfondimento ha il suo file (pipeline/audio.py), suona
     quello con un normale elemento <audio>: continua a schermo bloccato, con i
     comandi sulla schermata di blocco, e non tace col telefono in silenzioso.
     Altrimenti legge la voce del browser, a frasi. */
  const tts = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
  const ok = tts || typeof Audio !== "undefined";
  let chunks = [], idx = 0, playing = false, rate = 1, voice = null, title = "", lock = null, bar = null;
  let mode = null, audio = null, started = false, watchdog = null, note = "", gen = 0, bare = false, voiceURI = null;
  /* fileGen: il numero del file in corso, per ignorare le risposte in ritardo
     di quello prima. fallback: il file non e' arrivato, e il prossimo tocco su
     ▶ passa alla voce del telefono (fuori dal tocco iOS la lascerebbe muta).
     lastCancel: quando si e' zittita l'ultima voce, per non ripartire troppo presto. */
  let fileGen = 0, fallback = false, lastCancel = 0, current = null;
  const RATES = [1, 1.15, 1.3, .9];

  function pickVoice(){
    const all = tts ? speechSynthesis.getVoices() : [];
    const it = all.filter(function(x){ return /^it(-|_|$)/i.test(x.lang); });
    const score = function(x){
      let s = 0;
      if(/premium|enhanced|neural|natural|siri/i.test(x.name)) s += 4;
      if(/google/i.test(x.name)) s += 2;
      if(/alice|federica|emma|luca|paola/i.test(x.name)) s += 1;
      if(x.localService) s += 1;
      return s;
    };
    it.sort(function(a, b){ return score(b) - score(a); });
    voice = it[0] || null;
    /* si tiene solo l'identificativo: l'oggetto voce si ripesca al momento
       di parlare, dalla lista di allora */
    voiceURI = voice ? voice.voiceURI : null;
  }
  if(tts){
    pickVoice();
    if(speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", pickVoice);
    else speechSynthesis.onvoiceschanged = pickVoice;
  }

  function split(text){
    const out = [];
    String(text || "").replace(/\s+/g, " ").split(/(?<=[.!?…»”])\s+(?=[A-ZÀ-Ý«“"0-9])/).forEach(function(s){
      s = s.trim(); if(!s) return;
      while(s.length > 240){
        const cut = s.lastIndexOf(",", 240) > 80 ? s.lastIndexOf(",", 240) + 1 : 240;
        out.push(s.slice(0, cut).trim()); s = s.slice(cut).trim();
      }
      out.push(s);
    });
    return out;
  }

  function script(brief, n){
    const a = n.approfondimento, parts = [n.title + "."];
    if(!a){ parts.push(n.sintesi || ""); parts.push(n.descrizione || ""); return parts; }
    if(a.punto) parts.push(a.punto);
    (a.visivi || []).forEach(function(v){ if(v.didascalia) parts.push(v.didascalia); });
    if(a.sotto && a.sotto.length){ parts.push("Cosa c'è sotto."); [].concat(a.sotto).forEach(function(p){ parts.push(p); }); }
    if(a.tappe && a.tappe.length){
      parts.push("Come ci siamo arrivati.");
      a.tappe.forEach(function(t){ parts.push((/^\d{4}-\d{2}$/.test(t.data) ? "A " : "Il ") + spokenDate(t.data) + ": " + t.testo); });
    }
    if(a.fonti){ parts.push("Chi lo dice."); parts.push(a.fonti); }
    if(a.dopo && a.dopo.length){
      parts.push("Cosa aspettarsi.");
      a.dopo.forEach(function(d){ parts.push((d.data ? "Il " + spokenDate(d.data) + ": " : "") + d.testo); });
    }
    parts.push("Fine dell'approfondimento.");
    return parts;
  }

  function mmss(x){ x = Math.max(0, Math.round(x || 0)); return Math.floor(x / 60) + ":" + String(x % 60).padStart(2, "0"); }

  function ui(){
    if(bar) return bar;
    const pp = el("button", {type:"button", class:"pp", "aria-label":"pausa", text:"❚❚"});
    const what = el("div", {class:"what"}, [el("b"), el("span")]);
    const sp = el("button", {type:"button", class:"sp", text:"1×", "aria-label":"velocità"});
    const x = el("button", {type:"button", class:"x", text:"✕", "aria-label":"chiudi"});
    const prog = el("div", {class:"bar"}, [el("i")]);
    bar = el("div", {class:"player", hidden:"hidden", role:"region", "aria-label":"Lettura ad alta voce"}, [pp, what, sp, x, prog]);
    pp.addEventListener("click", function(){ playing ? pause() : resume(); });
    sp.addEventListener("click", function(){
      rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
      sp.textContent = String(rate).replace(".", ",") + "×";
      /* sul file cambia subito; sulla voce vale dalla frase dopo: fermarla e
         ripartire e' proprio quello che su Safari fa perdere l'enunciato */
      if(mode === "file" && audio) audio.playbackRate = rate;
    });
    x.addEventListener("click", stop);
    /* sulla traccia del file si puo' toccare per saltare avanti o indietro */
    prog.addEventListener("click", function(e){
      if(mode !== "file" || !audio || !audio.duration) return;
      const r = prog.getBoundingClientRect();
      audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * audio.duration;
    });
    document.body.appendChild(bar);
    return bar;
  }
  function paint(){
    /* un evento in ritardo del file appena chiuso non deve riaprire la barra */
    if(!mode && !fallback) return;
    const b = ui();
    b.hidden = false;
    document.body.classList.add("has-player");
    b.querySelector(".what b").textContent = title;
    let sub;
    if(note) sub = note;
    else if(mode === "file" && audio){
      sub = (playing ? "In ascolto" : "In pausa") + " · " + mmss(audio.currentTime) + " / " + mmss(audio.duration);
    } else if(mode === "speech" && playing && !started){
      sub = "Avvio…";
    } else {
      sub = (playing ? "In ascolto" : "In pausa") + " · " + Math.min(idx + 1, chunks.length) + "/" + chunks.length;
    }
    b.querySelector(".what span").textContent = sub;
    b.querySelector(".pp").textContent = playing ? "❚❚" : "▶";
    const f = mode === "file" && audio && audio.duration ? audio.currentTime / audio.duration : (chunks.length ? idx / chunks.length : 0);
    b.querySelector(".bar i").style.width = (f * 100) + "%";
    if("mediaSession" in navigator){ try{ navigator.mediaSession.playbackState = playing ? "playing" : "paused"; }catch(e){} }
  }
  async function wake(on){
    try{
      if(on && navigator.wakeLock && !lock){ lock = await navigator.wakeLock.request("screen"); }
      if(!on && lock){ lock.release(); lock = null; }
    }catch(e){}
  }
  function session(n, brief){
    if(!("mediaSession" in navigator)) return;
    const ms = navigator.mediaSession, file = mode === "file";
    try{
      ms.metadata = new MediaMetadata({title:n.title, artist:"The Morning Brief", album:fmtShort(brief.date)});
      ms.setActionHandler("play", resume);
      ms.setActionHandler("pause", pause);
      /* ±15 s solo sul file: sulla voce sposterebbero un file vecchio in pausa */
      ms.setActionHandler("seekbackward", file ? function(){ if(mode === "file" && audio) audio.currentTime = Math.max(0, audio.currentTime - 15); } : null);
      ms.setActionHandler("seekforward", file ? function(){ if(mode === "file" && audio) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15); } : null);
    }catch(e){}
  }
  function unsession(){
    if(!("mediaSession" in navigator)) return;
    const ms = navigator.mediaSession;
    try{ ms.metadata = null; ms.playbackState = "none"; }catch(e){}
    ["play", "pause", "seekbackward", "seekforward"].forEach(function(a){ try{ ms.setActionHandler(a, null); }catch(e){} });
  }

  /* zittisce la voce e segna quando: speak() subito dopo un cancel() che ha
     davvero fermato qualcosa, su Safari, perde l'enunciato (WebKit 191745, 238189) */
  function hush(force){
    if(!tts) return;
    if(force || speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); lastCancel = Date.now(); }
  }
  /* parte subito, o 160 ms dopo l'ultimo cancel. Un timer sotto il secondo
     conta ancora come tocco, quindi iOS lo lascia parlare. */
  function kick(){
    const my = gen, wait = 160 - (Date.now() - lastCancel);
    if(wait > 0) setTimeout(function(){ if(my === gen && playing) speak(); }, wait);
    else speak();
  }

  /* ---- la voce del browser ---- */
  function speak(){
    if(idx >= chunks.length){ stop(); return; }
    const my = gen;
    const u = new SpeechSynthesisUtterance(chunks[idx]);
    u.lang = "it-IT"; u.rate = rate;
    /* la voce si riprende dalla lista di adesso: un oggetto voce preso prima
       che la lista fosse pronta, su iOS, fa tacere l'enunciato */
    const now = bare ? null : speechSynthesis.getVoices().filter(function(v){ return v.voiceURI === voiceURI; })[0];
    if(now) u.voice = now;
    /* ogni evento porta il numero della lettura che l'ha generato: quelli di
       una lettura gia' fermata (Safari li spara anche dentro cancel) si
       ignorano, invece di far saltare o bloccare quella nuova */
    u.onstart = function(){ if(my !== gen) return; if(!started){ started = true; note = ""; paint(); } };
    u.onend = function(){ if(my !== gen || !playing) return; idx++; paint(); speak(); };
    u.onerror = function(e){
      if(my !== gen) return;
      if(e.error === "interrupted" || e.error === "canceled"){
        /* cancellato senza che l'abbiamo chiesto noi: si riprova la frase */
        if(playing){ lastCancel = Date.now(); kick(); }
        return;
      }
      idx++; if(playing) speak();
    };
    speechSynthesis.speak(u);
  }
  function playSpeech(brief, n){
    /* si zittisce solo se c'e' qualcosa in corso; kick() aspetta i 160 ms
       dopo un cancel, anche quello fatto da stop() passando da una notizia all'altra */
    gen++; hush();
    try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
    chunks = [];
    script(brief, n).forEach(function(p){ chunks = chunks.concat(split(p)); });
    idx = 0; playing = true; started = false; mode = "speech"; bare = false; note = ""; fallback = false;
    kick();   /* dentro il tocco, prima di tutto il resto */
    wake(true); session(n, brief); paint();
    clearTimeout(watchdog);
    watchdog = setTimeout(function(){
      if(started || !playing) return;
      /* dopo quattro secondi senza voce: si riprova una volta con la voce
         predefinita, e si dice la causa piu' probabile */
      note = "Non si sente? Togli il Silenzioso e alza il volume";
      bare = true; gen++; hush(true); kick();
      paint();
    }, 4000);
  }

  /* ---- il file audio ---- */
  function playFile(brief, n, url){
    if(!audio){
      audio = new Audio();
      audio.preload = "auto";
      audio.addEventListener("timeupdate", function(){ if(mode === "file") paint(); });
      audio.addEventListener("loadedmetadata", function(){ if(mode === "file") paint(); });
      audio.addEventListener("ended", function(){ if(mode === "file") stop(); });
      /* il sistema puo' fermare il file da se' (una chiamata, le cuffie tolte):
         la barra segue l'elemento invece di restare su ❚❚ */
      audio.addEventListener("pause", function(){ if(mode === "file" && playing && !audio.ended){ playing = false; wake(false); paint(); } });
      audio.addEventListener("play", function(){ if(mode === "file" && !playing){ playing = true; paint(); } });
      audio.addEventListener("error", function(){
        /* il file non arriva (niente rete, deposito irraggiungibile). La voce
           del telefono non si fa partire da qui: fuori dal tocco iOS la
           lascerebbe muta. Si prepara il ripiego per il prossimo ▶. */
        if(mode !== "file" || !audio.getAttribute("src")) return;
        fileGen++; mode = null; playing = false; wake(false);
        fallback = true;
        note = tts ? "Audio non disponibile · ▶ voce del telefono" : "Audio non disponibile · ▶ riprova";
        paint();
      });
    }
    mode = "file"; playing = true; note = ""; fallback = false;
    audio.src = url;
    audio.playbackRate = rate;
    const my = ++fileGen, p = audio.play();
    /* la risposta arriva dopo: se nel frattempo si e' chiuso o cambiato file,
       non tocca la lettura nuova. AbortError e' solo il file cambiato. */
    if(p && p.catch) p.catch(function(e){
      if(my !== fileGen || mode !== "file" || (e && e.name === "AbortError")) return;
      playing = false; paint();
    });
    wake(true); session(n, brief); paint();
  }

  function play(brief, n){
    if(!ok) return;
    stop(true);
    current = [brief, n];
    title = n.title;
    const a = n.approfondimento, url = a && a.audio && safeUrl(a.audio.url);
    /* la copia Artifact non puo' caricare file esterni: li' resta la voce */
    if(url && MODE !== "local"){ playFile(brief, n, url); return; }
    if(tts) playSpeech(brief, n);
  }
  function pause(){
    if(!mode) return;
    playing = false;
    if(mode === "file" && audio) audio.pause();
    else { gen++; hush(); }
    wake(false); paint();
  }
  function resume(){
    /* il file non e' arrivato: la voce del telefono, dentro questo tocco;
       senza voce, si riprova il file */
    if(fallback && current){
      fallback = false;
      if(tts) playSpeech(current[0], current[1]); else play(current[0], current[1]);
      return;
    }
    if(!mode) return;
    playing = true;
    if(mode === "file" && audio){
      const my = fileGen, p = audio.play();
      if(p && p.catch) p.catch(function(e){ if(my === fileGen && mode === "file" && !(e && e.name === "AbortError")){ playing = false; paint(); } });
      wake(true); paint(); return;
    }
    if(!chunks.length) return;
    gen++; wake(true); paint(); kick();
  }
  function stop(keep){
    const close = keep !== true;
    playing = false; clearTimeout(watchdog); note = ""; fallback = false;
    gen++; fileGen++; mode = null;
    /* si scarica il file: altrimenti resta in pausa sulla schermata di blocco
       e i suoi eventi in ritardo riaprono la barra */
    if(audio){ audio.pause(); if(audio.getAttribute("src")){ audio.removeAttribute("src"); audio.load(); } }
    hush();
    wake(false); chunks = []; idx = 0;
    if(close){
      current = null; unsession();
      if(bar) bar.hidden = true; document.body.classList.remove("has-player");
    }
  }
  /* la voce del browser si ferma a pagina nascosta, e al ritorno non manda
     gli eventi che aspettiamo: meglio metterla in pausa noi e mostrarlo */
  document.addEventListener("visibilitychange", function(){
    if(mode !== "speech") return;
    if(document.hidden && playing) pause();
  });
  window.addEventListener("pagehide", function(){ if(mode === "speech") stop(); });
  return {ok:ok, play:play, stop:stop};
})();


function storyNode(brief, n, index){
  const k = key(brief.date, n.id);
  /* top: le prime cinque, quelle con l'approfondimento — nella lista del Duo
     stanno «In primo piano», con la foto */
  const wrap = el("article", {class:"story" + (typeof index === "number" && index < 5 ? " top" : ""), id:"s-" + n.id});
  const m0 = mk(k);
  if(m0 && m0.read_at) wrap.classList.add("is-read");

  /* Una riga di pastiglie sola: il tag, e sui rumor quanto e' solido. Su una
     notizia confermata "affidabilita' alta" e' ovvio, e categoria e numero di
     puntata erano scritte in piu' che nessuno leggeva (30 settembre 2026). */
  const chips = el("div", {class:"chips"});
  if(n.tag) chips.appendChild(el("span", {class:tagClass(n.tag), text:n.tag}));
  if(n.tag === "RUMOR" && n.reliability){
    const lv = {alta:3, media:2, bassa:1}[n.reliability] || 0;
    const meter = el("span", {class:"meter m-" + n.reliability, role:"img",
      "aria-label":"affidabilità " + n.reliability, title:"affidabilità " + n.reliability});
    for(let i = 1; i <= 3; i++) meter.appendChild(el("i", {class:i <= lv ? "on" : ""}));
    chips.appendChild(meter);
  }
  if(n.approfondimento) chips.appendChild(el("span", {class:"chip deep-mark", text:"approfondita"}));
  const thread = n.thread ? THREADS[n.thread] : null;

  const kicker = el("span", {class:"kicker"}, [
    el("span", {text:reparto(n)}),
    n.tag === "RUMOR" ? el("span", {class:"rumor", text:"rumor"}) : null
  ]);
  const head = el("div", {class:"story-head"}, [
    bead(typeof index === "number" ? index : 0, String(typeof index === "number" ? index + 1 : (n.rank || 0))),
    kicker,
    chips,
    el("h3", {text:n.title}),
    el("p", {class:"lede", text:n.sintesi || ""})
  ]);
  if(n.image){
    head.classList.add("with-thumb");
    head.appendChild(el("img", {class:"thumb", src:n.image, alt:"", loading:"lazy", decoding:"async"}));
  }

  const body = el("div", {class:"story-body", hidden:"hidden"});
  body.appendChild(el("p", {text:n.descrizione || ""}));
  const nums = numbersNode(n.facts);
  if(nums) body.appendChild(nums);
  /* il rilascio di un sistema: l'elenco completo, prima dell'approfondimento */
  const nov = novitaNode(n);
  if(nov) body.appendChild(nov);

  /* Approfondisci e Ascolta: il primo apre il pezzo lungo scritto la mattina
     per le prime notizie, il secondo lo legge ad alta voce (o legge la
     notizia, se l'approfondimento non c'e'). */
  const deep = n.approfondimento ? deepNode(brief, n) : null;
  const acts = el("div", {class:"deep-acts"});
  if(deep){
    const openBtn = el("button", {type:"button", class:"deep-open", "aria-expanded":"false"}, [
      el("span", {text:"Approfondisci"}), el("i", {"aria-hidden":"true", text:"↓"})
    ]);
    const setDeep = function(on){
      deep.hidden = !on;
      openBtn.setAttribute("aria-expanded", on ? "true" : "false");
      openBtn.classList.toggle("on", on);
      openBtn.firstChild.textContent = on ? "Chiudi approfondimento" : "Approfondisci";
    };
    wrap._deep = setDeep;
    openBtn.addEventListener("click", function(ev){
      ev.stopPropagation();
      const on = deep.hidden;
      setDeep(on);
      if(on) Sig.bump(key(brief.date, n.id), "d");
      if(on) setTimeout(function(){
        /* nel pannello del Duo scorre solo il pannello: la lista resta dov'e' */
        if(Reader.holds(wrap)) Reader.reveal(deep);
        else deep.scrollIntoView({behavior:"smooth", block:"start"});
      }, 30);
    });
    /* la barra in fondo: Chiudi riporta al titolo, Prossima chiude questa
       notizia e apre la successiva — il "va bene, basta" che mancava */
    deep.querySelector('[data-act="close"]').addEventListener("click", function(ev){
      ev.stopPropagation(); setDeep(false);
      if(Reader.holds(wrap)) Reader.top(); else wrap.scrollIntoView({block:"start"});
    });
    deep.querySelector('[data-act="next"]').addEventListener("click", function(ev){
      ev.stopPropagation(); setDeep(false);
      body.hidden = true; wrap.classList.remove("is-open");
      let next = wrap.nextElementSibling;
      while(next && !(next.classList && next.classList.contains("story"))) next = next.nextElementSibling;
      if(!next){ wrap.scrollIntoView({block:"start"}); return; }
      /* prima si apre la prossima, poi si salta al suo titolo senza
         animazione: con lo scorrimento morbido, la notizia sopra che si
         chiude spostava tutto a meta' corsa e si finiva altrove */
      const nb = next.querySelector(".story-body");
      if(nb && nb.hidden) next.querySelector(".story-head").click();
      next.scrollIntoView({block:"start"});
    });
    acts.appendChild(openBtn);
  }
  /* Ascolta non c'e' piu' (1 novembre 2026: Mike non l'ha mai usato). Voice,
     piu' su, resta pronto: per riaccenderlo basta un pulsante che chiami
     Voice.play(brief, n). */
  if(acts.childNodes.length) body.appendChild(acts);
  if(deep) body.appendChild(deep);
  /* La nota sulla fonte e «Chiude una previsione» restano nei dati — servono
     alla taratura e alle pagelle — ma non si mostrano: Mike non le leggeva
     (1 novembre 2026). */
  /* La previsione di un rumor si mostra solo dopo che qualcuno l'ha chiusa:
     aperta e' contabilita' interna, verificata e' una notizia. Il conto per
     fonte non sta nell'app — si legge con pipeline/claims.py score. */
  if(n.claim && n.claim.id){
    const c = claimById(n.claim.id);
    if(c && c.res){
      const box = el("div", {class:"claim closed"}, [
        el("span", {class:"lbl", text:"Come è andata a finire"}),
        el("p", {class:"txt", text:n.claim.text || ""}),
        el("div", {class:"foot"}, [
          el("span", {class:"verdict v-" + c.state, text:c.state}),
          el("span", {class:"eyebrow", text:"verificata il " + fmtShort(c.res.date)})
        ])
      ]);
      if(c.res.note) box.appendChild(el("span", {text:c.res.note}));
      box.appendChild(el("button", {class:"act", type:"button", text:"Vedi la notizia che l'ha chiusa",
        onclick:function(ev){ ev.stopPropagation(); jumpTo(c.res.date, c.res.news.id); }}));
      body.appendChild(box);
    }
  }

  body.appendChild(echoNode(n));

  wrap._markRead = function(){
    if(NOTES && !(mk(k) && mk(k).read_at)){
      mark(k).read_at = new Date().toISOString();
      wrap.classList.add("is-read");
      touched(k);
    }
  };
  head.addEventListener("click", function(){
    /* sul Duo aperto la notizia non si apre qui sotto: va nel pannello a destra */
    if(Reader.claims(wrap)){ Reader.show(wrap, true); return; }
    body.hidden = !body.hidden;
    wrap.classList.toggle("is-open", !body.hidden);
    if(!body.hidden){ wrap._markRead(); Motion.swap(body); }
  });

  /* Quello che il pannello del Duo si porta via e poi restituisce: il corpo e
     i pulsanti si spostano, non si copiano, cosi' approfondimento, Ascolta,
     appunti e segnali di lettura restano gli stessi oggetti. Il capo invece
     si ridisegna, piu' grande, perche' nella lista resta il titolo. */
  wrap._parts = {body:body, bar:null, panel:null};
  wrap._readerHead = function(){
    /* l'occhiello ripete il reparto della lista, nell'arancione di «sei qui»:
       si vede a colpo d'occhio quale voce e' aperta a destra */
    return el("header", {class:"reader-head"}, [
      el("div", {class:"reader-kicker"}, [
        el("span", {class:"reader-rep", text:reparto(n) + (n.tag === "RUMOR" ? " · rumor" : "")}),
        el("span", {class:"eyebrow", text:fmtDate(brief.date)})
      ]),
      chips.childNodes.length ? chips.cloneNode(true) : null,
      el("h2", {text:n.title}),
      (n.hero || n.image) ? el("span", {class:"breath reader-frame"}, [el("img", {class:"reader-shot", src:n.hero || n.image, alt:"", decoding:"async"})]) : null,
      n.sintesi ? el("p", {class:"lede", text:n.sintesi}) : null
    ]);
  };

  wrap.appendChild(head);
  wrap.appendChild(body);
  if(!NOTES) return wrap;   /* copia di sola lettura: niente appunti */

  const tools = itemTools(k, {
    ref:{date:brief.date, id:n.id, title:n.title},
    onNote:function(){ body.hidden = false; wrap.classList.add("is-open"); }
  });
  wrap._parts.bar = tools.bar;
  wrap._parts.panel = tools.panel;
  wrap.appendChild(tools.bar);
  wrap.appendChild(tools.panel);
  return wrap;
}

/* ================= diario: scritture ================= */
function addDiary(fields){
  const now = new Date().toISOString();
  S.diary.unshift(Object.assign({
    id:"d" + Date.now() + Math.random().toString(36).slice(2,6),
    ts:Date.now(), text:"", tags:[], link:null, ref:null,
    updated_at:now, deleted_at:null, dirty:true
  }, fields));
  save(); queueSync(); refreshCounts();
}
function removeDiary(id){
  const e = S.diary.filter(function(x){ return x.id === id; })[0];
  if(!e) return;
  e.deleted_at = new Date().toISOString();
  e.updated_at = e.deleted_at;
  e.dirty = true;
  save(); queueSync(); refreshCounts();
}
function liveDiary(){ return S.diary.filter(function(e){ return !e.deleted_at; }); }

/* ================= il pannello del Duo =================
   Sullo schermo interno di iPhone Duo (fra 601 e 1.039 punti, in verticale e
   in orizzontale) la scheda APPLE e' lista a sinistra e notizia a destra. Si
   decide sulla larghezza, non sul modello: vale anche per l'iPad mini in
   verticale, e un Duo chiuso torna telefono.

   La notizia non viene copiata nel pannello: ci si sposta il suo corpo con i
   pulsanti, e torna al suo posto quando ne scegli un'altra o chiudi il
   telefono. Cosi' approfondimento, Ascolta e appunti restano gli stessi, e i
   segnali di lettura — che si agganciano all'<article> con i pulsanti —
   contano una volta sola: il pannello e' anch'esso un <article>.

   Il momento che giustifica tutto: stai leggendo una notizia a telefono
   chiuso, lo apri, e la ritrovi a destra senza perdere il punto. E il
   contrario: chiudi il telefono e la notizia resta aperta nella lista.

   Il pannello non e' mai vuoto: all'apertura, se non stavi leggendo niente,
   mostra la prima pagina dell'edizione (frontPage, piu' sotto), che non e'
   una notizia e non conta come lettura. Senza prima pagina — non succede
   nell'edizione, ma il modulo lo regge — mostra la notizia d'apertura come
   anteprima, che non conta finche' non la tocchi. */
const Reader = (function(){
  const MQ = window.matchMedia ? window.matchMedia("(min-width:601px) and (max-width:1039px)") : null;
  let box = null, pane = null, cur = null, cover = null, front = false;

  /* La larghezza della pagina cambia con lo zoom di Safari: al 75% il Duo
     dichiara oltre 1.040 punti e prendeva le colonne del Mac (1 novembre
     2026). Lo schermo invece non cambia: uno schermo touch largo fra 601 e
     1.039 punti nel verso in cui lo tieni e' il Duo, a qualunque zoom. In
     quel caso si segna html.duo-forzato, che spegne anche le colonne del Mac. */
  const COARSE = window.matchMedia ? window.matchMedia("(pointer:coarse)") : null;
  const LAND = window.matchMedia ? window.matchMedia("(orientation:landscape)") : null;
  function screenDuo(){
    if(!COARSE || !COARSE.matches || !window.screen) return false;
    const a = screen.width, b = screen.height;
    const w = LAND && LAND.matches ? Math.max(a, b) : Math.min(a, b);
    return w >= 601 && w <= 1039;
  }
  function on(){
    const mq = !!(MQ && MQ.matches), forced = !mq && screenDuo();
    document.documentElement.classList.toggle("duo-forzato", forced);
    return mq || forced;
  }
  function root(){ return document.getElementById("view-oggi"); }
  function active(){ return on() && !!box && box.isConnected; }
  function claims(w){ return active() && !!w && !!w._parts && box.contains(w) && !pane.contains(w); }
  function holds(w){ return !!w && cur === w; }

  function mast(){
    const m = document.getElementById("masthead");
    if(m && m.offsetHeight) document.documentElement.style.setProperty("--mast", m.offsetHeight + "px");
  }

  /* rimette corpo e pulsanti nella notizia, nell'ordine di prima */
  function restore(openInline){
    if(!cur) return;
    const w = cur, p = w._parts;
    w.appendChild(p.body);
    if(p.bar) w.appendChild(p.bar);
    if(p.panel) w.appendChild(p.panel);
    p.body.hidden = !openInline;
    w.classList.toggle("is-open", !!openInline);
    w.classList.remove("is-reading");
    w.removeAttribute("aria-current");
    pane.innerHTML = "";
    pane.classList.remove("is-open");
    cur = null;
  }

  /* La prima pagina: quello che il pannello mostra quando non stai leggendo
     niente. Non e' una notizia, quindi non porta pulsanti ne' segnali: il
     pannello senza .tools non conta come vista ne' come lettura. */
  function entry(){ return box ? box.querySelector(".fp-entry") : null; }
  function showFront(){
    if(!active() || !cover) return;
    if(cur) restore(false);
    pane.innerHTML = "";
    pane.classList.remove("is-open");
    pane.appendChild(cover());
    pane.scrollTop = 0;
    front = true;
    Motion.swap(pane);
    const e = entry();
    if(e){ e.classList.add("is-reading"); e.setAttribute("aria-current", "true"); }
  }
  function unfront(){
    if(!front) return;
    front = false;
    pane.innerHTML = "";
    const e = entry();
    if(e){ e.classList.remove("is-reading"); e.removeAttribute("aria-current"); }
  }

  function show(w, real){
    if(!active() || !w || !w._parts) return;
    if(cur === w){
      /* l'anteprima diventa lettura vera quando la tocchi */
      if(real && !pane.classList.contains("is-open")){
        pane.classList.add("is-open"); w.classList.add("is-open");
        if(w._markRead) w._markRead();
      }
      return;
    }
    if(cur) restore(false);
    unfront();
    const p = w._parts;
    pane.appendChild(w._readerHead());
    pane.appendChild(p.body);
    p.body.hidden = false;
    if(p.bar) pane.appendChild(p.bar);
    if(p.panel) pane.appendChild(p.panel);
    pane.scrollTop = 0;
    Motion.swap(pane);
    cur = w;
    w.classList.add("is-reading");
    w.setAttribute("aria-current", "true");
    pane.classList.toggle("is-open", !!real);
    w.classList.toggle("is-open", !!real);
    if(real && w._markRead) w._markRead();
  }

  /* telefono aperto: va nel pannello la notizia che stavi leggendo — se ce
     n'e' piu' d'una aperta, quella che occupa piu' schermo — o l'apertura */
  function enter(){
    const r = root();
    if(r) r.classList.add("duo");
    mast();
    if(!active() || cur) return;
    const list = box.querySelector(".newslist");
    if(!list) return;
    const opened = Array.prototype.filter.call(list.querySelectorAll(".story.is-open"),
                                               function(w){ return !!w._parts; });
    /* -Infinity, non -1: aprendo il telefono la pagina si ridispone e la
       notizia aperta puo' finire fuori schermo, ma resta quella da leggere */
    let target = null, best = -Infinity;
    opened.forEach(function(w){
      const rc = w.getBoundingClientRect();
      const vis = Math.min(rc.bottom, window.innerHeight) - Math.max(rc.top, 0);
      if(vis > best){ best = vis; target = w; }
    });
    opened.forEach(function(w){
      if(w !== target){ w._parts.body.hidden = true; w.classList.remove("is-open"); }
    });
    if(target){
      show(target, true);
      /* la lista compatta e' molto piu' corta di quella del telefono: senza
         questo la pagina resterebbe dov'era, giu' nel radar, e il pannello
         sopra lo schermo. Con la notizia a centro lista il pannello e' li'. */
      target.scrollIntoView({block:"center"});
      return;
    }
    if(cover){ showFront(); return; }
    const first = list.querySelector(".story");
    if(first) show(first, false);
  }

  /* telefono chiuso: la notizia torna nella lista, aperta se la stavi leggendo */
  function leave(){
    const r = root();
    if(r) r.classList.remove("duo");
    unfront();
    if(!cur) return;
    const w = cur, real = pane.classList.contains("is-open");
    restore(real);
    if(real) w.scrollIntoView({block:"start"});
  }

  function mount(b, c){
    box = b; pane = b ? b.querySelector(".reader") : null; cur = null; front = false;
    cover = c || null;
    last = on();
    if(last) enter(); else { const r = root(); if(r) r.classList.remove("duo"); }
  }
  function state(){
    return cur ? {id:cur.id, real:pane.classList.contains("is-open"), top:pane.scrollTop} : null;
  }
  function top(v){ if(pane) pane.scrollTop = v || 0; }
  function reveal(node){
    if(!pane || !node) return;
    const y = node.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop - 12;
    pane.scrollTo({top:Math.max(0, y), behavior:"smooth"});
  }

  /* Aprire o chiudere il Duo e' un cambio di larghezza. L'evento della media
     query di solito arriva, ma non in ogni WebView e non sempre in modalita'
     app a tutto schermo: a ogni ridimensionamento si ricontrolla anche a mano,
     e si agisce solo se lo stato e' davvero cambiato. */
  let last = on();
  function sync(){
    const now = on();
    if(now === last && (now ? root() && root().classList.contains("duo") : true)) return;
    last = now;
    if(now) enter(); else leave();
  }
  if(MQ){
    if(MQ.addEventListener) MQ.addEventListener("change", sync);
    else if(MQ.addListener) MQ.addListener(sync);
  }
  let mt = null;
  const onResize = function(){ clearTimeout(mt); mt = setTimeout(function(){ mast(); sync(); }, 120); };
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);

  return {active:active, claims:claims, holds:holds, show:show, mount:mount, state:state, top:top, reveal:reveal, front:showFront};
})();

/* ================= vista edizione ================= */
let currentDate = BRIEFS[0] ? BRIEFS[0].date : null;

/* Ridisegnare l'edizione (download finito, sincronizzazione dall'altro
   dispositivo) non deve chiudere quello che stai leggendo: si ricordano le
   notizie aperte, l'approfondimento con la sua scheda e il suo grafico, e
   il punto della pagina, e si rimettono com'erano. Solo se l'edizione e' la stessa. */
function renderEdition(){
  const root = document.getElementById("view-oggi");
  const was = root.dataset.date || "", y = window.scrollY, open = [];
  /* sul Duo il corpo della notizia sta nel pannello, non dentro l'<article>:
     approfondimento e grafico si cercano nel corpo, ovunque si trovi */
  const bodyOf = function(w){ return w._parts ? w._parts.body : w.querySelector(".story-body"); };
  const rd = Reader.state();
  const sh = Sheet.state();
  Sheet.drop();
  Array.prototype.forEach.call(root.querySelectorAll(".story.is-open"), function(w){
    const b = bodyOf(w), d = b ? b.querySelector(".deep") : null;
    open.push({id:w.id, deep:!!(d && !d.hidden), tab:d ? d.dataset.tab : null, slide:d ? d.dataset.slide : null});
  });
  const brief = drawEdition(root);
  root.dataset.date = brief ? brief.date : "";
  if(!was || was !== root.dataset.date) return;
  if(magazine()){
    const w = sh ? document.getElementById(sh.id) : null;
    if(w){ Sheet.open(w, {instant:true}); Sheet.top(sh.top); }
    window.scrollTo(0, y);
    return;
  }
  open.forEach(function(o){
    const w = document.getElementById(o.id);
    if(!w || !root.contains(w)) return;
    const body = bodyOf(w);
    if(Reader.active()) Reader.show(w, true);
    else if(body){ body.hidden = false; w.classList.add("is-open"); }
    if(o.deep && w._deep){
      w._deep(true);
      const d = body ? body.querySelector(".deep") : null;
      if(d && d._tab && o.tab) d._tab(+o.tab);
      if(d && d._slide && o.slide && +o.slide > 0) d._slide(+o.slide);
    }
  });
  /* e il punto dentro il pannello, se era lo stesso pezzo */
  const now = Reader.state();
  if(rd && now && now.id === rd.id) Reader.top(rd.top);
  window.scrollTo(0, y);
}
/* ================= la prima pagina del Duo =================
   Quello che si vede aprendo il Duo, prima di toccare qualsiasi cosa (1
   novembre 2026: Mike, davanti alla vecchia apertura in orizzontale — pallini,
   data, i tre titoli, l'intro, tutta la prima schermata spesa prima della
   prima notizia — «non lo accetto»). A sinistra c'e' gia' l'indice dal primo
   pixel; a destra, finche' non scegli, la prima pagina dell'edizione:

   - la testata del giorno;
   - la fila dei pallini, uno per notizia: lo stesso colore e lo stesso numero
     della lista, pieni quelli da leggere e spenti quelli letti — il campo di
     pallini della sigla, che qui dice quanto ti resta;
   - l'apertura come in televisione: la foto e sopra il sottopancia, la
     fascia gialla e il titolo su nero;
   - la seconda e la terza affiancate, poi il quadro della giornata.

   Ogni tocco apre la notizia accanto, come dalla lista. La pagina si rifa'
   ogni volta che torni su «Prima pagina», cosi' i pallini letti sono veri. */
function frontPage(brief, wraps){
  const news = brief.news || [];
  const d = new Date(brief.date + "T12:00:00");
  const fp = el("div", {class:"fp"});
  const open = function(i){
    const w = wraps[i];
    if(!w) return;
    Sig.bump(key(brief.date, news[i].id), "o");
    Reader.show(w, true);
    w.scrollIntoView({block:"nearest"});
  };

  /* la testata del giorno */
  const head = el("header", {class:"fp-head"}, [
    el("div", {class:"fp-when"}, [
      el("span", {class:"eyebrow", text:isNaN(d) ? "" : GIORNI[d.getDay()] + " · " + (brief.window || "ultime 24 ore")}),
      el("h2", {class:"fp-date", text:isNaN(d) ? brief.date : d.getDate() + " " + MESI[d.getMonth()]})
    ])
  ]);
  fp.appendChild(head);

  /* la fila: un pallino per notizia, spento se l'hai letta */
  const row = el("div", {class:"fp-beads"});
  let read = 0;
  news.forEach(function(n, i){
    const done = !!(wraps[i] && wraps[i].classList.contains("is-read"));
    if(done) read++;
    const b = el("button", {type:"button", class:"fp-bead" + (done ? " is-read" : ""),
      title:n.title, "aria-label":(i + 1) + ". " + n.title + (done ? " (letta)" : ""),
      onclick:function(ev){ ev.stopPropagation(); open(i); }}, [bead(i, String(i + 1))]);
    b.style.setProperty("--i", i);
    row.appendChild(b);
  });
  const left = news.length - read;
  fp.appendChild(el("div", {class:"fp-row"}, [row, el("span", {class:"eyebrow fp-count",
    text:!read ? news.length + " notizie da leggere" : !left ? "tutte lette" : read + (read === 1 ? " letta, " : " lette, ") + left + " da leggere"})]));

  /* l'apertura: la foto e il sottopancia */
  const lead = news[0];
  if(lead){
    const src = lead.hero || lead.image;
    const fig = el("figure", {class:"fp-lead" + (src ? "" : " no-img"), onclick:function(){ open(0); }}, [
      src ? el("img", {src:src, alt:"", decoding:"async"}) : null,
      el("figcaption", {class:"fp-chyron"}, [
        el("span", {class:"fp-tag", text:"In apertura" + (lead.tag ? " · " + lead.tag : "")}),
        el("span", {class:"fp-title", text:lead.title})
      ])
    ]);
    fp.appendChild(fig);
    if(lead.sintesi) fp.appendChild(el("p", {class:"fp-lede", text:lead.sintesi}));
  }

  /* la seconda e la terza */
  const two = news.slice(1, 3);
  if(two.length){
    const box = el("div", {class:"fp-seconds"});
    two.forEach(function(n, j){
      const i = j + 1;
      box.appendChild(el("button", {type:"button", class:"fp-second", onclick:function(){ open(i); }}, [
        n.image ? el("img", {src:n.image, alt:"", loading:"lazy", decoding:"async"}) : null,
        el("span", {class:"fp-k"}, [bead(i, String(i + 1)), n.tag ? el("span", {class:tagClass(n.tag), text:n.tag}) : null]),
        el("h3", {text:n.title})
      ]));
    });
    Motion.stagger(box.children);
    fp.appendChild(Motion.once(box, "kids"));
  }

  /* il quadro: la prima frase in nero, come l'attacco di un fondo */
  if(brief.intro){
    const m = brief.intro.match(/^(.+?[.!?])\s+(.+)$/);
    fp.appendChild(el("section", {class:"fp-quadro"}, [
      el("span", {class:"eyebrow", text:"Il quadro della giornata"}),
      el("p", {}, m ? [el("b", {text:m[1] + " "}), document.createTextNode(m[2])] : [document.createTextNode(brief.intro)])
    ]));
  }
  const st = brief.stats || {};
  if(st.articoli_letti){
    fp.appendChild(el("p", {class:"eyebrow fp-foot",
      text:st.articoli_letti + " articoli letti · " + (st.notizie_selezionate || news.length) + " scelti"}));
  }
  return fp;
}
function frontEntry(brief){
  const d = new Date(brief.date + "T12:00:00");
  return el("button", {type:"button", class:"fp-entry", onclick:function(){ Reader.front(); }}, [
    el("span", {class:"fp-mark", "aria-hidden":"true"}, [el("i"), el("i"), el("i"), el("i")]),
    el("span", {class:"fp-entry-t"}, [
      el("b", {text:"Prima pagina"}),
      el("span", {class:"eyebrow", text:(isNaN(d) ? "" : d.getDate() + " " + MESI[d.getMonth()].slice(0, 3) + " · ") +
        (brief.news || []).length + " notizie"})
    ])
  ]);
}

/* ================= la vista Magazine =================
   La seconda veste della scheda APPLE (2 novembre 2026). Mike ha letto
   Apple News+ e se n'e' innamorato: schede su carta, una costruzione uguale
   per tutte, il ritmo da rivista — grande, affiancate, orizzontale, brevi —
   una citazione grande a meta' strada, un commento della redazione. Senza il
   vuoto di News+: sotto ogni titolo le due-tre righe che dicono di cosa
   parla, che e' la cosa che fa venire voglia di aprire. La vista Classica
   resta com'era: il pulsante in testata passa dall'una all'altra. L'app si apre
   sempre nella Magazine (Mike, 2 novembre 2026): la Classica dura finche' l'app
   resta aperta (sessionStorage), alla prossima apertura si riparte dalla Magazine. Il fondo osso, i pallini e le chicche restano.

   La notizia toccata si apre a tutto schermo (Sheet): ci si spostano corpo
   e pulsanti dell'<article> della lista, come fa il pannello del Duo, cosi'
   approfondimento, appunti e segnali di lettura restano gli stessi oggetti. */
const VISTA_KEY = "tmb-vista";
/* Dal 3 novembre 2026 c'e' solo la Magazine (Mike: «via il pulsante, da domani solo
   modern»). La Classica resta qui dentro, spenta: per riaccenderla basta rimettere
   true, e torna il pulsante in testata. Il suo stato «amato» e' nel tag git
   app-amata-2026-11-02. */
const VISTA_PULSANTE = false;
let VISTA = "magazine";
try{
  localStorage.removeItem(VISTA_KEY);
  if(VISTA_PULSANTE && sessionStorage.getItem(VISTA_KEY) === "classica") VISTA = "classica";
