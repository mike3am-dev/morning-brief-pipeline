<title>The Morning Brief</title>

<style>
/* =========================================================
   Identità: campiture piatte, campo di pallini, condensato
   pesante su fondo osso — riferimento alla sigla di
   The Morning Show. Quattro colori saturi con ruolo
   semantico: giallo = rumor, blu = confermato, arancio =
   dati, rosso = analisi e opinione.
   ========================================================= */
:root{
  --bone:#EDEAE3;
  --paper:#F8F6F2;
  --paper-2:#E3DFD6;
  --ink:#17181B;
  --ink-2:#4B4D53;
  --ink-3:#7C7F87;
  --rule:#D7D2C7;
  --rule-strong:#BDB7AA;

  --yellow:#F5C518;
  --orange:#F0821E;
  --red:#E01F3D;
  --blue:#0E9CD8;
  --brand:#E0AB00;

  --yellow-ink:#7A5F00;
  --orange-ink:#93490A;
  --red-ink:#A5122A;
  --blue-ink:#0A5E82;

  --accent:var(--orange);
  --accent-ink:#93490A;
  --on-fill:#17181B;
  --ok:#2C7A46;

  --display:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue",
            "Arial Narrow",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;

  --gutter:clamp(1.1rem,4.5vw,3rem);
  --shadow:0 2px 3px rgba(23,24,27,.05), 0 14px 34px -22px rgba(23,24,27,.45);
}

@media (prefers-color-scheme:dark){
  :root{
    --bone:#131418; --paper:#1B1D22; --paper-2:#24272E;
    --ink:#F1EEE8; --ink-2:#B5B3AD; --ink-3:#84868D;
    --rule:#2B2E35; --rule-strong:#414550;
    --yellow:#F7CE3C; --orange:#F8963A; --red:#F0435C; --blue:#35B6EC;
    --brand:#F7CE3C;
    --yellow-ink:#F7CE3C; --orange-ink:#F8963A; --red-ink:#F0435C; --blue-ink:#35B6EC;
    --accent:#F8963A; --accent-ink:#F8963A; --on-fill:#131418; --ok:#6FBF87;
    --shadow:0 2px 4px rgba(0,0,0,.5), 0 16px 38px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bone:#131418; --paper:#1B1D22; --paper-2:#24272E;
  --ink:#F1EEE8; --ink-2:#B5B3AD; --ink-3:#84868D;
  --rule:#2B2E35; --rule-strong:#414550;
  --yellow:#F7CE3C; --orange:#F8963A; --red:#F0435C; --blue:#35B6EC;
  --brand:#F7CE3C;
  --yellow-ink:#F7CE3C; --orange-ink:#F8963A; --red-ink:#F0435C; --blue-ink:#35B6EC;
  --accent:#F8963A; --accent-ink:#F8963A; --on-fill:#131418; --ok:#6FBF87;
  --shadow:0 2px 4px rgba(0,0,0,.5), 0 16px 38px -24px rgba(0,0,0,.9);
}
:root[data-theme="light"]{
  --bone:#EDEAE3; --paper:#F8F6F2; --paper-2:#E3DFD6;
  --ink:#17181B; --ink-2:#4B4D53; --ink-3:#7C7F87;
  --rule:#D7D2C7; --rule-strong:#BDB7AA;
  --yellow:#F5C518; --orange:#F0821E; --red:#E01F3D; --blue:#0E9CD8;
  --brand:#E0AB00;
  --yellow-ink:#7A5F00; --orange-ink:#93490A; --red-ink:#A5122A; --blue-ink:#0A5E82;
  --accent:#F0821E; --accent-ink:#93490A; --on-fill:#17181B; --ok:#2C7A46;
  --shadow:0 2px 3px rgba(23,24,27,.05), 0 14px 34px -22px rgba(23,24,27,.45);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--bone); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.62;
  -webkit-text-size-adjust:100%; overflow-x:clip;
}
h1,h2,h3,h4{margin:0; line-height:1.08; text-wrap:balance}
p{margin:0}
a{color:var(--accent-ink); text-underline-offset:3px; text-decoration-thickness:from-font}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

.eyebrow{
  font-size:.63rem; font-weight:600; letter-spacing:.19em;
  text-transform:uppercase; color:var(--ink-3);
}

/* ---------------- marchio ---------------- */
/* Il marchio ricalca la sigla di The Morning Show: tre righe incolonnate sulla
   larghezza della parola grande — "The" piccolo in alto a filo sinistro, la
   parola grande con la O sostituita da un cerchio pieno, la terza parola
   piccola sotto a filo destro. Tutto in stampatello, tutto giallo. */
.wordmark{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  color:var(--brand); letter-spacing:-.012em; line-height:.84;
  display:grid; grid-template-columns:auto; justify-content:start;
}
.wordmark .the{font-size:.33em; letter-spacing:.06em; justify-self:start; padding-bottom:.1em}
.wordmark .mrn{font-size:1em; white-space:nowrap}
.wordmark .brf{font-size:.36em; letter-spacing:.06em; justify-self:end; padding-top:.16em}
/* la O piena: un cerchio poco piu' alto delle maiuscole, come nella sigla */
.wordmark .o{
  display:inline-block; width:.73em; height:.73em; border-radius:50%;
  background:currentColor; vertical-align:-.035em; margin:0 .015em;
}

/* ---------------- accesso ---------------- */
.gate{
  position:fixed; inset:0; z-index:100; background:var(--bone);
  display:grid; place-items:center; padding:var(--gutter);
}
.gate[hidden]{display:none}
.gate-card{width:100%; max-width:23rem; display:flex; flex-direction:column; gap:1.1rem}
.gate canvas{display:block; width:100%; height:60px}
.gate .wordmark{font-size:2.6rem}
.gate form{display:flex; flex-direction:column; gap:.55rem}
.gate input{
  font:inherit; font-size:1rem; padding:.65rem .8rem; background:var(--paper);
  color:var(--ink); border:0; box-shadow:inset 0 0 0 1.5px var(--rule); border-radius:4px;
}
.gate input:focus{box-shadow:inset 0 0 0 2.5px var(--blue); outline:none}
.gate .err{color:var(--red); font-size:.85rem; min-height:1.2rem}
.gate .hint{font-size:.85rem; color:var(--ink-3); line-height:1.5}

/* ---------------- testata ---------------- */
.masthead{
  position:sticky; top:0; z-index:30; background:var(--bone);
  border-bottom:2px solid var(--ink);
}
.masthead[hidden]{display:none}
.masthead-inner{max-width:1240px; margin:0 auto; padding:.55rem var(--gutter) 0}
.brand{display:flex; align-items:center; gap:.7rem}
.brand .wordmark{font-size:1.62rem}
.dot-mark{display:flex; gap:3px; align-items:center}
.dot-mark i{width:9px; height:9px; border-radius:50%; display:block}
.brand .edition{
  font-size:.63rem; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap;
}
.brand-tools{margin-left:auto; display:flex; gap:.15rem; align-items:center}
.icon-btn{
  background:none; border:0; color:var(--ink-3); width:34px; height:34px;
  border-radius:50%; display:grid; place-items:center; font-size:1rem;
  transition:background .15s, color .15s;
}
.icon-btn:hover{background:var(--paper-2); color:var(--ink)}
#syncPip{
  width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none;
  margin:0 .35rem 0 .15rem; transition:background .2s, opacity .2s;
}
#syncPip[data-state="busy"]{background:var(--blue); animation:pulse 1s ease-in-out infinite}
#syncPip[data-state="offline"]{background:var(--rule-strong)}
#syncPip[data-state="error"]{background:var(--red)}
@keyframes pulse{50%{opacity:.25}}

nav.tabs{display:flex; overflow-x:auto; scrollbar-width:none; margin-top:.35rem}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs.more-right{
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
}
nav.tabs.more-left.more-right{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 34px),transparent);
}
nav.tabs.more-left:not(.more-right){
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22px);
  mask-image:linear-gradient(90deg,transparent,#000 22px);
}
.tab{
  background:none; border:0; padding:.5rem 0 .65rem; margin-right:1.5rem; white-space:nowrap;
  font-family:var(--display); font-size:1rem; font-weight:600; text-transform:uppercase;
  letter-spacing:.05em; color:var(--ink-3); position:relative; transition:color .15s;
}
.tab[hidden]{display:none}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{color:var(--ink)}
.tab[aria-current="true"]::after{
  content:""; position:absolute; left:0; right:0; bottom:-2px; height:4px; background:var(--orange);
}
.tab .count{
  font-family:var(--body); font-size:.6rem; font-weight:700; color:var(--ink-3);
  margin-left:.35rem; vertical-align:.35em; letter-spacing:0;
}

/* schermi stretti: la testata sta dentro la finestra, niente scorrimento laterale */
@media (max-width:600px){
  .brand{gap:.5rem; min-width:0}
  .brand .wordmark{font-size:1.22rem; min-width:0}
  .brand .edition{display:none}
  .dot-mark i{width:7px; height:7px}
  .brand-tools{gap:0}
  .icon-btn{width:29px; height:29px; font-size:.92rem}
  #syncPip{margin:0 .2rem 0 .1rem}
  .tab{font-size:.82rem; margin-right:.95rem; letter-spacing:.03em}
  .tab:last-child{margin-right:0}
}

/* ---------------- impaginato ---------------- */
main{max-width:1240px; margin:0 auto; padding:0 var(--gutter) 5rem}
.view[hidden]{display:none}
.columns{display:block}
.rail{display:none}
@media (min-width:1040px){
  .columns{display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:4rem; align-items:start}
  .rail{display:block; position:sticky; top:7.2rem; padding-top:2.6rem}
}
.col-main{min-width:0; max-width:70ch}

.banner{
  margin:1.4rem 0 0; padding:.75rem .95rem; background:var(--paper); border-radius:4px;
  box-shadow:inset 4px 0 0 var(--blue); font-size:.88rem; color:var(--ink-2);
}
.banner a{font-weight:700}

/* ---------------- apertura ---------------- */
.hero{padding:1.6rem 0 0}
#dotfield{display:block; width:100%; height:74px; margin-bottom:1.4rem}
.hero .date{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:clamp(1.7rem,6vw,2.6rem); letter-spacing:-.01em; margin-bottom:.15rem;
}
.hero .window{margin-bottom:1.6rem}

.top3{list-style:none; margin:0 0 1.8rem; padding:0}
.top3 li{
  display:grid; grid-template-columns:2.1rem 1fr; gap:.75rem; align-items:start;
  padding:.85rem 0; border-top:1.5px solid var(--ink);
}
.top3 li:last-child{border-bottom:1.5px solid var(--ink)}
.top3 .bead{
  width:26px; height:26px; margin-top:.16rem; font-size:.85rem;
}
.top3 .txt{
  font-family:var(--display); font-weight:600; font-size:1.34rem; line-height:1.16;
  letter-spacing:-.005em;
}
.intro{color:var(--ink-2); font-size:1.03rem; max-width:62ch}
.meta-line{
  margin-top:1.3rem; padding-top:.8rem; border-top:1px solid var(--rule);
  display:flex; flex-wrap:wrap; gap:.3rem 1.4rem;
}

/* ---------------- intestazioni di sezione ---------------- */
.section-head{display:flex; align-items:center; flex-wrap:wrap; gap:.3rem .7rem; padding:2.8rem 0 .9rem}
.section-head h2{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:1.42rem; letter-spacing:.005em; white-space:nowrap;
}
.section-head .hint{margin-left:auto}
.section-head .pip{width:12px; height:12px; border-radius:50%; background:var(--orange); flex:none}
@media (max-width:600px){
  .section-head .hint{margin-left:0; flex-basis:100%; padding-left:1.7rem}
}

/* ---------------- immagini ---------------- */
.hero-shot{
  display:block; width:100%; aspect-ratio:16/9; object-fit:cover;
  border-radius:3px; margin:0 0 1.7rem; background:var(--paper-2);
}
.thumb{
  width:132px; height:74px; object-fit:cover; border-radius:2px;
  background:var(--paper-2); margin-top:.3rem; flex:none;
}

/* ---------------- notizia ---------------- */
.story{border-top:1px solid var(--rule); padding:1.45rem 0 1.15rem}
.story:first-of-type{border-top:1.5px solid var(--ink)}
/* Il capo della notizia e' una griglia a zone: cosi' la stessa marcatura si
   riordina fra desktop (miniatura di fianco) e telefono (miniatura sotto il
   titolo, accanto alla sintesi) senza toccare il DOM. */
.story-head{
  display:grid; column-gap:.75rem; cursor:pointer;
  grid-template-columns:2.5rem minmax(0,1fr);
  grid-template-areas:"bead chips" "bead title" "bead lede";
}
.story-head.with-thumb{
  grid-template-columns:2.5rem minmax(0,1fr) auto;
  grid-template-areas:"bead chips thumb" "bead title thumb" "bead lede thumb";
}
.story-head .bead{grid-area:bead}
.story-head .chips{grid-area:chips}
.story-head h3{grid-area:title}
.story-head .lede{grid-area:lede}
.story-head .thumb{grid-area:thumb; align-self:start}
.bead{
  width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--display); font-weight:700; font-size:.92rem; color:var(--on-fill);
  margin-top:.2rem; transition:transform .18s ease;
}
.story.is-read .bead{opacity:.32}
.story.is-open .bead{transform:scale(1.14)}
/* align-items:center, altrimenti una pastiglia che va a capo si stira
   sull'altezza della riga e sembra una scatola vuota. */
.chips{display:flex; flex-wrap:wrap; align-items:center; gap:.3rem; margin-bottom:.45rem}
.chip{
  font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  padding:.22rem .5rem; border-radius:2px; background:var(--paper-2); color:var(--ink-2);
  white-space:nowrap; line-height:1.4;
}
.chip.t-rumor{background:var(--yellow); color:#17181B}
.chip.t-confermato{background:var(--blue); color:#17181B}
.chip.t-dati{background:var(--orange); color:#17181B}
.chip.t-analisi,.chip.t-opinione{background:var(--red); color:#FFF}
.chip.t-contorno,.chip.t-contesto,.chip.t-servizio{background:var(--ink); color:var(--bone)}
.chip.cat{background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); color:var(--ink-3)}
.chip.rel{background:none; color:var(--ink-3); display:inline-flex; align-items:center; gap:.35rem; padding-left:0}
.dot{width:8px; height:8px; border-radius:50%; background:var(--ink-3); flex:none}
.rel-alta .dot{background:var(--blue)}
.rel-media .dot{background:var(--yellow)}
.rel-bassa .dot{background:var(--red)}
.story h3{
  font-family:var(--display); font-weight:600; font-size:1.62rem; line-height:1.1;
  letter-spacing:-.008em; margin-bottom:.4rem;
}
.lede{color:var(--ink-2); font-size:.98rem; line-height:1.5}
.story-body{padding:1rem 0 0 3.25rem; display:flex; flex-direction:column; gap:.9rem}
.story-body[hidden]{display:none}
.rel-note{
  font-size:.87rem; color:var(--ink-2); background:var(--paper);
  padding:.7rem .9rem; border-radius:3px; box-shadow:inset 4px 0 0 var(--yellow);
}
.rel-note b{display:block; margin-bottom:.2rem; font-size:.6rem; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.readmore{display:flex; flex-wrap:wrap; gap:.4rem .95rem; align-items:center; font-size:.92rem}
.readmore .primary{font-weight:700}
.sources{font-size:.72rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}

.story .tools{padding-left:3.25rem}
.act{
  background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); border:0; border-radius:999px;
  padding:.28rem .8rem; font-size:.78rem; font-weight:600; color:var(--ink-2);
  transition:box-shadow .15s, color .15s, background .15s;
}
.act:hover{box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.act.on{background:var(--yellow); box-shadow:none; color:#17181B}

/* I quattro pulsanti: stessa forma e stessa misura, in fondo a destra di ogni
   voce. Il colore acceso distingue il gesto — giallo quello che serve a te,
   blu e rosso il giudizio sulla rassegna. */
.tools{display:flex; gap:.4rem; justify-content:flex-end; align-items:center;
       margin-left:auto; padding-top:.7rem}
.tool{
  width:36px; height:36px; flex:none; border:0; border-radius:50%;
  background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong);
  color:var(--ink-3); display:grid; place-items:center; position:relative;
  transition:box-shadow .15s, color .15s, background .15s;
}
.tool:hover{box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.tool .ico{display:block}
.tool.t-down .ico{transform:rotate(180deg)}
.tool.t-star.on{background:var(--yellow); box-shadow:none; color:#17181B}
.tool.t-note.on{background:var(--paper-2); box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.tool.t-up.on{background:var(--blue); box-shadow:none; color:#17181B}
.tool.t-down.on{background:var(--red); box-shadow:none; color:#FFF}
/* quanti link allegati, senza aggiungere un altro bottone */
.tool.t-note[data-count]:not([data-count=""])::after{
  content:attr(data-count); position:absolute; top:-2px; right:-2px;
  min-width:15px; height:15px; padding:0 3px; border-radius:999px;
  background:var(--ink); color:var(--bone); font-family:var(--body);
  font-size:.58rem; font-weight:700; line-height:15px; text-align:center;
}
.radar-foot{display:flex; align-items:center; gap:.6rem; margin-top:.15rem}

.workspace{padding:.75rem 0 0 3.25rem; display:flex; flex-direction:column; gap:.6rem}
.workspace[hidden]{display:none}
@media (max-width:600px){
  /* Sul telefono la notizia ha un solo bordo a sinistra: numero e metadati in
     cima, poi titolo, sintesi e azioni tutti allineati a filo di colonna. Il
     numero e' l'unico elemento che rientra, ed e' in testa: fa da segnaposto,
     non da colonna. */
  .story-body,.story .tools,.workspace{padding-left:0}
  .story-head{
    grid-template-columns:auto minmax(0,1fr);
    grid-template-areas:"bead chips" "title title" "lede lede";
    column-gap:.5rem;
  }
  /* La foto prende tutta la colonna sotto la sintesi: alla larghezza del
     telefono una miniatura di lato resta un francobollo e lascia mezzo schermo
     vuoto. Sorgente a 480px (images.py), qui mostrata a ~341: regge. */
  .story-head.with-thumb{
    grid-template-areas:"bead chips" "title title" "lede lede" "thumb thumb";
  }
  .story-head .bead{align-self:center}
  .bead{width:22px; height:22px; font-size:.72rem; margin-top:0}
  .thumb{
    width:100%; height:auto; aspect-ratio:16/9; margin:.9rem 0 .1rem; border-radius:3px;
  }
  /* Una riga sola di metadati: il tag, che porta il colore, e il pallino
     dell'affidabilita'. Categoria e puntata del filo restano al desktop. */
  .chips{gap:.25rem .5rem; margin-bottom:.55rem}
  .chip{font-size:.58rem; letter-spacing:.1em; padding:.18rem .42rem}
  .chip.cat,.chip.filo{display:none}
  .chip.rel{gap:.3rem}
  .chip .long{display:none}
  .story h3{font-size:1.44rem; margin-bottom:.55rem}
  .lede{font-size:.94rem; line-height:1.45}
}
textarea.note{
  width:100%; min-height:5.6rem; resize:vertical; font:inherit; font-size:.95rem;
  background:var(--paper); color:var(--ink); border:0;
  box-shadow:inset 0 0 0 1.5px var(--rule); border-radius:4px; padding:.65rem .75rem;
}
textarea.note:focus{box-shadow:inset 0 0 0 2px var(--blue); outline:none}
.saved-flag{font-size:.65rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ok)}
.linkrow{display:flex; gap:.4rem; flex-wrap:wrap; align-items:center}
.linkrow input{
  flex:1 1 12rem; min-width:0; font:inherit; font-size:.88rem; padding:.45rem .65rem;
  background:var(--paper); color:var(--ink); border:0;
  box-shadow:inset 0 0 0 1.5px var(--rule); border-radius:4px;
}
.linkrow input:focus{box-shadow:inset 0 0 0 2px var(--blue); outline:none}
.btn{
  background:var(--ink); color:var(--bone); border:0; border-radius:999px;
  padding:.45rem 1.05rem; font-size:.82rem; font-weight:700;
}
.btn:hover{background:var(--red); color:#FFF}
.btn:disabled{opacity:.45; cursor:default}
.btn.ghost{background:none; box-shadow:inset 0 0 0 1.5px var(--rule-strong); color:var(--ink-2)}
.btn.ghost:hover{background:none; box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink)}
.btn.wide{width:100%; padding:.7rem 1rem; font-size:.95rem}
.saved-links{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.25rem}
.saved-links li{display:flex; gap:.5rem; align-items:baseline; font-size:.88rem}
.saved-links .kill{background:none; border:0; color:var(--ink-3); padding:0 .2rem}
.saved-links .kill:hover{color:var(--red)}
/* un indirizzo salvato che non regge il controllo resta visibile ma spento:
   sparire sarebbe peggio, perche' l'appunto c'era e va potuto cancellare */
.saved-links .broken{color:var(--ink-3); text-decoration:line-through}

/* ---------------- radar ---------------- */
.radar{list-style:none; margin:0; padding:0}
.radar li{border-top:1px solid var(--rule); padding:.9rem 0; display:grid; gap:.25rem}
.radar h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.radar p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.radar .src{font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}

/* ---------------- sul banco ----------------
   Non e' rassegna, e' materiale da lavoro: la concorrenza e chi la prova.
   La riga gialla e' la sezione — dice perche' quella cosa ti serve dietro al
   banco. Senza quella riga sarebbe una recensione qualsiasi. */
.banco{list-style:none; margin:0; padding:0}
.banco li{border-top:1px solid var(--rule); padding:.95rem 0; display:grid; gap:.35rem}
.banco h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.banco p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.banco .kind{
  justify-self:start; font-size:.6rem; font-weight:700; letter-spacing:.13em;
  text-transform:uppercase; padding:.2rem .45rem; border-radius:2px;
  background:var(--yellow); color:var(--on-fill);
}
.banco .kind.k-video{background:var(--red); color:#FFF}
.banco .kind.k-confronto{background:var(--blue); color:#FFF}
.banco .why{
  font-size:.89rem; color:var(--ink); line-height:1.5; margin-top:.1rem;
  padding-left:.9rem; box-shadow:inset 3px 0 0 var(--yellow);
}
.banco .foot,.recap .foot{display:flex; align-items:center; gap:.6rem; margin-top:.15rem}
.banco .src,.recap .src{
  font-size:.68rem; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3);
}

/* ---------------- se te lo fossi perso ----------------
   Roba vecchia di giorni: la cornice deve dire subito quanto, altrimenti
   sembra che la rassegna sia in ritardo. */
.recap{list-style:none; margin:0; padding:0}
.recap li{border-top:1px solid var(--rule); padding:.95rem 0; display:grid; gap:.3rem}
.recap h4{font-family:var(--display); font-weight:600; font-size:1.15rem; line-height:1.15}
.recap p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.recap .head{display:flex; flex-wrap:wrap; gap:.3rem .7rem; align-items:center}
.recap .when{
  font-size:.6rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  padding:.2rem .45rem; border-radius:2px; background:var(--orange); color:var(--on-fill);
}
.recap .signal{font-size:.7rem; font-weight:600; letter-spacing:.06em; color:var(--ink-3)}

/* ---------------- nelle discussioni ----------------
   Non sono fatti: sono opinioni e voci. La cornice deve dirlo da sola,
   quindi niente pastiglie di tag e un rientro che le stacca dalle notizie. */
.talk{list-style:none; margin:0; padding:0}
.talk li{border-top:1px solid var(--rule); padding:.95rem 0; display:grid; gap:.3rem}
.talk h4{font-family:var(--display); font-weight:600; font-size:1.14rem; line-height:1.18}
.talk p{font-size:.91rem; color:var(--ink-2); line-height:1.5}
.talk .who{display:flex; flex-wrap:wrap; gap:.3rem .7rem; align-items:center}
.talk .where{
  font-size:.6rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  padding:.2rem .45rem; border-radius:2px; background:var(--paper-2); color:var(--ink-2);
}
.talk .heat{font-size:.68rem; font-weight:600; letter-spacing:.08em; color:var(--ink-3)}
.talk .new{background:var(--red); color:#FFF}
.caveat{
  margin:.2rem 0 1rem; font-size:.85rem; color:var(--ink-3); line-height:1.5;
  padding-left:.9rem; box-shadow:inset 3px 0 0 var(--rule-strong);
}

/* ---------------- colonna laterale ---------------- */
.rail h4{
  font-size:.63rem; font-weight:700; letter-spacing:.19em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:.85rem;
}
.rail ol{list-style:none; margin:0 0 2.2rem; padding:0}
.rail ol button{
  background:none; border:0; text-align:left; width:100%; padding:.3rem 0;
  font-size:.83rem; line-height:1.34; color:var(--ink-2);
  display:grid; grid-template-columns:1.15rem 1fr; gap:.45rem; align-items:start;
}
.rail ol button:hover{color:var(--ink)}
.rail ol .pip{width:9px; height:9px; border-radius:50%; margin-top:.4rem; flex:none}
.statgrid{
  display:grid; grid-template-columns:1fr 1fr; gap:1rem .8rem; margin-bottom:2.2rem;
  padding-bottom:1.6rem; border-bottom:1.5px solid var(--ink);
}
.stat b{
  display:block; font-family:var(--display); font-weight:700; font-size:2rem;
  line-height:1; font-variant-numeric:tabular-nums;
}
.stat span{font-size:.66rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.rail .notice{display:flex; flex-direction:column; gap:.5rem; font-size:.78rem; color:var(--ink-3); line-height:1.45}

/* ---------------- archivio ---------------- */
.archive-list{list-style:none; margin:0; padding:0}
.archive-list li{border-top:1px solid var(--rule)}
.archive-list li:last-child{border-bottom:1px solid var(--rule)}
.archive-list button{
  background:none; border:0; width:100%; text-align:left; padding:1.1rem 0;
  display:grid; grid-template-columns:2.5rem 1fr; gap:.75rem; align-items:start;
}
.archive-list .h{font-family:var(--display); font-weight:600; font-size:1.28rem; line-height:1.14; color:var(--ink)}
.archive-list .d{display:block; margin-bottom:.25rem}
.archive-list .m{display:block; margin-top:.3rem; font-size:.72rem; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.archive-list button:hover .h{color:var(--accent-ink)}

/* ---------------- diario ---------------- */
.composer{
  background:var(--paper); border-radius:6px; padding:1.1rem;
  display:flex; flex-direction:column; gap:.8rem; margin:.5rem 0 2.2rem;
  box-shadow:var(--shadow);
}
.composer textarea{

<script>
(function(){
"use strict";

/* Sostituiti da pipeline/build.py */
const MODE    = "cloud";
const CFG     = {"url":"https://phlcmigyfmjmwukzbjaz.supabase.co","anon_key":"sb_publishable_dXifOl7YT42qbZ9UodEGXQ_c5uYw_h-"};
const EMBED   = [];
const APP_URL = "";

const CLOUD = (MODE === "cloud" && CFG && CFG.url && CFG.anon_key);
// appunti, salvati e diario: presenti anche senza sincronizzazione
const NOTES = (MODE !== "static");
const K_STATE = "tmb-state", K_AUTH = "tmb-auth", K_BRIEFS = "tmb-briefs";

let BRIEFS = EMBED || [];
let ALL = [];
let EXTRAS = [];

/* ================= stato locale ================= */
const blank = {marks:{}, diary:[], lastPull:null};
let S;
try{ S = Object.assign({}, blank, JSON.parse(localStorage.getItem(K_STATE) || "{}")); }
catch(e){ S = JSON.parse(JSON.stringify(blank)); }
if(!S.marks) S.marks = {};
if(!S.diary) S.diary = [];

/* migrazione dalla prima versione (apple-brief-v1) */
(function migrate(){
  let old = null;
  try{ old = JSON.parse(localStorage.getItem("apple-brief-v1") || "null"); }catch(e){}
  if(!old || localStorage.getItem("tmb-migrated")) return;
  const now = new Date().toISOString();
  const keys = {};
  ["stars","notes","links","read"].forEach(function(f){
    Object.keys(old[f] || {}).forEach(function(k){ keys[k] = 1; });
  });
  Object.keys(keys).forEach(function(k){
    const m = S.marks[k] || {starred_at:null, read_at:null, note:"", links:[], updated_at:now, dirty:true};
    if(old.stars && old.stars[k]) m.starred_at = new Date(old.stars[k]).toISOString();
    if(old.read && old.read[k]) m.read_at = new Date(old.read[k]).toISOString();
    if(old.notes && old.notes[k]) m.note = old.notes[k];
    if(old.links && old.links[k]) m.links = old.links[k];
    m.updated_at = now; m.dirty = true;
    S.marks[k] = m;
  });
  (old.diary || []).forEach(function(e){
    if(!S.diary.some(function(x){ return x.id === e.id; })){
      S.diary.push(Object.assign({}, e, {updated_at:now, dirty:true, deleted_at:null}));
    }
  });
  localStorage.setItem("tmb-migrated", "1");
  saveNow();
})();

let saveTimer = null;
function saveNow(){
  try{ localStorage.setItem(K_STATE, JSON.stringify(S)); }
  catch(e){ toast("Spazio esaurito nel browser: esporta gli appunti"); }
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 200); }

function mk(k){ return S.marks[k] || null; }
function mark(k){
  if(!S.marks[k]) S.marks[k] = {starred_at:null, read_at:null, note:"", links:[], vote:0, updated_at:null, dirty:false};
  return S.marks[k];
}
function touched(k){
  const m = mark(k);
  m.updated_at = new Date().toISOString();
  m.dirty = true;
  save(); queueSync();
}

/* ================= utilità ================= */
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const BEADS = ["--red","--yellow","--blue","--orange","--ink"];

function fmtDate(iso){
  const d = new Date(iso + "T12:00:00");
  if(isNaN(d)) return iso;
  return GIORNI[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()] + " " + d.getFullYear();
}
function fmtShort(iso){
  const d = new Date(iso + "T12:00:00");
  if(isNaN(d)) return iso;
  return d.getDate() + " " + MESI[d.getMonth()].slice(0,3) + " " + d.getFullYear();
}
/* "6 giorni fa", contato rispetto al giorno dell'edizione e non a oggi: una
   vecchia edizione riletta fra un mese deve restare vera. */
function fmtAgo(iso, refIso){
  const a = new Date(String(iso || "").slice(0,10) + "T12:00:00");
  const b = new Date(String(refIso || "").slice(0,10) + "T12:00:00");
  if(isNaN(a) || isNaN(b)) return fmtShort(iso);
  const d = Math.round((b - a) / 86400000);
  if(d <= 0) return "oggi";
  if(d === 1) return "ieri";
  if(d < 14) return d + " giorni fa";
  return Math.round(d / 7) + " settimane fa";
}
/* Il giorno va letto nel fuso di chi guarda, non in UTC: toISOString() dava
   la data di Londra accanto all'ora di casa, e un appunto scritto all'una di
   notte compariva datato al giorno prima. */
function localDay(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
       + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtStamp(ts){
  const d = new Date(ts);
  if(isNaN(d)) return "";          /* una voce importata male non rompe la lista */
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return fmtShort(localDay(d)) + " · " + hh + ":" + mm;
}
function el(tag, attrs, kids){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === "class") n.className = attrs[k];
    else if(k === "text") n.textContent = attrs[k];
    else if(k === "html") n.innerHTML = attrs[k];
    else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}
function bead(i, txt, cls){
  const v = BEADS[i % BEADS.length];
  const n = el("span", {class:cls || "bead", text:txt});
  n.style.background = "var(" + v + ")";
  if(v === "--ink") n.style.color = "var(--bone)";
  return n;
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function key(dateStr, id){ return dateStr + "/" + id; }
function safeUrl(u){
  const s = String(u || "").trim();
  return /^https?:\/\//i.test(s) ? s : null;
}
function tagClass(tag){ return "chip t-" + String(tag || "").toLowerCase().replace(/[^a-z]/g,""); }

/* ================= accesso ================= */
let AUTH = null;
try{ AUTH = JSON.parse(localStorage.getItem(K_AUTH) || "null"); }catch(e){}

function storeAuth(j){
  AUTH = {
    access_token:j.access_token,
    refresh_token:j.refresh_token,
    expires_at:Date.now() + (j.expires_in || 3600) * 1000,
    user_id:(j.user && j.user.id) || (AUTH && AUTH.user_id)
  };
  localStorage.setItem(K_AUTH, JSON.stringify(AUTH));
}
function clearAuth(){ AUTH = null; localStorage.removeItem(K_AUTH); }

async function login(email, password){
  let res;
  try{
    res = await fetch(CFG.url + "/auth/v1/token?grant_type=password", {
      method:"POST",
      headers:{"apikey":CFG.anon_key, "Content-Type":"application/json"},
      body:JSON.stringify({email:email, password:password})
    });
  }catch(e){
    throw new Error("Non riesco a raggiungere il server. Controlla la connessione e riprova.");
  }
  const j = await res.json().catch(function(){ return {}; });
  if(!res.ok) throw new Error(j.error_description || j.msg || j.message || "Accesso non riuscito");
  storeAuth(j);
}
async function refreshToken(){
  if(!AUTH || !AUTH.refresh_token) return false;
  try{
    const res = await fetch(CFG.url + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST",
      headers:{"apikey":CFG.anon_key, "Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:AUTH.refresh_token})
    });
    if(!res.ok) return false;
    storeAuth(await res.json());
    return true;
  }catch(e){ return false; }
}
async function sb(path, opts, retried){
  opts = opts || {};
  if(AUTH && AUTH.expires_at && Date.now() > AUTH.expires_at - 60000 && !retried){
    await refreshToken();
  }
  const headers = Object.assign({
    "apikey":CFG.anon_key,
    "Content-Type":"application/json"
  }, opts.headers || {});
  if(AUTH && AUTH.access_token) headers["Authorization"] = "Bearer " + AUTH.access_token;
  const res = await fetch(CFG.url + path, Object.assign({}, opts, {headers:headers}));
  if(res.status === 401 && !retried && await refreshToken()) return sb(path, opts, true);
  return res;
}

/* ================= sincronizzazione ================= */
let syncTimer = null, syncing = false;
function pip(state, title){
  const p = document.getElementById("syncPip");
  if(!p) return;
  p.dataset.state = state;
  p.title = title;
}
function queueSync(){
  if(!CLOUD) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, 1500);
}

/* diventa false se Supabase non conosce ancora la colonna del voto */
let VOTE_SYNC = true;

function markRow(k, m){
  const row = {
    user_id:AUTH.user_id, story:k,
    starred_at:m.starred_at || null, read_at:m.read_at || null,
    note:m.note || "", links:m.links || []
  };
  if(VOTE_SYNC) row.vote = m.vote || 0;
  return row;
}
function diaryRow(e){
  return {
    user_id:AUTH.user_id, id:e.id, ts:new Date(e.ts).toISOString(),
    text:e.text || "", tags:e.tags || [], link:e.link || null,
    ref:e.ref || null, deleted_at:e.deleted_at || null
  };
}

async function sync(){
  if(!CLOUD || !AUTH || syncing) return;
  if(!navigator.onLine){ pip("offline", "Offline — gli appunti restano sul dispositivo"); return; }
  syncing = true;
  pip("busy", "Sincronizzazione…");
  try{
    /* 1. spinge quello che è cambiato qui */
    /* Si segna l'ora di ogni riga *prima* di spedirla. Fra la partenza e la
       risposta passano dei secondi in cui si continua a scrivere, e marcare
       pulito quello che nel frattempo e' cambiato ancora vuol dire perderlo:
       resterebbe solo qui, senza piu' niente che lo spinga su. */
    const dirtyMarks = Object.keys(S.marks).filter(function(k){ return S.marks[k].dirty; });
    const sentAt = {};
    dirtyMarks.forEach(function(k){ sentAt[k] = S.marks[k].updated_at; });
    if(dirtyMarks.length){
      const invia = function(){
        return sb("/rest/v1/brief_marks?on_conflict=user_id,story", {
          method:"POST",
          headers:{"Prefer":"resolution=merge-duplicates,return=representation"},
          body:JSON.stringify(dirtyMarks.map(function(k){ return markRow(k, S.marks[k]); }))
        });
      };
      let res = await invia();
      /* Se la colonna del voto non c'è ancora (migrazione non lanciata), la
         riga verrebbe respinta tutta, portandosi dietro appunti e salvati.
         Meglio rinunciare al voto e salvare il resto: tornerà al prossimo giro. */
      if(!res.ok && res.status === 400){
        const detail = (await res.clone().text()).toLowerCase();
        if(detail.indexOf("vote") >= 0 && VOTE_SYNC){
          VOTE_SYNC = false;
          console.warn("Colonna 'vote' assente su brief_marks: i pollici restano locali.");
          res = await invia();
        }
      }
      if(!res.ok) throw new Error("brief_marks " + res.status + " " + (await res.text()).slice(0,140));
      (await res.json()).forEach(function(row){
        const m = S.marks[row.story];
        if(!m || m.updated_at !== sentAt[row.story]) return;   /* ritoccata nel frattempo */
        m.updated_at = row.updated_at; m.dirty = false;
      });
    }
    const dirtyDiary = S.diary.filter(function(e){ return e.dirty; });
    const diarySentAt = {};
    dirtyDiary.forEach(function(e){ diarySentAt[e.id] = e.updated_at; });
    if(dirtyDiary.length){
      const res = await sb("/rest/v1/brief_diary?on_conflict=user_id,id", {
        method:"POST",
        headers:{"Prefer":"resolution=merge-duplicates,return=representation"},
        body:JSON.stringify(dirtyDiary.map(diaryRow))
      });
      if(!res.ok) throw new Error("brief_diary " + res.status + " " + (await res.text()).slice(0,140));
      (await res.json()).forEach(function(row){
        const e = S.diary.filter(function(x){ return x.id === row.id; })[0];
        if(!e || e.updated_at !== diarySentAt[row.id]) return;
        e.updated_at = row.updated_at; e.dirty = false;
      });
    }

    /* 2. tira quello che è cambiato altrove */
    const since = S.lastPull || "1970-01-01T00:00:00Z";
    const [rm, rd] = await Promise.all([
      sb("/rest/v1/brief_marks?select=*&updated_at=gt." + encodeURIComponent(since)),
      sb("/rest/v1/brief_diary?select=*&updated_at=gt." + encodeURIComponent(since))
    ]);
    if(!rm.ok || !rd.ok) throw new Error("lettura " + rm.status + "/" + rd.status);

    let changed = false;
    (await rm.json()).forEach(function(row){
      const local = S.marks[row.story];
      if(local && local.dirty) return;                       /* il locale non ancora spinto vince */
      if(local && local.updated_at && local.updated_at >= row.updated_at) return;
      S.marks[row.story] = {
        starred_at:row.starred_at, read_at:row.read_at, note:row.note || "",
        links:row.links || [], vote:row.vote || 0, updated_at:row.updated_at, dirty:false
      };
      changed = true;
    });
    (await rd.json()).forEach(function(row){
      const i = S.diary.findIndex(function(x){ return x.id === row.id; });
      const entry = {
        id:row.id, ts:new Date(row.ts).getTime(), text:row.text, tags:row.tags || [],
        link:row.link, ref:row.ref, updated_at:row.updated_at,
        deleted_at:row.deleted_at, dirty:false
      };
      if(i < 0){ S.diary.push(entry); changed = true; }
      else if(!S.diary[i].dirty && (!S.diary[i].updated_at || S.diary[i].updated_at < row.updated_at)){
        S.diary[i] = entry; changed = true;
      }
    });
    if(changed){
      S.diary.sort(function(a,b){ return b.ts - a.ts; });
      repaint();
    }

    S.lastPull = new Date(Date.now() - 5000).toISOString();
    saveNow();
    refreshCounts();
    pip("ok", "Sincronizzato");
  }catch(err){
    /* il motivo va almeno in console: il pallino rosso dice che qualcosa non
       va, non dice cosa, e senza questa riga non restava traccia da nessuna parte */
    console.warn("Sincronizzazione non riuscita:", err && err.message ? err.message : err);
    pip("error", "Sincronizzazione non riuscita — riprovo tra poco");
  }finally{
    syncing = false;
  }
}

/* la cache locale delle edizioni non ha spazio garantito: l'archivio
   cresce di circa 150-200 KB al giorno (foto incorporate comprese) e prima
   o poi supera la quota di localStorage. Invece di lasciar fallire lo
   scrive in silenzio (e restare bloccati per sempre sull'ultimo salvataggio
   riuscito, magari di settimane prima), si scarta la coda piu' vecchia
   finche' non ci sta */
function saveBriefsCache(list){
  let slice = list;
  while(slice.length){
    try{ localStorage.setItem(K_BRIEFS, JSON.stringify(slice)); return; }
    catch(e){ slice = slice.slice(0, Math.max(1, Math.floor(slice.length / 2))); }
  }
  try{ localStorage.removeItem(K_BRIEFS); }catch(e){}
}

async function loadBriefs(){
  if(!CLOUD){ indexAll(); return; }
  try{
    const cached = JSON.parse(localStorage.getItem(K_BRIEFS) || "null");
    if(cached && cached.length){ BRIEFS = cached; indexAll(); repaint(); }
  }catch(e){}
  try{
    const res = await sb("/rest/v1/brief_editions?select=payload&order=date.desc&limit=400");
    if(!res.ok) throw new Error("brief_editions " + res.status);
    const rows = await res.json();
    if(rows.length){
      BRIEFS = rows.map(function(r){ return r.payload; });
      saveBriefsCache(BRIEFS);
      indexAll();
      if(!currentDate || !BRIEFS.some(function(b){ return b.date === currentDate; })){
        currentDate = BRIEFS[0].date;
      }
      repaint();
    }
  }catch(err){
    if(!BRIEFS.length) toast("Nessuna edizione scaricata — controlla la connessione");
  }
}

function indexAll(){
  ALL = [];
  EXTRAS = [];
  BRIEFS.forEach(function(b){
    (b.news || []).forEach(function(n){ ALL.push({brief:b, news:n, k:key(b.date, n.id)}); });
    /* radar, banco e recap non sono notizie ma si salvano lo stesso: un video
       da guardare dopo deve ricomparire fra i salvati come tutto il resto */
    [["radar", "Radar"], ["banco", "Sul banco"], ["recap", "Se te lo fossi perso"]]
      .forEach(function(sez){
        (b[sez[0]] || []).forEach(function(it){
          if(!it.id) return;
          EXTRAS.push({brief:b, item:it, kind:sez[0], label:sez[1],
                       k:key(b.date, sez[0] + ":" + it.id)});
        });
      });
  });
  indexThreads();
  indexClaims();
  indexFacts();
}

/* ================= fili e previsioni =================
   Nessuna tabella in piu' da sincronizzare: fili e previsioni stanno dentro
   le edizioni, e qui vengono ricostruiti a ogni caricamento. Per questo la
   copia Artifact, che non puo' fare rete, si comporta esattamente uguale. */

let THREADS = {};   /* slug -> {label, note, episodes} */
let CLAIMS = [];    /* previsioni con il loro stato di oggi */

function byDate(desc){
  return BRIEFS.slice().sort(function(a, b){
    return (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) * (desc ? -1 : 1);
  });
}

function indexThreads(){
  THREADS = {};
  byDate(true).forEach(function(b){
    const labels = b.threads || {};
    (b.news || []).forEach(function(n){
      if(!n.thread) return;
      let t = THREADS[n.thread];
      if(!t) t = THREADS[n.thread] = {slug:n.thread, label:n.thread, note:"", episodes:[]};
      /* l'etichetta piu' recente vince: se la rinomini, l'archivio si adegua */
      const lab = labels[n.thread];
      if(lab && !t.named){
        t.label = (typeof lab === "string") ? lab : (lab.label || n.thread);
        t.note = (typeof lab === "string") ? "" : (lab.note || "");
        t.named = true;
      }
      t.episodes.push({date:b.date, brief:b, news:n});
    });
  });
  Object.keys(THREADS).forEach(function(s){
    THREADS[s].episodes.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  });
}

const VERDICTS = ["confermato", "parziale", "smentito", "scaduto", "aperto"];

const SOURCE_ALIASES = {
  "gurman":"Mark Gurman (Bloomberg)", "mark gurman":"Mark Gurman (Bloomberg)",
  "bloomberg":"Mark Gurman (Bloomberg)", "kuo":"Ming-Chi Kuo",
  "ming-chi kuo":"Ming-Chi Kuo", "ross young":"Ross Young",
  "counterpoint":"Counterpoint Research", "idc":"IDC",
  "digitimes":"Digitimes", "etnews":"ETNews"
};

/* "9to5Mac (stime di analisti)" e "9to5Mac" sono la stessa fonte;
   "Mark Gurman (Bloomberg)" no: la maiuscola distingue l'editore
   dalla precisazione. */
function canonSource(s){
  let out = String(s || "ignota").replace(/\s+/g, " ").trim();
  const m = out.match(/^(.*?)\s*\(([^)]*)\)$/);
  if(m && m[2] && m[2][0] === m[2][0].toLowerCase() && m[2][0] !== m[2][0].toUpperCase()){
    out = m[1].trim();
  }
  return SOURCE_ALIASES[out.toLowerCase()] || out;
}

function indexClaims(){
  const opened = {}, closed = {};
  byDate(false).forEach(function(b){
    (b.news || []).forEach(function(n){
      if(n.claim && n.claim.id && !opened[n.claim.id]){
        opened[n.claim.id] = {
          id:n.claim.id, text:n.claim.text || "", horizon:n.claim.horizon || "",
          source:canonSource(n.claim.source || (n.sources || [])[0]),
          date:b.date, brief:b, news:n
        };
      }
      (n.resolves || []).forEach(function(r){
        if(r && r.claim) closed[r.claim] = {
          verdict:r.verdict, note:r.note || "", date:b.date, brief:b, news:n
        };
      });
    });
  });
  const today = localDay(new Date());
  CLAIMS = Object.keys(opened).map(function(id){
    const c = opened[id], res = closed[id];
    if(res && VERDICTS.indexOf(res.verdict) >= 0 && res.verdict !== "aperto"){
      c.state = res.verdict; c.res = res;
    } else if(c.horizon && c.horizon.slice(0, 10) < today){
      c.state = "scaduto";
    } else {
      c.state = "aperto";
    }
    c.left = c.horizon ? Math.round((new Date(c.horizon.slice(0,10) + "T12:00:00") - new Date()) / 86400000) : null;
    return c;
  });
  CLAIMS.sort(function(a, b){ return (a.horizon || "9999") < (b.horizon || "9999") ? -1 : 1; });
}

function claimById(id){
  for(let i = 0; i < CLAIMS.length; i++){ if(CLAIMS[i].id === id) return CLAIMS[i]; }
  return null;
}

/* ================= i numeri che si muovono ================= */
let FACTS = {};   /* chiave -> letture in ordine di data */

const UNIT_FMT = {
  "USD":["$",""], "EUR":[""," €"], "%":["","%"], "mAh":[""," mAh"],
  "mm":[""," mm"], "g":[""," g"], "pollici":["","”"],
  "milioni":[""," mln"], "miliardi":[""," mld"], "":["",""]
};
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;

function isDateVal(v){ return typeof v === "string" && ISO_DATE.test(v); }

function fmtVal(value, unit){
  if(isDateVal(value)) return fmtShort(value);
  const u = UNIT_FMT[unit || ""] || ["", " " + (unit || "")];
  if(typeof value !== "number") return (u[0] + value + u[1]).trim();
  /* Separatori italiani scritti a mano: toLocaleString("it-IT") non raggruppa
     i numeri di quattro cifre (1299 resta 1299) e non coinciderebbe con quello
     che stampa facts.py sul terminale. */
  const neg = value < 0;
  const parts = String(Math.round(Math.abs(value) * 100) / 100).split(".");
  const body = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".")
             + (parts[1] ? "," + parts[1] : "");
  return ((neg ? "-" : "") + u[0] + body + u[1]).trim();
}

function indexFacts(){
  FACTS = {};
  byDate(false).forEach(function(b){
    (b.news || []).forEach(function(n){
      (n.facts || []).forEach(function(f){
        if(!f || !f.key) return;
        (FACTS[f.key] || (FACTS[f.key] = [])).push({
          key:f.key, label:f.label || f.key, unit:f.unit || "",
          value:f.value, kind:f.kind || "stima", source:f.source || "",
          date:b.date, brief:b, news:n
        });
      });
    });
  });
  Object.keys(FACTS).forEach(function(k){
    FACTS[k].sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  });
}

/* Di quanto si è mossa una serie: testo e verso. */
function factDelta(a, b){
  if(isDateVal(a.value) && isDateVal(b.value)){
    const days = Math.round((new Date(b.value + "T12:00:00") - new Date(a.value + "T12:00:00")) / 86400000);
    if(!days) return {text:"ferma", dir:0};
    return {text:(days > 0 ? "slittata di " : "anticipata di ") + Math.abs(days) + " giorni",
            dir:days > 0 ? 1 : -1};
  }
  const x = Number(a.value), y = Number(b.value);
  if(!isFinite(x) || !isFinite(y)) return {text:"", dir:0};
  if(x === y) return {text:"stabile", dir:0};
  const diff = y - x;
  const pct = x ? Math.round(100 * diff / Math.abs(x)) : null;
  return {text:(diff > 0 ? "+" : "") + fmtVal(diff, a.unit) + (pct !== null ? " (" + (pct > 0 ? "+" : "") + pct + "%)" : ""),
          dir:diff > 0 ? 1 : -1};
}

/* Il blocco dei numeri: una riga per metrica, con la storia se ce l'ha. */
function numbersNode(facts, title){
  const keys = [];
  (facts || []).forEach(function(f){ if(f && f.key && keys.indexOf(f.key) < 0) keys.push(f.key); });
  if(!keys.length) return null;

  const box = el("div", {class:"numbers"}, [el("span", {class:"lbl", text:title || "I numeri"})]);
  keys.forEach(function(k){
    const series = FACTS[k] || [];
    if(!series.length) return;
    const last = series[series.length - 1];
    const row = el("div", {class:"num-row"}, [
      el("div", {class:"num-head"}, [
        el("span", {class:"lab", text:last.label}),
        el("span", {class:"val", text:fmtVal(last.value, last.unit)}),
        el("span", {class:"kind k-" + last.kind, text:last.kind})
      ])
    ]);
    if(series.length > 1){
      const hist = el("div", {class:"hist"});
      series.slice(0, -1).forEach(function(r){
        hist.appendChild(el("span", {class:"past", text:fmtVal(r.value, r.unit)}));
        hist.appendChild(el("span", {class:"when", text:fmtShort(r.date)}));
      });
      const d = factDelta(series[0], last);
      hist.appendChild(el("span", {
        class:"move " + (d.dir > 0 ? "up" : d.dir < 0 ? "down" : "flat"),
        text:(d.dir > 0 ? "↑ " : d.dir < 0 ? "↓ " : "= ") + d.text
      }));
      hist.appendChild(el("span", {text:"su " + series.length + " letture"}));
      row.appendChild(hist);
    } else if(last.source){
      row.appendChild(el("div", {class:"hist"}, [el("span", {text:last.source})]));
    }
    box.appendChild(row);
  });
  return box.childNodes.length > 1 ? box : null;
}

/* ================= campo di pallini =================
   Il campo si ridisegna a ogni cambio di edizione, di scheda e di tema. Ogni
   passaggio registrava il suo ascoltatore di ridimensionamento senza togliere
   il precedente: dopo una mattinata di navigazione erano decine, tutti attaccati
   a una tela ormai staccata dalla pagina. Ne resta uno solo, e a cambiarlo e'
   l'ultimo campo acceso — che e' anche l'unico visibile. */
let dotLive = null;

function dotfield(canvas){
  if(!canvas) return;
  if(dotLive){ dotLive.stop(); dotLive = null; }
  const ctx = canvas.getContext("2d");
  const still = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const css = getComputedStyle(document.documentElement);
  const palette = ["--red","--yellow","--blue","--orange"].map(function(v){ return css.getPropertyValue(v).trim(); });
  let dots = [], raf = null, t0 = 0;

  function layout(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if(!w || !h) return;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const step = 19, r = 5.4;
    dots = [];
    for(let y = step/2; y < h; y += step){
      for(let x = step/2; x < w; x += step){
        if(Math.random() < 0.30 + 0.55 * (1 - x / w)){
          dots.push({x:x, y:y, r:r, c:palette[(Math.random()*palette.length)|0], d:(x/w)*520 + Math.random()*260});
        }
      }
    }
  }
  function draw(now){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    let done = true;
    for(let i = 0; i < dots.length; i++){
      const p = dots[i];
      let k = still ? 1 : (now - t0 - p.d) / 460;
      if(k < 0){ k = 0; done = false; } else if(k < 1){ done = false; } else k = 1;
      if(k <= 0) continue;
      const e = 1 - Math.pow(1 - k, 3);
      ctx.globalAlpha = e;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * e, 0, 6.2832);
      ctx.fillStyle = p.c;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if(!done) raf = requestAnimationFrame(draw);
  }
  layout(); t0 = performance.now();
  raf = requestAnimationFrame(draw);

  /* stop() legge "raf" dalla chiusura invece di una copia: draw() lo riassegna
     a ogni fotogramma, e una copia presa qui sarebbe gia' vecchia al primo. */
  const live = {timer:null, onResize:null, stop:function(){
    window.removeEventListener("resize", live.onResize);
    clearTimeout(live.timer);
    cancelAnimationFrame(raf);
  }};
  live.onResize = function(){
    clearTimeout(live.timer);
    live.timer = setTimeout(function(){
      layout(); t0 = performance.now() - 2000;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(draw);
    }, 180);
  };
  window.addEventListener("resize", live.onResize);
  dotLive = live;
}

/* ================= i quattro pulsanti =================
   Salva, Appunti, e i due pollici. Stessa forma, stessa misura, in fondo a
   destra di ogni voce — notizie, radar, banco, recap. I due pollici dicono

function ico(d){

}
const I_STAR  = ico("M8 1.6l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.4l-3.8 2 .7-4.3-3.1-3 4.3-.6z");

/* Il pannello degli appunti: testo, link allegati, invio al diario. Era dentro
   la notizia, ora sta qui perche' lo usano anche radar, banco e recap — un
   video da guardare dopo si salva e si annota come una notizia. */
function notesPanel(k, ref, onPaint){
  const panel = el("div", {class:"workspace", hidden:"hidden"});
  const ta = el("textarea", {class:"note",
    placeholder:"Cosa ti serve ricordare — un'idea, un angolo da approfondire, un follow-up."});
  ta.value = (mk(k) && mk(k).note) || "";
  const flag = el("span", {class:"saved-flag", text:""});

  ta.addEventListener("input", function(){
    mark(k).note = ta.value;
    touched(k); onPaint();
    flag.textContent = "salvato";
    clearTimeout(ta._t); ta._t = setTimeout(function(){ flag.textContent = ""; }, 1400);
  });

  const linkList = el("ul", {class:"saved-links"});
  function paintLinks(){
    linkList.innerHTML = "";
    ((mk(k) && mk(k).links) || []).forEach(function(l, i){
      /* l'indirizzo si ricontrolla qui e non solo in scrittura: questi appunti
         arrivano anche da un file importato e dalla sincronizzazione, e un
         "javascript:" salvato altrove diventerebbe un bottone da premere */
      const lu = safeUrl(l && l.url);
      linkList.appendChild(el("li", {}, [
        lu ? el("a", {href:lu, target:"_blank", rel:"noopener noreferrer", text:(l.label || lu)})
           : el("span", {class:"broken", text:(l && l.label) || "indirizzo non valido"}),
        el("button", {class:"kill", type:"button", title:"Rimuovi", text:"✕", onclick:function(){
          mark(k).links.splice(i, 1); touched(k); paintLinks(); onPaint();
        }})
      ]));
    });
  }
  paintLinks();

  const urlIn = el("input", {type:"url", placeholder:"https:// video, articolo, thread…"});
  const labIn = el("input", {type:"text", placeholder:"etichetta (facoltativa)"});
  const addBtn = el("button", {class:"btn ghost", type:"button", text:"Aggiungi", onclick:function(){
    const u = safeUrl(urlIn.value);
    if(!u){ toast("Serve un indirizzo che inizi con http:// o https://"); return; }
    const m = mark(k);
    if(!m.links) m.links = [];
    m.links.push({url:u, label:labIn.value.trim() || u.replace(/^https?:\/\//,"").split("/")[0]});
    urlIn.value = ""; labIn.value = "";
    touched(k); paintLinks(); onPaint();
  }});

  const diaryBtn = el("button", {class:"btn ghost", type:"button", text:"Manda al diario", onclick:function(){
    const txt = (ta.value || "").trim();
    if(!txt){ toast("Scrivi prima un appunto"); return; }
    addDiary({text:txt, tags:["Da una notizia"], ref:ref});
    toast("Aggiunto al diario");
  }});

  panel.appendChild(ta);
  panel.appendChild(el("div", {class:"linkrow"}, [urlIn, labIn, addBtn]));
  panel.appendChild(linkList);
  panel.appendChild(el("div", {class:"linkrow"}, [diaryBtn, flag]));
  panel.focusNote = function(){ ta.focus(); };
  return panel;
}

function itemTools(k, opts){
  opts = opts || {};
  const bar = el("div", {class:"tools"});
  const star = toolBtn("t-star", "Salva", I_STAR);
  const note = toolBtn("t-note", "Appunti", I_PEN);
  const up   = toolBtn("t-up vote", "Ci stava", I_THUMB);
  const down = toolBtn("t-down vote", "Non ci stava", I_THUMB);
  const panel = notesPanel(k, opts.ref, paintNote);

  function paintStar(){
    const on = !!(mk(k) && mk(k).starred_at);
    star.classList.toggle("on", on);
    star.setAttribute("aria-pressed", on ? "true" : "false");
    star.title = on ? "Salvata — togli" : "Salva";
  }
  function paintNote(){
    const m = mk(k);
    const n = (m && m.links ? m.links.length : 0);
    const on = !!(m && ((m.note || "").trim() || n));
    note.classList.toggle("on", on);
    note.setAttribute("data-count", n > 0 ? String(n) : "");
  }
  function paintVote(){
    const v = (mk(k) && mk(k).vote) || 0;
    up.classList.toggle("on", v > 0);
    down.classList.toggle("on", v < 0);
    up.setAttribute("aria-pressed", v > 0 ? "true" : "false");
    down.setAttribute("aria-pressed", v < 0 ? "true" : "false");
  }

  star.addEventListener("click", function(ev){
    ev.stopPropagation();
    const m = mark(k);
    m.starred_at = m.starred_at ? null : new Date().toISOString();
    paintStar(); touched(k); refreshCounts();
    toast(m.starred_at ? "Salvata" : "Tolta dai salvati");
  });
  note.addEventListener("click", function(ev){
    ev.stopPropagation();
    panel.hidden = !panel.hidden;
    if(!panel.hidden){
      if(opts.onNote) opts.onNote();
      panel.focusNote();
    }
  });
  function vota(v){
    const m = mark(k);
    m.vote = (m.vote === v) ? 0 : v;
    paintVote(); touched(k);
    toast(m.vote > 0 ? "Segnato: ci stava"
        : m.vote < 0 ? "Segnato: non ci stava" : "Voto tolto");
  }
  up.addEventListener("click", function(ev){ ev.stopPropagation(); vota(1); });
  down.addEventListener("click", function(ev){ ev.stopPropagation(); vota(-1); });

  paintStar(); paintNote(); paintVote();
  bar.appendChild(star); bar.appendChild(note); bar.appendChild(up); bar.appendChild(down);
  return {bar:bar, panel:panel};
}

/* ================= notizia ================= */
function storyNode(brief, n, index){
  const k = key(brief.date, n.id);
  const wrap = el("article", {class:"story", id:"s-" + n.id});
  const m0 = mk(k);
  if(m0 && m0.read_at) wrap.classList.add("is-read");

  const chips = el("div", {class:"chips"});
  if(n.tag) chips.appendChild(el("span", {class:tagClass(n.tag), text:n.tag}));
  if(n.category) chips.appendChild(el("span", {class:"chip cat", text:n.category}));
  if(n.reliability){
    /* "affidabilita'" e "puntata" sono parole lunghe che sul telefono mandano a
       capo la riga dei metadati: restano nella marcatura, le nasconde la CSS. */
    chips.appendChild(el("span", {class:"chip rel rel-" + n.reliability}, [
      el("span", {class:"dot"}),
      el("span", {class:"long", text:"affidabilità"}),
      el("span", {text:n.reliability})
    ]));
  }
  const thread = n.thread ? THREADS[n.thread] : null;
  const epIndex = thread ? thread.episodes.findIndex(function(e){
    return e.date === brief.date && e.news.id === n.id;
  }) : -1;
  if(thread && thread.episodes.length > 1 && epIndex >= 0){
    const chip = el("span", {class:"chip filo", role:"button", tabindex:"0",
                             title:"Il filo: " + thread.label}, [
      el("b", {text:ordinal(epIndex + 1)}),
      el("span", {class:"long", text:" puntata"}),
      el("span", {text:" di " + thread.episodes.length})
    ]);
    const open = function(ev){ ev.stopPropagation(); openThread(thread.slug); };
    chip.addEventListener("click", open);
    chip.addEventListener("keydown", function(ev){ if(ev.key === "Enter" || ev.key === " ") open(ev); });
    chips.appendChild(chip);
  }

  const head = el("div", {class:"story-head"}, [
    bead(typeof index === "number" ? index : 0, String(typeof index === "number" ? index + 1 : (n.rank || 0))),
    chips,
    el("h3", {text:n.title}),
    el("p", {class:"lede", text:n.sintesi || ""})
  ]);
  if(n.image){
    head.classList.add("with-thumb");
    head.appendChild(el("img", {class:"thumb", src:n.image, alt:"", loading:"lazy", decoding:"async"}));
  }

  const body = el("div", {class:"story-body", hidden:"hidden"});
  body.appendChild(el("p", {text:n.descrizione || ""}));
  const nums = numbersNode(n.facts);
  if(nums) body.appendChild(nums);
  if(n.reliability_note){
    body.appendChild(el("div", {class:"rel-note"}, [
      el("b", {text:"Nota sulla fonte"}), el("span", {text:n.reliability_note})
    ]));
  }
  /* La previsione di un rumor si mostra solo dopo che qualcuno l'ha chiusa:
     aperta e' contabilita' interna, verificata e' una notizia. Il conto per
     fonte non sta nell'app — si legge con pipeline/claims.py score. */
  if(n.claim && n.claim.id){
    const c = claimById(n.claim.id);
    if(c && c.res){
      const box = el("div", {class:"claim closed"}, [
        el("span", {class:"lbl", text:"Come è andata a finire"}),
        el("p", {class:"txt", text:n.claim.text || ""}),
        el("div", {class:"foot"}, [
          el("span", {class:"verdict v-" + c.state, text:c.state}),
          el("span", {class:"eyebrow", text:"verificata il " + fmtShort(c.res.date)})
        ])
      ]);
      if(c.res.note) box.appendChild(el("span", {text:c.res.note}));
      box.appendChild(el("button", {class:"act", type:"button", text:"Vedi la notizia che l'ha chiusa",
        onclick:function(ev){ ev.stopPropagation(); jumpTo(c.res.date, c.res.news.id); }}));
      body.appendChild(box);
    }
  }

  (n.resolves || []).forEach(function(r){
    const c = claimById(r.claim);
    const box = el("div", {class:"claim closed"}, [
      el("span", {class:"lbl", text:"Chiude una previsione"}),
      el("p", {class:"txt", text:c ? c.text : r.claim})
    ]);
    box.appendChild(el("div", {class:"foot"}, [
      el("span", {class:"verdict v-" + (r.verdict || "aperto"), text:r.verdict || ""}),
      c ? el("span", {class:"eyebrow", text:c.source + " · " + fmtShort(c.date)}) : null
    ]));
    if(r.note) box.appendChild(el("span", {text:r.note}));
    if(c){
      box.appendChild(el("button", {class:"act", type:"button", text:"Vedi dove era stata detta",
        onclick:function(ev){ ev.stopPropagation(); jumpTo(c.date, c.news.id); }}));
    }
    body.appendChild(box);
  });

  if(thread && thread.episodes.length > 1){
    const line = el("div", {class:"readmore"}, [
      el("span", {class:"sources", text:"Filo — " + thread.label}),
      el("a", {href:"#", text:"tutte le " + thread.episodes.length + " puntate →",
        onclick:function(ev){ ev.preventDefault(); ev.stopPropagation(); openThread(thread.slug); }})
    ]);
    body.appendChild(line);
  }

  const read = el("div", {class:"readmore"});
  const primary = safeUrl(n.link);
  if(primary) read.appendChild(el("a", {class:"primary", href:primary, target:"_blank", rel:"noopener noreferrer", text:"Leggi l'articolo →"}));
  (n.extra_links || []).forEach(function(l){
    const u = safeUrl(l.url);
    if(u) read.appendChild(el("a", {href:u, target:"_blank", rel:"noopener noreferrer", text:l.label}));
  });
  if(read.childNodes.length) body.appendChild(read);
  if(n.sources && n.sources.length){
    body.appendChild(el("p", {class:"sources", text:n.sources.length + (n.sources.length === 1 ? " fonte — " : " fonti — ") + n.sources.join(", ")}));
  }

  head.addEventListener("click", function(){
    body.hidden = !body.hidden;
    wrap.classList.toggle("is-open", !body.hidden);
    if(!body.hidden && NOTES && !(mk(k) && mk(k).read_at)){
      mark(k).read_at = new Date().toISOString();
      wrap.classList.add("is-read");
      touched(k);
    }
  });

  wrap.appendChild(head);
  wrap.appendChild(body);
  if(!NOTES) return wrap;   /* copia di sola lettura: niente appunti */

  const tools = itemTools(k, {
    ref:{date:brief.date, id:n.id, title:n.title},
    onNote:function(){ body.hidden = false; wrap.classList.add("is-open"); }
  });
  wrap.appendChild(tools.bar);
  wrap.appendChild(tools.panel);
  return wrap;
}

/* ================= diario: scritture ================= */
function addDiary(fields){
  const now = new Date().toISOString();
  S.diary.unshift(Object.assign({
    id:"d" + Date.now() + Math.random().toString(36).slice(2,6),
    ts:Date.now(), text:"", tags:[], link:null, ref:null,
    updated_at:now, deleted_at:null, dirty:true
  }, fields));
  save(); queueSync(); refreshCounts();
}
function removeDiary(id){
  const e = S.diary.filter(function(x){ return x.id === id; })[0];
  if(!e) return;
  e.deleted_at = new Date().toISOString();
  e.updated_at = e.deleted_at;
  e.dirty = true;
  save(); queueSync(); refreshCounts();
}
function liveDiary(){ return S.diary.filter(function(e){ return !e.deleted_at; }); }
