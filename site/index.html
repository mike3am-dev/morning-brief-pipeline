const TAGS = ["Idea", "Lavoro", "Da approfondire", "Video", "Contenuto", "Personale"];
let draftTags = [];

function renderDiary(){
  const root = document.getElementById("view-diario");
  root.innerHTML = "";
  const col = el("div", {class:"col-main"});
  const rows0 = liveDiary();
  const pipR = el("span", {class:"pip"}); pipR.style.background = "var(--red)";
  col.appendChild(el("div", {class:"section-head"}, [
    pipR, el("h2", {text:"Diario"}),
    el("span", {class:"eyebrow hint", text:rows0.length + " voci"})
  ]));

  const ta = el("textarea", {placeholder:"Un'idea, un angolo da sviluppare, un appunto sulla giornata…"});
  const picker = el("div", {class:"tagpicker"});
  draftTags = [];
  TAGS.forEach(function(t){
    const b = el("button", {type:"button", text:t});
    b.addEventListener("click", function(){
      const i = draftTags.indexOf(t);
      if(i >= 0) draftTags.splice(i,1); else draftTags.push(t);
      b.classList.toggle("on", draftTags.indexOf(t) >= 0);
    });
    picker.appendChild(b);
  });
  const linkIn = el("input", {type:"url", placeholder:"link o video da allegare (facoltativo)"});
  const addBtn = el("button", {class:"btn", type:"button", text:"Salva nel diario", onclick:function(){
    const txt = ta.value.trim();
    if(!txt){ toast("Scrivi qualcosa prima di salvare"); return; }
    addDiary({text:txt, tags:draftTags.slice(), link:safeUrl(linkIn.value)});
    renderDiary(); toast("Salvato");
  }});

  col.appendChild(el("div", {class:"composer"}, [
    ta, picker, el("div", {class:"linkrow"}, [linkIn]),
    el("div", {class:"composer-foot"}, [el("span", {class:"spacer"}), addBtn])
  ]));

  if(!rows0.length){
    col.appendChild(el("div", {class:"empty", html:"<b>Il diario è vuoto</b>Scrivi qui le idee, oppure mandale al diario dagli appunti di una notizia."}));
  } else {
    const filterRow = el("div", {class:"tagpicker", style:"margin:.4rem 0 1.2rem"});
    const active = {v:null};
    ["Tutte"].concat(TAGS).concat(["Da una notizia"]).forEach(function(t){
      const b = el("button", {type:"button", text:t});
      if(t === "Tutte") b.classList.add("on");
      b.addEventListener("click", function(){
        active.v = (t === "Tutte") ? null : t;
        Array.prototype.forEach.call(filterRow.children, function(c){ c.classList.toggle("on", c === b); });
        paint();
      });
      filterRow.appendChild(b);
    });
    col.appendChild(filterRow);

    const list = el("div", {});
    function paint(){
      list.innerHTML = "";
      const rows = liveDiary().filter(function(e){ return !active.v || (e.tags || []).indexOf(active.v) >= 0; });
      if(!rows.length){ list.appendChild(el("div", {class:"empty", text:"Nessuna voce con questa etichetta."})); return; }
      rows.forEach(function(e){
        const meta = el("div", {class:"entry-meta"}, [el("time", {text:fmtStamp(e.ts)})]);
        (e.tags || []).forEach(function(t){ meta.appendChild(el("span", {class:"chip", text:t})); });
        meta.appendChild(el("button", {class:"kill", type:"button", text:"elimina", onclick:function(){
          removeDiary(e.id); renderDiary();
        }}));
        const node = el("div", {class:"entry"}, [meta, el("p", {class:"entry-text", text:e.text})]);
        const eu = safeUrl(e.link);
        if(eu) node.appendChild(el("p", {}, [el("a", {href:eu, target:"_blank", rel:"noopener noreferrer", text:eu})]));
        if(e.ref) node.appendChild(el("p", {class:"ctx", text:"da: " + e.ref.title + " · " + fmtShort(e.ref.date)}));
        list.appendChild(node);
      });
    }
    paint();
    col.appendChild(list);
  }
  root.appendChild(col);
}

/* ================= ricerca ================= */
function renderSearch(){
  const root = document.getElementById("view-cerca");
  root.innerHTML = "";
  const col = el("div", {class:"col-main"});
  const input = el("input", {type:"search", placeholder:"Cerca…"});
  const results = el("div", {});
  col.appendChild(el("div", {class:"searchbar"}, [input]));
  col.appendChild(el("p", {class:"eyebrow", text:NOTES ? "archivio notizie, appunti e diario" : "archivio notizie"}));
  col.appendChild(results);
  root.appendChild(col);

  function hl(text, q){
    const i = text.toLowerCase().indexOf(q);
    if(i < 0) return esc(text.slice(0, 180));
    const from = Math.max(0, i - 60);
    const snip = (from > 0 ? "…" : "") + text.slice(from, i + q.length + 120);
    const j = snip.toLowerCase().indexOf(q);
    return esc(snip.slice(0, j)) + "<mark>" + esc(snip.slice(j, j + q.length)) + "</mark>" + esc(snip.slice(j + q.length));
  }

  input.addEventListener("input", function(){
    const q = input.value.trim().toLowerCase();
    results.innerHTML = "";
    if(q.length < 2) return;

    const hits = ALL.filter(function(x){
      const m = mk(x.k);
      const hay = [x.news.title, x.news.sintesi, x.news.descrizione,
                   (x.news.sources || []).join(" "), (m && m.note) || ""].join("   ");
      return hay.toLowerCase().indexOf(q) >= 0;
    });
    results.appendChild(el("div", {class:"section-head"}, [
      el("span", {class:"pip"}), el("h2", {text:"Notizie"}),
      el("span", {class:"eyebrow hint", text:hits.length + " risultati"})
    ]));
    if(!hits.length) results.appendChild(el("div", {class:"empty", text:"Nessuna notizia trovata."}));
    hits.slice(0, 40).forEach(function(x){
      const m = mk(x.k);
      results.appendChild(el("div", {class:"entry"}, [
        el("div", {class:"entry-meta"}, [
          el("time", {text:fmtShort(x.brief.date)}),
          el("span", {class:tagClass(x.news.tag), text:x.news.tag || ""})
        ]),
        el("h4", {}, [el("a", {href:"#", onclick:function(ev){
          ev.preventDefault(); jumpTo(x.brief.date, x.news.id);
        }, text:x.news.title})]),
        el("p", {class:"entry-text", html:hl(x.news.descrizione || x.news.sintesi || "", q)}),
        (m && m.note) ? el("p", {class:"ctx", text:"tuo appunto: " + m.note.slice(0,140)}) : null
      ]));
    });

    if(!NOTES) return;
    const dhits = liveDiary().filter(function(e){
      return (e.text + " " + (e.tags || []).join(" ")).toLowerCase().indexOf(q) >= 0;
    });
    if(dhits.length){
      const p = el("span", {class:"pip"}); p.style.background = "var(--red)";
      results.appendChild(el("div", {class:"section-head"}, [
        p, el("h2", {text:"Diario"}),
        el("span", {class:"eyebrow hint", text:dhits.length + " voci"})
      ]));
      dhits.slice(0, 25).forEach(function(e){
        results.appendChild(el("div", {class:"entry"}, [
          el("div", {class:"entry-meta"}, [el("time", {text:fmtStamp(e.ts)})]),
          el("p", {class:"entry-text", html:hl(e.text, q)})
        ]));
      });
    }
  });
}

/* ================= AI ================= */
const AI_LAB = {uso:1, demo:1, trucco:1, sapevi:1};
const AI_LABS = [["anthropic","Anthropic"],["openai","OpenAI"],["google","Google"],["meta","Meta"],["apple","Apple"],["altri","Altri"]];
function labName(l){ const m = AI_LABS.filter(function(x){ return x[0] === l; })[0]; return m ? m[1] : (l || "Altri"); }
function isLab(a){ return !!AI_LAB[String(a.kind || "").toLowerCase()]; }

function aiFoot(date, a, extra){
  const u = safeUrl(a.link);
  const foot = el("div", {class:"foot"});
  if(u) foot.appendChild(el("a", {class:"primary", href:u, target:"_blank", rel:"noopener noreferrer",
                              text:(/youtube\.com|youtu\.be/.test(u) ? "Guarda il video →" : "Apri →")}));
  if(a.source) foot.appendChild(el("span", {class:"sources", text:a.source}));
  if(extra) foot.appendChild(extra);
  const tools = (NOTES && a.id)
    ? itemTools(key(date, "ai:" + a.id), {ref:{date:date, id:"ai:" + a.id, title:a.title}}) : null;
  if(tools) foot.appendChild(tools.bar);
  return {foot:foot, panel:tools ? tools.panel : null};
}

/* una riga del dispaccio: laboratorio, titolo e la miniatura; il resto al tocco */
function wireRow(date, a){
  const li = el("li", {id:"a-" + a.id});
  const row = el("div", {class:"row"}, [
    el("div", {class:"rowtext"}, [
      el("span", {class:"chip lab-name", text:labName(String(a.lab || "altri").toLowerCase())}),
      el("h4", {text:a.title}),
      a.sintesi ? el("p", {class:"sintesi", text:a.sintesi}) : null,
      segueNode(date, a)
    ]),
    a.image ? el("img", {class:"thumb", src:a.image, alt:"", loading:"lazy", decoding:"async"}) : null
  ]);
  const body = el("div", {class:"body", hidden:"hidden"});
  if(a.note) body.appendChild(el("p", {text:a.note}));
  if(a.apple) body.appendChild(el("p", {class:"apple", text:a.apple}));
  const f = aiFoot(date, a, a.kind ? el("span", {class:"sources", text:a.kind}) : null);
  body.appendChild(f.foot);
  if(f.panel) body.appendChild(f.panel);
  row.addEventListener("click", function(){ body.hidden = !body.hidden; li.classList.toggle("is-open", !body.hidden); });
  li.appendChild(row); li.appendChild(body);
  return li;
}

/* una scheda della galleria: la foto e' il risultato, sotto il come provarlo */
function labCard(date, a){
  const card = el("article", {class:"labcard" + (a.image ? "" : " noshot"), id:"a-" + a.id});
  const body = el("div", {class:"body", hidden:"hidden"});
  const toggle = function(){ body.hidden = !body.hidden; card.classList.toggle("is-open", !body.hidden); };
  if(a.image) card.appendChild(el("img", {class:"shot", src:a.image, alt:"", loading:"lazy", decoding:"async", onclick:toggle}));
  card.appendChild(el("div", {class:"chips"}, [
    el("span", {class:"chip k-lab", text:"LAB · " + String(a.kind || "")}),
    el("span", {class:"chip lab-name", text:labName(String(a.lab || "altri").toLowerCase())})
  ]));
  card.appendChild(el("h4", {text:a.title, onclick:toggle}));
  const seg = segueNode(date, a);
  if(seg) card.appendChild(seg);
  if(a.prova) card.appendChild(el("p", {class:"prova", text:a.prova}));
  if(a.note) body.appendChild(el("p", {text:a.note}));
  card.appendChild(body);
  const f = aiFoot(date, a, null);
  card.appendChild(f.foot);
  if(f.panel) card.appendChild(f.panel);
  return card;
}

/* i due blocchi di un giorno, nell'ordine in cui si leggono: prima cosa e'
   successo, poi cosa puoi provare */
function aiBlocks(col, date, items){
  const cron = items.filter(function(a){ return !isLab(a); });
  const lab = items.filter(isLab);
  if(cron.length){
    col.appendChild(el("div", {class:"subhead wire"}, [
      el("span", {text:"Cosa è successo"}), el("span", {class:"eyebrow", text:cron.length + (cron.length === 1 ? " voce" : " voci")})
    ]));
    const ul = el("ul", {class:"wire"});
    cron.forEach(function(a){ ul.appendChild(wireRow(date, a)); });
    col.appendChild(ul);
  }
  if(lab.length){
    col.appendChild(el("div", {class:"subhead lab"}, [
      el("span", {text:"Cosa puoi provare"}), el("span", {class:"eyebrow", text:"LAB · " + lab.length})
    ]));
    const grid = el("div", {class:"labgrid"});
    lab.forEach(function(a){ grid.appendChild(labCard(date, a)); });
    col.appendChild(grid);
  }
}

/* il fronte si ricava dall'archivio: l'ultima voce di genere "modello" per
   laboratorio. Niente registro a parte: vive dentro le edizioni come tutto */
function fronte(){
  const out = {};
  BRIEFS.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; }).forEach(function(b){
    (b.ai || []).forEach(function(a){
      if(String(a.kind || "").toLowerCase() !== "modello") return;
      const l = String(a.lab || "altri").toLowerCase();
      if(!out[l]) out[l] = {a:a, date:b.date};
    });
  });
  return AI_LABS.map(function(x){ return out[x[0]] ? [x[1], out[x[0]]] : null; }).filter(Boolean);
}

let aiMode = "notizie";
try{ aiMode = localStorage.getItem("mb_aiMode") === "lab" ? "lab" : "notizie"; }catch(e){}

/* una voce AI e' "vista" quando e' comparsa nella scheda: segno read_at sulla
   sua chiave ai:, che viaggia con la sincronizzazione e quindi vale su Mac e
   iPhone. Serve al numero sulla scheda, che conta solo il nuovo */
function aiKey(date, a){ return key(date, "ai:" + a.id); }
function aiRead(date, a){ if(!a.id) return false; const m = mk(aiKey(date, a)); return !!(m && m.read_at); }
function aiMarkSeen(date, a){
  if(!NOTES || !a.id || aiRead(date, a)) return false;
  const m = mark(aiKey(date, a)); m.read_at = new Date().toISOString(); m.updated_at = m.read_at; m.dirty = true;
  return true;
}

function renderAI(){
  const root = document.getElementById("view-ai");
  root.innerHTML = "";
  const col = el("div", {class:"col-main"});
  const pip = el("span", {class:"pip"}); pip.style.background = "var(--ink)";
  /* una sola edizione, come le notizie Apple nella home: la scheda segue il
     giorno che stai leggendo. Prima scorrevano di seguito tutti i giorni
     dell'archivio, e sotto le voci di oggi ricomparivano quelle di ieri. */
  const brief = BRIEFS.filter(function(b){ return b.date === currentDate; })[0] || BRIEFS[0];
  const items = (brief && brief.ai) || [];
  const cron = items.filter(function(a){ return !isLab(a); });
  const lab = items.filter(isLab);
  const nCron = cron.length, nLab = lab.length;
  col.appendChild(el("div", {class:"section-head"}, [pip, el("h2", {text:"AI"}),
    brief ? el("span", {class:"eyebrow hint", text:fmtShort(brief.date)}) : null]));
  if(!nCron && !nLab){
    col.appendChild(el("div", {class:"empty", html:"<b>Niente AI in questa edizione</b>Le altre giornate si raggiungono dall'archivio."}));
    root.appendChild(col); return;
  }
  /* due schede, una scelta: Notizie (cosa e' successo) o LAB (cosa puoi provare) */
  const sw = el("div", {class:"aiswitch", role:"tablist"});
  [["notizie","Notizie",nCron],["lab","LAB",nLab]].forEach(function(x){
    sw.appendChild(el("button", {type:"button", role:"tab", "data-mode":x[0],
      "aria-current": aiMode === x[0] ? "true" : null,
      onclick:function(){ aiMode = x[0]; try{ localStorage.setItem("mb_aiMode", aiMode); }catch(e){} renderAI(); window.scrollTo(0,0); }}, [
      el("span", {text:x[1]}), x[2] ? el("span", {class:"count", text:String(x[2])}) : null
    ]));
  });
  col.appendChild(sw);
  /* il fronte (l'ultimo modello per laboratorio) solo quando ha qualcosa da
     confrontare: con un laboratorio solo e' rumore */
  const fr = aiMode === "notizie" ? fronte() : [];
  if(fr.length >= 2){
    const g = el("div", {class:"fronte"});
    fr.forEach(function(x){
      const u = safeUrl(x[1].a.link);
      g.appendChild(el("div", {}, [
        el("span", {class:"lab", text:x[0]}),
        el("b", {}, [u ? el("a", {href:u, target:"_blank", rel:"noopener noreferrer", text:x[1].a.title}) : el("span", {text:x[1].a.title})]),
        el("span", {class:"when", text:fmtShort(x[1].date)})
      ]));
    });
    col.appendChild(g);
  }
  const shown = aiMode === "lab" ? lab : cron;
  if(!shown.length){
    col.appendChild(el("div", {class:"empty", html: aiMode === "lab"
      ? "<b>Nessuna voce LAB oggi</b>Questa edizione porta solo cronaca: passa a Notizie."
      : "<b>Nessuna notizia AI oggi</b>Questa edizione porta solo LAB: passa alla scheda accanto."}));
    root.appendChild(col); return;
  }
  if(aiMode === "lab"){
    const grid = el("div", {class:"labgrid"});
    shown.forEach(function(a){ grid.appendChild(labCard(brief.date, a)); });
    col.appendChild(grid);
  } else {
    const ul = el("ul", {class:"wire"});
    ul.style.borderTop = "0";
    shown.forEach(function(a){ ul.appendChild(wireRow(brief.date, a)); });
    col.appendChild(ul);
  }
  root.appendChild(col);
  /* quello che e' comparso adesso e' visto: un solo salvataggio per tutte */
  let seen = 0;
  shown.forEach(function(a){ if(aiMarkSeen(brief.date, a)) seen++; });
  if(seen){ save(); queueSync(); refreshCounts(); }
}

/* ================= navigazione ================= */
const views = ["oggi","ai","archivio","salvati","diario","cerca"];
let currentView = "oggi";

function show(name){
  currentView = name;
  views.forEach(function(v){ document.getElementById("view-" + v).hidden = (v !== name); });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    const on = t.classList.contains("more") ? (name === "diario" || name === "cerca") : t.dataset.view === name;
    t.setAttribute("aria-current", on ? "true" : "false");
    /* con sei schede la barra sul telefono non ci sta: la scheda attiva si
       porta sempre dentro la finestra, cosi' non resta mezza tagliata */
    if(on && t.scrollIntoView) t.scrollIntoView({block:"nearest", inline:"nearest"});
  });
  tabsOverflow();
  if(name === "ai") renderAI();
  if(name === "archivio") renderArchive();
  if(name === "salvati") renderStarred();
  if(name === "diario") renderDiary();
  if(name === "cerca"){ renderSearch(); const i = document.querySelector("#view-cerca input"); if(i) i.focus(); }
}
/* i tre puntini sul telefono: Diario e Cerca stanno li' dentro */
(function(){
  const more = document.getElementById("moreTab"), menu = document.getElementById("tabmenu");
  if(!more || !menu) return;
  function close(){ menu.hidden = true; more.setAttribute("aria-expanded", "false"); }
  more.addEventListener("click", function(ev){
    ev.stopPropagation();
    menu.hidden = !menu.hidden; more.setAttribute("aria-expanded", menu.hidden ? "false" : "true");
  });
  Array.prototype.forEach.call(menu.querySelectorAll("button"), function(b){
    b.addEventListener("click", function(){ close(); show(b.dataset.go); });
  });
  document.addEventListener("click", function(ev){ if(!menu.hidden && !menu.contains(ev.target)) close(); });
})();

function repaint(){
  if(currentView === "oggi") renderEdition();
  else if(currentView === "ai") renderAI();
  else if(currentView === "archivio") renderArchive();
  else if(currentView === "salvati") renderStarred();
  else if(currentView === "diario") renderDiary();
  refreshCounts();
}
Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
  if(t.classList.contains("more")) return;
  t.addEventListener("click", function(){ show(t.dataset.view); window.scrollTo({top:0, behavior:"smooth"}); });
});

/* Sfumatura sul bordo della barra quando ci sono schede oltre il margine:
   dice che si scorre senza aggiungere frecce o altro arredo. */
function tabsOverflow(){
  const nav = document.querySelector("nav.tabs");
  if(!nav) return;
  const max = nav.scrollWidth - nav.clientWidth;
  nav.classList.toggle("more-right", max - nav.scrollLeft > 4);
  nav.classList.toggle("more-left", nav.scrollLeft > 4);
}
(function(){
  const nav = document.querySelector("nav.tabs");
  if(!nav) return;
  nav.addEventListener("scroll", tabsOverflow, {passive:true});
  window.addEventListener("resize", tabsOverflow);
  tabsOverflow();
})();

function refreshCounts(){
  /* l'archivio non ha numero: quante edizioni ci siano non e' un'informazione.
     Il numero sulla scheda AI conta solo quello che non hai ancora visto
     dell'edizione aperta: aperta la scheda, si azzera */
  const day = BRIEFS.filter(function(b){ return b.date === currentDate; })[0] || BRIEFS[0] || {};
  const nAI = (day.ai || []).filter(function(a){ return !aiRead(day.date, a); }).length;
  document.getElementById("cAI").textContent = nAI || "";
  const stars = Object.keys(S.marks).filter(function(k){ return S.marks[k].starred_at; }).length;
  document.getElementById("cStar").textContent = stars || "";
  document.getElementById("cDiary").textContent = liveDiary().length || "";
  const d2 = document.getElementById("cDiary2"); if(d2) d2.textContent = liveDiary().length || "";
}

/* ================= tema ================= */
document.getElementById("themeBtn").addEventListener("click", function(){
  const r = document.documentElement;
  const dark = r.getAttribute("data-theme") === "dark" ||
    (!r.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme", dark ? "light" : "dark");
  try{ localStorage.setItem("tmb-theme", dark ? "light" : "dark"); }catch(e){}
  dotfield(document.getElementById("dotfield"));
});
try{
  const saved = localStorage.getItem("tmb-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
}catch(e){}

/* ================= esporta / importa ================= */
document.getElementById("exportBtn").addEventListener("click", async function(){
  const payload = JSON.stringify({app:"the-morning-brief", version:2, exported:new Date().toISOString(), data:S}, null, 1);
  const name = "morning-brief-appunti-" + localDay(new Date()) + ".json";
  try{
    if(window.claude && window.claude.downloads && window.claude.downloads.save){
      await window.claude.downloads.save({filename:name, data:payload});
      toast("Copia salvata"); return;
    }
  }catch(err){ toast("Salvataggio annullato"); return; }
  const blob = new Blob([payload], {type:"application/json"});
  const a = el("a", {href:URL.createObjectURL(blob), download:name});
  document.body.appendChild(a); a.click(); a.remove();
  toast("Copia scaricata");
});
document.getElementById("importBtn").addEventListener("click", function(){
  document.getElementById("fileInput").click();
});
document.getElementById("fileInput").addEventListener("change", function(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onload = function(){
    try{
      const parsed = JSON.parse(fr.result);
      const d = parsed.data || parsed;
      const now = new Date().toISOString();
      /* versione 1: stars/notes/links/read separati */
      if(d.stars || d.notes || d.links || d.read){
        const keys = {};
        ["stars","notes","links","read"].forEach(function(fl){
          Object.keys(d[fl] || {}).forEach(function(k){ keys[k] = 1; });
        });
        Object.keys(keys).forEach(function(k){
          const m = mark(k);
          if(d.stars && d.stars[k] && !m.starred_at) m.starred_at = new Date(d.stars[k]).toISOString();
          if(d.read && d.read[k] && !m.read_at) m.read_at = new Date(d.read[k]).toISOString();
          if(d.notes && d.notes[k] && !m.note) m.note = d.notes[k];
          if(d.links && d.links[k] && !(m.links || []).length) m.links = d.links[k];
          m.updated_at = now; m.dirty = true;
        });
      }
      /* versione 2: marks già nella forma giusta */
      Object.keys(d.marks || {}).forEach(function(k){
        const inc = d.marks[k], cur = S.marks[k];
        if(!cur || (inc.updated_at || "") > (cur.updated_at || "")){
          S.marks[k] = Object.assign({}, inc, {updated_at:now, dirty:true});
        }
      });
      (d.diary || []).forEach(function(e){
        if(!e || !e.id) return;
        if(!S.diary.some(function(x){ return x.id === e.id; })){
          S.diary.push(Object.assign({deleted_at:null}, e, {updated_at:now, dirty:true}));
        }
      });
      S.diary.sort(function(a,b){ return b.ts - a.ts; });
      saveNow(); queueSync(); repaint(); show("oggi");
      toast("Appunti importati");
    }catch(e){
      toast("File non leggibile: serve un export di questa app");
    }
  };
  fr.readAsText(f);
  ev.target.value = "";
});

/* ================= avvio ================= */
function boot(){
  document.getElementById("gate").hidden = true;
  document.getElementById("masthead").hidden = false;
  document.getElementById("main").hidden = false;
  document.getElementById("colophon").hidden = false;
  if(!NOTES){
    ["salvati","diario"].forEach(function(v){
      const t = document.querySelector('.tab[data-view="' + v + '"]');
      if(t) t.hidden = true;
    });
    ["exportBtn","importBtn"].forEach(function(id){
      const n = document.getElementById(id);
      if(n) n.hidden = true;
    });
  }
  if(!CLOUD){
    ["syncPip","outBtn"].forEach(function(id){
      const n = document.getElementById(id);
      if(n) n.hidden = true;
    });
  }
  indexAll();
  if(!currentDate && BRIEFS[0]) currentDate = BRIEFS[0].date;
  refreshCounts();
  renderEdition();
  show("oggi");
  if(CLOUD){
    loadBriefs();
    sync();
    setInterval(function(){ if(!document.hidden) sync(); }, 90000);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) sync(); });
    window.addEventListener("online", sync);
    window.addEventListener("offline", function(){ pip("offline", "Offline — gli appunti restano sul dispositivo"); });
  }
}

function openGate(msg){
  const g = document.getElementById("gate");
  g.hidden = false;
  document.getElementById("masthead").hidden = true;
  document.getElementById("main").hidden = true;
  document.getElementById("colophon").hidden = true;
  if(msg) document.getElementById("gateErr").textContent = msg;
  dotfield(document.getElementById("gatefield"));
}

document.getElementById("gateForm").addEventListener("submit", async function(ev){
  ev.preventDefault();
  const btn = document.getElementById("gateBtn");
  const err = document.getElementById("gateErr");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Un attimo…";
  try{
    await login(document.getElementById("gateEmail").value.trim(), document.getElementById("gatePass").value);
    boot();
  }catch(e){
    err.textContent = /invalid/i.test(e.message) ? "Email o password non corrette." : e.message;
  }finally{
    btn.disabled = false; btn.textContent = "Entra";
  }
});
document.getElementById("outBtn").addEventListener("click", function(){
  clearAuth();
  localStorage.removeItem(K_BRIEFS);
  location.reload();
});

if(CLOUD && !(AUTH && AUTH.refresh_token)) openGate();
else boot();
})();
