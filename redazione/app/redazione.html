<title>La redazione di TMB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Una stanza sola, in 3D, a tutto schermo; sopra, pochissime scritte nello stile dell'app. */
:root{
  --bone:#EDEAE3; --paper:#F8F6F2; --ink:#17181B; --ink-2:#4B4D53; --ink-3:#7C7F87; --rule:#D7D2C7;
  --yellow:#F5C518; --orange:#F0821E; --red:#E01F3D; --blue:#0E9CD8;
  --fondo:#EFEBE3; --fondo-2:#DCD5C8; --testo:#17181B; --testo-2:#4B4D53;
  --display:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
html[data-luce="alba"]{--fondo:#F6E3CF; --fondo-2:#E9BF9E}
html[data-luce="sera"]{--fondo:#3A3B5C; --fondo-2:#1F2038; --testo:#F1EEE8; --testo-2:#C9C6BF}
html[data-luce="notte"]{--fondo:#1B1D30; --fondo-2:#0D0E1A; --testo:#F1EEE8; --testo-2:#B5B3AD}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(110% 85% at 50% 42%, var(--fondo), var(--fondo-2)); color:var(--testo);
  font-family:var(--body); font-size:14px; overflow:hidden}
#app{position:relative; height:100%; overflow:hidden}
#scena{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab}
#scena.presa{cursor:grabbing}
#scena.mano{cursor:pointer}

.marchio{position:absolute; top:16px; left:max(20px,env(safe-area-inset-left,0px)); display:flex; align-items:center; gap:9px; pointer-events:none}
.pallini{display:flex; gap:4px}
.pallini i{width:8px; height:8px; border-radius:50%; display:block}
.marchio h1{font-family:var(--display); font-weight:800; font-size:19px; line-height:1; letter-spacing:.04em; text-transform:uppercase; margin:0}

.luci{position:absolute; top:12px; right:max(18px,env(safe-area-inset-right,0px)); display:flex; gap:1px; padding:3px;
  background:color-mix(in srgb, var(--paper) 86%, transparent); border-radius:999px; box-shadow:0 1px 0 rgba(23,24,27,.14)}
.luci button{font-family:var(--display); font-weight:700; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;
  border:0; background:none; color:var(--ink-2); padding:3px 10px; border-radius:999px; cursor:pointer}
.luci button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.luci button:focus-visible, .tag:focus-visible, .chiudi:focus-visible{outline:3px solid var(--blue); outline-offset:2px}

/* le etichette: un nome piccolo sopra la testa; il resto compare solo quando ci passi sopra */
.tag{position:absolute; left:0; top:0; transform:translate(-50%,-100%); border:0; cursor:pointer; white-space:nowrap;
  display:flex; align-items:center; gap:5px; padding:2px 8px 2px 6px; border-radius:999px;
  background:color-mix(in srgb, var(--paper) 90%, transparent); color:var(--ink); font:600 11px var(--body);
  box-shadow:0 1px 0 rgba(23,24,27,.16); will-change:transform}
.tag b{width:6px; height:6px; border-radius:50%; display:block}
.tag .piu{display:none; align-items:center; gap:6px; color:var(--ink-3); font-weight:500}
.tag .piu em{font-style:normal; font-family:var(--display); font-weight:700; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  background:var(--ink); color:var(--paper); padding:1px 7px; border-radius:999px}
.tag:hover .piu, .tag:focus-visible .piu, .tag.vicino .piu{display:inline-flex}
.tag:hover, .tag.vicino{background:var(--paper)}

.nota{position:absolute; left:max(20px,env(safe-area-inset-left,0px)); bottom:12px; margin:0; font-size:11.5px; color:var(--testo-2); pointer-events:none}

#pannello{position:absolute; top:16px; right:max(16px,env(safe-area-inset-right,0px)); bottom:16px; width:min(340px, calc(100% - 32px));
  background:var(--paper); color:var(--ink); border-radius:16px; box-shadow:0 10px 40px rgba(10,12,20,.22), 0 1px 0 rgba(23,24,27,.1);
  padding:20px 20px 18px; display:flex; flex-direction:column; gap:16px; overflow:auto}
.testa{display:flex; align-items:center; gap:12px}
.avatar{width:46px; height:46px; border-radius:50%; flex:none; display:grid; place-items:center; color:#fff;
  font-family:var(--display); font-weight:800; font-size:24px}
.testa h2{font-family:var(--display); font-weight:800; font-size:30px; line-height:.95; text-transform:uppercase; margin:0}
.testa p{margin:2px 0 0; font-size:12.5px; color:var(--ink-2)}
.chiudi{margin-left:auto; border:0; background:var(--bone); color:var(--ink); width:32px; height:32px; border-radius:50%; font-size:18px; line-height:1; cursor:pointer}
.blocco{display:flex; flex-direction:column; gap:7px}
.blocco h3{font-family:var(--display); font-weight:700; font-size:14px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin:0}
.blocco p{margin:0; line-height:1.45}
.numeri{display:flex; gap:8px; flex-wrap:wrap}
.numeri div{background:var(--bone); border-radius:10px; padding:8px 12px; min-width:0}
.numeri strong{display:block; font-family:var(--display); font-weight:800; font-size:26px; line-height:1; font-variant-numeric:tabular-nums}
.numeri span{font-size:11.5px; color:var(--ink-2)}
.cambio{border-left:3px solid var(--red); padding-left:10px; display:flex; flex-direction:column; gap:3px}
.cambio del{color:var(--ink-3); text-decoration-color:var(--red); text-decoration-thickness:2px; font-size:13px; line-height:1.35}
.cambio ins{text-decoration:none; font-weight:600; line-height:1.35}
.titoli{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px}
.titoli li{display:flex; gap:8px; line-height:1.35}
.titoli li i{flex:none; width:8px; height:8px; border-radius:50%; margin-top:6px; background:var(--orange)}
.adesso{display:flex; gap:8px; align-items:center; font-weight:600}
.adesso i{width:9px; height:9px; border-radius:50%; background:#2f8a4a; flex:none}
.ritratto{display:block; width:100%; aspect-ratio:1.6; border-radius:12px; background:var(--bone)}
.piede{margin-top:auto; font-size:12px; color:var(--ink-3); line-height:1.4}
#errore{position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center}
</style>

<div id="app">
  <canvas id="scena" aria-label="La redazione di The Morning Brief, in 3D"></canvas>
  <div id="etichette"></div>

  <div class="marchio">
    <span class="pallini"><i style="background:var(--red)"></i><i style="background:var(--yellow)"></i><i style="background:var(--blue)"></i></span>
    <h1>La redazione</h1>
  </div>

  <div class="luci" role="group" aria-label="La luce della stanza">
    <button type="button" data-luce="adesso" aria-pressed="true">Adesso</button>
    <button type="button" data-luce="alba" aria-pressed="false">Alba</button>
    <button type="button" data-luce="giorno" aria-pressed="false">Giorno</button>
    <button type="button" data-luce="sera" aria-pressed="false">Sera</button>
    <button type="button" data-luce="notte" aria-pressed="false">Notte</button>
  </div>

  <p class="nota">Tocca una persona · rotella per avvicinarti · trascina per spostarti · doppio clic per tornare</p>

  <aside id="pannello" hidden aria-live="polite"></aside>
  <div id="errore" hidden></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
            "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

/* ------------------------------------------------------------------ i dati veri (13 novembre 2026)
   Da redazione/stato/2026-11-13.json: l'edizione, la corsa, le correzioni di Ivo, le letture di Mike. */
const DATI = {
  uscita: '06:00', prossimaUscita: [6, 0],
  corsa: { inizio: '05:34', minuti: 30, tetto: 45, ultime: [40, 25, 29, 27, 26, 26, 30], giorni: ['S', 'D', 'L', 'M', 'M', 'G', 'V'] },
  menabo: [
    { t: 'HomeView arriva nei negozi. Le recensioni promuovono l\'oggetto e si dividono su Siri', breve: 'HomeView nei negozi' },
    { t: 'Huang lascia Nvidia. Fra i nomi per la successione ci sono due dirigenti Apple', breve: 'Huang lascia Nvidia' },
    { t: 'Bloomberg Intelligence stima 16 milioni di iPhone Duo nel primo anno, nonostante i resi', breve: 'iPhone Duo: 16 milioni' },
    { t: 'Il nuovo Apple TV 4K alla prova: Siri senza telecomando e il primo surround fatto di HomePod', breve: 'Apple TV 4K alla prova' },
    { t: 'Il primo aggiornamento di HomeView chiude nove falle. Siri aprirà la porta solo a dicembre', breve: 'HomeView: 9 falle chiuse' },
  ],
  punto: 'Da chi deve proteggerci uno schermo in cucina?',
  letture: [['S', 5], ['D', 2], ['L', 3], ['M', 5], ['M', 7], ['G', 1]],   // voci aperte da Mike, edizioni dal 7 al 12 novembre
  richiesteLea: 76, feedMuti: 6, gtaGiorni: 6,
  persone: {
    ettore: { nome: 'Ettore', mestiere: 'redattore', modello: 'Opus', colore: '#F0821E', dalle: '05:50', alle: '05:58', minuti: 8,
      notizie: 15, approfondimenti: 5 },
    ivo: { nome: 'Ivo', mestiere: 'revisore', modello: 'Opus', colore: '#E01F3D', dalle: '05:58', alle: '05:59', minuti: 1, riscritti: 10,
      cambi: [
        { prima: 'Huang lascia Nvidia, e fra i nomi per la successione ci sono due dirigenti Apple',
          dopo: 'Huang lascia Nvidia. Fra i nomi per la successione ci sono due dirigenti Apple' },
        { prima: 'Bloomberg Intelligence alza a 16 milioni le vendite di iPhone Duo nel primo anno, nonostante i resi',
          dopo: 'Bloomberg Intelligence stima 16 milioni di iPhone Duo nel primo anno, nonostante i resi' },
        { prima: 'Apple accetta per la prima volta i pieghevoli Samsung in permuta, fino a 410 dollari per il Fold7',
          dopo: 'Apple accetta per la prima volta i pieghevoli Samsung in permuta. Per il Fold7 fino a 410 dollari' },
      ] },
  },
};

const C = { bone: '#EDEAE3', paper: '#F8F6F2', ink: '#17181B', ink2: '#4B4D53', ink3: '#7C7F87',
  yellow: '#F5C518', orange: '#F0821E', red: '#E01F3D', blue: '#0E9CD8' };
const DISPLAY = '"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue",Arial,sans-serif';
const SISTEMA = '-apple-system,"SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif';
const PENNARELLO = '"Marker Felt","Chalkboard SE","Comic Sans MS",sans-serif';
const A_MANO = '"Bradley Hand","Noteworthy","Marker Felt",cursive';
const GRAZIE = '"Apple Garamond","Garamond","Baskerville","Times New Roman",serif';
const CORSIVO = '"Snell Roundhand","Apple Chancery","Brush Script MT",cursive';
const fermo = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PI = Math.PI;

try { avvia(); } catch (e) { guasto(e); }
function guasto(e) {
  const el = document.getElementById('errore'); el.hidden = false;
  el.textContent = 'La stanza non si è accesa: ' + (e && e.message ? e.message : e);
  console.error(e);
}

function avvia() {
  const canvas = document.getElementById('scena');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  /* ================================================================ mattoni */
  const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0, ...o });
  const ombra = (m, getta = true) => { m.castShadow = getta; m.receiveShadow = true; return m; };
  const box = (w, h, d, mat, r = 0.02) =>
    ombra(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2.01, h / 2.01, d / 2.01)), mat));
  const cyl = (rt, rb, h, mat, seg = 28) => ombra(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat));
  const sph = (r, mat, w = 24, hh = 18) => ombra(new THREE.Mesh(new THREE.SphereGeometry(r, w, hh), mat));
  const ell = (r, sx, sy, sz, mat) => { const m = sph(r, mat); m.scale.set(sx, sy, sz); return m; };
  const caps = (r, l, mat) => ombra(new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 8, 18), mat));
  const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
  const gruppo = (...figli) => { const g = new THREE.Group(); figli.forEach(f => f && g.add(f)); return g; };
  const dolce = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
  const fra = (u, a, b) => dolce((u - a) / (b - a));                       // 0 prima di a, 1 dopo b
  const campana = (u, a, b, c, d) => fra(u, a, b) * (1 - fra(u, c, d));   // sale fra a e b, scende fra c e d

  function tela(w, h, disegna) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    disegna(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
  }
  const schermo = (w, h, tex) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  const stampa = (w, h, tex) => ombra(new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 })), false);

  function aCapo(x, testo, maxW, maxRighe = 9) {
    const parole = testo.split(' '), righe = []; let r = '';
    for (const p of parole) { const prova = r ? r + ' ' + p : p; if (x.measureText(prova).width > maxW && r) { righe.push(r); r = p; } else r = prova; }
    if (r) righe.push(r);
    if (righe.length > maxRighe) { righe.length = maxRighe; righe[maxRighe - 1] = righe[maxRighe - 1].replace(/\s+\S*$/, '') + '…'; }
    return righe;
  }
  function spazia(x, em, px) { try { x.letterSpacing = (em * px) + 'px'; } catch (e) { /* non c'è: pazienza */ } }
  const rr = (x, a, b, w, h, r) => { x.beginPath(); x.roundRect(a, b, w, h, r); };
  function casuale(seme) { let k = seme; return () => (k = (k * 16807) % 2147483647) / 2147483647; }

  /* Il marchio, ricalcato sulla testata dell'app: THE e BRIEF grandi metà di MORNING,
     la O è il sole, davanti la falce azzurra dell'orizzonte. */
  function falce(x, ax, ay, aw, ah) {
    const g = x.createLinearGradient(ax, 0, ax + aw, 0);
    g.addColorStop(0, '#1A5FAF'); g.addColorStop(0.48, '#7CC6F2'); g.addColorStop(1, '#1A5FAF');
    const X = u => ax + aw * u / 100, Y = v => ay + ah * v / 14;
    x.fillStyle = g; x.beginPath(); x.moveTo(X(0), Y(13.6)); x.quadraticCurveTo(X(48), Y(-5), X(100), Y(13.6));
    x.quadraticCurveTo(X(48), Y(4.2), X(0), Y(13.6)); x.fill();
  }
  function marchio(x, x0, y0, S, inchiostro = C.ink) {
    const s = S * 0.47; x.save(); x.textBaseline = 'alphabetic'; x.fillStyle = inchiostro;
    x.font = `900 ${s}px ${SISTEMA}`; spazia(x, -0.01, s);
    const yThe = y0 + s * 0.73; x.fillText('THE', x0, yThe);
    const y = yThe + S * 0.80;
    x.font = `900 ${S}px ${SISTEMA}`; spazia(x, -0.035, S);
    const wM = x.measureText('M').width; x.fillText('M', x0, y);
    const d = S * 0.92, cx = x0 + wM + S * 0.01 + d / 2, cy = y - S * 0.33;
    x.fillStyle = C.yellow; x.beginPath(); x.arc(cx, cy, d / 2, 0, PI * 2); x.fill();
    x.fillStyle = inchiostro; const xr = x0 + wM + S * 0.03 + d; x.fillText('RNING', xr, y);
    const W = xr + x.measureText('RNING').width - x0;
    falce(x, x0 - W * 0.03, y - S * 0.12, W * 0.72, S * 0.30);
    x.fillStyle = inchiostro; x.font = `900 ${s}px ${SISTEMA}`; spazia(x, -0.01, s);
    const yBrief = y + S * 0.21 + s * 0.73; x.fillText('BRIEF', x0, yBrief);
    x.restore(); return { w: W, h: yBrief - y0 };
  }
  function sole(x, cx, cy, r) {   // il sole con la falce: la versione piccola, per le tazze
    x.fillStyle = C.yellow; x.beginPath(); x.arc(cx, cy, r, 0, PI * 2); x.fill();
    falce(x, cx - r * 1.5, cy + r * 0.05, r * 3, r * 1.0);
  }

  /* ================================================================ le tele */
  // Il fondale: solo il marchio e il visual della testata, come dietro alle trasmissioni del mattino.
  const texFondale = tela(2048, 943, (x, w, h) => {
    x.fillStyle = C.bone; x.fillRect(0, 0, w, h);
    const cx = 1620, cy = 800, R = 430;
    for (let r = 0, gy = 26; gy < h; gy += 44, r++) for (let gx = 26 + (r % 2) * 22; gx < w; gx += 44) {   // il campo di pallini
      const d = Math.hypot(gx - cx, gy - cy), rag = 13.5 * (1 - (d - R) / 760) * Math.min(1, Math.max(0, (gx - 1090) / 360));
      if (d > R + 6 && rag > 1.2) { x.fillStyle = d < R + 330 ? C.orange : C.red; x.beginPath(); x.arc(gx, gy, Math.min(13.5, rag), 0, 7); x.fill(); }
    }
    x.fillStyle = C.yellow; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.fill();
    falce(x, 540, 560, 2300, 420);
    [[C.red, 0], [C.yellow, 1], [C.blue, 2]].forEach(([c, i]) => { x.fillStyle = c; x.beginPath(); x.arc(140 + i * 60, 124, 21, 0, 7); x.fill(); });
    marchio(x, 118, 196, 200);
  });

  function finestra(titolo) {   // la cornice di una finestra del Mac, per gli schermi
    return (x, w, h) => {
      x.fillStyle = '#DCD9D2'; x.fillRect(0, 0, w, h);
      x.fillStyle = 'rgba(255,255,255,.7)'; x.fillRect(0, 0, w, 26);
      x.fillStyle = C.ink; x.font = `600 15px ${SISTEMA}`; x.fillText('', 12, 19); x.font = `700 14px ${SISTEMA}`; x.fillText('TMB', 38, 19);
      x.font = `400 14px ${SISTEMA}`; x.fillStyle = C.ink2; x.fillText('File   Modifica   Vista', 82, 19);
      x.fillStyle = C.paper; rr(x, 22, 40, w - 44, h - 54, 12); x.fill();
      [['#FF5F57', 0], ['#FEBC2E', 1], ['#28C840', 2]].forEach(([c, i]) => { x.fillStyle = c; x.beginPath(); x.arc(44 + i * 20, 60, 6.5, 0, 7); x.fill(); });
      x.fillStyle = C.ink3; x.font = `600 14px ${SISTEMA}`; x.textAlign = 'center'; x.fillText(titolo, w / 2, 65); x.textAlign = 'left';
    };
  }
  const texMonitorEttore = tela(640, 400, (x, w, h) => {
    finestra('edizione del 13 novembre')(x, w, h);
    x.fillStyle = C.orange; x.font = `800 24px ${DISPLAY}`; spazia(x, 0.1, 24); x.fillText('CASA · IN APERTURA', 48, 112); spazia(x, 0, 1);
    x.fillStyle = C.ink; x.font = `800 34px ${SISTEMA}`;
    let y = 154; aCapo(x, DATI.menabo[0].t, w - 96, 3).forEach(r => { x.fillText(r, 48, y); y += 41; });
    x.fillStyle = '#C9C5BB'; for (let i = 0; i < 4 && y + i * 24 < h - 34; i++) x.fillRect(48, y + 2 + i * 24, i === 3 ? 260 : w - 96, 10);
  });
  const texMonitorIvo = tela(640, 400, (x, w, h) => {
    finestra('revisione · 10 testi riscritti')(x, w, h);
    const c = DATI.persone.ivo.cambi[1];
    x.fillStyle = C.ink3; x.font = `500 25px ${SISTEMA}`; let y = 118;
    aCapo(x, c.prima, w - 96, 3).forEach(r => { x.fillText(r, 48, y); const m = x.measureText(r).width;
      x.strokeStyle = C.red; x.lineWidth = 3.5; x.beginPath(); x.moveTo(46, y - 8); x.lineTo(50 + m, y - 9); x.stroke(); y += 33; });
    y += 20; x.fillStyle = C.ink; x.font = `800 30px ${SISTEMA}`;
    aCapo(x, c.dopo, w - 96, 4).forEach(r => { x.fillText(r, 48, y); y += 37; });
  });

  function foglio(seme, pulito = false) {   // una bozza stampata; quelle di Ivo hanno le correzioni a penna rossa
    return tela(300, 420, (x, w, h) => {
      x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, w, h);
      x.fillStyle = C.ink; x.fillRect(28, 30, 190, 16); x.fillRect(28, 54, 120, 16);
      const caso = casuale(seme);
      for (let i = 0; i < 13; i++) {
        const y = 100 + i * 23, l = 150 + caso() * 94;
        x.fillStyle = '#B9B6AE'; x.fillRect(28, y, l, 8);
        if (!pulito && caso() < 0.3) { x.strokeStyle = C.red; x.lineWidth = 3.5; x.beginPath(); const a = 40 + caso() * 60, b = a + 50 + caso() * 70;
          x.moveTo(a, y + 4); x.lineTo(b, y + 3); x.stroke(); x.beginPath(); x.moveTo(b + 6, y - 2); x.lineTo(w - 36, y - 10 + caso() * 6); x.stroke(); }
      }

    cam.left = -mezza * asp; cam.right = mezza * asp; cam.top = mezza; cam.bottom = -mezza; inquadra();
    if (pronta) { renderer.render(scene, cam); etichette(); sporca = false; }
  }
  new ResizeObserver(misura).observe(canvas); misura();

  /* ================================================================ etichette e scheda */
  const strato = document.getElementById('etichette'), tags = {};
  const el = (tag, cls, testo) => { const e = document.createElement(tag); if (cls) e.className = cls; if (testo != null) e.textContent = testo; return e; };
  for (const [id, p] of Object.entries(DATI.persone)) {
    const b = el('button', 'tag'); b.type = 'button'; const pallino = el('b'); pallino.style.background = p.colore;
    const piu = el('span', 'piu'); piu.append(document.createTextNode(p.mestiere), el('em', null, 'Guarda ▸'));
    b.append(pallino, document.createTextNode(p.nome), piu); b.setAttribute('aria-label', `${p.nome}, ${p.mestiere}: apri la scheda`);
    b.addEventListener('click', () => apri(id)); strato.append(b); tags[id] = b;
  }
  const v3 = new THREE.Vector3();
  function etichette() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    for (const [id, g] of Object.entries(persone)) {
      g.userData.j.testa.getWorldPosition(v3); v3.y += 0.3; v3.project(cam);
      tags[id].style.transform = `translate(-50%,-100%) translate(${((v3.x + 1) / 2 * w).toFixed(1)}px,${((1 - v3.y) / 2 * h).toFixed(1)}px)`;
    }
  }

  const pannello = document.getElementById('pannello'); let aperto = null, rigaAdesso = null;
  /* il primo piano: una seconda camera, vera, puntata su chi hai aperto. Si vede quello che fa, da vicino. */
  const telaRitratto = el('canvas', 'ritratto'); telaRitratto.setAttribute('aria-hidden', 'true');
  const cam2 = new THREE.PerspectiveCamera(22, 1.6, 0.2, 40), FONDI = { alba: new THREE.Color(0xF3DCC8), giorno: new THREE.Color(0xE9E3D9), sera: new THREE.Color(0x2F3050), notte: new THREE.Color(0x161829) };
  let rend2 = null, env2 = null;
  function primoPiano() {
    if (!aperto) return;
    if (!rend2) { rend2 = new THREE.WebGLRenderer({ canvas: telaRitratto, antialias: true }); rend2.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); rend2.setSize(320, 200, false);
      rend2.toneMapping = THREE.NeutralToneMapping; rend2.shadowMap.enabled = true; rend2.shadowMap.type = THREE.PCFShadowMap; env2 = new THREE.PMREMGenerator(rend2).fromScene(new RoomEnvironment(), 0.04).texture; }
    const g = persone[aperto]; g.userData.j.testa.getWorldPosition(v3);
    const j = g.userData.j, yaw = g.rotation.y + j.busto.rotation.y + j.testa.rotation.y * 0.7; let dx = 0.8 * Math.sin(yaw) + 0.42, dz = 0.8 * Math.cos(yaw) + 0.42; const n = Math.hypot(dx, dz) || 1;
    let cx = v3.x + dx / n * 2.0, cz = v3.z + dz / n * 2.0;
    if (cx < 0.4 || cz < 0.4) {   // ha il viso contro una parete: lo si guarda di profilo, dal lato aperto della stanza
      const fx2 = Math.sin(yaw), fz2 = Math.cos(yaw); let px = fz2, pz = -fx2; if (px + pz < 0) { px = -px; pz = -pz; }
      cx = v3.x + px * 2.0 + fx2 * 0.5; cz = v3.z + pz * 2.0 + fz2 * 0.5; }
    cam2.position.set(Math.max(0.4, cx), v3.y + 0.1, Math.max(0.4, cz)); cam2.lookAt(v3.x, v3.y - 0.2, v3.z);
    const e = scene.environment, b = scene.background; scene.environment = env2; scene.background = FONDI[document.documentElement.dataset.luce] || FONDI.giorno;
    rend2.render(scene, cam2); scene.environment = e; scene.background = b;
  }
  function apri(id) {
    const p = DATI.persone[id]; aperto = id; pannello.textContent = '';
    const testa = el('div', 'testa'), av = el('div', 'avatar', p.nome[0]); av.style.background = p.colore;
    const chi = el('div'); chi.append(el('h2', null, p.nome), el('p', null, `${p.mestiere} · ${p.modello}`));
    const x = el('button', 'chiudi', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Chiudi la scheda'); x.addEventListener('click', chiudi);
    testa.append(av, chi, x); pannello.append(telaRitratto, testa);
    const momento = el('div', 'blocco'), riga = el('p', 'adesso'); rigaAdesso = el('span'); riga.append(el('i'), rigaAdesso); momento.append(el('h3', null, 'In questo momento'), riga); pannello.append(momento);
    const numeri = el('div', 'numeri'), numero = (n, cosa) => { const d = el('div'); d.append(el('strong', null, n), el('span', null, cosa)); numeri.append(d); };
    const stamattina = el('div', 'blocco'); stamattina.append(el('h3', null, 'Stamattina, per l\'edizione delle ' + DATI.uscita));
    if (id === 'ettore') {
      numero(String(p.notizie), 'notizie scritte'); numero(String(p.approfondimenti), 'approfondimenti'); numero(p.minuti + ' min', 'di lavoro');
      stamattina.append(numeri, el('p', null, `Ha scritto la prosa dalle ${p.dalle} alle ${p.alle}. L'edizione è uscita alle ${DATI.uscita}.`));
      const b = el('div', 'blocco'); b.append(el('h3', null, 'Sul suo schermo: le prime tre'));
      const ul = el('ul', 'titoli'); DATI.menabo.slice(0, 3).forEach(n => { const li = el('li'); li.append(el('i'), el('span', null, n.t)); ul.append(li); }); b.append(ul);
      const c = el('div', 'blocco'); c.append(el('h3', null, '«Il punto» di oggi'), el('p', null, DATI.punto));
      pannello.append(stamattina, b, c);
    } else {
      numero(String(p.riscritti), 'testi riscritti'); numero(p.minuti + ' min', 'di lavoro');
      stamattina.append(numeri, el('p', null, `Ha riletto la prosa di Ettore dalle ${p.dalle} alle ${p.alle}, subito prima dell'uscita.`));
      const b = el('div', 'blocco'); b.append(el('h3', null, 'Sulla scrivania: tre titoli corretti'));
      p.cambi.forEach(c => { const d = el('div', 'cambio'); d.append(el('del', null, c.prima), el('ins', null, c.dopo)); b.append(d); });
      pannello.append(stamattina, b);
    }
    pannello.append(el('p', 'piede', 'In alto il primo piano, dal vivo. I gesti in scena sono una giornata tipo; i numeri e i testi sono quelli veri di stamattina. La conversazione arriva con il prossimo passo.'));
    pannello.hidden = false; x.focus({ preventScroll: true }); segui(); primoPiano();
  }
  function segui() {   // la camera resta sulla persona aperta, anche mentre cammina
    if (!aperto) return; const g = persone[aperto]; v3.set(g.position.x, 0.85, g.position.z); const [a, b] = sulPiano(v3), z = 2.1;
    const larga = canvas.clientWidth > 760 ? pannello.offsetWidth : 0; meta.x = a + (larga / 2) / (ppu * z); meta.y = b; meta.zoom = z;
    if (rigaAdesso) rigaAdesso.textContent = ADESSO[aperto](tempoGiro());
  }
  function lascia() { if (!aperto) return null; const t = tags[aperto]; aperto = null; rigaAdesso = null; pannello.hidden = true; return t; }   // chiude la scheda, la camera resta dov'è
  function chiudi() { const t = lascia(); if (!t) return; Object.assign(meta, CASA); t.focus({ preventScroll: true }); }
  addEventListener('keydown', e => { if (e.key === 'Escape') chiudi(); });

  /* ================================================================ rotella, trascinamento, clic */
  const raggio = new THREE.Raycaster(), ndc = new THREE.Vector2(); let presa = null;
  const chiSotto = e => { const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raggio.setFromCamera(ndc, cam); const colpi = raggio.intersectObjects(Object.values(persone), true); if (!colpi.length) return null;
    let o = colpi[0].object; while (o && !o.userData.id) o = o.parent; return o ? o.userData.id : null; };
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); lascia(); const r = canvas.getBoundingClientRect();
    const dx = (e.clientX - r.left - r.width / 2) / ppu, dy = -(e.clientY - r.top - r.height / 2) / ppu;
    const z0 = meta.zoom, z1 = Math.min(5, Math.max(1, z0 * Math.exp(-e.deltaY * 0.0016)));
    meta.x += dx / z0 - dx / z1; meta.y += dy / z0 - dy / z1; meta.zoom = z1;
    if (z1 === 1) { meta.x = CASA.x; meta.y = CASA.y; }
  }, { passive: false });
  canvas.addEventListener('pointerdown', e => { presa = { x: e.clientX, y: e.clientY, mosso: 0 }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!presa) { const id = chiSotto(e); canvas.classList.toggle('mano', !!id); for (const k in tags) tags[k].classList.toggle('vicino', k === id); return; }
    const dx = e.clientX - presa.x, dy = e.clientY - presa.y; presa.mosso += Math.abs(dx) + Math.abs(dy); if (presa.mosso > 6) { canvas.classList.add('presa'); lascia(); }
    presa.x = e.clientX; presa.y = e.clientY; meta.x -= dx / (ppu * inq.zoom); meta.y += dy / (ppu * inq.zoom); inq.x = meta.x; inq.y = meta.y; inquadra(); });
  canvas.addEventListener('pointerup', e => { canvas.classList.remove('presa'); const p = presa; presa = null; if (!p || p.mosso > 6) return; const id = chiSotto(e); if (id) apri(id); else if (aperto) chiudi(); });
  canvas.addEventListener('dblclick', () => { if (aperto) chiudi(); else Object.assign(meta, CASA); });

  /* ================================================================ il giro */
  function ora() { const d = new Date(), sec = d.getSeconds() + d.getMilliseconds() / 1000, min = d.getMinutes() + sec / 60, h = (d.getHours() % 12) + min / 60;
    secondi.rotation.z = -sec * PI / 30; minuti.rotation.z = -min * PI / 30; ore.rotation.z = -h * PI / 6; }
  luce('adesso'); ora(); conto(); vita(tempoGiro());
  pronta = true; renderer.render(scene, cam); etichette();
  let prima = 0;
  function giro(t) {
    requestAnimationFrame(giro);
    if (document.hidden || t - prima < 1000 / 31) return; prima = t;
    if (!fermo) { vita(tempoGiro()); ora(); sporca = true; }
    if (conto()) sporca = true;
    segui();
    let muove = false; for (const c of ['x', 'y', 'zoom']) { const d = meta[c] - inq[c]; if (Math.abs(d) > 0.0005) { inq[c] += d * 0.16; muove = true; } else inq[c] = meta[c]; }
    if (muove) inquadra();
    if (!sporca) return; sporca = false;
    renderer.render(scene, cam); etichette(); primoPiano();
  }
  requestAnimationFrame(giro);
  // una maniglia per le prove: redazione.tempo(52) ferma la scena a quel secondo del giro, redazione.tempo(null) la fa ripartire
  window.redazione = { THREE, renderer, scene, solare, luce, apri, chiudi, GIRO, adesso: ADESSO, tempi: () => ({ tCaffeFine, tLancio, tConsegna, tRiordino, tLavagnaFine, tAnnaffia, tIvoTorna }),
    tempo(t) { tempoFermo = t; vita(tempoGiro()); sporca = true; },
    guarda(x, y, z, zoom = 3) { lascia(); const [a, b] = sulPiano(new THREE.Vector3(x, y, z)); Object.assign(meta, { x: a, y: b, zoom }); Object.assign(inq, meta); inquadra(); } };
  canvas.addEventListener('webglcontextlost', e => e.preventDefault());
  canvas.addEventListener('webglcontextrestored', () => { sporca = true; });
}
