<title>La redazione di TMB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Una stanza sola, in 3D, a tutto schermo; sopra, poche scritte nello stile dell'app. */
:root{
  --bone:#EDEAE3; --paper:#F8F6F2; --ink:#17181B; --ink-2:#4B4D53; --ink-3:#7C7F87; --rule:#D7D2C7;
  --yellow:#F5C518; --orange:#F0821E; --red:#E01F3D; --blue:#0E9CD8;
  --fondo:#EFEBE3; --fondo-2:#DCD5C8; --testo:#17181B; --testo-2:#4B4D53;
  --display:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
html[data-luce="alba"]{--fondo:#F6E3CF; --fondo-2:#E9BF9E}
html[data-luce="sera"]{--fondo:#3A3B5C; --fondo-2:#1F2038; --testo:#F1EEE8; --testo-2:#C9C6BF}
html[data-luce="notte"]{--fondo:#1B1D30; --fondo-2:#0D0E1A; --testo:#F1EEE8; --testo-2:#B5B3AD}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(110% 85% at 50% 42%, var(--fondo), var(--fondo-2)); color:var(--testo);
  font-family:var(--body); font-size:14px; overflow:hidden}
#app{position:relative; height:100%; overflow:hidden}
#scena{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab}
#scena.presa{cursor:grabbing}

.marchio{position:absolute; top:18px; left:max(22px,env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:6px; pointer-events:none}
.pallini{display:flex; gap:6px}
.pallini i{width:11px; height:11px; border-radius:50%; display:block}
.marchio h1{font-family:var(--display); font-weight:800; font-size:34px; line-height:.92; letter-spacing:.01em; text-transform:uppercase; margin:0}
.marchio p{margin:0; font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--testo-2)}

.luci{position:absolute; top:18px; right:max(22px,env(safe-area-inset-right,0px)); display:flex; gap:2px; padding:3px;
  background:color-mix(in srgb, var(--paper) 88%, transparent); border-radius:999px; box-shadow:0 1px 0 rgba(23,24,27,.14)}
.luci button{font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.05em; text-transform:uppercase;
  border:0; background:none; color:var(--ink-2); padding:5px 14px; border-radius:999px; cursor:pointer}
.luci button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.luci button:focus-visible, .tag:focus-visible, .chiudi:focus-visible{outline:3px solid var(--blue); outline-offset:2px}

.tag{position:absolute; left:0; top:0; transform:translate(-50%,-100%); border:0; cursor:pointer; white-space:nowrap;
  display:flex; align-items:center; gap:7px; padding:5px 12px 5px 9px; border-radius:999px;
  background:var(--paper); color:var(--ink); font:600 12.5px var(--body); box-shadow:0 2px 0 rgba(23,24,27,.16); will-change:transform}
.tag b{width:9px; height:9px; border-radius:50%; display:block}
.tag span{color:var(--ink-3); font-weight:500}
.tag em{font-style:normal; font-family:var(--display); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  background:var(--ink); color:var(--paper); padding:2px 8px; border-radius:999px; margin-left:2px}

.nota{position:absolute; left:max(22px,env(safe-area-inset-left,0px)); bottom:16px; margin:0; max-width:46ch; font-size:12.5px; line-height:1.45; color:var(--testo-2)}
.nota b{color:var(--testo)}

#pannello{position:absolute; top:16px; right:max(16px,env(safe-area-inset-right,0px)); bottom:16px; width:min(360px, calc(100% - 32px));
  background:var(--paper); color:var(--ink); border-radius:16px; box-shadow:0 10px 40px rgba(10,12,20,.22), 0 1px 0 rgba(23,24,27,.1);
  padding:20px 20px 18px; display:flex; flex-direction:column; gap:16px; overflow:auto}
.testa{display:flex; align-items:center; gap:12px}
.avatar{width:46px; height:46px; border-radius:50%; flex:none; display:grid; place-items:center; color:#fff;
  font-family:var(--display); font-weight:800; font-size:24px}
.testa h2{font-family:var(--display); font-weight:800; font-size:30px; line-height:.95; text-transform:uppercase; margin:0}
.testa p{margin:2px 0 0; font-size:12.5px; color:var(--ink-2)}
.chiudi{margin-left:auto; border:0; background:var(--bone); color:var(--ink); width:32px; height:32px; border-radius:50%; font-size:18px; line-height:1; cursor:pointer}
.blocco{display:flex; flex-direction:column; gap:7px}
.blocco h3{font-family:var(--display); font-weight:700; font-size:14px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin:0}
.blocco p{margin:0; line-height:1.45}
.numeri{display:flex; gap:8px; flex-wrap:wrap}
.numeri div{background:var(--bone); border-radius:10px; padding:8px 12px; min-width:0}
.numeri strong{display:block; font-family:var(--display); font-weight:800; font-size:26px; line-height:1; font-variant-numeric:tabular-nums}
.numeri span{font-size:11.5px; color:var(--ink-2)}
.cambio{border-left:3px solid var(--red); padding-left:10px; display:flex; flex-direction:column; gap:3px}
.cambio del{color:var(--ink-3); text-decoration-color:var(--red); text-decoration-thickness:2px; font-size:13px; line-height:1.35}
.cambio ins{text-decoration:none; font-weight:600; line-height:1.35}
.titoli{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px}
.titoli li{display:flex; gap:8px; line-height:1.35}
.titoli li i{flex:none; width:8px; height:8px; border-radius:50%; margin-top:6px; background:var(--orange)}
.piede{margin-top:auto; font-size:12px; color:var(--ink-3); line-height:1.4}
#errore{position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center}
</style>

<div id="app">
  <canvas id="scena" aria-label="Un angolo della redazione di The Morning Brief, in 3D"></canvas>
  <div id="etichette"></div>

  <div class="marchio">
    <span class="pallini"><i style="background:var(--red)"></i><i style="background:var(--yellow)"></i><i style="background:var(--blue)"></i></span>
    <h1>La redazione</h1>
    <p>Prova di look · un angolo</p>
  </div>

  <div class="luci" role="group" aria-label="La luce della stanza">
    <button type="button" data-luce="alba" aria-pressed="false">Alba</button>
    <button type="button" data-luce="giorno" aria-pressed="true">Giorno</button>
    <button type="button" data-luce="sera" aria-pressed="false">Sera</button>
    <button type="button" data-luce="notte" aria-pressed="false">Notte</button>
  </div>

  <p class="nota"><b>Tocca Ettore o Ivo.</b> Rotella per avvicinarti, trascina per spostarti, doppio clic per tornare. Tutto quello che si legge viene dall'edizione di giovedì 12 novembre.</p>

  <aside id="pannello" hidden aria-live="polite"></aside>
  <div id="errore" hidden></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
            "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ i dati veri (12 novembre 2026)
   Da redazione/stato/2026-11-12.json: l'edizione, la corsa, le correzioni di Ivo. */
const DATI = {
  dataBreve: 'GIO 12 NOV', inOnda: '05:56',
  corsa: { inizio: '05:34', fine: '06:00', minuti: 26 },
  menabo: [
    { t: 'Scadono i resi dei primi iPhone Duo. Chi lo restituisce e perché', rep: 'iPhone' },
    { t: 'Gemini arriva su CarPlay con un\'app sua. Era l\'ultimo grande assistente che mancava', rep: 'AI' },
    { t: 'iPhone 18 Pro Max primo nel test di autonomia di CNET su 32 telefoni', rep: 'iPhone' },
    { t: 'Un fornitore cinese dice di lavorare agli occhiali AI e agli AirPods con fotocamera di Apple', rep: 'Accessori' },
    { t: 'Nel nuovo MacBook Pro l\'aria calda esce dalla cerniera, non più dallo schermo', rep: 'Mac' },
  ],
  punto: 'Si può restituire un telefono, meno un\'abitudine',
  primePagine: [
    { data: 'MER 11 NOV', t: 'Apple TV porta gli interpreti in lingua dei segni nei suoi film', c: '#0E9CD8' },
    { data: 'MAR 10 NOV', t: 'Apple mette un prezzo all\'AI: 49,99 dollari per altro uso in Logic Pro', c: '#F0821E' },
  ],
  persone: {
    ettore: { nome: 'Ettore', mestiere: 'redattore', modello: 'Opus', colore: '#F0821E', minuti: 9,
      notizie: 15, approfondimenti: 5 },
    ivo: { nome: 'Ivo', mestiere: 'revisore', modello: 'Opus', colore: '#E01F3D', minuti: 1, riscritti: 11,
      cambi: [
        { prima: 'iPhone Duo, si chiude la finestra dei resi: chi lo restituisce e perché',
          dopo: 'Scadono i resi dei primi iPhone Duo. Chi lo restituisce e perché' },
        { prima: 'Google porta l\'app Gemini su CarPlay, l\'ultimo grande assistente che mancava',
          dopo: 'Gemini arriva su CarPlay con un\'app sua. Era l\'ultimo grande assistente che mancava' },
        { prima: 'Nel nuovo MacBook Pro il calore esce dalla cerniera, non più dallo schermo: lo mostra la prova del fumo',
          dopo: 'Nel nuovo MacBook Pro l\'aria calda esce dalla cerniera, non più dallo schermo' },
      ] },
  },
};

const C = { bone: '#EDEAE3', paper: '#F8F6F2', ink: '#17181B', ink2: '#4B4D53', ink3: '#7C7F87',
  yellow: '#F5C518', orange: '#F0821E', red: '#E01F3D', blue: '#0E9CD8' };
const DISPLAY = '"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue",Arial,sans-serif';
const SISTEMA = '-apple-system,"SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif';
const fermo = matchMedia('(prefers-reduced-motion: reduce)').matches;

try { avvia(); } catch (e) { guasto(e); }
function guasto(e) {
  const el = document.getElementById('errore'); el.hidden = false;
  el.textContent = 'La stanza non si è accesa: ' + (e && e.message ? e.message : e);
  console.error(e);
}

function avvia() {
  const canvas = document.getElementById('scena');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.shadowMap.autoUpdate = false;

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  /* ---------------------------------------------------------------- mattoni */
  const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0, ...o });
  const ombra = (m, getta = true) => { m.castShadow = getta; m.receiveShadow = true; return m; };
  const box = (w, h, d, mat, r = 0.02) =>
    ombra(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2.01, h / 2.01, d / 2.01)), mat));
  const cyl = (rt, rb, h, mat, seg = 28) => ombra(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat));
  const sph = (r, mat, w = 24, hh = 18) => ombra(new THREE.Mesh(new THREE.SphereGeometry(r, w, hh), mat));
  const cap = (r, l, mat) => ombra(new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 8, 18), mat));
  const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
  const gruppo = (...figli) => { const g = new THREE.Group(); figli.forEach(f => f && g.add(f)); return g; };

  function tela(w, h, disegna) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    disegna(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
  }
  const schermo = (w, h, tex) => new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  const stampa = (w, h, tex) => ombra(new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 })), false);

  function aCapo(x, testo, maxW, maxRighe = 9) {
    const parole = testo.split(' '), righe = []; let r = '';
    for (const p of parole) {
      const prova = r ? r + ' ' + p : p;
      if (x.measureText(prova).width > maxW && r) { righe.push(r); r = p; } else r = prova;
    }
    if (r) righe.push(r);
    if (righe.length > maxRighe) { righe.length = maxRighe; righe[maxRighe - 1] = righe[maxRighe - 1].replace(/\s+\S*$/, '') + '…'; }
    return righe;
  }
  function spazia(x, em, px) { try { x.letterSpacing = (em * px) + 'px'; } catch (e) { /* non c'è: pazienza */ } }

  /* Il marchio, ricalcato sulla testata dell'app: THE e BRIEF grandi metà di MORNING,
     la O è il sole, davanti la falce azzurra dell'orizzonte. */
  function marchio(x, x0, y0, S, inchiostro = C.ink) {
    const s = S * 0.47; x.save(); x.textBaseline = 'alphabetic'; x.fillStyle = inchiostro;
    x.font = `900 ${s}px ${SISTEMA}`; spazia(x, -0.01, s);
    const yThe = y0 + s * 0.73; x.fillText('THE', x0, yThe);
    const y = yThe + S * 0.80;
    x.font = `900 ${S}px ${SISTEMA}`; spazia(x, -0.035, S);
    const wM = x.measureText('M').width; x.fillText('M', x0, y);
    const d = S * 0.92, cx = x0 + wM + S * 0.01 + d / 2, cy = y - S * 0.33;
    x.fillStyle = C.yellow; x.beginPath(); x.arc(cx, cy, d / 2, 0, Math.PI * 2); x.fill();
    x.fillStyle = inchiostro; const xr = x0 + wM + S * 0.03 + d; x.fillText('RNING', xr, y);
    const W = xr + x.measureText('RNING').width - x0;
    const ax = x0 - W * 0.03, aw = W * 0.72, ay = y - S * 0.12, ah = S * 0.30;
    const g = x.createLinearGradient(ax, 0, ax + aw, 0);
    g.addColorStop(0, '#1A5FAF'); g.addColorStop(0.48, '#7CC6F2'); g.addColorStop(1, '#1A5FAF');
    const X = u => ax + aw * u / 100, Y = v => ay + ah * v / 14;
    x.fillStyle = g; x.beginPath(); x.moveTo(X(0), Y(13.6)); x.quadraticCurveTo(X(48), Y(-5), X(100), Y(13.6));
    x.quadraticCurveTo(X(48), Y(4.2), X(0), Y(13.6)); x.fill();
    x.fillStyle = inchiostro; x.font = `900 ${s}px ${SISTEMA}`; spazia(x, -0.01, s);
    const yBrief = y + S * 0.21 + s * 0.73; x.fillText('BRIEF', x0, yBrief);
    x.restore(); return { w: W, h: yBrief - y0 };
  }
  function sole(x, cx, cy, r) {   // il sole con la falce: la versione piccola, per tazze e adesivi
    x.fillStyle = C.yellow; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
    const g = x.createLinearGradient(cx - r * 1.5, 0, cx + r * 1.5, 0);
    g.addColorStop(0, '#1A5FAF'); g.addColorStop(0.5, '#7CC6F2'); g.addColorStop(1, '#1A5FAF');
    x.fillStyle = g; x.beginPath(); x.moveTo(cx - r * 1.5, cy + r * 1.0);
    x.quadraticCurveTo(cx, cy - r * 0.15, cx + r * 1.5, cy + r * 1.0);
    x.quadraticCurveTo(cx, cy + r * 0.55, cx - r * 1.5, cy + r * 1.0); x.fill();
  }

  /* ---------------------------------------------------------------- le tele */
  const texSchermone = tela(2048, 976, (x, w, h) => {
    x.fillStyle = C.bone; x.fillRect(0, 0, w, h);
    marchio(x, 96, 92, 205);
    // a destra: i tre pallini, la data, in onda
    const rx = w - 96; x.textAlign = 'right';
    [[C.red, 0], [C.yellow, 1], [C.blue, 2]].forEach(([c, i]) => { x.fillStyle = c; x.beginPath(); x.arc(rx - 24 - (2 - i) * 66, 138, 24, 0, 7); x.fill(); });
    x.fillStyle = C.ink; x.font = `800 158px ${DISPLAY}`; x.fillText(DATI.dataBreve, rx, 336);
    x.fillStyle = C.ink2; x.font = `700 60px ${DISPLAY}`; spazia(x, 0.08, 60);
    const scritta = 'IN ONDA DALLE ' + DATI.inOnda, ws = x.measureText(scritta).width; x.fillText(scritta, rx, 436);
    x.fillStyle = C.red; x.beginPath(); x.arc(rx - ws - 30, 416, 15, 0, 7); x.fill();
    spazia(x, 0, 1);
    // il sottopancia: fascia gialla, titolo su nero
    x.textAlign = 'left'; const by = 620;
    x.fillStyle = C.ink; x.fillRect(0, by, w, h - by);
    x.fillStyle = C.yellow; x.fillRect(96, by - 44, 470, 88);
    x.fillStyle = C.ink; x.font = `800 60px ${DISPLAY}`; spazia(x, 0.06, 60); x.fillText('IN APERTURA', 126, by + 20); spazia(x, 0, 1);
    x.fillStyle = C.paper; x.font = `700 92px ${SISTEMA}`;
    aCapo(x, DATI.menabo[0].t, w - 192, 2).forEach((r, i) => x.fillText(r, 96, by + 160 + i * 108));
  });

  const texMonitorEttore = tela(640, 400, (x, w, h) => {
    x.fillStyle = C.paper; x.fillRect(0, 0, w, h);
    x.fillStyle = C.ink; x.fillRect(0, 0, w, 44);
    [C.red, C.yellow, C.blue].forEach((c, i) => { x.fillStyle = c; x.beginPath(); x.arc(26 + i * 24, 22, 7, 0, 7); x.fill(); });
    x.fillStyle = C.orange; x.font = `800 30px ${DISPLAY}`; spazia(x, 0.1, 30); x.fillText('IPHONE · IN APERTURA', 36, 96); spazia(x, 0, 1);
    x.fillStyle = C.ink; x.font = `800 42px ${SISTEMA}`;
    let y = 150; aCapo(x, DATI.menabo[0].t, w - 72, 3).forEach(r => { x.fillText(r, 36, y); y += 50; });
    x.fillStyle = '#C9C5BB'; for (let i = 0; i < 4; i++) x.fillRect(36, y + 4 + i * 26, i === 3 ? 300 : w - 72, 11);
    x.fillStyle = C.orange; x.fillRect(346, y + 4 + 3 * 26 - 6, 4, 24);
  });

  const texMonitorIvo = tela(640, 400, (x, w, h) => {
    x.fillStyle = C.paper; x.fillRect(0, 0, w, h);
    x.fillStyle = C.ink; x.fillRect(0, 0, w, 44);
    x.fillStyle = C.paper; x.font = `700 24px ${DISPLAY}`; spazia(x, 0.1, 24); x.fillText('REVISIONE · 11 TESTI RISCRITTI', 22, 31); spazia(x, 0, 1);
    const c = DATI.persone.ivo.cambi[1];
    x.fillStyle = C.ink3; x.font = `500 30px ${SISTEMA}`; let y = 104;
    aCapo(x, c.prima, w - 72, 3).forEach(r => { x.fillText(r, 36, y); const m = x.measureText(r).width;
      x.strokeStyle = C.red; x.lineWidth = 4; x.beginPath(); x.moveTo(34, y - 10); x.lineTo(38 + m, y - 11); x.stroke(); y += 40; });
    y += 22; x.fillStyle = C.ink; x.font = `800 36px ${SISTEMA}`;
    aCapo(x, c.dopo, w - 72, 4).forEach(r => { x.fillText(r, 36, y); y += 44; });
  });

  function foglio(seme) {   // una bozza stampata, con le correzioni a penna rossa
    return tela(300, 420, (x, w, h) => {
      x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, w, h);
      x.fillStyle = C.ink; x.fillRect(28, 30, 190, 16); x.fillRect(28, 54, 120, 16);
      let k = seme;
      const caso = () => (k = (k * 9301 + 49297) % 233280) / 233280;
      for (let i = 0; i < 13; i++) {
        const y = 100 + i * 23, l = 150 + caso() * 94;
        x.fillStyle = '#B9B6AE'; x.fillRect(28, y, l, 8);
        if (caso() < 0.3) { x.strokeStyle = C.red; x.lineWidth = 3.5; x.beginPath(); const a = 40 + caso() * 60, b = a + 50 + caso() * 70;
          x.moveTo(a, y + 4); x.lineTo(b, y + 3); x.stroke();
          x.beginPath(); x.moveTo(b + 6, y - 2); x.lineTo(w - 36, y - 10 + caso() * 6); x.stroke(); }
      }
      x.strokeStyle = C.red; x.lineWidth = 3; x.beginPath(); x.ellipse(120, 48, 108, 30, -0.04, 0, 6.6); x.stroke();
    });
  }

  const texMenabo = tela(1100, 660, (x, w, h) => {
    x.fillStyle = '#FDFDFB'; x.fillRect(0, 0, w, h);
    x.fillStyle = C.ink; x.font = `800 84px ${DISPLAY}`; x.fillText('MENABÒ', 44, 100);
    x.fillStyle = C.ink3; x.font = `700 40px ${DISPLAY}`; spazia(x, 0.08, 40); x.fillText(DATI.dataBreve, 330, 98); spazia(x, 0, 1);
    x.fillStyle = C.ink; x.fillRect(44, 122, 700, 6);
    const col = { iPhone: C.orange, AI: C.red, Accessori: C.blue, Mac: C.yellow };
    DATI.menabo.forEach((n, i) => {
      const y = 190 + i * 96;
      x.fillStyle = col[n.rep] || C.ink; x.beginPath(); x.arc(70, y - 12, 20, 0, 7); x.fill();
      x.fillStyle = n.rep === 'Mac' ? C.ink : '#fff'; x.font = `800 28px ${DISPLAY}`; x.textAlign = 'center'; x.fillText(String(i + 1), 70, y - 2); x.textAlign = 'left';
      x.fillStyle = C.ink; x.font = `${i === 0 ? 700 : 500} 32px ${SISTEMA}`;

  postoEttore.add(at(lampada, -0.7, 0.775, -0.25)); punto(0xFFC860, 5, 2.6 - 0.6, 1.2, 2.9 - 0.15, 3.2);
  const sediaEttore = sedia(); sediaEttore.rotation.y = Math.PI; postoEttore.add(at(sediaEttore, 0.05, 0, 0.82));
  const ettore = persona({ id: 'ettore', pelle: 0xF0C3A0, maglia: 0xF0821E, capelli: 0x3A2A22, seduto: true, occhiali: true, ciuffo: true });
  ettore.rotation.y = Math.PI; at(ettore, 2.65, 0, 3.74); stanza.add(ettore);

  // Ivo, il revisore: in piedi, con le bozze di Ettore corrette a penna rossa
  const postoIvo = gruppo(); at(postoIvo, 5.95, 0, 2.0); stanza.add(postoIvo);
  postoIvo.add(scrivania(1.6, 0.8), at(monitor(texMonitorIvo), -0.1, 0.775, -0.18), at(tastiera(), -0.1, 0.775, 0.18), at(tazza(C.red), 0.6, 0.775, 0.2));
  [[-0.58, 0.02, 0.2, 11], [-0.5, 0.1, -0.15, 23]].forEach(([x, z, r, seme], i) => { const f = stampa(0.21, 0.297, foglio(seme)); f.rotation.set(-Math.PI / 2, 0, r); postoIvo.add(at(f, x, 0.777 + i * 0.002, z)); });
  const sediaIvo = sedia(); sediaIvo.rotation.y = Math.PI - 0.7; postoIvo.add(at(sediaIvo, 0.25, 0, 0.95));
  const ivo = persona({ id: 'ivo', pelle: 0xD9A27E, maglia: 0xE01F3D, capelli: 0xB4B4BA, occhiali: true, baffi: true, fronte: 0.4 });
  ivo.rotation.y = Math.PI / 4; at(ivo, 4.75, 0, 3.55); stanza.add(ivo);
  { const p = ivo.userData.parti;
    const bozza = stampa(0.27, 0.37, foglio(5)); bozza.material.side = THREE.DoubleSide; bozza.rotation.set(-0.75, 0.25, 0); p.bd.add(at(bozza, -0.13, -0.4, 0.1));
    const penna = cyl(0.011, 0.011, 0.15, M(0xE01F3D, { roughness: 0.4 }), 10); penna.rotation.set(0.5, 0, 0.3); p.bs.add(at(penna, 0.01, -0.34, 0.03)); }
  const persone = { ettore, ivo };

  /* ---------------------------------------------------------------- le luci */
  const emisfero = new THREE.HemisphereLight(0xffffff, 0xd9cdb8, 1); scene.add(emisfero);
  const solare = new THREE.DirectionalLight(0xffffff, 2.5); scene.add(solare, solare.target);
  const centro = new THREE.Vector3(3.4, 0.9, 2.6); solare.target.position.copy(centro);
  solare.castShadow = true; solare.shadow.mapSize.set(4096, 4096);
  Object.assign(solare.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 40 });
  solare.shadow.camera.updateProjectionMatrix();
  solare.shadow.bias = -0.0004; solare.shadow.normalBias = 0.03; solare.shadow.radius = 11;
  const LUCI = {
    alba:   { da: [-7, 4.4, 6], sole: 0xFFAE6E, soleI: 2.7, cielo: 0xFFDDBB, terra: 0xD8B596, emiI: 0.56, env: 0.22, lampade: 0.3, ombra: 0.6, esp: 1.0 },
    giorno: { da: [-4.5, 9, 6.5], sole: 0xFFF4E2, soleI: 2.4, cielo: 0xFFFFFF, terra: 0xDCD0BC, emiI: 0.55, env: 0.3, lampade: 0, ombra: 0.6, esp: 1.0 },
    sera:   { da: [5, 6, 7], sole: 0x8E9BE8, soleI: 0.55, cielo: 0x8C92D6, terra: 0x4A456B, emiI: 0.3, env: 0.1, lampade: 1, ombra: 0.5, esp: 1.0 },
    notte:  { da: [4, 9, 6], sole: 0x6F86D6, soleI: 0.3, cielo: 0x4A5AA8, terra: 0x23264A, emiI: 0.25, env: 0.06, lampade: 1, ombra: 0.45, esp: 1.0 },
  };
  let sporca = true;
  function luce(nome) {
    const L = LUCI[nome]; document.documentElement.dataset.luce = nome;
    solare.color.set(L.sole); solare.intensity = L.soleI; solare.position.copy(centro).add(new THREE.Vector3(...L.da));
    solare.shadow.intensity = L.ombra;
    emisfero.color.set(L.cielo); emisfero.groundColor.set(L.terra); emisfero.intensity = L.emiI;
    scene.environmentIntensity = L.env; renderer.toneMappingExposure = L.esp;
    lampade.forEach(l => { l.intensity = l.userData.max * L.lampade; });
    paralumi.forEach(m => { m.emissiveIntensity = 1.6 * L.lampade; });
    cielo.map = cieli[nome]; cielo.needsUpdate = true;
    document.querySelectorAll('.luci button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.luce === nome)));
    renderer.shadowMap.needsUpdate = true; sporca = true;
  }
  document.querySelectorAll('.luci button').forEach(b => b.addEventListener('click', () => luce(b.dataset.luce)));

  /* ---------------------------------------------------------------- la camera: isometrica, ferma */
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 120);
  const DIR = new THREE.Vector3(1, 0.8, 1).normalize();
  cam.position.copy(centro).addScaledVector(DIR, 40); cam.lookAt(centro); cam.updateMatrixWorld();
  const DESTRA = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), SU = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
  const sulPiano = p => { const d = p.clone().sub(centro); return [d.dot(DESTRA), d.dot(SU)]; };
  // quanto è grande la stanza vista da qui
  const scatola = new THREE.Box3().setFromObject(stanza); let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const x of [scatola.min.x, scatola.max.x]) for (const y of [scatola.min.y, scatola.max.y]) for (const z of [scatola.min.z, scatola.max.z]) {
    const [a, b] = sulPiano(new THREE.Vector3(x, y, z)); minX = Math.min(minX, a); maxX = Math.max(maxX, a); minY = Math.min(minY, b); maxY = Math.max(maxY, b); }
  const CASA = { x: (minX + maxX) / 2, y: (minY + maxY) / 2, zoom: 1 }, AMPIA = maxX - minX, ALTEZZA = maxY - minY;
  const vista = { ...CASA }, meta = { ...CASA }; let mezza = 5, ppu = 100;
  function inquadra() {
    cam.position.copy(centro).addScaledVector(DIR, 40).addScaledVector(DESTRA, vista.x).addScaledVector(SU, vista.y);
    cam.zoom = vista.zoom; cam.updateProjectionMatrix(); sporca = true;
  }
  function misura() {
    const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); const asp = w / h;
    mezza = Math.max(ALTEZZA / 2 * 1.16, AMPIA / 2 / asp * 1.06); ppu = h / (2 * mezza);
    cam.left = -mezza * asp; cam.right = mezza * asp; cam.top = mezza; cam.bottom = -mezza; inquadra();
  }
  new ResizeObserver(misura).observe(canvas); misura();

  /* ---------------------------------------------------------------- etichette e pannello */
  const strato = document.getElementById('etichette'), tags = {};
  for (const [id, p] of Object.entries(DATI.persone)) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tag';
    const pallino = document.createElement('b'); pallino.style.background = p.colore;
    const ruolo = document.createElement('span'); ruolo.textContent = p.mestiere;
    const guarda = document.createElement('em'); guarda.textContent = 'Guarda ▸';
    b.append(pallino, document.createTextNode(p.nome), ruolo, guarda);
    b.setAttribute('aria-label', `${p.nome}, ${p.mestiere}: apri la scheda`);
    b.addEventListener('click', () => apri(id)); strato.append(b); tags[id] = b;
  }
  const v3 = new THREE.Vector3();
  function etichette() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    for (const [id, g] of Object.entries(persone)) {
      v3.set(0, g.userData.altezza + 0.1, 0); g.localToWorld(v3); v3.project(cam);
      tags[id].style.transform = `translate(-50%,-100%) translate(${((v3.x + 1) / 2 * w).toFixed(1)}px,${((1 - v3.y) / 2 * h).toFixed(1)}px)`;
    }
  }

  const pannello = document.getElementById('pannello'); let aperto = null;
  const el = (tag, cls, testo) => { const e = document.createElement(tag); if (cls) e.className = cls; if (testo != null) e.textContent = testo; return e; };
  function apri(id) {
    const p = DATI.persone[id]; aperto = id; pannello.textContent = '';
    const testa = el('div', 'testa'), av = el('div', 'avatar', p.nome[0]); av.style.background = p.colore;
    const chi = el('div'); chi.append(el('h2', null, p.nome), el('p', null, `${p.mestiere} · ${p.modello}`));
    const x = el('button', 'chiudi', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Chiudi la scheda'); x.addEventListener('click', chiudi);
    testa.append(av, chi, x); pannello.append(testa);
    const numeri = el('div', 'numeri'), numero = (n, cosa) => { const d = el('div'); d.append(el('strong', null, n), el('span', null, cosa)); numeri.append(d); };
    const stamattina = el('div', 'blocco'); stamattina.append(el('h3', null, 'Stamattina'));
    if (id === 'ettore') {
      numero(String(p.notizie), 'notizie scritte'); numero(String(p.approfondimenti), 'approfondimenti'); numero(p.minuti + ' min', 'di lavoro');
      stamattina.append(numeri, el('p', null, `Ha scritto la prosa dell'edizione durante la corsa delle ${DATI.corsa.inizio}. L'edizione è andata in onda alle ${DATI.inOnda}.`));
      const b = el('div', 'blocco'); b.append(el('h3', null, 'Sul suo schermo: le prime tre'));
      const ul = el('ul', 'titoli'); DATI.menabo.slice(0, 3).forEach(n => { const li = el('li'); li.append(el('i'), el('span', null, n.t)); ul.append(li); }); b.append(ul);
      const c = el('div', 'blocco'); c.append(el('h3', null, '«Il punto» di oggi'), el('p', null, DATI.punto));
      pannello.append(stamattina, b, c);
    } else {
      numero(String(p.riscritti), 'testi riscritti'); numero(p.minuti + ' min', 'di lavoro');
      stamattina.append(numeri, el('p', null, `Ha riletto la prosa di Ettore prima della pubblicazione delle ${DATI.inOnda}. Era il suo primo giorno.`));
      const b = el('div', 'blocco'); b.append(el('h3', null, 'Sulla scrivania: tre titoli corretti'));
      p.cambi.forEach(c => { const d = el('div', 'cambio'); d.append(el('del', null, c.prima), el('ins', null, c.dopo)); b.append(d); });
      pannello.append(stamattina, b);
    }
    pannello.append(el('p', 'piede', 'In questa prova la scheda mostra solo i fatti di oggi. La conversazione arriva con il prossimo passo.'));
    pannello.hidden = false; x.focus({ preventScroll: true });
    // la camera si avvicina alla sua scrivania, lasciando posto alla scheda
    const g = persone[id]; v3.set(0, 0.75, 0); g.localToWorld(v3); const [a, b] = sulPiano(v3), z = 2.1;
    const larga = canvas.clientWidth > 760 ? pannello.offsetWidth : 0;
    meta.x = a + (larga / 2) / (ppu * z); meta.y = b; meta.zoom = z;
  }
  function chiudi() { if (!aperto) return; const t = tags[aperto]; aperto = null; pannello.hidden = true; Object.assign(meta, CASA); t.focus({ preventScroll: true }); }
  addEventListener('keydown', e => { if (e.key === 'Escape') chiudi(); });

  /* ---------------------------------------------------------------- rotella, trascinamento, clic */
  const raggio = new THREE.Raycaster(), ndc = new THREE.Vector2(); let presa = null;
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); const r = canvas.getBoundingClientRect();
    const dx = (e.clientX - r.left - r.width / 2) / ppu, dy = -(e.clientY - r.top - r.height / 2) / ppu;
    const z0 = meta.zoom, z1 = Math.min(4.5, Math.max(1, z0 * Math.exp(-e.deltaY * 0.0016)));
    meta.x += dx / z0 - dx / z1; meta.y += dy / z0 - dy / z1; meta.zoom = z1;
    if (z1 === 1) { meta.x = CASA.x; meta.y = CASA.y; }
  }, { passive: false });
  canvas.addEventListener('pointerdown', e => { presa = { x: e.clientX, y: e.clientY, mosso: 0 }; canvas.setPointerCapture(e.pointerId); canvas.classList.add('presa'); });
  canvas.addEventListener('pointermove', e => { if (!presa) return; const dx = e.clientX - presa.x, dy = e.clientY - presa.y; presa.mosso += Math.abs(dx) + Math.abs(dy);
    presa.x = e.clientX; presa.y = e.clientY; meta.x -= dx / (ppu * vista.zoom); meta.y += dy / (ppu * vista.zoom); vista.x = meta.x; vista.y = meta.y; inquadra(); });
  canvas.addEventListener('pointerup', e => {
    canvas.classList.remove('presa'); const p = presa; presa = null; if (!p || p.mosso > 6) return;
    const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raggio.setFromCamera(ndc, cam); const colpi = raggio.intersectObjects(Object.values(persone), true);
    if (colpi.length) { let o = colpi[0].object; while (o && !o.userData.id) o = o.parent; if (o) return apri(o.userData.id); }
    if (aperto) chiudi();
  });
  canvas.addEventListener('dblclick', () => { if (aperto) chiudi(); else Object.assign(meta, CASA); });

  /* ---------------------------------------------------------------- la vita: piccoli gesti */
  const dolce = t => t * t * (3 - 2 * t);
  function anima(s) {
    { const p = ettore.userData.parti, batte = Math.sin(s * 0.45) > -0.35 ? 1 : 0;   // scrive a raffiche
      p.bs.rotation.x = -1.18 + batte * Math.sin(s * 15) * 0.06; p.bd.rotation.x = -1.18 + batte * Math.sin(s * 15 + 2.1) * 0.06;
      p.bs.rotation.z = 0.2; p.bd.rotation.z = -0.2;
      const f = s % 16, gira = f > 12 ? dolce(Math.min(1, (f - 12) / 0.7)) * (f > 15 ? dolce(Math.max(0, 1 - (f - 15) / 0.7)) : 1) : 0;
      p.testa.rotation.y = -gira * 1.15; p.testa.rotation.x = 0.14 * (1 - gira) + Math.sin(s * 1.1) * 0.02; }
    { const p = ivo.userData.parti;   // legge le bozze, poi alza gli occhi
      const f = s % 11, su = f > 7 ? dolce(Math.min(1, (f - 7) / 0.6)) * (f > 10 ? dolce(Math.max(0, 1 - (f - 10) / 0.6)) : 1) : 0;
      p.testa.rotation.x = 0.42 * (1 - su); p.testa.rotation.y = -0.25 * (1 - su);
      p.bd.rotation.x = -1.0 - su * 0.1; p.bd.rotation.z = -0.22; p.bs.rotation.x = -0.9 + Math.sin(s * 0.9) * 0.03; p.bs.rotation.z = 0.42;
      p.corpo.rotation.y = Math.sin(s * 0.5) * 0.04; p.corpo.position.y = 0.55 + Math.sin(s * 1.6) * 0.004; }
  }
  function ora() {
    const d = new Date(), sec = d.getSeconds() + d.getMilliseconds() / 1000, min = d.getMinutes() + sec / 60, h = (d.getHours() % 12) + min / 60;
    secondi.rotation.z = -sec * Math.PI / 30; minuti.rotation.z = -min * Math.PI / 30; ore.rotation.z = -h * Math.PI / 6;
  }

  luce('giorno'); anima(3); ora();
  let prima = 0;
  function giro(t) {
    requestAnimationFrame(giro);
    if (document.hidden || t - prima < 1000 / 31) return; prima = t;
    const k = 0.16; let muove = false;
    for (const c of ['x', 'y', 'zoom']) { const d = meta[c] - vista[c]; if (Math.abs(d) > 0.0005) { vista[c] += d * k; muove = true; } else vista[c] = meta[c]; }
    if (muove) inquadra();
    if (!fermo) { anima(t / 1000); ora(); sporca = true; }
    if (!sporca) return; sporca = false;
    renderer.render(scene, cam); etichette();
  }
  requestAnimationFrame(giro);
  if (fermo) setInterval(() => { ora(); sporca = true; }, 15000);
  // una maniglia per le prove: redazione.guarda(x, y, z, zoom) porta la camera su un punto della stanza
  window.redazione = { THREE, renderer, scene, solare, emisfero, luce, apri, chiudi, ridisegna() { renderer.shadowMap.needsUpdate = true; sporca = true; }, guarda(x, y, z, zoom = 3) { const [a, b] = sulPiano(new THREE.Vector3(x, y, z)); Object.assign(meta, { x: a, y: b, zoom }); Object.assign(vista, meta); inquadra(); } };
  canvas.addEventListener('webglcontextlost', e => e.preventDefault());
  canvas.addEventListener('webglcontextrestored', () => { renderer.shadowMap.needsUpdate = true; sporca = true; });
}
</script>

/* Se le librerie 3D non arrivano il modulo qui sopra non parte nemmeno: lo si dice, invece di lasciare una pagina vuota. */
setTimeout(function () {
  if (window.redazione) return;
  var e = document.getElementById('errore');
  if (e && e.hidden) { e.hidden = false; e.textContent = 'La stanza non si è caricata: le librerie 3D non sono arrivate. Ricarica la pagina.'; }
